<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Yfirferð — Björninn</title>
<link rel="icon" href="/icons/icon-192.png" />
<style>
  /* yfirferd.html — the Skipulag per-unit review wizard. Replaces the Airtable
     "Skipulag 2.0" interface (which was just an Eyðublað record-review page)
     entirely. Deliberately a NEW, small SVG box renderer rather than reusing
     kitchen-planner-3d.js — that engine is coupled to a whole room/wall state
     and has no isolated single-cabinet + dimensions path. Re-chromed
     2026-10-17 into the BC-style office shell (sidebar nav via
     office-shell.js, light dense theme, desktop-only) — same wizard logic
     and SVG renderer underneath, untouched.
     "Samþykkja" writes the "🔄 Keyra Yfirferð 3.0" checkbox (false→true, every
     time, so repeat reviews always produce a real transition) — the ONLY
     writable field on Eyðublað — which retriggers "Yfirfara 3.0" once its
     trigger is reconfigured in Airtable (see memory: project_vercel_migration). */
  :root {
    --bg:#f3f4f6; --surface:#ffffff; --line:#e1e4e8; --sidebar:#1b2430;
    --text:#1a1d21; --muted:#5d6670; --dim:#9aa3ad;
    --accent:#0f6cbd; --warn:#9a6700; --bad:#c4291c; --good:#1a7d36;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4; }

  /* ---- shared office shell (sidebar) — see /skrifstofa for the canonical copy ---- */
  #shell { display:flex; min-height:100vh; }
  .sidebar { width:224px; flex:none; background:var(--sidebar); color:#cfd5dd; display:flex; flex-direction:column; padding:18px 0; min-height:100vh; }
  .sidebar .brand { padding:0 18px 18px; font-weight:700; color:#fff; font-size:1.05rem; border-bottom:1px solid #2a3442; margin-bottom:10px; }
  .sidebar nav { display:flex; flex-direction:column; gap:1px; flex:1; }
  .sidebar nav a { display:flex; align-items:center; gap:10px; padding:9px 18px; text-decoration:none; color:#cfd5dd; font-size:.88rem; }
  .sidebar nav a:hover { background:#242e3b; }
  .sidebar nav a.active { background:var(--accent); color:#fff; }
  .sidebar .user { padding:14px 18px 0; border-top:1px solid #2a3442; margin-top:10px; font-size:.82rem; display:flex; justify-content:space-between; align-items:center; }
  .sidebar .user button { background:none; border:none; color:#8aa4c7; font:inherit; font-size:.8rem; cursor:pointer; }

  .wrap { flex:1; max-width:720px; padding:24px 28px 40px; }

  .hd { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .title { font-size:1.3rem; font-weight:700; letter-spacing:-.01em; margin-top:2px; }
  .sub { color:var(--muted); font-size:.9rem; margin-top:2px; }

  .flags { display:flex; flex-direction:column; gap:8px; margin:16px 0; }
  .flag { background:#fff4e5; color:#8a5200; border-radius:12px; padding:10px 14px; font-size:.88rem; display:flex; gap:8px; align-items:center; }

  .tabs { display:flex; gap:6px; margin:18px 0 14px; overflow-x:auto; }
  .tab { flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--surface); color:var(--muted); font-size:.85rem; font-weight:500; border:1px solid var(--line); white-space:nowrap; }
  .tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }

  .panel { display:none; }
  .panel.active { display:block; }
  .card { background:var(--surface); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .card h3 { font-size:.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:.92rem; }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--muted); }
  .row .v { font-weight:500; text-align:right; }

  .boxSvg { width:100%; height:auto; display:block; }
  .boxSvg text { font-family:var(--font); fill:var(--text); }
  .boxSvg .dim { stroke:var(--muted); stroke-width:1; }
  .boxSvg .dimTxt { font-size:11px; fill:var(--muted); }
  .boxSvg .shell { fill:var(--surface); stroke:var(--text); stroke-width:1.5; }
  .boxSvg .div { stroke:var(--line); stroke-width:1.5; }

  .empty { text-align:center; color:var(--muted); padding:30px 0; font-size:.9rem; }

  .approveBar { position:sticky; bottom:0; background:var(--bg); padding-top:14px; }
  .approveBtn { width:100%; background:var(--good); color:#fff; border:none; border-radius:14px; padding:15px; font-size:1rem; font-weight:600; font-family:inherit; }
  .approveBtn:disabled { opacity:.5; }
  .approveMsg { text-align:center; font-size:.85rem; color:var(--muted); margin-top:8px; min-height:1.2em; }

  /* ---- Picker (no recordId given) ---- */
  #picker input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:1rem; font-family:inherit; }
  #pickerResults { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .pickRow { background:var(--surface); border-radius:12px; padding:12px 14px; text-decoration:none; color:var(--text); display:block; }
  .pickRow .lbl { font-weight:600; font-size:.95rem; }
  .pickRow .meta { color:var(--muted); font-size:.82rem; margin-top:2px; }

  .loading { text-align:center; color:var(--muted); padding:60px 0; }
</style>
</head>
<body>
<div id="shell">
  <div class="sidebar">
    <div class="brand">🐻 Björninn</div>
    <nav id="officeNav"></nav>
    <div class="user">
      <span id="officeUserName"></span>
      <button id="officeLogout" type="button">Útskrá</button>
    </div>
  </div>
<div class="wrap">
  <div id="picker" style="display:none;">
    <div class="title">Yfirferð</div>
    <div class="sub">Leitaðu að einingu (t.d. "Sk6" eða "LEF100")</div>
    <div style="margin-top:14px;"><input id="pickerInput" type="text" placeholder="Nafn einingar…" /></div>
    <div id="pickerResults"></div>
  </div>

  <div id="loading" class="loading" style="display:none;">Sæki gögn…</div>

  <div id="wizard" style="display:none;">
    <div class="title" id="unitTitle"></div>
    <div class="sub" id="unitSub"></div>

    <div class="flags" id="flags"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-panel="p-kassi">Kassi</button>
      <button class="tab" data-panel="p-innihald">Skúffur/hillur</button>
      <button class="tab" data-panel="p-sogun">Sögunarlisti</button>
      <button class="tab" data-panel="p-pontun">Pöntun</button>
    </div>

    <div class="panel active" id="p-kassi">
      <div class="card">
        <svg class="boxSvg" id="boxSvg" viewBox="0 0 320 280"></svg>
      </div>
    </div>

    <div class="panel" id="p-innihald">
      <div class="card"><h3>Skúffur</h3><div id="drawerList"></div></div>
      <div class="card"><h3>Hillur</h3><div id="shelfList"></div></div>
      <div class="card"><h3>Annað</h3><div id="otherList"></div></div>
    </div>

    <div class="panel" id="p-sogun">
      <div class="card"><div id="sogunList"></div></div>
    </div>

    <div class="panel" id="p-pontun">
      <div class="card"><div id="pontunList"></div></div>
    </div>

    <div class="approveBar">
      <button class="approveBtn" id="approveBtn">Samþykkja einingu</button>
      <div class="approveMsg" id="approveMsg"></div>
    </div>
  </div>
</div>
</div>

<script src="/office-shell.js"></script>
<script>
(function () {
  "use strict";
  var EYDUBLAD = "tbl0WcyHhz63pSzZX";
  var SOGUNARLISTI = "tblhdgyvTcBfP8kov";
  var VORUR = "tblszHaBrwhYNV68z";
  var RUN_FIELD = "🔄 Keyra Yfirferð 3.0";

  var shellInfo = window.OfficeShell.boot("skipulag");
  if (!shellInfo) return; // boot() is already redirecting to /skrifstofa?return=...

  var params = new URLSearchParams(location.search);
  var recordId = params.get("recordId");
  var k = shellInfo.k;

  function api(path, extra) {
    var u = "/api/airtable?path=" + encodeURIComponent(path);
    if (k) u += "&k=" + encodeURIComponent(k);
    if (extra) u += "&" + extra;
    return fetch(u).then(function (r) { return r.json(); });
  }
  function apiPatch(path, fields) {
    return fetch("/api/airtable?path=" + encodeURIComponent(path), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    }).then(function (r) { return r.json(); });
  }
  // Airtable's ARRAYJOIN on a linked-record field resolves to the linked
  // record's NAME (its primary field), not its id — confirmed by direct
  // testing against the live base (an id-based FIND never matched, a
  // name-based one did). So this matches by the unit's own display name
  // (Athugasemd) via exact equality, not by record id.
  function eqFilterEydublad(name) {
    var e = String(name).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    return "%7BEy%C3%B0ubla%C3%B0%20%E2%9C%8F%EF%B8%8F%7D%3D" + encodeURIComponent('"' + e + '"');
  }

  // ---- Picker ----
  if (!recordId) {
    document.getElementById("picker").style.display = "block";
    var input = document.getElementById("pickerInput");
    var results = document.getElementById("pickerResults");
    var t = null;
    input.addEventListener("input", function () {
      clearTimeout(t);
      var q = input.value.trim();
      if (q.length < 2) { results.innerHTML = ""; return; }
      t = setTimeout(function () {
        var formula = "SEARCH(LOWER(%22" + encodeURIComponent(q.toLowerCase()).replace(/%20/g, " ") + "%22),LOWER({Athugasemd}))";
        api(EYDUBLAD, "filterByFormula=" + formula + "&maxRecords=12&fields%5B%5D=Athugasemd&fields%5B%5D=Hva%C3%B0%20viltu%20sm%C3%AD%C3%B0a%3F")
          .then(function (d) {
            var recs = d.records || [];
            results.innerHTML = "";
            if (!recs.length) { results.innerHTML = '<div class="empty">Ekkert fannst</div>'; return; }
            recs.forEach(function (r) {
              var a = document.createElement("a");
              a.className = "pickRow";
              a.href = "/yfirferd?recordId=" + r.id + (k ? "&k=" + encodeURIComponent(k) : "");
              var name = r.fields["Athugasemd"] || "(ónefnt)";
              var kind = r.fields["Hvað viltu smíða?"] || "";
              a.innerHTML = '<div class="lbl">' + esc(name) + '</div><div class="meta">' + esc(kind) + '</div>';
              results.appendChild(a);
            });
          });
      }, 250);
    });
    return;
  }

  // ---- Load wizard ----
  document.getElementById("loading").style.display = "block";
  api(EYDUBLAD + "/" + recordId).then(function (unit) {
    var unitName = (unit.fields || {})["Athugasemd"] || "";
    var matchFml = eqFilterEydublad(unitName);
    return Promise.all([
      Promise.resolve(unit),
      api(SOGUNARLISTI, "filterByFormula=" + matchFml + "&maxRecords=200"),
      api(VORUR, "filterByFormula=" + matchFml + "&maxRecords=200")
    ]);
  }).then(function (res) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("wizard").style.display = "block";
    renderUnit(res[0], res[1].records || [], res[2].records || []);
  }).catch(function () {
    document.getElementById("loading").textContent = "Tókst ekki að sækja gögn.";
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }

  function renderUnit(unit, sogun, vorur) {
    var f = unit.fields || {};
    document.getElementById("unitTitle").textContent = f["Athugasemd"] || "(ónefnd eining)";
    document.getElementById("unitSub").textContent = [f["Heiti rýmis"], f["Hvað viltu smíða?"]].filter(Boolean).join(" · ");

    // ---- Pre-check flags ----
    var flagsEl = document.getElementById("flags");
    flagsEl.innerHTML = "";
    if (f["Skúffur stemma ekki ⚠️"]) addFlag("Skúffur stemma ekki við á milli Sögunar og Pöntunar");
    if (f["Vantar hluta ⚠️"]) addFlag("Það vantar hluta fyrir þessa einingu");
    function addFlag(msg) {
      var d = document.createElement("div");
      d.className = "flag";
      d.textContent = "⚠️ " + msg;
      flagsEl.appendChild(d);
    }

    // ---- Box data: Smíðagögn JSON, fallback to flat fields ----
    var box = parseBox(f);
    drawBox(box);

    // ---- Skúffur / hillur / annað ----
    renderDrawers(f, box);
    renderShelves(f, box);
    renderOther(f);

    // ---- Sögunarlisti ----
    renderSogun(sogun);

    // ---- Pöntun (Vörur per eining) ----
    renderVorur(vorur);

    // ---- Tabs ----
    var tabs = document.querySelectorAll(".tab");
    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        tabs.forEach(function (t2) { t2.classList.remove("active"); });
        document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
        tab.classList.add("active");
        document.getElementById(tab.dataset.panel).classList.add("active");
      });
    });

    // ---- Approve ----
    var btn = document.getElementById("approveBtn");
    var msg = document.getElementById("approveMsg");
    btn.addEventListener("click", function () {
      btn.disabled = true;
      msg.textContent = "Sendi…";
      var fields = {}; fields[RUN_FIELD] = false;
      apiPatch(EYDUBLAD + "/" + recordId, fields)
        .then(function () {
          var fields2 = {}; fields2[RUN_FIELD] = true;
          return apiPatch(EYDUBLAD + "/" + recordId, fields2);
        })
        .then(function () {
          var now = new Date();
          msg.textContent = "Sent í úrvinnslu kl. " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
          btn.disabled = false;
        })
        .catch(function () {
          msg.textContent = "Tókst ekki að senda — reyndu aftur.";
          btn.disabled = false;
        });
    });
  }

  function parseBox(f) {
    var raw = f["Smíðagögn (JSON) 🔧"];
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.w && parsed.h) return parsed;
      } catch (e) {}
    }
    // Fallback: flat Eyðublað fields
    return {
      w: f["Breidd"] || 0, h: f["Hæð"] || 0, d: f["Dýpt"] || 0,
      shelves: { loose: f["Lausar hillur fjöldi"] || 0, fixed: f["Fastar hillur fjöldi"] || 0 },
      _fallback: true
    };
  }

  function drawBox(box) {
    var svg = document.getElementById("boxSvg");
    var W = 320, H = 280, padL = 46, padR = 58, padV = 46;
    var w = Math.max(box.w || 1, 1), h = Math.max(box.h || 1, 1);
    var scale = Math.min((W - padL - padR) / w, (H - padV * 2) / h);
    var bw = w * scale, bh = h * scale;
    var x0 = padL + (W - padL - padR - bw) / 2, y0 = (H - bh) / 2 + 6;
    var parts = [];
    parts.push('<rect class="shell" x="' + x0 + '" y="' + y0 + '" width="' + bw + '" height="' + bh + '" rx="2"/>');

    // Width dim (top)
    var dy = y0 - 18;
    parts.push(dimLine(x0, dy, x0 + bw, dy));
    parts.push('<text class="dimTxt" x="' + (x0 + bw / 2) + '" y="' + (dy - 6) + '" text-anchor="middle">' + Math.round(box.w) + ' mm</text>');
    // Height dim (left)
    var dx = x0 - 18;
    parts.push(dimLine(dx, y0, dx, y0 + bh));
    parts.push('<text class="dimTxt" x="' + (dx - 6) + '" y="' + (y0 + bh / 2) + '" text-anchor="middle" transform="rotate(-90 ' + (dx - 6) + ' ' + (y0 + bh / 2) + ')">' + Math.round(box.h) + ' mm</text>');
    // Depth tag
    if (box.d) parts.push('<text class="dimTxt" x="' + (x0 + bw + 6) + '" y="' + (y0 + bh + 14) + '">d ' + Math.round(box.d) + ' mm</text>');

    // Interior: fronts (drawer stack) takes priority over shelves if present
    if (box.fronts && box.fronts.length) {
      var totalMm = box.fronts.reduce(function (s, fr) { return s + (fr.mm || 0); }, 0) || h;
      var cy = y0;
      box.fronts.forEach(function (fr, i) {
        var fh = (fr.mm || totalMm / box.fronts.length) * (bh / totalMm);
        if (i > 0) parts.push('<line class="div" x1="' + x0 + '" y1="' + cy + '" x2="' + (x0 + bw) + '" y2="' + cy + '"/>');
        parts.push('<text class="dimTxt" x="' + (x0 + 6) + '" y="' + (cy + fh / 2 + 3) + '">' + esc(fr.code || "") + (fr.mm ? " · " + Math.round(fr.mm) + "mm" : "") + '</text>');
        cy += fh;
      });
    } else if (box.shelves && (box.shelves.loose || box.shelves.fixed)) {
      var n = (box.shelves.loose || 0) + (box.shelves.fixed || 0);
      for (var i = 1; i <= n; i++) {
        var ly = y0 + (bh * i) / (n + 1);
        parts.push('<line class="div" x1="' + x0 + '" y1="' + ly + '" x2="' + (x0 + bw) + '" y2="' + ly + '"/>');
      }
      parts.push('<text class="dimTxt" x="' + (x0 + 6) + '" y="' + (y0 + 14) + '">' + n + ' hillur</text>');
    }

    svg.innerHTML = parts.join("");
  }
  function dimLine(x1, y1, x2, y2) {
    return '<line class="dim" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>'
      + '<line class="dim" x1="' + x1 + '" y1="' + (y1 - 4) + '" x2="' + x1 + '" y2="' + (y1 + 4) + '"/>'
      + '<line class="dim" x1="' + x2 + '" y1="' + (y2 - 4) + '" x2="' + x2 + '" y2="' + (y2 + 4) + '"/>';
  }

  function renderDrawers(f, box) {
    var el = document.getElementById("drawerList");
    var rows = [];
    if (f["Skúffutegund"]) rows.push(["Tegund", f["Skúffutegund"]]);
    ["N", "M", "K", "C", "F", "E"].forEach(function (code) {
      if (f[code]) rows.push([code, f[code] + " stk"]);
    });
    el.innerHTML = rows.length ? rowsHtml(rows) : '<div class="empty">Engar skúffur skráðar</div>';
  }
  function renderShelves(f, box) {
    var el = document.getElementById("shelfList");
    var rows = [];
    if (f["Fastar hillur fjöldi"]) rows.push(["Fastar hillur", f["Fastar hillur fjöldi"]]);
    if (f["Lausar hillur fjöldi"]) rows.push(["Lausar hillur", f["Lausar hillur fjöldi"]]);
    el.innerHTML = rows.length ? rowsHtml(rows) : '<div class="empty">Engar hillur skráðar</div>';
  }
  function renderOther(f) {
    var el = document.getElementById("otherList");
    var rows = [];
    if (f["Grip?"]) rows.push(["Grip", f["Grip?"]]);
    if (f["Hæð ofns"]) rows.push(["Hæð ofns", f["Hæð ofns"] + " mm"]);
    if (f["LED magn"]) rows.push(["LED", f["LED magn"] + " stk"]);
    if (f["Athugasemd til fræsara 🔬"]) rows.push(["Athugasemd til fræsara", f["Athugasemd til fræsara 🔬"]]);
    el.innerHTML = rows.length ? rowsHtml(rows) : '<div class="empty">Ekkert skráð</div>';
  }
  function rowsHtml(rows) {
    return rows.map(function (r) {
      return '<div class="row"><span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + '</span></div>';
    }).join("");
  }

  function renderSogun(recs) {
    var el = document.getElementById("sogunList");
    if (!recs.length) { el.innerHTML = '<div class="empty">Engir hlutar í Sögunarlista enn</div>'; return; }
    el.innerHTML = recs.map(function (r) {
      var f = r.fields || {};
      var dims = [f["H"], f["B"], f["Þ"]].filter(function (v) { return v != null; }).join("×");
      var warn = f["Villa?"] ? " ⚠️" : "";
      return '<div class="row"><span class="k">' + esc(f["Partur"] || "") + warn + '</span><span class="v">' + esc(dims) + (f["M"] ? " · " + f["M"] + "x" : "") + '</span></div>';
    }).join("");
  }

  function renderVorur(recs) {
    var el = document.getElementById("pontunList");
    if (!recs.length) { el.innerHTML = '<div class="empty">Engar vörur skráðar á þessa einingu</div>'; return; }
    el.innerHTML = recs.map(function (r) {
      var f = r.fields || {};
      var label = f["Tegund"] || f["Hvað viltu panta?"] || "Vara";
      var meta = [];
      if (f["Magn"]) meta.push(f["Magn"] + " stk");
      if (f["Breidd (mm)"] && f["Hæð (mm)"]) meta.push(f["Breidd (mm)"] + "×" + f["Hæð (mm)"] + " mm");
      var bad = f["⛔ Villa"] ? " ⚠️" : "";
      return '<div class="row"><span class="k">' + esc(label) + bad + '</span><span class="v">' + esc(meta.join(" · ")) + '</span></div>';
    }).join("");
  }
})();
</script>
</body>
</html>
