<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>Björninn</title>
<!-- yfirferd.html retired 2026-10-17 — per-unit review now lives inside
     /ferli's "Skipulag (einingar)" stage section. Kept as a redirect stub
     so old bookmarks/automation links with ?recordId= still land somewhere
     useful, instead of deleting the file outright. -->
<script>
  // yfirferd.html's own ?recordId= was always an Eyðublað UNIT id (it opened
  // straight into the per-unit wizard, skipping the picker) — never a
  // project id, so it maps onto /ferli's ?unit= param, not ?recordId=.
  var params = new URLSearchParams(location.search);
  var unitId = params.get("recordId");
  var k = params.get("k");
  var dest = "/ferli?" + (unitId ? "unit=" + encodeURIComponent(unitId) : "") + (k ? "&k=" + encodeURIComponent(k) : "");
  location.replace(dest);
</script>
</head>
<body></body>
</html>
