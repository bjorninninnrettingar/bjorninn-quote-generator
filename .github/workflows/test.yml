name: Prófanir
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci   # tests import pdf-lib / postal-mime — a clean runner has no node_modules
      - run: npm test
