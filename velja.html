<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Velja — Björninn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* velja.html — the QR landing page. Scanning a piece's Zebra label lands
     here (via /v/<pieceId> → this, ?u=<unit>&p=<project>&k=<VERK_KEY>) and
     asks: this unit specifically (EINING), or the whole project (VERKEFNIÐ)? */
  :root {
    --bg:#0b0b0c; --surface:#161618; --surface2:#1e1e21;
    --line:#2a2a2e; --text:#f2f2f3; --muted:#e8e8ec;
    --blue:#0a84ff; --blue-bg:#0e2436;
    --amber:#ffd60a; --amber-bg:#241f0b;
    --brand-blue:#3d61c1; --brand-gold:#a29c72;
    --font:"Kumbh Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    background:var(--bg); color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .wrap { max-width:520px; margin:0 auto; padding:20px 18px 40px; }

  .flabel { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .field { margin-top:14px; }
  .field .fval { font-size:1.05rem; font-weight:600; color:var(--text); }
  .field.main .fval { font-size:1.9rem; font-weight:800; letter-spacing:-.01em; }

  .proj-name { color:var(--text); font-size:1.1rem; font-weight:700; margin-top:20px; }

  .choices { display:flex; flex-direction:column; gap:14px; margin-top:26px; }
  .choice {
    display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text);
    border-radius:16px; padding:22px 18px; border:1px solid var(--line);
  }
  .choice .ic { font-size:2.2rem; flex:none; }
  .choice .t { font-size:1.25rem; font-weight:800; letter-spacing:.02em; color:var(--text); }
  .choice .d { font-size:.88rem; color:var(--text); margin-top:3px; }
  .choice:active { filter:brightness(1.1); }
  /* Solid, saturated fills instead of the barely-tinted dark cards these
     used to be — meant to read as pressable buttons, not info panels.
     Blue stays light enough that white text keeps good contrast. Yellow at
     button-strength is too bright for white text (classic low-contrast
     failure), so its own text/icon flip to dark instead — same convention
     any "yellow CTA" uses everywhere else. */
  /* Brand colours (same as faq.html / kitchen-planner.html): logo gold
     #a29c72 and its complementary blue #3d61c1. White text on the blue is
     fine; the gold is too light for white, so its text stays dark. */
  .choice.eining { background:var(--brand-blue); border-color:#6683d4; }
  .choice.verk { background:var(--brand-gold); border-color:#bdb78e; }
  .choice.verk .t, .choice.verk .d { color:#1a1400; }
  .choice.verk .d { opacity:.75; }

  /* "Merkja fræst" — only shown when the scanned piece is marked Yfirfr.
     One tap = the whole Sögunarlisti row is fræst; counts toward
     Framvinda framleiðslu, same as a tap on /fraesing. */
  .mill { margin-top:24px; border:1px solid #1f6b3a; background:#0d2016; border-radius:16px; padding:16px 18px 18px; }
  .mill-piece { font-size:1.15rem; font-weight:700; margin-top:2px; }
  .mill-btn {
    display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
    margin-top:14px; padding:22px 18px; border-radius:14px; border:1px solid #3ddc84;
    background:#1f9d55; color:#fff; font-family:var(--font); font-size:1.35rem; font-weight:800;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .mill-btn:active { filter:brightness(1.1); }
  .mill-btn[disabled] { opacity:.6; cursor:default; }
  .mill-done { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; }
  .mill-done .ok { font-size:1.35rem; font-weight:800; color:#3ddc84; }
  .mill-undo {
    font-family:var(--font); font-size:.95rem; font-weight:700; color:var(--text);
    background:transparent; border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer;
  }
  .mill-err { margin-top:10px; color:#ff6b6b; font-weight:600; }

  #loading,#error { text-align:center; color:var(--muted); padding-top:40px; }
  #error strong { display:block; color:var(--text); font-size:1.1rem; margin-bottom:6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Sæki einingu…</div>
  <div id="error" class="hidden">
    <strong>Fann ekki einingu</strong>
    QR-kóðinn gæti verið úreltur eða hlekkinn vantar lykil.
  </div>

  <div id="content" class="hidden">
    <div class="field main"><span class="flabel">Eining</span><br><span class="fval" id="unitName">—</span></div>
    <div class="field hidden" id="roomField"><span class="flabel">Rými</span><br><span class="fval" id="roomVal"></span></div>
    <div class="field hidden" id="tegundField"><span class="flabel">Tegund einingu</span><br><span class="fval" id="tegundVal"></span></div>
    <div class="proj-name" id="projName"></div>

    <div class="mill hidden" id="millCard">
      <span class="flabel">Skannaður hlutur · þarf að fræsa</span>
      <div class="mill-piece" id="millPiece"></div>
      <button type="button" class="mill-btn" id="millBtn">🔬 Merkja fræst</button>
      <div class="mill-done hidden" id="millDone">
        <span class="ok" id="millOk">✅ Fræst</span>
        <button type="button" class="mill-undo" id="millUndo">Afturkalla</button>
      </div>
      <div class="mill-err hidden" id="millErr"></div>
    </div>

    <div class="choices">
      <a class="choice eining" id="btnEining">
        <div class="ic">📦</div>
        <div><div class="t">EINING</div><div class="d">Skurðarlisti, vörur og allt um þessa einingu</div></div>
      </a>
      <a class="choice verk" id="btnVerk">
        <div class="ic">⚙️</div>
        <div><div class="t">Verkefnið</div><div class="d">Teikningar, athugasemdir og framvinda verkefnisins</div></div>
      </a>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var PROXY = "/api/airtable";
  var UNIT_TABLE = "tbl0WcyHhz63pSzZX";
  var PROJECT_TABLE = "tbl4LMXlQjp66RFKI";

  function $(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function arr(v){ return Array.isArray(v)?v:(v==null||v===""?[]:[v]); }
  function txt(v){ return arr(v).filter(function(x){return x!=null&&x!=="";}).join(" / ").trim(); }

  // Same deterministic hash as eining.html/verk.html — a room's color here
  // matches the color it gets in /verk's Eyðublað list, one visual language
  // across all three pages.
  function colorForKey(key){
    var hash = 0;
    for (var i=0;i<key.length;i++) hash = (hash*31 + key.charCodeAt(i)) | 0;
    var hue = Math.abs(hash) % 360;
    return "hsl(" + hue + ",70%,68%)";
  }

  // encodeURIComponent, NOT URLSearchParams — see eining.html for why.
  function fetchJson(path, k){
    var qs = "path=" + encodeURIComponent(path) + (k ? "&k=" + encodeURIComponent(k) : "");
    return fetch(PROXY + "?" + qs).then(function(r){
      return r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status));
    });
  }

  // u (unit) and p (project) both come from /v/<pieceId>'s server-side
  // redirect, resolved from the printed piece's own Sögunarlisti links — NOT
  // re-derived from Eyðublað's own project link here, which has been found
  // to carry stray extra links on some units (see api/v.js).
  var q = new URLSearchParams(location.search);
  var u = q.get("u"), p = q.get("p"), s = q.get("s"), k = q.get("k");
  if (!u || !/^rec[A-Za-z0-9]{14}$/.test(u) || !k) {
    hide($("loading")); show($("error")); return;
  }

  // ── Merkja fræst ──────────────────────────────────────────────────────
  // s = the scanned piece (Sögunarlisti row), added by /v. When that row is
  // marked Yfirfr., one tap sets it fully fræst — the same fields /fraesing
  // writes (Fræst + Magn fræst, and the per-side counts for a V/H hlið
  // pair sharing one row), so both pages agree. Afturkalla puts back exactly
  // what was there before.
  var SOG_TABLE = "tblhdgyvTcBfP8kov";
  var MILL_FIELDS = ["Fræst", "Magn fræst", "V hlið magn fræst", "H hlið magn fræst"];

  function patchPiece(fields){
    var qs = "path=" + encodeURIComponent(SOG_TABLE + "/" + s);
    return fetch(PROXY + "?" + qs, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    }).then(function(r){
      return r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status));
    });
  }

  function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }

  function setupMill(piece){
    var f = piece.fields || {};
    if (!f["Yfirfr."]) return; // nothing to mill on this piece — no button
    var m = Math.max(1, num(f["M"]));
    var before = {};
    MILL_FIELDS.forEach(function(k2){
      before[k2] = k2 === "Fræst" ? !!f[k2] : num(f[k2]);
    });
    var done = !!f["Fræst"];

    var dims = [num(f["H"]), num(f["B"])].filter(Boolean).join(" × ");
    $("millPiece").textContent = [txt(f["Partur"]) || "Hlutur", dims, m > 1 ? m + " stk" : ""]
      .filter(Boolean).join(" · ");

    function render(state){
      hide($("millErr"));
      $("millBtn").disabled = state === "saving";
      $("millBtn").textContent = state === "saving" ? "Vista…" : "🔬 Merkja fræst";
      if (state === "done" || state === "already") {
        hide($("millBtn")); show($("millDone"));
        $("millOk").textContent = state === "already" ? "✅ Þegar merkt fræst" : "✅ Fræst";
      } else {
        show($("millBtn")); hide($("millDone"));
      }
    }
    function fail(e){
      console.error(e);
      $("millErr").textContent = "Tókst ekki að vista — reyndu aftur.";
      show($("millErr"));
    }

    $("millBtn").onclick = function(){
      render("saving");
      var fields = { "Fræst": true, "Magn fræst": m };
      if (m % 2 === 0) { fields["V hlið magn fræst"] = m / 2; fields["H hlið magn fræst"] = m / 2; }
      patchPiece(fields)
        .then(function(){ done = true; render("done"); })
        .catch(function(e){ render("todo"); fail(e); });
    };
    $("millUndo").onclick = function(){
      $("millUndo").disabled = true;
      // Already fræst when scanned → "before" is the done state itself, so
      // undo clears it instead of restoring it.
      var fields = before["Fræst"]
        ? { "Fræst": false, "Magn fræst": 0, "V hlið magn fræst": 0, "H hlið magn fræst": 0 }
        : before;
      patchPiece(fields)
        .then(function(){ done = false; before = { "Fræst": false, "Magn fræst": 0, "V hlið magn fræst": 0, "H hlið magn fræst": 0 }; render("todo"); })
        .catch(fail)
        .then(function(){ $("millUndo").disabled = false; });
    };

    render(done ? "already" : "todo");
    show($("millCard"));
  }

  if (s && /^rec[A-Za-z0-9]{14}$/.test(s)) {
    fetchJson(SOG_TABLE + "/" + s, k)
      .then(setupMill)
      .catch(function(e){ console.error("Hlutur fannst ekki:", e); });
  }

  $("btnEining").href = "/eining?u=" + encodeURIComponent(u) +
    (p ? "&p=" + encodeURIComponent(p) : "") + "&k=" + encodeURIComponent(k);
  if (p && /^rec[A-Za-z0-9]{14}$/.test(p)) {
    $("btnVerk").href = "/verk?t=" + encodeURIComponent(p) + "&k=" + encodeURIComponent(k);
  } else {
    $("btnVerk").style.opacity = ".4";
    $("btnVerk").style.pointerEvents = "none";
  }

  fetchJson(UNIT_TABLE + "/" + u, k)
    .then(function(rec){
      var f = rec.fields || {};
      var name = txt(f["Athugasemd"]) || "Eining";
      $("unitName").textContent = name;

      var room = txt(f["Heiti rýmis"]);
      if (room) {
        $("roomVal").textContent = room;
        $("roomVal").style.color = colorForKey(room);
        show($("roomField"));
      }
      var tegund = txt(f["Tegund einingu"]);
      if (tegund) { $("tegundVal").textContent = tegund; show($("tegundField")); }

      hide($("loading"));
      show($("content"));

      if (!p) return;
      fetchJson(PROJECT_TABLE + "/" + p, null)
        .then(function(prec){
          var pname = txt((prec.fields||{})["Heiti tækifæris / verkefnis"]).replace(/[\s,–—-]+$/,"").trim();
          if (pname) $("projName").textContent = pname;
        })
        .catch(function(){ /* project name is a nicety, not required */ });
    })
    .catch(function(e){ console.error(e); hide($("loading")); show($("error")); });
})();
</script>
</body>
</html>
