<!-- Blum cruciform mounting plate footprint, from blum+hinge+unit+left+side+.glb mesh 5 (inches ×25.4 = mm, true scale).
     Origin (0,0) = plate centre on the hinge screw line; x = depth (+ toward the front edge / arm side), y = up. mm. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -29 44 58" width="176" height="232">
  <g transform="scale(1,-1)" fill="none" stroke="#111" stroke-width="0.6">
    <rect x="-13" y="-28.25" width="26" height="56.5" rx="4.5"/>          <!-- body 26 × 56.5 -->
    <path d="M13 -8.45 H21.2 Q22.8 -8.45 22.8 -6.8 V7.3 Q22.8 8.95 21.2 8.95 H13"/> <!-- front wing, 9.8 × 17.4 -->
    <path d="M-13 -5.25 H-19 V2.95 H-13"/>                                 <!-- rear tab, 6 × 8.2 -->
    <circle cx="-3.8" cy="0.15" r="1.8"/>                                  <!-- adjusting screw -->
  </g>
</svg>
