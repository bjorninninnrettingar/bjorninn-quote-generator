<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Smíða úr Eyðublöðum — Björninn</title>
<style>
  /* smida.html (/smida, 2026-10-26) — "Smíða úr Eyðublöðum": Smíða for a project planned the OLD way in Airtable
     (Eyðublöð + Sögunarlisti, no PRO drawing). One cabinet per Eyðublað, built from the same Sögunarlisti rows /cnc
     plans from (cnc-data.js + cnc-sides.js), so what you see here is what /cnc drills. Edits: hinge side, hinges,
     door type, shelves, oven, inner drawers behind a door, clothes rail. Vista writes ONLY each Eyðublað's
     "Smíðagögn (JSON) 🔧" (api/smida-eydublad.js), Afturkalla puts the previous value back. See docs/pro-finish.md. */
  :root {
    --bg:#f3f4f6; --surface:#ffffff; --surface2:#eef1f4; --line:#e1e4e8; --text:#1a1d21; --muted:#5d6670; --dim:#9aa3ad;
    --blue:#0f6cbd; --green:#1a7d36; --amber:#9a6700; --red:#c4291c;
    --warn-bg:#fdf2d9; --warn-line:#f0d78c; --good-bg:#e5f6ea; --good-line:#b7e3c2; --bad-bg:#fbe4e1; --bad-line:#f0b8b0;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --bw-title1:#5c4a2e; --bw-title2:#9c8a6b; --bw-chrome:#d6d3c6; --bw-chrome-dark:#9b9686;
    --bw-list-bg:#e2dfd2; --bw-row-line:#cac6b6; --bw-canvas:#eeede6; --bw-ink:#333;
    --bw-teal:#2f7f6a; --bw-pill:#c3d3e1; --bw-pill-ink:#4f7294; --bw-font:Tahoma,"Segoe UI",Verdana,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4; }
  button, input, select { font:inherit; color:var(--text); }
  button { cursor:pointer; font-weight:700; border:1px solid var(--line); background:var(--surface2); border-radius:9px; padding:7px 12px; white-space:nowrap; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.go { background:var(--green); border-color:var(--green); color:#fff; }
  input[type=number] { width:84px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:#fff; text-align:right; }
  .top { display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--surface); border-bottom:1px solid var(--line); }
  .top .ttl { flex:1; min-width:0; }
  .kicker { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
  .pname { font-weight:800; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status { font-size:.84rem; color:var(--muted); width:260px; text-align:right; }
  .status.bad { color:var(--red); } .status.ok { color:var(--green); }
  #saveBtn { width:150px; } #undoBtn { width:120px; }
  .top a { color:var(--blue); font-weight:700; font-size:.88rem; text-decoration:none; white-space:nowrap; }
  .nav { display:flex; align-items:center; gap:8px; padding:8px 18px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .nav[hidden] { display:none; }
  .strip { flex:1; display:flex; gap:4px; overflow-x:auto; padding:2px 0; scrollbar-width:thin; }
  .chip { flex:none; border:1px solid var(--line); background:var(--surface2); border-radius:8px; padding:4px 9px; font-size:.8rem; font-weight:700; display:flex; align-items:center; gap:6px; }
  .chip i { width:8px; height:8px; border-radius:50%; background:#d5a021; display:inline-block; }
  .chip.done i { background:var(--green); } .chip.bad i { background:var(--red); } .chip.fre i { background:var(--dim); }
  .chip.on { border-color:var(--blue); background:#e3eefa; color:var(--blue); }
  .chip.dirty::after { content:"•"; color:var(--blue); margin-left:-2px; }
  .count { font-size:.82rem; color:var(--muted); width:110px; text-align:center; }
  #nextBtn { width:220px; }
  .main { display:grid; grid-template-columns:minmax(380px, 1fr) 470px; gap:16px; padding:14px 18px 40px; max-width:1500px; margin:0 auto; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
  .draw { display:flex; justify-content:center; }
  .draw svg { max-width:100%; height:auto; touch-action:none; user-select:none; }
  .hint { font-size:.78rem; color:var(--muted); margin-top:6px; }
  h3 { font-size:.95rem; font-weight:800; display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  h3 small { font-weight:500; color:var(--muted); font-size:.8rem; }
  .sec { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .sec:first-child { border-top:none; margin-top:0; padding-top:0; }
  .meta { font-size:.85rem; color:var(--muted); }
  .meta b { color:var(--text); }
  .row { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:.87rem; flex-wrap:wrap; }
  .row .lbl { width:96px; color:var(--muted); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { border:none; border-radius:0; background:var(--surface2); padding:6px 11px; font-weight:600; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--blue); color:#fff; }
  .small { font-size:.8rem; padding:4px 9px; font-weight:600; }
  .note { font-size:.8rem; color:var(--muted); margin-top:4px; }
  .issues { list-style:none; font-size:.84rem; }
  .issues li { padding:5px 9px; border-radius:8px; margin:4px 0; }
  .issues li.stop { background:var(--bad-bg); color:var(--red); border:1px solid var(--bad-line); }
  .issues li.check { background:var(--warn-bg); color:var(--amber); border:1px solid var(--warn-line); }
  .issues li.ok { background:var(--good-bg); color:var(--green); border:1px solid var(--good-line); }
  .msg { max-width:640px; margin:60px auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .msg h2 { font-size:1.15rem; margin-bottom:8px; } .msg p { color:var(--muted); margin-bottom:12px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:9px 16px; border-radius:10px; font-size:.88rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }
  /* BiesseWorks card (cnc-bpp.js) — same look as /cnc and /bpp */
  .bpp-card { background:none; border:none; padding:0; }
  .bw-window { background:var(--bw-chrome); border:1px solid var(--bw-chrome-dark); border-radius:5px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .bw-titlebar { background:linear-gradient(180deg, var(--bw-title1), var(--bw-title2)); color:#f3ecdd; padding:6px 7px 6px 10px; display:flex; align-items:center; gap:8px; font-family:var(--bw-font); }
  .bw-titlebar .ttl { font-size:.8rem; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 1px rgba(0,0,0,.4); }
  .bw-titlebar .remove { background:#00000030; border:1px solid #ffffff40; color:#fff; width:20px; height:18px; border-radius:3px; cursor:pointer; font-size:.72rem; line-height:1; flex:none; }
  .bw-titlebar .remove:hover { background:#c0392b; }
  .bpp-chip { font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:3px; letter-spacing:.03em; white-space:nowrap; display:inline-block; flex:none; }
  .bpp-chip.kind { background:#ffffffcc; color:#4a3c22; }
  .bpp-chip.unknown { background:#c0392b; color:#fff; }
  .bw-body { display:flex; align-items:stretch; }
  .bw-list { width:184px; flex:none; background:var(--bw-list-bg); border-right:1px solid var(--bw-chrome-dark); max-height:480px; overflow:auto; font-family:var(--bw-font); }
  .bw-row { display:flex; align-items:center; gap:5px; padding:2.5px 6px; border-bottom:1px solid var(--bw-row-line); white-space:nowrap; }
  .bw-row.child { padding-left:22px; }
  .bw-chk { width:10px; height:10px; border:1px solid #767262; background:#fff; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:1px; }
  .bw-chk.on::after { content:""; width:6px; height:6px; background:#2f2f2f; display:block; }
  .bw-icon { width:12px; height:12px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.3); }
  .bw-row .nm { color:#1a1a1a; font-size:.72rem; overflow:hidden; text-overflow:ellipsis; }
  .bw-canvas-wrap { flex:1; background:var(--bw-canvas); padding:16px; display:flex; justify-content:center; align-items:center; min-width:0; overflow:auto; }
  svg.plan { display:block; }
  .bpp-legend { display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px 12px; font-size:.74rem; color:#5c5848; background:var(--bw-chrome); font-family:var(--bw-font); }
  .bpp-legend span { display:inline-flex; align-items:center; gap:5px; }
  .bpp-legend i { width:11px; height:11px; border-radius:3px; display:inline-block; flex:none; }
  .bpp-note { margin-top:10px; font-size:.84rem; border-radius:10px; padding:9px 13px; }
  .bpp-note.warn { background:var(--warn-bg); color:var(--amber); border:1px solid var(--warn-line); }
  .bpp-note.err { background:var(--bad-bg); color:var(--red); border:1px solid var(--bad-line); }
  .bpp-note.info { background:var(--good-bg); color:var(--green); border:1px solid var(--good-line); }
  .bpp-raw { margin-top:12px; }
  .bpp-raw summary { cursor:pointer; font-size:.82rem; color:var(--muted); font-weight:700; }
  .bpp-raw summary:hover { color:var(--text); }
  .bpp-rawlist { margin-top:8px; font-size:.78rem; color:var(--dim); font-family:ui-monospace,Menlo,Consolas,monospace; max-height:240px; overflow:auto; background:var(--bg); border-radius:8px; padding:8px 10px; }
  .bpp-rawlist div { padding:2px 0; }
  .bpp-rawlist .off { opacity:.45; }
  .cncwrap .bw-list { max-height:360px; }
  .cncfiles { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .cncfiles button.on { background:var(--text); color:#fff; }
</style>
</head>
<body>
<div class="top">
  <div class="ttl"><div class="kicker">Smíða úr Eyðublöðum</div><div class="pname" id="pname">Sæki verkefni…</div></div>
  <a id="cncLink" href="#" target="_blank" rel="noopener">Opna CNC →</a>
  <span class="status" id="status"></span>
  <button id="undoBtn" type="button" disabled title="Setur fyrri Smíðagögn aftur á Eyðublöðin sem síðasta vistun breytti">Afturkalla</button>
  <button id="saveBtn" type="button" class="primary" disabled>Vista</button>
</div>
<div class="nav" id="nav" hidden>
  <button type="button" id="prevBtn" title="Fyrri (←)">‹</button>
  <div class="strip" id="strip"></div>
  <button type="button" id="nextArrow" title="Næsti (→)">›</button>
  <span class="count" id="count"></span>
  <button type="button" id="nextBtn" class="go">Yfirfarinn</button>
</div>
<div id="app"><div class="msg" style="text-align:center;color:var(--muted)">Sæki Eyðublöð og Sögunarlista…</div></div>
<div class="toast" id="toast"></div>

<script src="/cnc-sides.js"></script>
<script src="/cnc-data.js"></script>
<script src="/cnc-bpp.js"></script>
<script src="/smida-eydublod.js"></script>
<script>
(function () {
  "use strict";
  var SD = window.CNCSIDES, CD = window.CNCDATA, M = window.SMIDAEY, BPP = window.CNCBPP;
  var PROXY = "/api/airtable", qs = new URLSearchParams(location.search);
  var KEY = qs.get("k") || "", REC = qs.get("recordId") || qs.get("pro") || "", WANT_T = qs.get("t") || "", WANT_UNIT = qs.get("unit") || "";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function r1(x) { return Math.round(x * 10) / 10; }
  var project = null, cabs = [], edits = {}, cur = 0, view = "front", cncFile = 0, lastUndo = null, saving = false;
  var DRAFT = function () { return "bjorninn:smida:" + (project ? project.id : ""); };
  // the stand-in master PRO's Smíða uses too (no USB stick here): same drilling, macros sit before STAT_BLOCK
  var MASTER = ["[VARIABLES]", "PAN=LPX|0||4|", "PAN=LPY|0||4|", "PAN=LPZ|0||4|", "", "[PROGRAM]",
    '@ STAT_BLOCK, "", "", 100000001, "", 0 : 0, LPY+100, 1', "", "[VBSCRIPT]"].join("\r\n");

  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2600); }
  function fail(title, help, tech) {
    $("app").innerHTML = '<div class="msg"><h2>' + esc(title) + '</h2><p>' + esc(help) + '</p><button type="button" onclick="location.reload()">Reyna aftur</button>' + (tech ? '<p style="margin-top:10px;font-size:.75rem">' + esc(tech) + '</p>' : "") + '</div>';
    $("pname").textContent = "Opnaðist ekki";
  }

  // ── load ──────────────────────────────────────────────────────────────────────────────────
  async function boot() {
    if (!KEY) { fail("Lykil vantar", "Opnaðu síðuna úr PRO eða /cnc (hlekkurinn er með skrifstofulyklinum).", ""); return; }
    try {
      var p;
      if (REC) p = (await CD.fetchAll(PROXY, KEY, CD.PROJECTS, { filterByFormula: 'RECORD_ID()="' + REC + '"', "fields[]": [CD.PNAME] }))[0];
      else if (WANT_T) p = (await CD.fetchAll(PROXY, KEY, CD.PROJECTS, { filterByFormula: 'FIND("' + WANT_T.replace(/"/g, "") + ' |",{' + CD.PNAME + '})', "fields[]": [CD.PNAME] }))[0];
      if (!p) { fail("Verkefnið fannst ekki", "Hlekkurinn vísar á verkefni sem er ekki til. Opnaðu það aftur úr PRO eða /cnc.", ""); return; }
      var name = String(p.fields[CD.PNAME] || p.id), pre = (name.match(/^(T-\d+)/) || [])[1];
      if (!pre) { fail("Verkefnið er ekki með T-númer", "Smíða úr Eyðublöðum finnur einingarnar eftir T-númeri verkefnisins.", name); return; }
      project = { id: p.id, name: name, prefix: pre };
      $("pname").textContent = name;
      $("cncLink").href = "/cnc?recordId=" + encodeURIComponent(p.id) + "&k=" + encodeURIComponent(KEY);
      var data = await CD.load({ proxy: PROXY, key: KEY, id: p.id, prefix: pre });
    } catch (e) {
      if (e.status === 401 || e.status === 403) fail("Lykillinn virkar ekki", "Opnaðu síðuna aftur úr PRO eða /cnc.", e.message);
      else if (e.status) fail("Villa á þjóninum", "Airtable svaraði ekki rétt. Bíddu augnablik og reyndu aftur.", e.message);
      else fail("Ekkert samband", "Athugaðu nettenginguna og reyndu aftur.", e.message);
      return;
    }
    if (!CD.legacy(data)) {
      fail("Þetta verkefni er teiknað í PRO", "Eyðublöðin voru búin til úr teikningunni — breyttu Smíða í PRO, annars skrifar næsta Keyra skipulag yfir það sem er vistað hér.", "");
      $("app").querySelector(".msg").insertAdjacentHTML("beforeend", '<p><a href="/skipuleggja?pro=' + encodeURIComponent(project.id) + '&k=' + encodeURIComponent(KEY) + '">Opna í PRO →</a></p>');
      return;
    }
    var I = CD.sideInput(data);
    cabs = data.units.filter(function (u) { return I.byUnit[u.id] && !I.isDoor[u.id]; }).map(function (u) {
      return M.cabinet(u, I.byUnit[u.id], { gripMm: CD.gripFor(I, data.projGrip, u.id, null).mm, gripZones: I.unitGripZones[u.id], fataslar: I.unitFataslar[u.id] });
    }).filter(Boolean).sort(function (a, b) { return a.name.localeCompare(b.name, "is", { numeric: true }); });
    if (!cabs.length) { fail("Engir skápar", "Engin Eyðublöð með skápahliðum í Sögunarlista fundust fyrir " + pre + ".", ""); return; }
    var draft = {}; try { draft = JSON.parse(localStorage.getItem(DRAFT()) || "{}") || {}; } catch (e) { draft = {}; }
    var restored = 0;
    cabs.forEach(function (c) {
      var d = draft[c.unit];
      if (d && d.raw === (c.raw || null) && d.e) { edits[c.unit] = d.e; restored++; } // a draft from before a newer save elsewhere is dropped
      else edits[c.unit] = M.initEdit(c);
    });
    if (restored && dirtyCabs().length) toast("Óvistaðar breytingar úr þessum vafra sóttar (" + dirtyCabs().length + ")");
    var at = cabs.findIndex(function (c) { return c.unit === WANT_UNIT; });
    cur = at >= 0 ? at : 0;
    $("nav").hidden = false;
    render();
  }

  // ── state helpers ─────────────────────────────────────────────────────────────────────────
  function cab() { return cabs[cur]; }
  function ed(c) { return edits[(c || cab()).unit]; }
  function smida(c) { return M.smidaOf(c, ed(c)); }
  function plan(c) { return M.planOf(c, smida(c)); }
  // only what Rakel looked at goes to Airtable: a cabinet she marked or changed (an untouched default stays /cnc's default)
  function dirty(c) { var e = ed(c); return M.editable(c) && !!(e.reviewed || e.touched) && !M.same(smida(c), c.existing); }
  function dirtyCabs() { return cabs.filter(dirty); }
  function stateOf(c) {
    if (!M.editable(c)) return "fre";
    if (M.blockers(c, ed(c), plan(c)).length) return "bad";
    return ed(c).reviewed ? "done" : "todo";
  }
  function saveDraft() {
    var o = {}; cabs.forEach(function (c) { if (dirty(c)) o[c.unit] = { raw: c.raw || null, e: ed(c) }; });
    try { if (Object.keys(o).length) localStorage.setItem(DRAFT(), JSON.stringify(o)); else localStorage.removeItem(DRAFT()); } catch (e) {}
  }
  // any change to what gets built drops the "yfirfarinn" mark (same as PRO)
  function change(fn) { fn(ed()); ed().reviewed = false; ed().touched = true; saveDraft(); render(); }

  // ── render ────────────────────────────────────────────────────────────────────────────────
  function render() {
    var c = cab(), e = ed(c), p = plan(c);
    // strip
    $("strip").innerHTML = cabs.map(function (x, i) {
      return '<button type="button" class="chip ' + stateOf(x) + (i === cur ? " on" : "") + (dirty(x) ? " dirty" : "") + '" data-go="' + i + '" title="' + esc(x.name + (x.tegund ? " · " + x.tegund : "")) + '"><i></i>' + esc(x.sk) + "</button>";
    }).join("");
    var on = $("strip").querySelector(".chip.on"); if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
    var editableCabs = cabs.filter(M.editable), done = editableCabs.filter(function (x) { return ed(x).reviewed; }).length;
    $("count").textContent = done + " / " + editableCabs.length + " yfirfarnir";
    var nb = $("nextBtn"), next = nextUnreviewed(), blocked = M.blockers(c, e, p);
    if (!M.editable(c)) { nb.textContent = next >= 0 ? "Næsti → " + cabs[next].sk : "Allir yfirfarnir"; nb.disabled = next < 0; nb.dataset.act = "next"; }
    else if (!e.reviewed) { nb.textContent = next >= 0 && next !== cur ? "Yfirfarinn → " + cabs[next].sk : "Skápur yfirfarinn"; nb.disabled = !!blocked.length; nb.dataset.act = "mark"; nb.title = blocked.length ? "Lagaðu fyrst: " + blocked[0] : ""; }
    else { nb.textContent = next >= 0 ? "Næsti → " + cabs[next].sk : "Allir yfirfarnir — vista"; nb.disabled = false; nb.dataset.act = next >= 0 ? "next" : "save"; nb.title = ""; }
    // top
    var nd = dirtyCabs().length;
    $("saveBtn").textContent = nd ? "Vista (" + nd + ")" : "Vista";
    $("saveBtn").disabled = !nd || saving;
    $("undoBtn").disabled = !lastUndo || saving;
    if (!saving && !$("status").dataset.keep) { $("status").className = "status"; $("status").textContent = nd ? nd + " skápar óvistaðir" : "Allt vistað"; }
    // main
    var app = $("app");
    app.innerHTML = '<div class="main"><div class="panel"><div class="tabs"><button type="button" data-view="front" class="' + (view === "front" ? "on" : "") + '">Framhlið</button>' +
      '<button type="button" data-view="side" class="' + (view === "side" ? "on" : "") + '">Hlið · CNC</button></div><div id="drawBox"></div></div>' +
      '<div class="panel" id="side"></div></div>';
    if (view === "front") drawFront(c, e, p, $("drawBox")); else drawSide(c, p, $("drawBox"));
    sidePanel(c, e, p, $("side"));
  }
  function nextUnreviewed() {
    for (var k = 1; k <= cabs.length; k++) { var i = (cur + k) % cabs.length; if (M.editable(cabs[i]) && !ed(cabs[i]).reviewed) return i; }
    return M.editable(cab()) && !ed().reviewed ? cur : -1;
  }

  // Front view: the carcass as /cnc sees it (mm from the bottom of the side). Shelves, inner drawers, oven boards,
  // rails and hinges are dragged; drawers and doors are what Sögunarlisti cut.
  var NS = "http://www.w3.org/2000/svg";
  function drawFront(c, e, p, box) {
    if (!M.editable(c)) { box.innerHTML = '<div class="msg" style="margin:20px auto"><h2>' + esc(c.name) + '</h2><p>' + esc((c.base.stop || []).join(" · ") || "Engin hlið sem /cnc borar.") + '</p><p>Gert í höndunum — þessi skápur er ekki vistaður hér.</p></div>'; return; }

    });
  });
  $("prevBtn").onclick = function () { cur = (cur - 1 + cabs.length) % cabs.length; render(); };
  $("nextArrow").onclick = function () { cur = (cur + 1) % cabs.length; render(); };
  $("nextBtn").onclick = function () {
    var act = this.dataset.act, c = cab();
    if (act === "mark") { if (M.blockers(c, ed(), plan(c)).length) return; ed().reviewed = true; saveDraft(); var n = nextUnreviewed(); if (n >= 0) cur = n; render(); return; }
    if (act === "save") { save(); return; }
    var nx = nextUnreviewed(); if (nx >= 0) { cur = nx; render(); }
  };
  document.addEventListener("keydown", function (ev) {
    if (/INPUT|SELECT|TEXTAREA/.test((ev.target || {}).tagName || "")) return;
    if (ev.key === "ArrowLeft") $("prevBtn").click();
    else if (ev.key === "ArrowRight") $("nextArrow").click();
  });
  window.addEventListener("beforeunload", function (ev) { if (cabs.length && dirtyCabs().length) { ev.preventDefault(); ev.returnValue = ""; } });

  // ── Vista / Afturkalla ────────────────────────────────────────────────────────────────────
  async function post(items) {
    var r = await fetch("/api/smida-eydublad", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k: KEY, recordId: project.id, items: items }) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { var er = new Error(j.error || "HTTP " + r.status); er.status = r.status; er.conflict = j.conflict; throw er; }
    return j;
  }
  function setStatus(t, cls) { var s = $("status"); s.textContent = t; s.className = "status" + (cls ? " " + cls : ""); s.dataset.keep = "1"; clearTimeout(setStatus.t); setStatus.t = setTimeout(function () { delete s.dataset.keep; render(); }, 6000); }
  async function save() {
    var list = dirtyCabs(); if (!list.length || saving) return;
    var notRev = list.filter(function (c) { return !ed(c).reviewed; });
    if (notRev.length && !confirm(notRev.length + " af " + list.length + " breyttum skápum eru ekki merktir yfirfarnir (" + notRev.map(function (c) { return c.sk; }).slice(0, 8).join(", ") + (notRev.length > 8 ? " …" : "") + ").\n\nÞeir vistast samt, en /cnc segir „ekki yfirfarinn“ við þá. Vista?")) return;
    saving = true; render(); setStatus("Vista " + list.length + " Eyðublöð…");
    var items = list.map(function (c) { return { id: c.unit, smida: JSON.stringify(smida(c)), prev: c.raw || null }; });
    try {
      var j = await post(items);
      items.forEach(function (it) { var c = cabs.find(function (x) { return x.unit === it.id; }); c.raw = it.smida; c.existing = M.parse(it.smida); });
      lastUndo = items.map(function (it) { return { id: it.id, smida: j.previous[it.id] == null ? null : j.previous[it.id], prev: it.smida }; });
      saving = false; saveDraft(); render();
      setStatus("Vistað: " + j.written + " Eyðublöð. Opnaðu CNC.", "ok");
    } catch (e) {
      saving = false; render();
      setStatus(e.status === 409 ? "Ekki vistað — breytt annars staðar (" + (e.conflict || []).length + "). Endurhlaða síðuna." : "Vistun tókst ekki: " + e.message, "bad");
    }
  }
  $("saveBtn").onclick = save;
  $("undoBtn").onclick = async function () {
    if (!lastUndo || saving) return;
    if (!confirm("Afturkalla síðustu vistun? Fyrri Smíðagögn fara aftur á " + lastUndo.length + " Eyðublöð.")) return;
    saving = true; render(); setStatus("Afturkalla…");
    try {
      await post(lastUndo);
      lastUndo.forEach(function (it) { var c = cabs.find(function (x) { return x.unit === it.id; }); c.raw = it.smida; c.existing = M.parse(it.smida); }); // the edits stay on the page (unsaved again) — Vista puts them back
      lastUndo = null; saving = false; saveDraft(); render(); setStatus("Afturkallað í Airtable — breytingarnar eru enn hér, óvistaðar.", "ok");
    } catch (e) { saving = false; render(); setStatus("Afturkalla tókst ekki: " + e.message, "bad"); }
  };

  boot();
})();
</script>
</body>
</html>
