<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Smíða — Björninn</title>
<style>
  /* smida.html (/smida) — "Smíða úr Eyðublöðum": Smíða for a project planned the OLD way in Airtable (Eyðublöð +
     Sögunarlisti, no PRO drawing). One cabinet per Eyðublað, built from the same Sögunarlisti rows /cnc plans from
     (cnc-data.js + cnc-sides.js → smida-eydublod.js), so the drawing is what /cnc drills. Saves ONLY each Eyðublað's
     "Smíðagögn (JSON) 🔧" (api/smida-eydublad.js); a cabinet is saved the moment it's marked "Yfirfarinn".
     2026-10-26 redesign (owner: "the most important page in the company"): one calm screen per cabinet — the drawing
     is the hero and is edited directly (drag shelves/hinges, click a door for its hinge side, click a number to type),
     the right side asks only what is still open, everything settled is one quiet line. See docs/pro-finish.md. */
  :root {
    --bg:#f5f5f7; --surface:#ffffff; --line:#e5e5ea; --line2:#d2d2d7; --text:#1d1d1f; --muted:#6e6e73; --dim:#a1a1a6;
    --blue:#0071e3; --blue-soft:#e8f1fc; --green:#248a3d; --green-soft:#e9f6ec; --amber:#b25000; --amber-soft:#fff4e5; --red:#d70015;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --warn-bg:#fdf2d9; --warn-line:#f0d78c; --good-bg:#e5f6ea; --good-line:#b7e3c2; --bad-bg:#fbe4e1; --bad-line:#f0b8b0;
    --bw-title1:#5c4a2e; --bw-title2:#9c8a6b; --bw-chrome:#d6d3c6; --bw-chrome-dark:#9b9686;
    --bw-list-bg:#e2dfd2; --bw-row-line:#cac6b6; --bw-canvas:#eeede6; --bw-ink:#333;
    --bw-teal:#2f7f6a; --bw-pill:#c3d3e1; --bw-pill-ink:#4f7294; --bw-font:Tahoma,"Segoe UI",Verdana,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:none; }
  button:disabled { cursor:default; }
  input[type=number] { width:76px; border:1px solid var(--line2); border-radius:8px; padding:5px 8px; background:#fff; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=number]:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px #0071e333; }
  .shell { height:100vh; display:grid; grid-template-rows:56px 1fr; }

  /* top bar */
  .top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 20px; background:rgba(255,255,255,.86); backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:baseline; gap:10px; min-width:0; }
  .brand b { font-weight:600; font-size:15px; }
  .brand span { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .bar { width:140px; height:4px; border-radius:2px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--green); border-radius:2px; transition:width .3s; }
  .acts { display:flex; justify-content:flex-end; align-items:center; gap:14px; }
  .save { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); width:190px; justify-content:flex-end; white-space:nowrap; }
  .save i { width:7px; height:7px; border-radius:50%; background:var(--green); flex:none; }
  .save.dirty i { background:var(--blue); } .save.busy i { background:var(--dim); } .save.bad { color:var(--red); } .save.bad i { background:var(--red); }
  .tbtn { font-size:13px; color:var(--blue); padding:6px 4px; }
  .tbtn:disabled { color:var(--dim); }
  #saveBtn { min-width:64px; text-align:center; } #undoBtn { width:78px; text-align:center; }
  .usb { font-size:13px; font-weight:600; color:#fff; background:var(--text); border-radius:8px; padding:7px 14px; }
  .usb:disabled { background:#e8e8ed; color:var(--dim); }
  /* export sheet */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; z-index:50; }
  .sheet > div { width:min(760px, calc(100vw - 40px)); max-height:calc(100vh - 80px); overflow:auto; background:#fff; border-radius:16px; padding:28px 30px 22px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .sheet h2 { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .sheet .sub2 { color:var(--muted); margin-top:4px; }
  .sheet .stage2 { margin-top:18px; display:flex; align-items:center; gap:10px; color:var(--muted); }
  .sheet .spin { width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .sheet h3 { font-size:12px; font-weight:600; color:var(--dim); letter-spacing:.05em; text-transform:uppercase; margin:20px 0 6px; }
  .sheet ul { list-style:none; } .sheet li { font-size:13.5px; padding:4px 0; }
  .sheet li.hand::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--amber); margin-right:9px; vertical-align:middle; }
  .sheet .files { display:grid; grid-template-columns:repeat(2, 1fr); gap:2px 16px; }
  .sheet .files button { text-align:left; font-size:12.5px; color:var(--blue); padding:3px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet .foot { display:flex; justify-content:flex-end; gap:16px; margin-top:22px; }
  .sheet .foot button { font-size:14px; color:var(--blue); }
  .sheet .err { color:var(--red); margin-top:14px; }
  #fileCard { margin-top:14px; }

  .main { display:grid; grid-template-columns:236px 1fr 404px; min-height:0; }

  /* cabinet list */
  .list { border-right:1px solid var(--line); overflow-y:auto; padding:12px 10px 24px; }
  .list h4 { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); padding:4px 10px 8px; }
  .item { width:100%; display:grid; grid-template-columns:20px 1fr auto; align-items:center; gap:8px; padding:7px 10px; border-radius:9px; text-align:left; }
  .item:hover { background:#ebebef; }
  .item.on { background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .item .nm { font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .ty { display:block; font-weight:400; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .un { width:6px; height:6px; border-radius:50%; background:var(--blue); visibility:hidden; }
  .item .un.on { visibility:visible; }
  .st { width:18px; height:18px; display:block; }

  /* stage */
  .stage { position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; padding:18px 22px 14px; }
  .views { position:absolute; top:16px; right:22px; display:flex; gap:2px; background:#e8e8ed; border-radius:8px; padding:2px; z-index:2; }
  .views button { font-size:12px; padding:4px 10px; border-radius:6px; color:var(--muted); }
  .views button.on { background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.1); }
  #canvas { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  #canvas.both { align-items:stretch; gap:8px; }
  #canvas.both #cf { flex:1.15; min-width:0; display:flex; align-items:center; justify-content:center; }
  #canvas.both #cs { flex:1; min-width:0; border-left:1px solid var(--line); }
  #canvas.both .cncv { padding-top:44px; } #canvas.both .cnccap { flex-wrap:wrap; gap:6px 12px; } #canvas.both .frsec { display:none; }
  #canvas svg { display:block; touch-action:none; user-select:none; overflow:visible; }
  .door { cursor:pointer; }
  .door:hover .door-r { fill:#0071e30d; }
  .lbl { cursor:text; }
  .lbl rect { fill:#fff; stroke:var(--line2); }
  .lbl:hover rect { stroke:var(--blue); }
  .drag { cursor:ns-resize; }
  .inl { position:absolute; width:72px; z-index:5; }
  .cncv { width:100%; height:100%; overflow:auto; padding-top:40px; }
  .cncrow { display:flex; gap:16px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  .cncrow .bpp-card { flex:0 1 auto; max-width:100%; }
  .cncrow .bpp-card:not(.bpp-calm) { flex:1 1 100%; }
  .cnccap { display:flex; gap:16px; justify-content:center; margin-top:12px; font-size:12px; color:var(--muted); }
  .cnccap span { display:inline-flex; align-items:center; gap:6px; }
  .cnccap i { display:inline-block; }
  .cnccap .ci { width:9px; height:9px; border-radius:50%; border:1.6px solid var(--text); }
  .cnccap .cs { width:4px; height:4px; border-radius:50%; background:var(--text); box-shadow:6px 0 0 var(--text); margin-right:6px; }
  .cnccap .cf { width:14px; height:2px; background:var(--text); }
  .bpp-calm-svg .cz[data-type="shelf"], .bpp-calm-svg .cz[data-type="inner"], .bpp-calm-svg .cz[data-type="hinge"] { cursor:ns-resize; }
  .cnccap .cd { width:14px; height:9px; border:1.1px solid #6e6e73; border-radius:2px; box-shadow:inset 0 -1.6px 0 #6e6e73; }
  .cnccap svg { display:block; }
  .bpp-calm-svg .cz[data-type] { cursor:pointer; }
  .pick { cursor:pointer; }
  .r.hl, .q.hl { animation:hl 1.6s ease-out; border-radius:10px; }
  @keyframes hl { 0%, 35% { background:#e8f1fc; box-shadow:0 0 0 6px #e8f1fc; } 100% { background:transparent; box-shadow:0 0 0 6px transparent; } }
  .cnccap .cb { color:var(--blue); }
  .frsec { margin:18px auto 0; max-width:640px; }
  .frh { display:flex; align-items:baseline; gap:10px; font-size:13px; margin-bottom:8px; } .frh span { color:var(--muted); font-size:12px; }
  .frrow { display:flex; gap:12px; flex-wrap:wrap; }
  .frc { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; align-items:center; }
  .frn { font-size:12px; margin-top:4px; } .frx { font-size:11px; color:var(--dim); } .cnccap .cred { color:var(--red); }
  .cnccap .cgp { width:6px; height:6px; background:#c7c7cc; }
  .cnccap .cfr { width:6px; height:12px; background:#f2f2f4; border:1px solid #aeaeb2; border-radius:1.5px; }

  /* panel */
  .panel { border-left:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-height:0; }
  .pscroll { flex:1; overflow-y:auto; padding:26px 26px 12px; }
  .ph h1 { font-size:28px; font-weight:600; letter-spacing:-.02em; line-height:1.1; }
  .ph p { color:var(--muted); margin-top:4px; font-size:13.5px; }
  .open { margin-top:22px; }
  .q { margin-bottom:20px; }
  .q h2 { font-size:17px; font-weight:600; letter-spacing:-.01em; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .q h2 .dot { width:8px; height:8px; border-radius:50%; background:var(--amber); flex:none; }
  .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .cards.two { grid-template-columns:repeat(2, 1fr); }
  .card { border:1.5px solid var(--line); border-radius:12px; padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; font-weight:500; background:#fff; transition:border-color .12s, background .12s; }
  .card:hover { border-color:var(--line2); }
  .card.on { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
  .card svg { width:46px; height:62px; }
  .calm { margin-top:22px; display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; background:var(--green-soft); color:var(--green); font-weight:500; }
  .calm.hand { background:#f2f2f4; color:var(--muted); }
  .calm svg { flex:none; }
  .act { margin-top:10px; font-size:13px; color:var(--blue); }
  .rows { margin-top:24px; border-top:1px solid var(--line); }
  .r { border-bottom:1px solid var(--line); }
  .rh { width:100%; display:grid; grid-template-columns:108px 1fr 14px; align-items:center; gap:10px; padding:13px 2px; text-align:left; }
  .rh .k { color:var(--muted); font-size:13.5px; }
  .rh .v { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .rh .chev { color:var(--dim); transition:transform .15s; }
  .r.x .rh .chev { transform:rotate(90deg); }
  .r.ro .rh { cursor:default; }
  .rb { padding:2px 2px 16px; display:none; }
  .r.x .rb { display:block; }
  .line { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13.5px; }
  .line .t { width:70px; color:var(--muted); }
  .line .u { color:var(--muted); }
  .seg { display:inline-flex; background:#e8e8ed; border-radius:8px; padding:2px; }
  .seg button { font-size:12.5px; padding:4px 10px; border-radius:6px; color:var(--text); }
  .seg button.on { background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600; }
  .more { font-size:12.5px; color:var(--blue); margin-top:8px; }
  .adv { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .mini { font-size:12.5px; color:var(--blue); margin-right:12px; }
  .mini:disabled { color:var(--dim); }
  .check { margin-top:20px; }
  .check h3 { font-size:12px; font-weight:600; color:var(--dim); letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
  .check li { list-style:none; font-size:13px; color:var(--amber); padding:4px 0 4px 16px; position:relative; }
  .check li::before { content:""; position:absolute; left:2px; top:11px; width:6px; height:6px; border-radius:50%; background:var(--amber); }
  .tip { position:relative; display:inline-flex; color:var(--dim); cursor:help; vertical-align:middle; }
  .tip:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); right:-8px; width:240px; background:#1d1d1f; color:#fff; font-size:12px; line-height:1.4; padding:8px 10px; border-radius:8px; z-index:30; font-weight:400; white-space:normal; }
  .pf { padding:14px 26px 18px; border-top:1px solid var(--line); }
  #nextBtn { width:100%; height:46px; border-radius:12px; background:var(--blue); color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; }
  #nextBtn:disabled { background:#e8e8ed; color:var(--dim); }
  #nextBtn.calmb { background:#e8e8ed; color:var(--text); }
  #nextBtn kbd { font:inherit; font-size:11px; opacity:.65; border:1px solid currentColor; border-radius:4px; padding:0 4px; }
  .sub { height:22px; display:flex; justify-content:center; align-items:flex-end; }
  .sub button { font-size:12.5px; color:var(--muted); }
  .msg { max-width:520px; margin:80px auto; text-align:center; }
  .msg h2 { font-size:22px; font-weight:600; margin-bottom:8px; } .msg p { color:var(--muted); margin-bottom:16px; }
  .msg button { color:var(--blue); }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px); background:#1d1d1f; color:#fff; padding:9px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:40; }
  .toast.show { opacity:1; transform:translateX(-50%); }
  /* BiesseWorks card (cnc-bpp.js) — same look as /cnc and /bpp */
  .bpp-card { background:none; border:none; padding:0; }
  .bw-window { background:var(--bw-chrome); border:1px solid var(--bw-chrome-dark); border-radius:5px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .bw-titlebar { background:linear-gradient(180deg, var(--bw-title1), var(--bw-title2)); color:#f3ecdd; padding:6px 7px 6px 10px; display:flex; align-items:center; gap:8px; font-family:var(--bw-font); }
  .bw-titlebar .ttl { font-size:.8rem; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 1px rgba(0,0,0,.4); }
  .bw-titlebar .remove { background:#00000030; border:1px solid #ffffff40; color:#fff; width:20px; height:18px; border-radius:3px; cursor:pointer; font-size:.72rem; line-height:1; flex:none; }
  .bw-titlebar .remove:hover { background:#c0392b; }
  .bpp-chip { font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:3px; letter-spacing:.03em; white-space:nowrap; display:inline-block; flex:none; }
  .bpp-chip.kind { background:#ffffffcc; color:#4a3c22; }
  .bpp-chip.unknown { background:#c0392b; color:#fff; }
  .bw-body { display:flex; align-items:stretch; }
  .bw-list { width:184px; flex:none; background:var(--bw-list-bg); border-right:1px solid var(--bw-chrome-dark); max-height:480px; overflow:auto; font-family:var(--bw-font); }
  .bw-row { display:flex; align-items:center; gap:5px; padding:2.5px 6px; border-bottom:1px solid var(--bw-row-line); white-space:nowrap; }
  .bw-row.child { padding-left:22px; }
  .bw-chk { width:10px; height:10px; border:1px solid #767262; background:#fff; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:1px; }
  .bw-chk.on::after { content:""; width:6px; height:6px; background:#2f2f2f; display:block; }
  .bw-icon { width:12px; height:12px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.3); }
  .bw-row .nm { color:#1a1a1a; font-size:.72rem; overflow:hidden; text-overflow:ellipsis; }
  .bw-canvas-wrap { flex:1; background:var(--bw-canvas); padding:16px; display:flex; justify-content:center; align-items:center; min-width:0; overflow:auto; }
  svg.plan { display:block; }
  .bpp-legend { display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px 12px; font-size:.74rem; color:#5c5848; background:var(--bw-chrome); font-family:var(--bw-font); }
  .bpp-legend span { display:inline-flex; align-items:center; gap:5px; }
  .bpp-legend i { width:11px; height:11px; border-radius:3px; display:inline-block; flex:none; }
  .bpp-note { margin-top:10px; font-size:.84rem; border-radius:10px; padding:9px 13px; }
  .bpp-note.warn { background:var(--warn-bg); color:var(--amber); border:1px solid var(--warn-line); }
  .bpp-note.err { background:var(--bad-bg); color:var(--red); border:1px solid var(--bad-line); }
  .bpp-note.info { background:var(--good-bg); color:var(--green); border:1px solid var(--good-line); }
  .bpp-raw { margin-top:12px; }
  .bpp-raw summary { cursor:pointer; font-size:.82rem; color:var(--muted); font-weight:700; }
  .bpp-raw summary:hover { color:var(--text); }
  .bpp-rawlist { margin-top:8px; font-size:.78rem; color:var(--dim); font-family:ui-monospace,Menlo,Consolas,monospace; max-height:240px; overflow:auto; background:var(--bg); border-radius:8px; padding:8px 10px; }
  .bpp-rawlist div { padding:2px 0; }
  .bpp-rawlist .off { opacity:.45; }
  .bw-list { max-height:none; }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><b>Smíða</b><span id="pname">Sæki verkefni…</span></div>
    <div class="prog" id="prog"></div>
    <div class="acts">
      <span class="save" id="save"></span>
      <button type="button" class="tbtn" id="saveBtn" disabled>Vista</button>
      <button type="button" class="tbtn" id="undoBtn" disabled>Afturkalla</button>
      <button type="button" id="usbBtn" class="usb" disabled>Skrifa á USB</button>
    </div>
  </div>
  <div class="main" id="main"><div></div><div class="msg"><p>Sæki Eyðublöð og Sögunarlista…</p></div><div></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="/cnc-sides.js"></script>
<script src="/cnc-data.js"></script>
<script src="/cnc-doors.js"></script>
<script src="/cnc-export.js"></script>
<script src="/cnc-bpp.js"></script>
<script src="/smida-eydublod.js"></script>
<script>
(function () {
  "use strict";
  var SD = window.CNCSIDES, CD = window.CNCDATA, M = window.SMIDAEY, BPP = window.CNCBPP;
  var PROXY = "/api/airtable", qs = new URLSearchParams(location.search);
  // k: from the link, else the office key /skrifstofa keeps in this browser (same as PRO; found by the T-248 test, 2026-10-27)
  var KEY = qs.get("k") || (function () { try { return localStorage.getItem("bjorninn:skrifstofa:k") || ""; } catch (e) { return ""; } })(), REC = qs.get("recordId") || qs.get("pro") || "", WANT_T = qs.get("t") || "", WANT_UNIT = qs.get("unit") || "";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function r1(x) { return Math.round(x * 10) / 10; }

      var adv2 = loose.length ? '<div class="line"><span class="u">Göt fyrir hverja lausa hillu ' + tip("Hve margar stillingar (50 mm á milli) hver laus hilla fær. 3 er venjan.") + "</span></div>" +
        loose.sort(function (a, b) { return b.x.mm - a.x.mm; }).map(function (o) { return '<div class="line"><span class="t">' + mm(o.x.mm) + '</span><span class="seg">' + [1, 3, 5].map(function (n) { return '<button type="button" data-pos="' + o.i + ":" + n + '" class="' + ((o.x.pos || 3) === n ? "on" : "") + '">' + n + "</button>"; }).join("") + "</span></div>"; }).join("") : "";
      if (!e.oven) adv2 += '<div class="line"><button type="button" class="mini" data-act="spread">Raða jafnt</button></div>';
      h += row("shelves", e.oven ? "Botnar, hillur" : "Hillur", esc(sum), '<div class="line"><span class="u">mm frá botni hliðar ' + tip("Efri flötur hillunnar. Fjöldi og föst/laus koma úr Sögunarlista. Dragðu línuna á teikningunni eða smelltu á töluna.") + "</span></div>" + lines + more("s", adv2));
    }
    if (e.inner) {
      h += row("inner", "Innskúffur", e.inner.length + " · " + e.inner.map(function (x) { return mm(x.mm); }).join(", "),
        e.inner.map(function (x, i) { return '<div class="line"><span class="t">' + x.code + " · " + ((c.inner[i] || {}).h || "") + '</span><input type="number" data-inner="' + i + '" value="' + mm(x.mm) + '"><span class="u">mm ' + (i ? "" : tip("Neðri brún innskúffufrontsins, frá botni hliðar.")) + "</span></div>"; }).join("") +
        '<button type="button" class="more" data-act="innerreset">Raða sjálfkrafa</button>');
    }
    if (e.rails) {
      h += row("rails", "Fataslá", e.rails.map(function (x) { return mm(x.mm); }).join(", "),
        e.rails.map(function (x, i) { return '<div class="line"><span class="t">Slá ' + (i + 1) + '</span><input type="number" data-rail="' + i + '" value="' + mm(x.mm) + '"><span class="u">mm ' + (i ? "" : tip("CNC borar slána ekki enn — staðsetningin fer í CNC-skrána og er boruð í höndunum.")) + "</span></div>"; }).join(""));
    }
    if ((p.drawers || []).length) {
      var ur = e.urtak, codes = p.drawers.map(function (d) { return d.code; }).filter(function (x, i, a) { return a.indexOf(x) === i; }), PL = { vinstri: "Vinstri", midja: "Miðja", haegri: "Hægri" };
      h += row("urtak", "Úrtak fyrir vatnslás", ur && ur.drawer ? "Skúffa " + ur.drawer + " · " + (PL[ur.place || "midja"] || "Miðja").toLowerCase() + (ur.x ? " · " + mm(ur.x) + " mm" : "") : "Ekkert",
        '<div class="line"><span class="u">Í botni hvaða skúffu ' + tip("Botninn fær úrtak (URTAK_F_VATNSLAS, 150 mm breitt) og kemur sem sér skrá í CNC-útflutninginn — stærðin kemur úr „Skúffubotn“ í Sögunarlista, kerfið (Merivo/Legra) úr skúffunni.") + '</span></div>' +
        '<div class="line"><span class="seg"><button type="button" data-urd="" class="' + (ur && ur.drawer ? "" : "on") + '">Ekkert</button>' + codes.map(function (cd) { return '<button type="button" data-urd="' + cd + '" class="' + (ur && ur.drawer === cd ? "on" : "") + '">' + cd + "</button>"; }).join("") + "</span></div>" +
        (ur && ur.drawer ? '<div class="line"><span class="seg">' + ["vinstri", "midja", "haegri"].map(function (k) { return '<button type="button" data-urp="' + k + '" class="' + ((ur.place || "midja") === k ? "on" : "") + '">' + PL[k] + "</button>"; }).join("") + "</span></div>" +
          more("urx", '<div class="line"><span class="t">Miðað við</span><input type="number" data-urx="1" value="' + (ur.x ? mm(ur.x) : "") + '" placeholder="miðja botns"><span class="u">mm frá vinstri brún botns ' + tip("Autt = í miðju botnsins (eins og tilbúna skráin). Vinstri/Miðja/Hægri segir hvaða brún úrtaksins er á þessum stað.") + "</span></div>") : ""));
    }
    if ((p.drawers || []).length) h += row("dw", "Skúffur", p.drawers.map(function (d) { return d.code + " " + mm(d.front); }).join(" · ") + (c.depths.length ? " · dýpt " + c.depths.map(mm).join("/") : "") + " " + tip("Dýptin er lengd skúffubotnsins í Sögunarlista (kerfislengd ≈ botn + 26). Breyttu skúffum á Eyðublaðinu og keyrðu Yfirfara."), "", true);
    h += "</div>";
    // ── what /cnc still says (real things only — the defaults go away once marked, the open questions are above)
    var notes = (p.check || []).filter(function (t) { return t.indexOf("Skápur yfirfarinn") < 0 && (p.defaults || []).indexOf(t) < 0 && !/amahlið óþekkt/.test(t); }); // the hinge side is asked above
    if (notes.length) h += '<div class="check"><h3>Athugaðu</h3><ul>' + notes.map(function (t) { return "<li>" + esc(t.split(/ — /)[0]) + (t.indexOf(" — ") > 0 ? " " + tip(t) : "") + "</li>"; }).join("") + "</ul></div>";
    h += "</div>";
    el.innerHTML = h + footer(c, e, blockers);
  }
  function footer(c, e, blockers) {
    var nx = nextOpen(cur), btn;
    if (!canEdit(c)) { if (nx < 0 && cabs.length > 1) nx = (cur + 1) % cabs.length; // nothing to review here: just step through
      btn = '<button type="button" id="nextBtn" class="calmb" data-act="step" data-to="' + nx + '"' + (nx < 0 ? " disabled" : "") + ">" + (nx >= 0 ? "Næsti · " + esc(cabs[nx].sk) + " <kbd>⏎</kbd>" : "Allir yfirfarnir") + "</button>"; }
    else if (blockers.length) btn = '<button type="button" id="nextBtn" disabled>Ákveddu fyrst það sem er opið</button>';
    else if (!e.reviewed) btn = '<button type="button" id="nextBtn" data-act="mark">Yfirfarinn' + (nx >= 0 && nx !== cur ? " → " + esc(cabs[nx].sk) : "") + " <kbd>⏎</kbd></button>";
    else btn = '<button type="button" id="nextBtn" class="calmb" data-act="next"' + (nx < 0 ? " disabled" : "") + ">" + (nx >= 0 ? "Næsti · " + esc(cabs[nx].sk) + " <kbd>⏎</kbd>" : "Allir skápar yfirfarnir") + "</button>";
    var sub = canEdit(c) && e.reviewed ? '<button type="button" data-act="unmark">Taka merkinguna af</button>' : "";
    return '<div class="pf">' + btn + '<div class="sub">' + sub + "</div></div>";
  }

  // ── events ────────────────────────────────────────────────────────────────────────────────
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t || !cabs.length) return;
    var c = cab(), d = t.dataset;
    if (d.go != null) { go(+d.go); return; }
    if (d.view) { view = d.view; drawStage(); return; }
    if (d.cncfile != null) { cncFile = +d.cncfile; drawStage(); return; }
    if (d.row) { openRow[c.unit + d.row] = !openRow[c.unit + d.row]; renderPanel(); return; }
    if (d.adv) { advOpen[c.unit + d.adv] = !advOpen[c.unit + d.adv]; renderPanel(); return; }
    if (d.hinge) { change(function (e) { e.hinge = d.hinge; }); return; }
    if (d.dtype) { var dt = d.dtype.split(":"), di = +dt[0]; change(function (e) { ensureDoors(c, e); e.doors[di].type = dt[1];
      if (dt[1] === "hinged" && !e.doors[di].hinges.length) e.doors[di].hinges = SD.defaultHingeSpec(r1(c.base.doors[di].to - c.base.doors[di].from), []); }); return; }
    if (d.jey) { var jj = d.jey.split(":"); change(function (e) { var l = (e.noJey = e.noJey || { drawers: [], doors: [] })[jj[0] === "d" ? "drawers" : "doors"], at = l.indexOf(+jj[1]), n = +jj[1];
      var vl = (e.jeyVert = e.jeyVert || { doors: [] }).doors, vat = vl.indexOf(n);
      if (jj[0] === "r") { if (jj[2] !== "v" && vat >= 0) vl.splice(vat, 1); if (jj[2] === "v" && vat < 0) vl.push(n); }
      if (jj[2] === "0" || jj[2] === "v") { if (at < 0) l.push(n); } else if (at >= 0) l.splice(at, 1); }); return; }
    if (d.hsplit != null) { change(function (e) { var k = +d.hsplit, n = c.base.cabinets; e.hingeSplit = k === 0 || k === n ? null : { vinstri: k, haegri: n - k }; if (k === 0) e.hinge = "haegri"; else if (k === n) e.hinge = "vinstri"; }); return; }
    if (d.blind) { change(function (e) { e.blindSide = d.blind; }); return; }
    if (d.urd != null) { change(function (e) { e.urtak = d.urd ? { drawer: d.urd, place: (e.urtak && e.urtak.place) || "midja", x: e.urtak ? e.urtak.x : null } : null; }); openRow[c.unit + "urtak"] = true; return; }
    if (d.urp) { change(function (e) { if (e.urtak) e.urtak.place = d.urp; }); return; }
    if (d.fgrip) { change(function (e) { e.frontGrip = d.fgrip; }); return; }
    if (d.ledadd) { change(function (e) { (e.led = e.led || []).push({ where: "hlid", y: c.panel ? 50 : 57 }); }); openRow[c.unit + "led"] = true; return; }
    if (d.leddel != null) { change(function (e) { e.led.splice(+d.leddel, 1); }); return; }
    if (d.ledw) { var lw = d.ledw.split(":"); change(function (e) { e.led[+lw[0]].where = lw[1]; }); return; }
    if (d.pos) { var pp = d.pos.split(":").map(Number); change(function (e) { (e.shelves || e.oven.shelves)[pp[0]].pos = pp[1]; }); return; }
    if (d.ovh) { change(function (e) { e.oven.h = +d.ovh; }); return; }
    if (d.hadd != null || d.hdel != null) {
      var ii = +(d.hadd != null ? d.hadd : d.hdel), door = plan(c).doors[ii], len = r1(door.to - door.from);
      change(function (e) {
        ensureDoors(c, e);
        var pos = SD.specToPositions(e.doors[ii].hinges, len);
        if (d.hadd != null) { var gaps = pos.map(function (q, j) { return j ? [q - pos[j - 1], (q + pos[j - 1]) / 2] : null; }).filter(Boolean).sort(function (a, b) { return b[0] - a[0]; }); pos.push(gaps.length ? gaps[0][1] : len / 2); }
        else pos.splice(Math.floor(pos.length / 2), 1);
        e.doors[ii].hinges = toSpec(pos, len);
      }); return;
    }
    if (d.hreset != null) { var ri = +d.hreset; change(function (e) { if (!e.doors) return; e.doors[ri] = { type: "hinged", hinges: [] };
      if (e.doors.every(function (x) { return x.type === "hinged" && !x.hinges.length; })) e.doors = null; else e.doors[ri].hinges = M.hingeSpec(c, Object.assign({}, e, { doors: null }), ri); }); return; }
    var act = d.act;
    if (act === "ovenlayout") change(function (e) { e.oven.shelves = M.ovenLayout(c, e.oven.h, e.oven.under); });
    else if (act === "spread") change(function (e) { e.shelves = M.defaultShelves(c); });
    else if (act === "innerreset") change(function (e) { e.inner = M.defaultInner(c); });
    else if (act === "unmark") { ed().reviewed = false; ed().touched = true; saveDraft(); render(); }
    else if (act === "mark") mark();
    else if (act === "next") { var nx = nextOpen(cur); if (nx >= 0) go(nx); }
    else if (act === "step") go(+d.to);
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target; if (!t.matches || !t.matches(".panel input[type=number]")) return;
    var v = Math.round(+t.value), c = cab(), d = t.dataset;
    if (!isFinite(v)) { renderPanel(); return; }
    change(function (e) {
      if (d.shelf != null) (e.shelves || e.oven.shelves)[+d.shelf].mm = v;
      else if (d.inner != null) e.inner[+d.inner].mm = v;
      else if (d.rail != null) e.rails[+d.rail].mm = v;
      else if (d.oven) e.oven[d.oven] = v;
      else if (d.led != null) e.led[+d.led].y = Math.max(1, v);
      else if (d.urx != null) { if (e.urtak) e.urtak.x = v > 0 ? v : null; }
      else if (d.ledlen != null) { if (v > 0) e.led[+d.ledlen].len = v; else delete e.led[+d.ledlen].len; }
      else if (d.ledfrom != null) { if (v > 0) e.led[+d.ledfrom].from = v; else delete e.led[+d.ledfrom].from; }
      else if (d.hinge) {
        var ij = d.hinge.split(":").map(Number), door = plan(c).doors[ij[0]], len = r1(door.to - door.from), q = door.hinges[ij[1]];
        setHinge(c, ij[0], ij[1], q > len / 2 ? len - v : v, door);
      }
    });
  });
  document.addEventListener("keydown", function (ev) {
    if (!cabs.length || /INPUT|TEXTAREA|SELECT/.test((ev.target || {}).tagName || "")) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") { ev.preventDefault(); go(Math.min(cabs.length - 1, cur + 1)); }
    else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") { ev.preventDefault(); go(Math.max(0, cur - 1)); }
    else if (ev.key === "Enter") { var b = $("nextBtn"); if (b && !b.disabled) { ev.preventDefault(); b.click(); } }
  });
  window.addEventListener("beforeunload", function (ev) { if (cabs.length && (dirtyCabs().length || saving)) { ev.preventDefault(); ev.returnValue = ""; } });

  // ── saving: a cabinet marked "Yfirfarinn" is written right away (with any other marked change); Vista sends the rest
  function mark() {
    var c = cab(); if (!canEdit(c) || M.blockers(c, ed(c), plan(c)).length) return;
    ed(c).reviewed = true; ed(c).touched = true; saveDraft();
    var nx = nextOpen(cur); if (nx >= 0) cur = nx;
    render(); var on = document.querySelector(".item.on"); if (on) on.scrollIntoView({ block: "nearest" });
    save(false);
  }
  async function post(items) {
    var r = await fetch("/api/smida-eydublad", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k: KEY, recordId: project.id, items: items }) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { var er = new Error(j.error || "HTTP " + r.status); er.status = r.status; er.conflict = j.conflict; throw er; }
    return j;
  }
  var again = false;
  async function save(all) {
    if (saving) { again = true; return; }
    var list = dirtyCabs().filter(function (c) { return all || ed(c).reviewed; });
    if (!list.length) { render(); return; }
    if (all) {
      var notRev = list.filter(function (c) { return !ed(c).reviewed; });
      if (notRev.length && !confirm(notRev.map(function (c) { return c.sk; }).slice(0, 8).join(", ") + (notRev.length > 8 ? " …" : "") + (notRev.length === 1 ? " er ekki merktur" : " eru ekki merktir") + " yfirfarinn.\n\nVista samt? CNC segir „ekki yfirfarinn“ við " + (notRev.length === 1 ? "hann" : "þá") + ".")) return;
    }
    saving = true; saveErr = null; renderTop();
    var items = list.map(function (c) { return { id: c.unit, smida: JSON.stringify(smida(c)), prev: c.raw || null }; });
    try {
      var j = await post(items);
      items.forEach(function (it) { var c = cabs.find(function (x) { return x.unit === it.id; }); c.raw = it.smida; c.existing = M.parse(it.smida); });
      if (j.written) undoStack.push({ label: list.map(function (c) { return c.sk; }).join(", "), items: items.map(function (it) { return { id: it.id, smida: j.previous[it.id] == null ? null : j.previous[it.id], prev: it.smida }; }) });
      saving = false; saveDraft(); render();
    } catch (e) {
      saving = false; again = false;
      saveErr = e.status === 409 ? "Breytt annars staðar síðan síðan var opnuð — endurhlaðið síðuna" : e.message;
      render(); toast(e.status === 409 ? "Ekki vistað — einhver breytti þessum Eyðublöðum. Endurhlaðið síðuna." : "Vistaðist ekki — breytingarnar eru geymdar hér. Reyndu aftur.");
      return;
    }
    if (again) { again = false; save(false); }
  }
  $("saveBtn").onclick = function () { save(true); };
  $("undoBtn").onclick = async function () {
    var last = undoStack[undoStack.length - 1]; if (!last || saving) return;
    if (!confirm("Taka síðustu vistun til baka (" + last.label + ")?\n\nFyrri gögn fara aftur á Eyðublöðin. Breytingarnar þínar eru áfram hér, óvistaðar.")) return;
    saving = true; renderTop();
    try {
      await post(last.items);
      undoStack.pop();
      last.items.forEach(function (it) { var c = cabs.find(function (x) { return x.unit === it.id; }); c.raw = it.smida; c.existing = M.parse(it.smida); ed(c).reviewed = false; });
      saving = false; saveErr = null; saveDraft(); render(); toast("Tekið til baka — " + last.label);
    } catch (e) { saving = false; render(); toast("Tókst ekki að taka til baka: " + e.message); }
  };

  // ── Skrifa á USB: cnc-export.js (the export /cnc used to have, moved there 2026-10-29 — same files, byte for byte, see
  // tests/cnc-export.test.js). Unsaved changes are saved first, then the project is read fresh from Airtable and planned,
  // so the files are made from exactly what is saved.
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function sheet(html) {
    var el = $("usbSheet"); if (!el) { el = document.createElement("div"); el.id = "usbSheet"; el.className = "sheet"; document.body.appendChild(el); }
    el.innerHTML = "<div>" + html + "</div>"; return el;
  }
  function stage(t) { sheet('<h2>Skrifa á USB</h2><p class="sub2">' + esc(project.name) + '</p><div class="stage2"><span class="spin"></span>' + esc(t) + "</div>"); }
  async function exportUsb() {
    if (!project || saving) return;
    if (!("showDirectoryPicker" in window)) { alert("Þessi vafri getur ekki skrifað beint á USB. Notaðu Chrome eða Edge."); return; }
    var dir; try { dir = await window.showDirectoryPicker({ mode: "readwrite" }); } catch (e) { return; } // picked first: the browser needs the click
    var btn = $("usbBtn"); btn.disabled = true;
    try {
      if (dirtyCabs().length) {
        stage("Vista breytingar…");
        var before = dirtyCabs().length; await save(true);
        if (saveErr || dirtyCabs().length === before) throw new Error("Vistaðist ekki — ekkert skrifað á USB");
      }
      stage("Undirbý skrárnar…");
      var P = await CNCEXPORT.loadProject({ proxy: PROXY, key: KEY, id: project.id, name: project.name });
      CNCEXPORT.planSides(P, null);
      stage("Skrifa á USB…");
      var r = await CNCEXPORT.writeUsb(P, dir, {});
      showResult(r, dir);
    } catch (e) {
      sheet('<h2>Ekkert skrifað</h2><p class="err">' + esc(e.message) + '</p><div class="foot"><button type="button" data-close="1">Loka</button></div>');
    } finally { btn.disabled = false; }
  }
  function showResult(r, dir) {
    var hand = [];
    r.missing.forEach(function (m) { hand.push(m); });
    stakur.forEach(function (n) { hand.push(n + ": lamir fyrir stakan front — boraðar í höndunum"); });
    r.warn.filter(function (w) { return /Fatasl/.test(w); }).forEach(function (w) { hand.push(w.replace(/\s+/g, " ").replace(/: — /, " — ")); });
    var nw = r.warn.length;
    var h = '<h2>Skrifað á USB</h2><p class="sub2">' + r.made.length + " skrár · " + esc(dir.name + "/" + r.folder) + "</p>" +
      (hand.length ? "<h3>Í höndunum</h3><ul>" + hand.map(function (t) { return '<li class="hand">' + esc(t) + "</li>"; }).join("") + "</ul>" : "") +
      (nw ? '<p class="sub2" style="margin-top:14px">' + nw + " athugasemdir eru í „" + esc(project.prefix) + " CNC skrá.txt“ á kubbnum.</p>" : "") +
      "<h3>Skrárnar</h3><div class=\"files\">" + r.preview.map(function (f, i) { var where = f.dir && f.dir.name ? f.dir.name + " / " : ""; return '<button type="button" data-file="' + i + '" title="' + esc(where + f.name) + '">' + esc(where + f.name) + "</button>"; }).join("") + "</div>" +
      '<div id="fileCard"></div><div class="foot"><button type="button" data-close="1">Loka</button></div>';
    var el = sheet(h); el._preview = r.preview;
  }
  document.addEventListener("click", async function (ev) {
    var t = ev.target.closest("#usbSheet button"); if (!t) return;
    if (t.dataset.close) { $("usbSheet").remove(); return; }
    if (t.dataset.file != null) {
      var f = $("usbSheet")._preview[+t.dataset.file], box = $("fileCard");
      try {
        var file = await (await f.dir.getFileHandle(f.name)).getFile();
        var text = new TextDecoder("windows-1252").decode(await file.arrayBuffer());
        box.innerHTML = ""; var card = BPP.buildCard({ name: f.name }, text, null, null, { maxH: 380, maxW: 420 });
        var rm = card.querySelector(".bw-titlebar .remove"); if (rm) rm.remove();
        box.appendChild(card);
      } catch (e) { box.textContent = "Gat ekki lesið " + f.name; }
    }
  });
  $("usbBtn").onclick = exportUsb;

  boot();
})();
</script>
