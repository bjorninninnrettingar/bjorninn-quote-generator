<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>CRM — Björninn</title>
<link rel="icon" href="/icons/icon-192.png" />
<style>
  /* crm.html — the CRM area (2026-10-17), last of the 6 agreed areas. A kanban over
     "Staða í söluferli" — all fields here already existed on Tækifæri (Næsta skref,
     Eftirfylgnisstaða, Verk ósnert dagar …), this just surfaces them instead of
     Airtable's own grid/kanban view. Same Apple-minimal CSS as /skrifstofa, /yfirferd,
     /pontun — this is a new page, not an extension of an old dark-themed one. */
  :root {
    --bg:#f3f4f6; --surface:#ffffff; --line:#e1e4e8; --sidebar:#1b2430;
    --text:#1a1d21; --muted:#5d6670; --dim:#9aa3ad;
    --accent:#0f6cbd; --warn:#9a6700; --bad:#c4291c; --good:#1a7d36;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4; }

  #shell { display:flex; min-height:100vh; }
  .sidebar { width:224px; flex:none; background:var(--sidebar); color:#cfd5dd; display:flex; flex-direction:column; padding:18px 0; height:100vh; position:sticky; top:0; overflow-y:auto; }
  .sidebar .brand { padding:0 18px 18px; font-weight:700; color:#fff; font-size:1.05rem; border-bottom:1px solid #2a3442; margin-bottom:10px; }
  .sidebar nav { display:flex; flex-direction:column; gap:1px; flex:1; }
  .sidebar nav a { display:flex; align-items:center; gap:10px; padding:9px 18px; text-decoration:none; color:#cfd5dd; font-size:.88rem; }
  .sidebar nav a:hover { background:#242e3b; }
  .sidebar nav a.active { background:var(--accent); color:#fff; }
  .sidebar .user { padding:14px 18px 0; border-top:1px solid #2a3442; margin-top:10px; font-size:.82rem; display:flex; justify-content:space-between; align-items:center; }
  .sidebar .user button { background:none; border:none; color:#8aa4c7; font:inherit; font-size:.8rem; cursor:pointer; }

  .wrap { flex:1; max-width:1300px; padding:24px 28px 40px; }

  .hd { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .title { font-size:1.3rem; font-weight:700; letter-spacing:-.01em; }
  .hdRight { display:flex; align-items:center; gap:10px; }
  .searchBox { font:inherit; font-size:.85rem; border:1px solid var(--line); border-radius:999px; padding:7px 14px; width:200px; background:var(--surface); }
  .toggleClosed { background:none; border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:.82rem; color:var(--muted); font-family:inherit; cursor:pointer; }

  .kpiRow { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .kpi { background:var(--surface); border-radius:14px; padding:13px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05); flex:1; min-width:150px; }
  .kpi .lbl { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .kpi .val { font-size:1.4rem; font-weight:700; margin-top:4px; }
  .kpi .sub { font-size:.74rem; color:var(--dim); margin-top:2px; }

  .nextSteps { margin-bottom:20px; }
  .nextSteps h2 { font-size:.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; margin-bottom:8px; }
  .nsRow { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .nsCard { flex:0 0 220px; background:var(--surface); border-radius:12px; padding:11px 13px; box-shadow:0 1px 3px rgba(0,0,0,.05); cursor:pointer; border-left:3px solid var(--bad); }
  .nsCard.soon { border-left-color:var(--warn); }
  .nsCard .nm { font-weight:600; font-size:.85rem; }
  .nsCard .step { font-size:.78rem; color:var(--muted); margin-top:4px; }
  .nsCard .when { font-size:.72rem; color:var(--dim); margin-top:3px; }

  .board { display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; margin-top:16px; }
  .col { flex:0 0 260px; }
  .col h2 { font-size:.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .col h2 .colLabel { flex:1; }
  .col h2 .cnt { color:var(--dim); font-weight:500; }
  .col h2 .colorDot { width:8px; height:8px; border-radius:50%; flex:none; }
  .cards { display:flex; flex-direction:column; gap:8px; }

  .card { background:var(--surface); border-radius:14px; padding:12px 13px; box-shadow:0 1px 3px rgba(0,0,0,.05); cursor:pointer; }
  .card .nm { font-weight:600; font-size:.88rem; }
  .card .step { font-size:.78rem; color:var(--muted); margin-top:5px; }
  .card .flags { display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
  .pill { font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .pill.stale { background:#ffe8e6; color:#b3261e; }
  .pill.follow { background:#eef1f4; color:var(--muted); }

  .detail { display:none; background:var(--surface); border-radius:16px; padding:16px; margin-top:16px; }
  .detail.open { display:block; }
  .detail .dTitle { font-weight:600; font-size:1rem; margin-bottom:10px; }
  .detail .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:.88rem; }
  .detail .row:last-of-type { border-bottom:none; }
  .detail .row label { color:var(--muted); }
  .detail select, .detail input[type="date"] { font:inherit; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 9px; }
  .detail .actions { display:flex; justify-content:space-between; margin-top:12px; }
  .detail .actions a { color:var(--accent); font-size:.85rem; text-decoration:none; }
  .detail .close { background:none; border:none; color:var(--muted); font-size:.85rem; font-family:inherit; }

  /* Vörulínur editor (2026-10-17) — "patch and review" pre-staðfest only */
  .liToggle { all:unset; display:block; width:100%; box-sizing:border-box; margin-top:12px; padding:9px 12px; background:var(--bg); border:1px dashed var(--line); border-radius:10px; color:var(--muted); font-size:.85rem; font-weight:600; cursor:pointer; text-align:left; }
  .liBody { display:none; margin-top:10px; }
  .liBody.open { display:block; }
  .liGridWrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .liGrid { border-collapse:collapse; width:100%; font-size:.78rem; }
  .liGrid th { text-align:left; padding:6px 8px; background:var(--bg); color:var(--muted); font-weight:700; font-size:.68rem; text-transform:uppercase; white-space:nowrap; }
  .liGrid td { padding:5px 8px; border-top:1px solid var(--line); white-space:nowrap; }
  .liGrid td.num input { width:56px; font:inherit; font-size:.78rem; border:1px solid var(--line); border-radius:6px; padding:3px 5px; background:var(--surface); color:var(--text); }
  .liGrid select { font:inherit; font-size:.78rem; border:1px solid var(--line); border-radius:6px; padding:3px 5px; background:var(--surface); color:var(--text); }
  .liPickBtn { all:unset; cursor:pointer; color:var(--accent); font-size:.76rem; max-width:140px; overflow:hidden; text-overflow:ellipsis; display:inline-block; vertical-align:middle; }
  .liWarn { color:var(--bad); margin-right:3px; }
  .liTag { font-size:.62rem; font-weight:700; background:var(--good-soft, #e5f6ea); color:var(--good); padding:1px 5px; border-radius:999px; margin-left:4px; }
  .liLocked { color:var(--dim); font-size:.76rem; }
  .liDelBtn { all:unset; cursor:pointer; color:var(--bad); font-size:.9rem; padding:0 4px; }
  .liAddBtn { all:unset; display:inline-block; margin-top:8px; color:var(--accent); font-size:.82rem; font-weight:600; cursor:pointer; }
  .liMatSection { margin-top:16px; }
  .liMatSection h3 { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 6px; }
  .liMatGrid { display:flex; flex-direction:column; gap:4px; }
  .liMatRow { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:.82rem; }
  .liMatRow:last-child { border-bottom:none; }
  .liMatRow .k { color:var(--muted); flex:none; }
  .liMatRow .v { text-align:right; }

  /* generic search-link picker modal, shared by every Vörulínur/efni/handle field */
  .lpModalBg { display:none; position:fixed; inset:0; background:rgba(10,14,20,.45); z-index:250; align-items:flex-start; justify-content:center; padding:60px 20px; overflow:auto; }
  .lpModalBg.open { display:flex; }
  .lpModal { background:var(--surface); border-radius:14px; max-width:420px; width:100%; padding:18px; max-height:70vh; overflow:auto; }
  .lpClose { float:right; background:none; border:none; font-size:1.2rem; color:var(--muted); cursor:pointer; }
  .lpTitle { font-weight:700; font-size:.95rem; }
  .lpSearch { width:100%; box-sizing:border-box; margin-top:10px; padding:8px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:.85rem; background:var(--bg); color:var(--text); }
  .lpResults { margin-top:8px; max-height:300px; overflow:auto; }
  .lpResult { padding:8px 9px; border-radius:8px; cursor:pointer; font-size:.85rem; }
  .lpResult:hover { background:var(--bg); }
  .lpResult .sub { color:var(--muted); font-size:.72rem; }

  .loading { text-align:center; color:var(--muted); padding:60px 0; }
  .empty { text-align:center; color:var(--muted); padding:16px 0; font-size:.82rem; }
</style>
</head>
<body>
<div id="shell">
  <div class="sidebar">
    <div id="officeSidebarTop"></div>
    <nav id="officeNav"></nav>
    <div id="officeSidebarBottom"></div>
  </div>
<div class="wrap">
  <div class="hd">
    <div class="title">CRM</div>
    <div class="hdRight">
      <input class="searchBox" id="search" type="text" placeholder="Leita að tækifæri…" />
      <button class="toggleClosed" id="toggleClosed">Sýna líka unnin/töpuð</button>
    </div>
  </div>

  <div class="kpiRow" id="kpiRow">
    <div class="kpi"><div class="lbl">Heildarvirði</div><div class="val" id="kpiTotal">—</div><div class="sub" id="kpiTotalSub"></div></div>
    <div class="kpi"><div class="lbl">Sölumarkmið mánaðarins</div><div class="val" id="kpiTarget">—</div></div>
    <div class="kpi"><div class="lbl">Sala þessa mánaðar</div><div class="val" id="kpiSold">—</div></div>
    <div class="kpi"><div class="lbl">Millifærslur þennan mánuð</div><div class="val" id="kpiTransfers">—</div><div class="sub">Staðfestingargjöld + eftirstöðvar</div></div>
  </div>

  <div class="nextSteps" id="nextSteps" style="display:none;">
    <h2>Næstu skref</h2>
    <div class="nsRow" id="nsRow"></div>
  </div>

  <div id="loading" class="loading">Sæki verkefni…</div>
  <div class="board" id="board" style="display:none;"></div>

  <div class="detail" id="detail">
    <div class="dTitle" id="dName"></div>
    <div class="row"><label>Staða í söluferli</label><select id="dStage"></select></div>
    <div class="row"><label>Næsta skref</label><select id="dStep"></select></div>
    <div class="row"><label>Næsta skref dags.</label><input type="date" id="dStepDate" /></div>
    <div class="row"><label>Verk ósnert</label><span id="dStale"></span></div>
    <div class="row"><label>Eftirfylgni</label><span id="dFollow"></span></div>

    <div id="liWrap" style="display:none;">
      <button class="liToggle" id="liToggleBtn" type="button">📦 Vörulínur ▾</button>
      <div id="liBody" class="liBody">
        <div class="liGridWrap"><table class="liGrid" id="liGrid"><thead><tr>
          <th>Rými</th><th>V1</th><th>V2</th><th>V3</th><th>Magn</th><th>Afsl. %</th><th>Ein.verð</th><th>Verð</th><th></th>
        </tr></thead><tbody id="liRows"></tbody></table></div>
        <button class="liAddBtn" id="liAddBtn" type="button">+ Ný lína</button>

        <div class="liMatSection">
          <h3>Efni verkefnis</h3>
          <div class="liMatGrid" id="liEfniGrid"></div>
          <h3>Aukahlutir</h3>
          <div class="liMatGrid" id="liAukaGrid"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <a id="dOpenPro" href="#" target="_blank">Opna í hönnuðinum →</a>
      <button class="close" id="dClose">Loka</button>
    </div>
  </div>
</div>

<div class="lpModalBg" id="lpModalBg">
  <div class="lpModal">
    <button class="lpClose" id="lpClose" type="button">✕</button>
    <div class="lpTitle" id="lpTitle">Veldu</div>
    <input class="lpSearch" id="lpSearch" type="text" placeholder="Leita…" />
    <div class="lpResults" id="lpResults"></div>
  </div>
</div>

<script src="/office-shell.js"></script>
<script>
(function () {
  "use strict";
  var TAEKIFAERI = "tbl4LMXlQjp66RFKI";

  var shellInfo = window.OfficeShell.boot("crm");
  if (!shellInfo) return;
  var k = shellInfo.k;

  var STAGES = [
    { name: "Hönnun & Ráðgjöf 🖊️✨", short: "Hönnun", color: "#e05d9e" },
    { name: "✍️ Teikna og yfirfara tilboð", short: "Teikna/yfirfara", color: "#d6473c" },
    { name: "📤 Tilboð sent", short: "Tilboð sent", color: "#e9b000" },
    { name: "🔥 Líklegt tækifæri", short: "Líklegt", color: "#7ac77a" },
  ];
  var FJARHAG = "tblhP1FMM4QJfwxat";
  var CLOSED_STAGES = ["🏆 Tækifæri unnið", "🥀 Tækifæri tapað", "🚫 Tækifæri neitað"];
  var STEP_CHOICES = ["📞 Hringja í viðskiptavin", "📧 Senda póst", "📐 Klára teikningu / hönnun", "💰 Senda tilboð", "⏳ Bíða eftir svari frá viðskiptavini", "🤝 Verkfundur / heimsókn", "Annað"];

  function api(path, extra) {
    var u = "/api/airtable?path=" + encodeURIComponent(path);
    if (k) u += "&k=" + encodeURIComponent(k);
    if (extra) u += "&" + extra;
    return fetch(u).then(function (r) { return r.json(); });
  }
  function apiPatch(id, fields) {
    return fetch("/api/airtable?path=" + encodeURIComponent(TAEKIFAERI + "/" + id), {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    }).then(function (r) { return r.json(); });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function kr(n) { return n == null ? "—" : Math.round(n).toLocaleString("is-IS") + " kr."; }

  var showClosed = false;
  var records = [];
  var searchTerm = "";

  function load() {
    document.getElementById("loading").style.display = "block";
    document.getElementById("board").style.display = "none";
    var stageList = showClosed ? STAGES.map(function (s) { return s.name; }).concat(CLOSED_STAGES) : STAGES.map(function (s) { return s.name; });
    var formula = "OR(" + stageList.map(function (s) { return '{Staða í söluferli}="' + s.replace(/"/g, '\\"') + '"'; }).join(",") + ")";
    api(TAEKIFAERI, "filterByFormula=" + encodeURIComponent(formula) + "&pageSize=100")
      .then(function (d) {
        records = d.records || [];
        document.getElementById("loading").style.display = "none";
        document.getElementById("board").style.display = "flex";
        render();
        renderNextSteps();
        loadKpis();
      })
      .catch(function () { document.getElementById("loading").textContent = "Tókst ekki að sækja gögn."; });
  }

  function matchesSearch(r) {
    if (!searchTerm) return true;
    return (r.fields["Heiti tækifæris / verkefnis"] || "").toLowerCase().indexOf(searchTerm) !== -1;
  }

  function render() {
    var board = document.getElementById("board");
    board.innerHTML = "";
    var cols = showClosed ? STAGES.concat(CLOSED_STAGES.map(function (s) { return { name: s, short: s, color: "#9aa3ad" }; })) : STAGES;
    cols.forEach(function (stage) {
      var items = records.filter(function (r) { return (r.fields["Staða í söluferli"] || "") === stage.name && matchesSearch(r); });
      items.sort(function (a, b) { return (b.fields["Verk ósnert dagar 📅"] || 0) - (a.fields["Verk ósnert dagar 📅"] || 0); });
      var col = document.createElement("div");
      col.className = "col";
      col.innerHTML = '<h2><span class="colorDot" style="background:' + stage.color + '"></span><span class="colLabel">' + esc(stage.short) + '</span><span class="cnt">' + items.length + '</span></h2><div class="cards"></div>';
      var cardsEl = col.querySelector(".cards");
      if (!items.length) cardsEl.innerHTML = '<div class="empty">Ekkert hér</div>';
      items.forEach(function (r) { cardsEl.appendChild(cardEl(r, stage.color)); });
      board.appendChild(col);
    });
  }

  function cardEl(r, color) {
    var f = r.fields;
    var el = document.createElement("div");
    el.className = "card";
    el.style.borderLeft = "3px solid " + color;
    var stale = f["Verk ósnert dagar 📅"] || 0;
    var step = f["Næsta skref"] || "";
    var stepDate = f["Næsta skref dags."] || "";
    el.innerHTML =
      '<div class="nm">' + esc(f["Heiti tækifæris / verkefnis"] || "(ónefnt)") + '</div>' +
      (step ? '<div class="step">' + esc(step) + (stepDate ? " · " + esc(stepDate) : "") + '</div>' : '') +
      '<div class="flags">' +
        (stale >= 14 ? '<span class="pill stale">' + Math.round(stale) + ' d. ósnert</span>' : '') +
        (f["Eftirfylgnisstaða❓"] ? '<span class="pill follow">' + esc(f["Eftirfylgnisstaða❓"]) + '</span>' : '') +
      '</div>';
    el.addEventListener("click", function () { openDetail(r); });
    return el;
  }

  // ---- Næstu skref — every open deal with a Næsta skref dags. set, soonest/overdue first ----
  function renderNextSteps() {
    var withStep = records.filter(function (r) { return r.fields["Næsta skref dags."]; });
    withStep.sort(function (a, b) { return a.fields["Næsta skref dags."] < b.fields["Næsta skref dags."] ? -1 : 1; });
    var wrap = document.getElementById("nextSteps"), row = document.getElementById("nsRow");
    if (!withStep.length) { wrap.style.display = "none"; return; }
    wrap.style.display = "block";
    row.innerHTML = "";
    var today = new Date().toISOString().slice(0, 10);
    withStep.slice(0, 12).forEach(function (r) {
      var f = r.fields;
      var d = f["Næsta skref dags."];
      var el = document.createElement("div");
      el.className = "nsCard" + (d >= today ? " soon" : "");
      el.innerHTML =
        '<div class="nm">' + esc(f["Heiti tækifæris / verkefnis"] || "(ónefnt)") + '</div>' +
        '<div class="step">' + esc(f["Næsta skref"] || "—") + '</div>' +
        '<div class="when">' + (d < today ? "⚠️ " : "") + esc(d) + '</div>';
      el.addEventListener("click", function () { openDetail(r); });
      row.appendChild(el);
    });
  }

  // ---- KPI row — total value + count of open deals (always from the open-stage set,
  // regardless of the "sýna líka unnin/töpuð" toggle), plus two tiles grounded on real
  // date fields rather than guessed singleSelect choice strings: IS_SAME(..., TODAY(), "month")
  // against "Verk staðfest þann" (confirmed this month) and the two installment-paid dates. ----
  function loadKpis() {
    var openItems = records.filter(function (r) { return STAGES.some(function (s) { return s.name === r.fields["Staða í söluferli"]; }); });
    var total = openItems.reduce(function (sum, r) { return sum + (r.fields["💰 Tilboðsupphæð"] || 0); }, 0);
    document.getElementById("kpiTotal").textContent = kr(total);
    document.getElementById("kpiTotalSub").textContent = openItems.length + " opin tækifæri";

    api(FJARHAG, "sort%5B0%5D%5Bfield%5D=Dagsetning&sort%5B0%5D%5Bdirection%5D=desc&maxRecords=1")
      .then(function (d) {
        var rec = (d.records || [])[0];
        var target = rec && rec.fields["Sölumarkmið (Fastur kostnaður x2)"];
        document.getElementById("kpiTarget").textContent = target != null ? kr(target) : "—";
      });

    var confirmedFml = 'IS_SAME({Verk staðfest þann}, TODAY(), "month")';
    var paidFml = 'OR(IS_SAME({Greiðsla 2 greidd þann}, TODAY(), "month"), IS_SAME({Greiðsla 3 greidd þann}, TODAY(), "month"))';
    Promise.all([
      api(TAEKIFAERI, "filterByFormula=" + encodeURIComponent(confirmedFml) + "&fields%5B%5D=Sta%C3%B0fest%20tilbo%C3%B0sup%C3%A6%C3%B0%20%F0%9F%94%92&fields%5B%5D=%F0%9F%92%B0%20Tilbo%C3%B0sup%C3%A6%C3%B0&fields%5B%5D=Sta%C3%B0festingargjald&pageSize=100"),
      api(TAEKIFAERI, "filterByFormula=" + encodeURIComponent(paidFml) + "&fields%5B%5D=Eftirst%C3%B6%C3%B0var%20(kr)%20%F0%9F%92%B0&pageSize=100"),
    ]).then(function (res) {
      var confirmed = res[0].records || [], paid = res[1].records || [];
      var sold = confirmed.reduce(function (sum, r) { return sum + (r.fields["Staðfest tilboðsupphæð 🔒"] || r.fields["💰 Tilboðsupphæð"] || 0); }, 0);
      document.getElementById("kpiSold").textContent = kr(sold);
      var transfers = confirmed.reduce(function (sum, r) { return sum + (r.fields["Staðfestingargjald"] || 0); }, 0) +
        paid.reduce(function (sum, r) { return sum + (r.fields["Eftirstöðvar (kr) 💰"] || 0); }, 0);
      document.getElementById("kpiTransfers").textContent = kr(transfers);
    });
  }

  function openDetail(r) {
    var f = r.fields;
    var d = document.getElementById("detail");
    document.getElementById("dName").textContent = f["Heiti tækifæris / verkefnis"] || "(ónefnt)";

    var stageSel = document.getElementById("dStage");
    stageSel.innerHTML = STAGES.concat(CLOSED_STAGES.map(function (s) { return { name: s }; })).map(function (s) {
      return '<option value="' + esc(s.name) + '"' + (s.name === f["Staða í söluferli"] ? " selected" : "") + '>' + esc(s.short || s.name) + '</option>';
    }).join("");

    var stepSel = document.getElementById("dStep");
    stepSel.innerHTML = '<option value="">—</option>' + STEP_CHOICES.map(function (s) {
      return '<option value="' + esc(s) + '"' + (s === f["Næsta skref"] ? " selected" : "") + '>' + esc(s) + '</option>';
    }).join("");

    document.getElementById("dStepDate").value = f["Næsta skref dags."] || "";
    document.getElementById("dStale").textContent = (f["Verk ósnert dagar 📅"] || 0) + " dagar";
    document.getElementById("dFollow").textContent = f["Eftirfylgnisstaða❓"] || "—";
    document.getElementById("dOpenPro").href = "/skipuleggja?pro=" + r.id + (k ? "&k=" + encodeURIComponent(k) : "");
    setupLineItems(r);

    stageSel.onchange = function () {
      var next = stageSel.value;
      if (CLOSED_STAGES.indexOf(next) !== -1 && !confirm('Færa í "' + next + '"? Þetta er lokastaða og kveikir á tengdum automationum (t.d. tölvupóstum).')) {
        stageSel.value = f["Staða í söluferli"];
        return;
      }
      apiPatch(r.id, { "Staða í söluferli": next }).then(function () { f["Staða í söluferli"] = next; load(); });
    };
    stepSel.onchange = function () {
      apiPatch(r.id, { "Næsta skref": stepSel.value || null }).then(function () { f["Næsta skref"] = stepSel.value; });
    };
    document.getElementById("dStepDate").onchange = function (e) {
      apiPatch(r.id, { "Næsta skref dags.": e.target.value || null }).then(function () { f["Næsta skref dags."] = e.target.value; });
    };

    d.classList.add("open");
    d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  // ---- Vörulínur editor (2026-10-17) — "patch and review" only, pre-staðfest.
  // Grounded against the live "Nýtt verkefni" Airtable interface + a real record
  // (T-242) before writing any of this, not guessed from the schema alone. ----
  var LINEITEMS = "tblFcsUoGxsuUwNEH", UTFAERSLUR = "tbl8HjvBwNJ41cTV0", EFNISLISTI = "tbl8CrVWKF8CuI7HD", VORULISTI = "tblzuuRSRkeXaLWxC";
  var RYMI_CHOICES = ["Eldhús", "Baðh.", "Baðh. 2", "Andyri", "Þvottah.", "Alrými", "Hjónah.", "Barnah.", "Barnah. 2", "Svefnh.", "Stofa", "Búr", "Skrifst.", "Gangur", "Fatask.", "Forstofa"];
  var LITUR_HOLDUR_CHOICES = ["Svartar ⚫", "Hvítar ⚪", "Stál 🦾", "Silfur 🥈", "Gyllt / Látún 🥇", "Kopar 🥉"];
  var LITUR_SKUFFUM_CHOICES = ["Dökkgráar ⬛", "Hvítar ⬜", "Svartar ⚫"];
  var MAT_FIELDS = [
    { field: "Skrokka efni 🔲 viðskiptavinar", lookup: "Heiti efnis (from Skrokka efni 🔲 viðskiptavinar)", label: "Skrokkaefni", type: "link", table: EFNISLISTI, search: "Heiti efnis" },
    { field: "Fronta efni viðskiptavinar 🖼️", lookup: "Heiti efnis (from Fronta efni viðskiptavinar 🖼️)", label: "Frontaefni", type: "link", table: EFNISLISTI, search: "Heiti efnis" },
    { field: "Fronta efni 2.0 Viðskiptavinar 🖼️", lookup: "Heiti efnis (from Fronta efni 2.0 Viðskiptavinar 🖼️)", label: "Frontaefni 2", type: "link", table: EFNISLISTI, search: "Heiti efnis" },
    { field: "Borðplata viðskiptavinar 🍽️", lookup: "Heiti efnis (from Borðplata viðskiptavinar 🍽️)", label: "Borðplata", type: "link", table: EFNISLISTI, search: "Heiti efnis" },
    { field: "Hurðaefni viðskiptavinar 🚪", lookup: "Heiti efnis (from Hurðaefni viðskiptavinar 🚪)", label: "Hurðaefni", type: "link", table: EFNISLISTI, search: "Heiti efnis" },
  ];
  var AUKA_FIELDS = [
    { field: "Höldur Viðskiptavinar ✊", lookup: "Heiti vöru 📣 (from Höldur Viðskiptavinar ✊)", label: "Höldur", type: "link", table: VORULISTI, search: "Heiti vöru 📣" },
    { field: "Höldur Viðskiptavinar ✊2.0", lookup: "Heiti vöru 📣 (from Höldur Viðskiptavinar ✊2.0)", label: "Höldur 2.0", type: "link", table: VORULISTI, search: "Heiti vöru 📣" },
    { field: "Litur á höldum 🎨", label: "Litur á höldum", type: "select", choices: LITUR_HOLDUR_CHOICES },
    { field: "Litur á höldum 2.0 🎨", label: "Litur á höldum 2.0", type: "select", choices: LITUR_HOLDUR_CHOICES },
    { field: "Litur á skúffum [Handvalið]", label: "Litur á skúffum", type: "select", choices: LITUR_SKUFFUM_CHOICES },
    { field: "Kantlíming skrokka", label: "Kantlíming skrokka", type: "select", choices: ["Skrokkaefni", "Frontaefni", "Frontaefni 2", "Ál", "Ál og gler"] },
  ];

  function apiPatchLi(id, fields) {
    return fetch("/api/airtable?path=" + encodeURIComponent(LINEITEMS + "/" + id), {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: fields })
    }).then(function (r) { return r.json(); });
  }
  function apiCreateLi(fields) {
    return fetch("/api/airtable?path=" + encodeURIComponent(LINEITEMS) + "&k=" + encodeURIComponent(k), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: fields })
    }).then(function (r) { return r.json(); });
  }
  function fmtKr(n) { return n == null ? "" : Math.round(n).toLocaleString("is-IS"); }

  var liLoaded = false, liCurrent = null;
  function setupLineItems(r) {
    liCurrent = r;
    liLoaded = false;
    var wrap = document.getElementById("liWrap"), body = document.getElementById("liBody"), btn = document.getElementById("liToggleBtn");
    var isOpen = CLOSED_STAGES.indexOf(r.fields["Staða í söluferli"]) === -1;
    wrap.style.display = isOpen ? "block" : "none";
    body.classList.remove("open");
    btn.textContent = "📦 Vörulínur ▾";
    btn.onclick = function () {
      var open = body.classList.toggle("open");
      btn.textContent = "📦 Vörulínur " + (open ? "▴" : "▾");
      if (open && !liLoaded) { liLoaded = true; loadAndRenderLi(); renderMatSections(); }
    };
  }

  function loadAndRenderLi() {
    var name = liCurrent.fields["Heiti tækifæris / verkefnis"] || "";
    var escd = name.replace(/"/g, '\\"');
    var fml = 'FIND("' + escd + '", ARRAYJOIN({Tækifæri 📣 (projects)})) > 0';
    api(LINEITEMS, "filterByFormula=" + encodeURIComponent(fml) + "&maxRecords=200")
      .then(function (d) { renderLiRows(d.records || []); });
  }

  function renderLiRows(records) {
    var tbody = document.getElementById("liRows");
    tbody.innerHTML = "";
    records.forEach(function (li) { tbody.appendChild(liRowEl(li)); });
  }

  function liRowEl(li) {
    var f = li.fields;
    var locked = !!f["Læstur verðlykill 🔒"];
    var tr = document.createElement("tr");
    if ((f["Magn"] || 0) === 0) tr.style.opacity = ".4";

    var rymiTd = document.createElement("td");
    if (locked) { rymiTd.innerHTML = '<span class="liLocked">' + esc(f["Rými 🏡"] || "—") + '</span>'; }
    else {
      var sel = document.createElement("select");
      sel.innerHTML = '<option value="">—</option>' + RYMI_CHOICES.map(function (c) { return '<option value="' + esc(c) + '"' + (c === f["Rými 🏡"] ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("");
      sel.onchange = function () { apiPatchLi(li.id, { "Rými 🏡": sel.value || null }); };
      rymiTd.appendChild(sel);
    }
    tr.appendChild(rymiTd);

    [["Vöru reitur 1", "Vara 🚪"], ["Vöru reitur 2", "útfærsla 🎨"], ["Vöru reitur 3", "Aukahlutir 🧩"]].forEach(function (pair) {
      var td = document.createElement("td");
      var label = (f[pair[1]] || [])[0] || "—";
      if (locked) { td.innerHTML = '<span class="liLocked">' + esc(label) + '</span>'; }
      else {
        var btn = document.createElement("button");
        btn.className = "liPickBtn"; btn.type = "button"; btn.title = label; btn.textContent = label;
        btn.onclick = function () {
          openPicker(UTFAERSLUR, "Lýsing á útfærslu", "Vörunúmer", function (rec) {
            var ff = {}; ff[pair[0]] = [rec.id];
            apiPatchLi(li.id, ff).then(function () { loadAndRenderLi(); });
          });
        };
        td.appendChild(btn);
      }
      tr.appendChild(td);
    });

    function numTd(field, isPercent) {
      var td = document.createElement("td");
      td.className = "num";
      if (locked) { td.innerHTML = '<span class="liLocked">' + (isPercent ? Math.round((f[field] || 0) * 100) + "%" : (f[field] || 0)) + '</span>'; return td; }
      var input = document.createElement("input");
      input.type = "number";
      input.value = isPercent ? Math.round((f[field] || 0) * 100) : (f[field] || 0);
      input.onchange = function () {
        var v = Number(input.value) || 0;
        var ff = {}; ff[field] = isPercent ? v / 100 : v;
        apiPatchLi(li.id, ff).then(function () { if (!isPercent) loadAndRenderLi(); });
      };
      td.appendChild(input);
      return td;
    }
    tr.appendChild(numTd("Magn", false));
    tr.appendChild(numTd("Afsl. %", true));

    var priceTd = document.createElement("td"); priceTd.textContent = fmtKr(f["Einingarverð"]); tr.appendChild(priceTd);
    var totalTd = document.createElement("td");
    totalTd.innerHTML = (f["⚠️ Skipulagsvilla"] ? '<span class="liWarn" title="' + esc(f["⚠️ Skipulagsvilla"]) + '">⚠️</span>' : "") +
      esc(fmtKr(f["Endanlegt söluverð 💲"])) +
      (f["Breyting eftir staðfestingu"] ? '<span class="liTag">' + esc(f["Breyting eftir staðfestingu"]) + '</span>' : "");
    tr.appendChild(totalTd);

    var delTd = document.createElement("td");
    if (!locked) {
      var delBtn = document.createElement("button");
      delBtn.className = "liDelBtn"; delBtn.type = "button"; delBtn.title = "Fjarlægja (setur Magn á 0)"; delBtn.textContent = "✕";
      delBtn.onclick = function () {
        if (!confirm("Fjarlægja þessa línu? (Magn fer á 0 — línan sjálf er ekki eytt.)")) return;
        apiPatchLi(li.id, { "Magn": 0 }).then(function () { loadAndRenderLi(); });
      };
      delTd.appendChild(delBtn);
    }
    tr.appendChild(delTd);

    return tr;
  }

  document.getElementById("liAddBtn").addEventListener("click", function () {
    if (!liCurrent) return;
    apiCreateLi({ "Tækifæri 📣 (projects)": [liCurrent.id], "Magn": 1 }).then(function (d) {
      if (d.error) { alert("Tókst ekki að búa til línu: " + d.error); return; }
      loadAndRenderLi();
    });
  });

  function renderMatSections() {
    var f = liCurrent.fields;
    document.getElementById("liEfniGrid").innerHTML = "";
    document.getElementById("liAukaGrid").innerHTML = "";
    MAT_FIELDS.forEach(function (m) { document.getElementById("liEfniGrid").appendChild(matRowEl(m, f)); });
    AUKA_FIELDS.forEach(function (m) { document.getElementById("liAukaGrid").appendChild(matRowEl(m, f)); });
  }

  function matRowEl(m, f) {
    var row = document.createElement("div");
    row.className = "liMatRow";
    var vEl;
    if (m.type === "select") {
      vEl = document.createElement("select");
      vEl.innerHTML = '<option value="">—</option>' + m.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (c === f[m.field] ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("");
      vEl.onchange = function () { apiPatch(liCurrent.id, (function () { var ff = {}; ff[m.field] = vEl.value || null; return ff; })()); };
    } else {
      vEl = document.createElement("button");
      vEl.className = "liPickBtn";
      var current = (f[m.lookup] || [])[0] || "—";
      vEl.textContent = current; vEl.title = current; vEl.type = "button";
      vEl.onclick = function () {
        openPicker(m.table, m.search, null, function (rec) {
          var ff = {}; ff[m.field] = [rec.id];
          apiPatch(liCurrent.id, ff).then(function () {
            var lookupField = {}; lookupField[m.lookup] = [rec.name];
            Object.assign(liCurrent.fields, lookupField);
            renderMatSections();
          });
        });
      };
    }
    row.innerHTML = '<span class="k">' + esc(m.label) + '</span>';
    row.appendChild(vEl);
    return row;
  }

  // ---- Generic search-link picker — shared by Vörulínur V1/V2/V3 and every efni/handle field ----
  function openPicker(table, searchField, subField, onPick) {
    var bg = document.getElementById("lpModalBg"), input = document.getElementById("lpSearch"), results = document.getElementById("lpResults");
    bg.classList.add("open");
    input.value = ""; results.innerHTML = '<div class="empty">Byrjaðu að skrifa…</div>';
    input.focus();
    var timer = null;
    input.oninput = function () {
      clearTimeout(timer);
      var term = input.value.trim();
      if (!term) { results.innerHTML = '<div class="empty">Byrjaðu að skrifa…</div>'; return; }
      timer = setTimeout(function () {
        var fml = "SEARCH(LOWER(\"" + term.replace(/"/g, '\\"') + "\"),LOWER({" + searchField + "}))";
        var extra = "filterByFormula=" + encodeURIComponent(fml) + "&maxRecords=20";
        if (subField) extra += "&fields%5B%5D=" + encodeURIComponent(searchField) + "&fields%5B%5D=" + encodeURIComponent(subField);
        api(table, extra).then(function (d) {
          var recs = d.records || [];
          if (!recs.length) { results.innerHTML = '<div class="empty">Ekkert fannst</div>'; return; }
          results.innerHTML = "";
          recs.forEach(function (rec) {
            var name = rec.fields[searchField] || "(ónefnt)";
            var el = document.createElement("div");
            el.className = "lpResult";
            el.innerHTML = esc(name) + (subField && rec.fields[subField] ? '<div class="sub">' + esc(rec.fields[subField]) + '</div>' : "");
            el.addEventListener("click", function () { bg.classList.remove("open"); onPick({ id: rec.id, name: name }); });
            results.appendChild(el);
          });
        });
      }, 250);
    };
  }
  document.getElementById("lpClose").addEventListener("click", function () { document.getElementById("lpModalBg").classList.remove("open"); });
  document.getElementById("lpModalBg").addEventListener("click", function (e) { if (e.target === e.currentTarget) e.currentTarget.classList.remove("open"); });

  document.getElementById("dClose").addEventListener("click", function () { document.getElementById("detail").classList.remove("open"); });
  document.getElementById("toggleClosed").addEventListener("click", function () {
    showClosed = !showClosed;
    document.getElementById("toggleClosed").textContent = showClosed ? "Fela unnin/töpuð" : "Sýna líka unnin/töpuð";
    load();
  });
  document.getElementById("search").addEventListener("input", function (e) {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  load();
})();
</script>
