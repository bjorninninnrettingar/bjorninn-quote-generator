<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Dagatal — Björninn</title><style>
:root{--bg:#0b0b0c;--s:#161618;--s2:#1e1e21;--line:#2a2a2e;--t:#f2f2f3;--m:#aaa;--b:#0a84ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:900px;margin:auto;padding:16px}.back{color:var(--m);text-decoration:none;font-weight:700}.head{display:flex;align-items:center;gap:8px;margin:14px 0}.head h1{font-size:1.2rem;text-align:center;flex:1;margin:0}.nav{background:var(--s2);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:800}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--m);margin:10px 0}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:.68rem;color:var(--m);font-weight:800;padding:4px}.day{min-height:95px;background:var(--s);border:1px solid var(--line);border-radius:9px;padding:5px;min-width:0}.day.other{opacity:.35}.day.today{border-color:var(--b)}.day.over{outline:2px solid var(--b)}.num{font-size:.72rem;font-weight:800}.ev{display:block;width:100%;border:0;border-radius:5px;color:white;text-align:left;padding:4px 5px;margin-top:3px;font-size:.63rem;font-weight:700;cursor:pointer;overflow:hidden}.prod{background:#0a84ff}.delivery{background:#a27b00}.pickup{background:#278455}.quickfix{background:#a83b3b}.msg{min-height:22px;color:var(--m);font-size:.82rem;margin-top:8px}.edit{display:none;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}.edit b{display:block;margin-bottom:8px}.row{display:flex;gap:8px}.row input{flex:1;background:var(--s);color:var(--t);border:1px solid var(--line);border-radius:8px;padding:10px}.save{background:var(--b);color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:800}@media(max-width:600px){.w{padding:12px 7px}.day{min-height:70px;padding:3px}.ev{font-size:.55rem;padding:3px}.week,.grid{gap:2px}}
</style></head><body><div class="w"><a class="back" href="/app">‹ Til baka</a><div class="head"><button class="nav" id="p">‹</button><h1 id="title">Dagatal</h1><button class="nav" id="n">›</button></div><div class="legend"><span>🟦 Framleiðsla</span><span>🟨 Afhending</span><span>🟩 Sótt</span><span>🟥 Quick Fix</span></div><div class="week"><div>Mán</div><div>Þri</div><div>Mið</div><div>Fim</div><div>Fös</div><div>Lau</div><div>Sun</div></div><div class="grid" id="g"></div><div class="msg" id="msg"></div><div class="edit" id="edit"><b id="et"></b><div class="row"><input type="date" id="ed"><button class="save" id="save">Vista</button></div></div></div><script>
const API="/api/airtable",PT="tbl4LMXlQjp66RFKI",QT="tblDQWuf4OSjUv2XI",PN="Heiti tækifæris / verkefnis",PD="Upphafs framleiðsludagur verks",DD="Áætlaður afhendingardagur Björninn (internal)",PU="Viðskiptavinur sækir þann:",QS="Staða",QD="Skiladagur",QI="Vandamálið";let cur=new Date();cur.setDate(1);let events=[],editing=null;const months=["janúar","febrúar","mars","apríl","maí","júní","júlí","ágúst","september","október","nóvember","desember"];const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),date=v=>v?String(v).slice(0,10):"";
function qs(o){return Object.entries(o).flatMap(([k,v])=>(Array.isArray(v)?v:[v]).map(x=>encodeURIComponent(k)+"="+encodeURIComponent(x))).join("&")}
async function get(table,p){let out=[],off;do{let r=await fetch(API+"?path="+encodeURIComponent(table)+"&"+qs({...p,...(off?{offset:off}:{})}));if(!r.ok)throw Error(r.status);let d=await r.json();out.push(...(d.records||[]));off=d.offset}while(off);return out}
async function patch(ev,d){let r=await fetch(API+"?path="+encodeURIComponent(ev.table+"/"+ev.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{[ev.field]:d}})});if(!r.ok)throw Error(r.status)}
async function load(){ $("msg").textContent="Sæki dagatal…";try{let a=new Date(cur.getFullYear(),cur.getMonth()-1,1),b=new Date(cur.getFullYear(),cur.getMonth()+2,1),s=iso(a),e=iso(b);let pf="OR(AND({"+PD+"}>='"+s+"',{"+PD+"}<'"+e+"'),AND({"+DD+"}>='"+s+"',{"+DD+"}<'"+e+"'),AND({"+PU+"}>='"+s+"',{"+PU+"}<'"+e+"'))";let qf="AND({"+QS+"}!='Lokið ✅',{"+QD+"}>='"+s+"',{"+QD+"}<'"+e+"')";let [pr,qr]=await Promise.all([get(PT,{filterByFormula:pf,"fields[]":[PN,PD,DD,PU],pageSize:100}),get(QT,{filterByFormula:qf,"fields[]":[QI,QD],pageSize:100})]);events=[];pr.forEach(r=>{let f=r.fields,n=f[PN]||"(nafnlaust verk)";if(f[PD])events.push({table:PT,id:r.id,field:PD,date:date(f[PD]),kind:"prod",title:n+" · Framleiðsla"});if(f[DD])events.push({table:PT,id:r.id,field:DD,date:date(f[DD]),kind:"delivery",title:n+" · Afhending"});if(f[PU])events.push({table:PT,id:r.id,field:PU,date:date(f[PU]),kind:"pickup",title:n+" · Sótt"})});qr.forEach(r=>{let f=r.fields;if(f[QD])events.push({table:QT,id:r.id,field:QD,date:date(f[QD]),kind:"quickfix",title:(f[QI]||"Quick Fix")+" · Quick Fix"})});$("msg").textContent="";render()}catch(e){$("msg").textContent="Villa við að sækja dagatal.";render()}}
function render(){$("title").textContent=months[cur.getMonth()]+" "+cur.getFullYear();let g=$("g");g.innerHTML="";let f=new Date(cur.getFullYear(),cur.getMonth(),1),o=(f.getDay()+6)%7,b=new Date(f);b.setDate(f.getDate()-o),today=iso(new Date());for(let i=0;i<42;i++){let d=new Date(b);d.setDate(b.getDate()+i);let di=iso(d),cell=document.createElement("div");cell.className="day"+(d.getMonth()!=cur.getMonth()?" other":"")+(di==today?" today":"");cell.dataset.date=di;cell.innerHTML='<div class="num">'+d.getDate()+"</div>";events.filter(x=>x.date==di).forEach(ev=>{let x=document.createElement("button");x.className="ev "+ev.kind;x.textContent=ev.title;x.draggable=true;x.onclick=()=>edit(ev);x.ondragstart=e=>e.dataTransfer.setData("text/plain",events.indexOf(ev));cell.appendChild(x)});cell.ondragover=e=>{e.preventDefault();cell.classList.add("over")};cell.ondragleave=()=>cell.classList.remove("over");cell.ondrop=e=>{e.preventDefault();cell.classList.remove("over");let ev=events[+e.dataTransfer.getData("text/plain")];if(ev)move(ev,di)};g.appendChild(cell)}}
function edit(ev){editing=ev;$("et").textContent=ev.title;$("ed").value=ev.date;$("edit").style.display="block";$("edit").scrollIntoView({behavior:"smooth",block:"nearest"})}
async function move(ev,d){if(!d||d==ev.date)return;let old=ev.date;ev.date=d;render();$("msg").textContent="Vista…";try{await patch(ev,d);$("msg").textContent="✓ Vistað í Airtable";setTimeout(()=>{$("msg").textContent=""},1800)}catch(e){ev.date=old;render();$("msg").textContent="Tókst ekki að vista — breyting afturkölluð."}}
$("p").onclick=()=>{cur.setMonth(cur.getMonth()-1);load()};$("n").onclick=()=>{cur.setMonth(cur.getMonth()+1);load()};$("save").onclick=()=>{if(editing)move(editing,$("ed").value);$("edit").style.display="none"};load();
</script></body></html>
