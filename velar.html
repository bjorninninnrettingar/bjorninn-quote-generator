<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Vélar — Björninn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/bjorninn-tokens.css" />
<style>
  /* velar.html — /velar, the workshop's machine SOP/FAQ, pulled live from a
     single Airtable table: "Vélaleiðbeiningar 📋", one row per tappable
     how-to item. "Vél" (singleSelect) names the machine — there's no
     separate one-row-per-machine table, so a brand new machine name just
     needs one item using it, nothing to set up first. "Flokkur" tags the
     item with the old fixed category (Ræsing/Notkun/Drepa á/Bilanir/
     Öryggi), doubling as a filter chip. "Myndir" (attachments) drag-and-
     drop straight into the item — shown in its popup, always fetched live
     so the link never goes stale. FAQ-style: pick a machine → filter by
     category chip → tap an item → it opens in a popup, not an inline
     dropdown, so the list behind it never loses its place.
     Deep link: /velar?vel=<machine name>&kafli=<raesing|...>&lid=<itemId>
     (kafli pre-filters the chip row, lid auto-opens one item's popup) —
     for a QR sticker on the machine itself, or on a single how-to item.
     Reached from /app's home grid. */
  :root {
    --bg:#0b0b0c; --surface:#161618; --surface2:#1e1e21; --line:#2a2a2e;
    --text:#f2f2f3; --muted:#c9c9ce; --dim:#8a8a90;
    --blue:#6b8ae0; --blue-fill:#3d61c1; --amber:#f5c542; --green:#4caf50; --red:#ff6b5b; --orange:#ff9f43;
    --font:"Kumbh Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.5; }
  .wrap { max-width:680px; margin:0 auto; padding:0 16px 60px; }

  .hd { position:sticky; top:0; z-index:10; background:var(--bg); padding:16px 0 12px; border-bottom:1px solid var(--line); }
  .back { min-height:44px; padding-right:12px !important; display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; background:none; border:none; cursor:pointer; padding:0; font-family:var(--font); }
  h1 { font-size:1.6rem; font-weight:800; letter-spacing:-.01em; margin-top:8px; }
  .lede { color:var(--muted); font-size:.9rem; margin-top:4px; }

  .search { position:relative; margin-top:14px; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--dim); pointer-events:none; }
  .search input {
    width:100%; font-family:var(--font); font-size:1rem; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius: 14px;
    padding:13px 14px 13px 42px; outline:none;
  }
  .search input:focus { border-color:var(--blue); }

  .search-results { margin-top:12px; display:none; flex-direction:column; gap:8px; }
  .search-results.show { display:flex; }
  .search-hit {
    display:block; text-align:left; width:100%; cursor:pointer; font-family:var(--font);
    color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius: 14px; padding:13px 14px;
  }
  .search-hit .cat { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--amber); display:block; margin-bottom:2px; }
  .search-hit .t { font-size:.98rem; font-weight:700; }
  .search-hit .snip { font-size:.82rem; color:var(--muted); margin-top:3px; }
  .search-empty { font-size:.85rem; color:var(--muted); padding:10px 2px; }

  #status { text-align:center; color:var(--muted); padding:60px 0; }

  /* machine list */
  .mlist { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .mrow {
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; font-family:var(--font);
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; color:var(--text);
  }
  .mrow:active { background:var(--surface2); }
  .mrow .thumb { width:64px; height:64px; border-radius:10px; object-fit:cover; flex:none; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
  .mrow .txt { flex:1 1 auto; min-width:0; }
  .mrow .t { font-size:1.05rem; font-weight:800; }
  .mrow .sub { font-size:.78rem; color:var(--muted); margin-top:3px; }
  .mrow .arrow { color:var(--dim); flex:none; }

  /* machine view */
  .mname { font-size:1.45rem; font-weight:800; letter-spacing:-.01em; margin-top:14px; }

  /* category filter chips */
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .chip {
    font-family:var(--font); font-weight:800; font-size:.85rem; color:var(--muted); cursor:pointer;
    background:var(--surface); border:1.5px solid var(--line); border-radius:100px; padding:8px 14px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip.active { border-color:var(--cc); background:var(--surface2); color:var(--cc); }

  /* how-to item list */
  .ilist { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .irow {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; font-family:var(--font);
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--cc); border-radius: 14px; padding:13px 14px; color:var(--text);
  }
  .irow:active { background:var(--surface2); }
  .irow .ic { font-size:1.15rem; flex:none; }
  .irow .t { font-size:.98rem; font-weight:700; flex:1 1 auto; min-width:0; }
  .irow .arrow { color:var(--dim); flex:none; }
  .empty-sec { color:var(--muted); font-size:.9rem; margin-top:14px; }

  /* popup */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal {
    background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--cc);
    border-radius:18px 18px 0 0; width:100%; max-width:680px; max-height:85vh; overflow-y:auto;
    padding:18px 18px 28px; animation:slideUp .18s ease-out;
  }
  @media (min-width:720px) {
    .overlay { align-items:center; }
    .modal { border-radius:18px; max-height:80vh; }
  }
  @keyframes slideUp { from { transform:translateY(24px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal-hd { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .modal-cat { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--cc); }
  .modal-close {
    font-family:var(--font); background:var(--surface2); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:1.1rem; cursor:pointer; flex:none; line-height:1;
  }
  .modal h2 { font-size:1.25rem; font-weight:800; margin-top:6px; }
  .video-link {
    display:inline-flex; align-items:center; gap:8px; margin-top:12px; text-decoration:none;
    background:var(--blue-fill); color:#fff; font-weight:800; font-size:.92rem; border-radius:11px; padding:11px 16px;
  }
  .photos { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .photos img { width:100%; border-radius: 14px; border:1px solid var(--line); object-fit:cover; }

  .steps { margin-top:14px; }
  .steps .step-h { font-weight:800; font-size:1rem; margin:16px 0 6px; color:var(--text); }
  .steps .step-h:first-child { margin-top:0; }
  .steps p { font-size:.97rem; margin:6px 0; }
  .steps ul, .steps ol { margin:4px 0 10px 22px; padding:0; }
  .steps li { font-size:.97rem; margin-bottom:6px; color:var(--muted); }
  .steps li b, .steps li strong, .steps p b { color:var(--text); }
  .steps a { color:var(--blue); }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <a class="back" href="/app">← Verkstæði</a>
    <h1>Vélar</h1>
    <div class="lede">Ræsing, notkun og hvernig á að drepa á — veldu vél eða leitaðu.</div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Leita — t.d. „sög“, „lím“, „slökkva“…" autocomplete="off" />
    </div>
  </div>

  <div id="status">Sæki vélar…</div>
  <div class="search-results" id="searchResults"></div>

  <div id="homeView" class="hidden">
    <div class="mlist" id="mList"></div>
  </div>

  <div id="machineView" class="hidden">
    <button class="back" id="backBtn" style="margin-top:14px;">← Allar vélar</button>
    <div class="mname" id="mName"></div>
    <div class="chips" id="mChips"></div>
    <div class="ilist" id="mItems"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-hd">
      <div class="modal-cat" id="iCat"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <h2 id="iTitle"></h2>
    <a class="video-link hidden" id="iVideo" target="_blank" rel="noopener">🎬 Myndband</a>
    <div class="photos" id="iPhotos"></div>
    <div class="steps" id="iBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var PROXY_URL = "/api/airtable";
  var LEID_TABLE = "tblGkKOmIIlBgOhh3"; // Vélaleiðbeiningar 📋

  var L_TITLE = "Titill (spurning)";
  var L_VEL = "Vél";
  var L_CAT = "Flokkur";
  var L_SVAR = "Svar";
  var L_VIDEO = "Myndband";
  var L_PHOTOS = "Myndir 🖼️";
  var L_ORDER = "Röð";
  var L_HIDDEN = "Falið";

  // key = what ?kafli= uses; label doubles as the Flokkur choice name; colour
  // is shared by the chip, the item's left border and the popup's accent.
  var SECTIONS = [
    { key: "raesing", label: "Ræsing", ic: "▶️", color: "var(--green)" },
    { key: "notkun",  label: "Notkun",  ic: "📖", color: "var(--blue)" },
    { key: "drepa",   label: "Drepa á", ic: "⏹️", color: "var(--red)" },
    { key: "bilanir", label: "Bilanir", ic: "🛠️", color: "var(--orange)" },
    { key: "oryggi",  label: "Öryggi",  ic: "⚠️", color: "var(--amber)" },
  ];
  function sectionByKey(key) { return SECTIONS.find(function (s) { return s.key === key; }); }
  function sectionByLabel(label) { return SECTIONS.find(function (s) { return s.label === label; }); }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) { return (s || "").toLowerCase(); }
  function hasText(v) { return !!(v && String(v).trim()); }

  // Airtable rich text comes back as markdown: **Bold** lines / #-headings
  // become sub-headings, "- "/"1. " lines (any indent) become nested lists,
  // [text](url) links work, ![caption](url) becomes an inline photo (for
  // precise placement — the Myndir attachments field is the easy path for
  // "just drop a photo in").
  function renderSteps(src) {
    if (!src) return "";
    var lines = String(src).split(/\r?\n/);
    var html = "", stack = [];
    function closeTo(indent) {
      while (stack.length && stack[stack.length - 1].indent >= indent) html += "</" + stack.pop().tag + ">";
    }
    function inline(t) {
      return esc(t)
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy" style="display:block;max-width:100%;border-radius:10px;margin:8px 0;border:1px solid var(--line);">')
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    lines.forEach(function (raw) {
      if (!raw.trim()) return;
      var heading = raw.match(/^\s*#{1,6}\s*(.*)$/);
      if (heading) {
        closeTo(0);
        if (heading[1].trim()) html += '<div class="step-h">' + inline(heading[1].replace(/\*\*/g, "")) + "</div>";
        return;
      }
      var bold = raw.match(/^\s*\*\*(.+?)\*\*\s*:?\s*$/);
      if (bold) { closeTo(0); html += '<div class="step-h">' + esc(bold[1]) + "</div>"; return; }
      var m = raw.match(/^(\s*)(?:[-*]|\d+[.)])\s+(.*)$/);
      if (!m) { closeTo(0); html += "<p>" + inline(raw.trim()) + "</p>"; return; }
      var indent = m[1].length;
      var tag = /^\d/.test(raw.replace(/^\s*/, "")) ? "ol" : "ul";
      closeTo(indent + 1);
      var top = stack[stack.length - 1];
      if (top && top.indent === indent && top.tag !== tag) closeTo(indent); // "- " list followed by "1. " list
      if (!stack.length || stack[stack.length - 1].indent < indent) {
        html += "<" + tag + ">";
        stack.push({ indent: indent, tag: tag });
      }
      html += "<li>" + inline(m[2]) + "</li>";
    });
    closeTo(0);
    return html;
  }

  async function airtableFetchAll(table, params) {
    var qs = ["path=" + encodeURIComponent(table)];
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      (Array.isArray(v) ? v : [v]).forEach(function (x) { qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(x)); });
    });
    var recs = [], offset;
    do {
      var r = await fetch(PROXY_URL + "?" + qs.join("&") + (offset ? "&offset=" + encodeURIComponent(offset) : ""));
      if (!r.ok) throw new Error("HTTP " + r.status);
      var d = await r.json();
      recs = recs.concat(d.records || []);
      offset = d.offset;
    } while (offset);
    return recs;
  }

  var homeView = $("homeView"), machineView = $("machineView");
  var searchResults = $("searchResults"), searchInput = $("searchInput");
  var overlay = $("overlay");
  var items = [];
  var itemsByMachine = {}; // machine name -> visible items, sorted
  var machineNames = [];
  var current = null; // current machine name
  var activeCat = null; // null = "Allt"

  function photoUrl(att, size) {
    var t = (att && att.thumbnails) || {};
    return (t[size] || t.large || att || {}).url || "";
  }
  function machineThumb(name) {
    var found = (itemsByMachine[name] || []).find(function (it) { return (it.fields[L_PHOTOS] || []).length; });
    return found ? photoUrl(found.fields[L_PHOTOS][0], "large") : "";
  }

  function showOnly(view) {
    [homeView, machineView].forEach(function (v) { v.classList.toggle("hidden", v !== view); });
    searchResults.classList.remove("show");
    searchInput.value = "";
    window.scrollTo({ top: 0 });
  }

  function renderList() {
    if (!machineNames.length) {
      $("mList").innerHTML = '<div class="search-empty">Engar vélar skráðar enn — bættu við leiðbeiningu í Airtable-töflunni „Vélaleiðbeiningar 📋“ og veldu eða skráðu vélarheiti í „Vél“.</div>';
      return;
    }
    $("mList").innerHTML = machineNames.map(function (name) {
      var thumb = machineThumb(name);
      var n = (itemsByMachine[name] || []).length;
      return '<button class="mrow" data-name="' + esc(name) + '">' +
        (thumb ? '<img class="thumb" src="' + esc(thumb) + '" alt="" loading="lazy">' : '<span class="thumb">⚙️</span>') +
        '<div class="txt"><div class="t">' + esc(name) + "</div>" +
        '<div class="sub">' + n + " leiðbeining" + (n === 1 ? "" : "ar") + "</div></div>" +
        '<span class="arrow">→</span></button>';
    }).join("");
    $("mList").querySelectorAll(".mrow").forEach(function (btn) {
      btn.addEventListener("click", function () { openMachine(btn.dataset.name); });
    });
  }

  function openMachine(name, catKey) {
    if (!itemsByMachine[name]) return;
    current = name;
    activeCat = catKey && sectionByKey(catKey) ? catKey : null;
    showOnly(machineView);
    $("mName").textContent = name;
    renderChipsAndItems();
    // own history entry so the Android back button goes machine -> list instead of leaving /velar
    if (!(history.state && history.state.vel)) {
      try { history.pushState({ vel: name }, "", "?vel=" + encodeURIComponent(name) + (activeCat ? "&kafli=" + activeCat : "")); } catch (e) {}
    }
  }

  function renderChipsAndItems() {
    var all = itemsByMachine[current] || [];
    var present = SECTIONS.filter(function (s) {
      return all.some(function (it) { return it.fields[L_CAT] === s.label; });
    });
    var chips = '<button class="chip' + (activeCat ? "" : " active") + '" style="--cc:var(--text);" data-key="">Allt</button>' +
      present.map(function (s) {
        return '<button class="chip' + (activeCat === s.key ? " active" : "") + '" style="--cc:' + s.color + ';" data-key="' + s.key + '">' + s.ic + " " + esc(s.label) + "</button>";
      }).join("");
    $("mChips").innerHTML = chips;
    $("mChips").querySelectorAll(".chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeCat = btn.dataset.key || null;
        try { history.replaceState(history.state, "", "?vel=" + encodeURIComponent(current) + (activeCat ? "&kafli=" + activeCat : "")); } catch (e) {}
        renderChipsAndItems();
      });
    });

    var shown = activeCat ? all.filter(function (it) { return it.fields[L_CAT] === sectionByKey(activeCat).label; }) : all;
    if (!shown.length) {
      $("mItems").innerHTML = '<div class="empty-sec">' + (all.length ? "Ekkert skráð í þessum flokki enn." : "Ekkert skráð hér enn.") + "</div>";
      return;
    }
    $("mItems").innerHTML = shown.map(function (it) {
      var s = sectionByLabel(it.fields[L_CAT]) || SECTIONS[0];
      return '<button class="irow" style="--cc:' + s.color + ';" data-id="' + esc(it.id) + '">' +
        '<span class="ic">' + s.ic + "</span>" +
        '<span class="t">' + esc(it.fields[L_TITLE] || "(ónefnt)") + "</span>" +
        '<span class="arrow">→</span></button>';
    }).join("");
    $("mItems").querySelectorAll(".irow").forEach(function (btn) {
      btn.addEventListener("click", function () { openItem(btn.dataset.id); });
    });
  }

  function openItem(id) {
    var it = items.find(function (r) { return r.id === id; });
    if (!it) return;
    var s = sectionByLabel(it.fields[L_CAT]) || SECTIONS[0];
    $("modal").style.setProperty("--cc", s.color);
    $("iCat").textContent = s.ic + " " + s.label;
    $("iTitle").textContent = it.fields[L_TITLE] || "(ónefnt)";
    $("iVideo").classList.toggle("hidden", !it.fields[L_VIDEO]);
    if (it.fields[L_VIDEO]) $("iVideo").href = it.fields[L_VIDEO];
    var photos = it.fields[L_PHOTOS] || [];
    $("iPhotos").innerHTML = photos.map(function (att) {
      return '<img src="' + esc(photoUrl(att, "large")) + '" alt="" loading="lazy">';
    }).join("");
    $("iBody").innerHTML = hasText(it.fields[L_SVAR]) ? renderSteps(it.fields[L_SVAR]) : (photos.length ? "" : '<div class="empty-sec">Ekkert skráð hér enn.</div>');
    overlay.classList.remove("hidden");
    if (current) {
      try { history.replaceState(history.state, "", "?vel=" + encodeURIComponent(current) + (activeCat ? "&kafli=" + activeCat : "") + "&lid=" + id); } catch (e) {}
    }
  }

  function closeItem() {
    overlay.classList.add("hidden");
    if (current) {
      try { history.replaceState(history.state, "", "?vel=" + encodeURIComponent(current) + (activeCat ? "&kafli=" + activeCat : "")); } catch (e) {}
    }
  }

  $("modalClose").addEventListener("click", closeItem);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeItem(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.classList.contains("hidden")) closeItem(); });

  window.addEventListener("popstate", function (e) {
    overlay.classList.add("hidden");
    var vel = e.state && e.state.vel;
    if (vel && itemsByMachine[vel]) { openMachine(vel, null); return; }
    current = null;
    try { history.replaceState(null, "", location.pathname); } catch (err) {}
    showOnly(homeView);
  });

  $("backBtn").addEventListener("click", function () {
    if (history.state && history.state.vel) { history.back(); return; }
    current = null;
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    showOnly(homeView);
  });

  // Search across machine names and every item's title + body; a hit opens
  // the machine and, for an item hit, pops its popup straight away.
  searchInput.addEventListener("input", function () {
    var val = norm(searchInput.value.trim());
    if (!val) {
      searchResults.classList.remove("show");
      searchResults.innerHTML = "";
      (current ? machineView : homeView).classList.remove("hidden");
      return;
    }
    homeView.classList.add("hidden"); machineView.classList.add("hidden");
    searchResults.classList.add("show");
    var hits = [];
    machineNames.forEach(function (name) {
      var nameHit = norm(name).indexOf(val) !== -1;
      var ownItems = itemsByMachine[name] || [];
      var itemHits = ownItems.filter(function (it) {
        return norm(it.fields[L_TITLE]).indexOf(val) !== -1 || norm(it.fields[L_SVAR]).indexOf(val) !== -1;
      });
      if (nameHit && !itemHits.length) hits.push({ machine: name, item: null, snip: "" });
      itemHits.forEach(function (it) {
        var s = sectionByLabel(it.fields[L_CAT]) || SECTIONS[0];
        var txt = String(it.fields[L_SVAR] || "").replace(/[*#!\[\]]/g, "").replace(/\s+/g, " ");
        var i = norm(txt).indexOf(val);
        var snip = i === -1 ? "" : (i > 30 ? "…" : "") + txt.slice(Math.max(0, i - 30), i + val.length + 50) + "…";
        hits.push({ machine: name, item: it, sec: s, snip: snip });
      });
    });
    searchResults.innerHTML = hits.length
      ? hits.map(function (h, i) {
          var cat = h.item ? h.sec.ic + " " + h.sec.label : "Vél";
          var title = h.item ? h.item.fields[L_TITLE] : h.machine;
          return '<button class="search-hit" data-i="' + i + '"><span class="cat">' + esc(cat) + "</span>" +
            '<span class="t">' + esc(title || "") + "</span>" +
            (h.snip ? '<div class="snip">' + esc(h.snip) + "</div>" : "") + "</button>";
        }).join("")
      : '<div class="search-empty">Ekkert fannst.</div>';
    searchResults.querySelectorAll(".search-hit").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var h = hits[Number(btn.dataset.i)];
        openMachine(h.machine, null);
        if (h.item) openItem(h.item.id);
      });
    });
  });

  (async function () {
    try {
      items = (await airtableFetchAll(LEID_TABLE, { pageSize: 100 }))
        .filter(function (r) { return !r.fields[L_HIDDEN] && hasText(r.fields[L_TITLE]) && hasText(r.fields[L_VEL]); });
      items.sort(function (a, b) {
        var oa = a.fields[L_ORDER], ob = b.fields[L_ORDER];
        if (oa != null || ob != null) return (oa == null ? 1e9 : oa) - (ob == null ? 1e9 : ob);
        return (a.fields[L_TITLE] || "").localeCompare(b.fields[L_TITLE] || "", "is");
      });
      itemsByMachine = {};
      items.forEach(function (it) {
        var name = it.fields[L_VEL];
        (itemsByMachine[name] = itemsByMachine[name] || []).push(it);
      });
      machineNames = Object.keys(itemsByMachine).sort(function (a, b) { return a.localeCompare(b, "is"); });

      $("status").classList.add("hidden");
      renderList();
      var p = new URLSearchParams(location.search);
      var velName = p.get("vel");
      if (velName && itemsByMachine[velName]) {
        openMachine(velName, p.get("kafli"));
        if (p.get("lid") && items.some(function (r) { return r.id === p.get("lid"); })) openItem(p.get("lid"));
      } else showOnly(homeView);
    } catch (e) {
      $("status").textContent = "Villa við að sækja vélar — reyndu aftur.";
    }
  })();
})();
</script>
<script src="/chat-widget.js" data-app="velar" data-context="Vélar: ræsing, notkun, bilanir og öryggi véla" defer></script>
