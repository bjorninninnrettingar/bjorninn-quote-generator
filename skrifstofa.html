<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Skrifstofa — Björninn</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Skrifstofa" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" />
<style>
  /* skrifstofa.html — the new office hub (2026-10-17 scoping). First piece of the
     "move the whole operation off Airtable" mission: a shared, PIN-gated shell that
     every office-side area (Skipulag, Pöntunarlisti, Loka yfirferð, Tilboð, CRM) will
     hang off, same way /app is the floor's one entry point. Deliberately minimal —
     agreed design direction is "very clean, Apple-like, less is more", a different
     visual language than /app's dark Kumbh-Sans look, not an extension of it.
     Only the Skipulag-review area is real right now; everything else shows as
     "Væntanlegt" (same disabled-tile pattern as app.html) until it's built. */
  :root {
    --bg:#f5f5f7; --surface:#ffffff; --line:#e3e3e6;
    --text:#1d1d1f; --muted:#6e6e73; --dim:#aeaeb2;
    --accent:#0071e3;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#000000; --surface:#1c1c1e; --line:#2c2c2e;
      --text:#f5f5f7; --muted:#a1a1a6; --dim:#6e6e73;
    }
  }
  :root[data-theme="dark"] {
    --bg:#000000; --surface:#1c1c1e; --line:#2c2c2e;
    --text:#f5f5f7; --muted:#a1a1a6; --dim:#6e6e73;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4; min-height:100%; }
  .wrap { max-width:460px; margin:0 auto; padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); min-height:100vh; display:flex; flex-direction:column; }

  /* ---- PIN screen ---- */
  #pinScreen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; text-align:center; }
  #pinScreen h1 { font-size:1.7rem; font-weight:600; letter-spacing:-.01em; }
  #pinScreen p.sub { color:var(--muted); font-size:.95rem; }
  .dots { display:flex; gap:14px; }
  .dot { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--dim); transition:background .12s, border-color .12s; }
  .dot.filled { background:var(--text); border-color:var(--text); }
  .dots.err .dot { border-color:#ff3b30; }
  .keypad { display:grid; grid-template-columns:repeat(3,72px); gap:16px; }
  .key { width:72px; height:72px; border-radius:50%; border:none; background:var(--surface); color:var(--text); font-size:1.5rem; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; }
  .key:active { background:var(--line); }
  .key.ghost { background:transparent; box-shadow:none; }
  #pinErr { color:#ff3b30; font-size:.9rem; min-height:1.2em; }

  /* ---- Hub screen ---- */
  #hub { display:none; flex:1; flex-direction:column; gap:28px; }
  .hd { display:flex; align-items:baseline; justify-content:space-between; }
  .hd h1 { font-size:1.5rem; font-weight:600; letter-spacing:-.01em; }
  .hd button { background:none; border:none; color:var(--accent); font-size:.95rem; font-family:inherit; padding:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tile { background:var(--surface); border-radius:18px; padding:20px 16px; display:flex; flex-direction:column; gap:10px; min-height:118px; text-decoration:none; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .tile .ic { font-size:1.6rem; }
  .tile .lbl { font-weight:600; font-size:.98rem; letter-spacing:-.005em; }
  .tile .meta { font-size:.8rem; color:var(--muted); }
  .tile.soon { opacity:.45; }
  .tile.soon .meta { color:var(--dim); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; font-size:.95rem; }
</style>
</head>
<body>
<div class="wrap">

  <div id="pinScreen">
    <div>
      <h1>Skrifstofa</h1>
      <p class="sub">Sláðu inn PIN</p>
    </div>
    <div class="dots" id="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div id="pinErr"></div>
    <div class="keypad" id="keypad"></div>
  </div>

  <div id="hub">
    <div class="hd">
      <h1 id="greeting">Hæ</h1>
      <button id="logoutBtn" type="button">Útskrá</button>
    </div>
    <div class="grid" id="tiles"></div>
    <div class="empty" id="emptyMsg" style="display:none;">Engin verkfæri tengd þínu hlutverki ennþá.</div>
  </div>

</div>

<script>
(function () {
  "use strict";
  var SESSION_KEY = "bjorninn:skrifstofa:session";

  var AREAS = [
    { id: "skipulag",    label: "Yfirferð",       ic: "📐", roles: ["skipulag", "allt"], href: "/yfirferd" },
    { id: "pontun",      label: "Pöntunarlisti",  ic: "📋", roles: ["allt"], href: "/pontun" },
    { id: "lokayfirferd",label: "Loka yfirferð",  ic: "✅", roles: ["allt"], href: "/skipulag" },
    { id: "tilbod",      label: "Tilboð",         ic: "🧾", roles: ["sala", "allt"], soon: true },
    { id: "forskipulag", label: "Forskipulag",    ic: "✏️", roles: ["forskipulag", "allt"], soon: true },
    { id: "crm",         label: "CRM",            ic: "📇", roles: ["allt"], soon: true }
  ];

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; }
  }
  function saveSession(s) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {} }
  function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }

  // The internal data key (?k=) is never requested from an API — it only ever
  // moves through the URL, same as /verk and /eining already do. Read it once
  // from this page's own link and remember it, so it survives a reload even
  // if a later open of /skrifstofa doesn't repeat it.
  var K_STORE = "bjorninn:skrifstofa:k";
  (function () {
    var fromUrl = new URLSearchParams(location.search).get("k");
    if (fromUrl) { try { localStorage.setItem(K_STORE, fromUrl); } catch (e) {} }
  })();
  function getK() { try { return localStorage.getItem(K_STORE) || ""; } catch (e) { return ""; } }

  // ---- PIN screen ----
  var pin = "";
  var dotsEl = document.getElementById("dots");
  var errEl = document.getElementById("pinErr");
  var keypadEl = document.getElementById("keypad");

  function renderDots() {
    var dots = dotsEl.querySelectorAll(".dot");
    dots.forEach(function (d, i) { d.classList.toggle("filled", i < pin.length); });
  }
  function shake() {
    dotsEl.classList.add("err");
    setTimeout(function () { dotsEl.classList.remove("err"); }, 350);
  }
  function buildKeypad() {
    var layout = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
    layout.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "key" + (k === "" ? " ghost" : "");
      b.textContent = k;
      if (k !== "") {
        b.addEventListener("click", function () { onKey(k); });
      } else {
        b.disabled = true;
      }
      keypadEl.appendChild(b);
    });
  }
  function onKey(k) {
    errEl.textContent = "";
    if (k === "⌫") { pin = pin.slice(0, -1); renderDots(); return; }
    if (pin.length >= 4) return;
    pin += k;
    renderDots();
    if (pin.length === 4) submitPin();
  }
  function submitPin() {
    fetch("/api/skrifstofa-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: pin })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          errEl.textContent = "Rangt PIN";
          shake();
          pin = "";
          renderDots();
          return;
        }
        saveSession({ token: res.data.token, record: res.data.record, ts: Date.now() });
        showHub(res.data.record);
      })
      .catch(function () {
        errEl.textContent = "Tókst ekki að tengjast";
        pin = "";
        renderDots();
      });
  }

  // ---- Hub screen ----
  function showHub(record) {
    document.getElementById("pinScreen").style.display = "none";
    var hub = document.getElementById("hub");
    hub.style.display = "flex";
    document.getElementById("greeting").textContent = "Hæ, " + (record.name || "").split(" ")[0];

    var tilesEl = document.getElementById("tiles");
    tilesEl.innerHTML = "";
    var roles = record.roles || [];
    var visible = AREAS.filter(function (a) { return a.roles.some(function (r) { return roles.indexOf(r) !== -1; }); });

    if (visible.length === 0) {
      document.getElementById("emptyMsg").style.display = "block";
      return;
    }
    var k = getK();
    visible.forEach(function (a) {
      var el = document.createElement(a.soon ? "div" : "a");
      el.className = "tile" + (a.soon ? " soon" : "");
      if (!a.soon) el.href = a.href + (k ? "?k=" + encodeURIComponent(k) : "");
      el.innerHTML = '<span class="ic">' + a.ic + '</span><span class="lbl">' + a.label + '</span><span class="meta">' + (a.soon ? "Væntanlegt" : "") + '</span>';
      tilesEl.appendChild(el);
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", function () {
    clearSession();
    location.reload();
  });

  buildKeypad();
  renderDots();

  var existing = loadSession();
  if (existing && existing.record) {
    showHub(existing.record);
  }
})();
</script>
</body>
</html>
