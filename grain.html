<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Æðaskipulag — Björninn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Kumbh Sans ties this into the /skipulag · /verkstaedi · velja.html family
     (2026-09-12) — a font swap only, no layout changes, so it's safe this
     close to /saga going into real use. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #f0f0f0;
    font-family: "Kumbh Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 40px 80px;
  }
  h1 { font-size: 1.6rem; letter-spacing: 0.03em; margin-bottom: 4px; }
  .sub { color: #d5d5d5; font-size: 0.95rem; margin-bottom: 22px; }

  .card {
    background: #161616;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 18px;
  }

  label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #d5d5d5; margin-bottom: 6px; }

  select, input[type="number"], input[type="text"] {
    background: #0d0d0d;
    border: 1px solid #333;
    color: #f0f0f0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    width: 100%;
    max-width: 480px;
  }
  input[type="number"] { max-width: 110px; text-align: right; }

  button {
    background: #333;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: #2196f3; }
  button.ghost { background: transparent; border: 1.5px solid #333; }
  button:disabled { background: #222; color: #666; cursor: not-allowed; }
  button.small { padding: 5px 9px; font-size: 0.8rem; border-radius: 6px; }

  .hidden { display: none !important; }
  .project-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }

  /* project name (left) + active-material chip (right corner), same line —
     replaces the old "veldu efni" picker screen, see renderHeaderPill().
     Both sides ellipsis rather than wrap, so a long project name or a long
     décor name can't push this onto two lines — full text is one hover away
     via the title attribute set alongside these. */
  .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hdr-row .project-name {
    flex: 1 1 auto; min-width: 80px; max-width: 60%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mat-switcher { display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
  .mat-photo {
    width: 64px; height: 64px; border-radius: 11px; object-fit: cover;
    flex: none; border: 1px solid #2a2a2a; background: #0d0d0d;
  }
  .mat-swatch { display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
  .mat-name, .mat-badge {
    max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mat-name { font-size: 0.92rem; font-weight: 700; text-align: right; }
  .mat-badge { font-size: 0.8rem; margin-top: 2px; text-align: right; }
  #matSelect {
    flex: none; width: auto; max-width: 200px; background: #0d0d0d; border: 1px solid #333;
    color: #f0f0f0; border-radius: 8px; padding: 8px 10px; font-size: 0.85rem;
  }

  /* material picker */
  .mat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border: 1.5px solid #262626; border-radius: 8px;
    margin-bottom: 8px; cursor: pointer;
  }
  .mat-item:hover { border-color: #2196f3; }
  .mat-item.active { border-color: #2196f3; background: #0d1a26; }
  .mat-item .mname { font-weight: 600; }
  .mat-item .mmeta { color: #d5d5d5; font-size: 0.82rem; margin-top: 2px; }
  .badge {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 7px; border-radius: 5px; font-weight: 700; white-space: nowrap;
  }
  .badge.grain { background: #3a2d12; color: #f5c518; }

  /* workspace */
  .workspace { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .boards-col { flex: 1 1 620px; min-width: 0; }
  .side-col {
    flex: 0 1 320px; min-width: 280px;
    position: sticky; top: 14px; align-self: flex-start;
    max-height: calc(100vh - 28px); overflow-y: auto;
  }
  .side-col > .card { margin-bottom: 0; }

  .toolbar {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
    margin-bottom: 16px;
  }
  .toolbar .field { display: flex; flex-direction: column; }
  .toolbar .field label { margin-bottom: 4px; }
  .settings-pop {
    position: absolute; top: 100%; left: 0; z-index: 40; margin-top: 6px;
    background: #161616; border: 1px solid #333; border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; width: 240px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.55);
  }
  /* THE BUG: an unconditional "display: flex" above always beats the
     browser's own [hidden]{display:none} rule — author CSS wins over the
     user-agent stylesheet no matter the specificity, so the JS toggling
     the hidden attribute was doing nothing visible. This rule (class +
     attribute = higher specificity than .settings-pop alone) is what
     actually makes hidden work again. */
  .settings-pop[hidden] { display: none; }
  .settings-pop .field { width: 100%; }
  .settings-pop input[type="number"] { max-width: 100%; }
  .pop-head {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    font-size: 0.85rem; font-weight: 700; color: #f0f0f0;
    padding: 2px 2px 10px; margin: -2px -2px 8px; border-bottom: 1px solid #2a2a2a;
  }
  .pop-close {
    background: #222; border: none; color: #fff; font-size: 1.15rem; line-height: 1;
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .pop-close:active { background: #333; }

  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin: 4px 0 18px; }
  .stat { font-size: 0.85rem; color: #d5d5d5; }
  .stat b { color: #f0f0f0; font-size: 1.05rem; display: block; }

  #boardsCol { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .board-wrap {
    margin-bottom: 4px;
    width: var(--board-w, 440px);
    min-width: 240px;
    resize: horizontal; overflow: hidden;   /* drag the bottom-right corner */
  }
  .board-wrap svg.board { width: 100%; }
  .board-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .board-head h3 { font-size: 1rem; }

  /* collapsed "done" sheets — a compact strip instead of the full diagram,
     so working through 20 sheets one at a time doesn't mean scrolling past
     19 finished ones every time */
  .done-pills {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    width: 100%; margin-bottom: 6px; padding: 10px 12px;
    background: #10201a; border: 1px solid #2f6f4f; border-radius: 10px;
  }
  .done-pills-label { font-size: 0.8rem; font-weight: 700; color: #a8e0c4; margin-right: 4px; }
  .done-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: #161616; border: 1px solid #2a2a2a; border-radius: 999px;
    padding: 4px 6px 4px 12px; font-size: 0.82rem; color: #d5d5d5;
  }

  svg.board { background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; touch-action: none; display: block; width: 100%; height: auto; }
  svg.board text { font-family: "SF Mono", Consolas, monospace; }

  .group-rect.dragging { opacity: 0.22; }
  .front-cell.dragging { opacity: 0.22; }
  .group-rect.selected .grgbox { stroke: #2196f3; stroke-width: 3; }
  .group-rect.overflow .grgbox { stroke: #f44336; stroke-dasharray: 6 4; }
  .run-handle { cursor: grab; }
  .front-cell { cursor: grab; }
  .front-cell:hover rect:first-child { fill-opacity: 0.3; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #1c1c1c; border: 1px solid #333; color: #eee; padding: 10px 16px;
    border-radius: 8px; font-size: 0.85rem; z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* the ghost is always in the DOM (like #toast) so .show can transition it
     in/out — a quick "lift off the board" cue when you pick something up,
     instead of an abrupt appear/disappear */
  #dragGhost {
    position: fixed; z-index: 200; pointer-events: none;
    border: 2px solid #2196f3; background: rgba(33,150,243,0.28);
    border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    color: #fff; font: 600 12px/1.2 "SF Mono", Consolas, monospace;
    padding: 3px 5px; overflow: hidden; white-space: pre;
    opacity: 0; transform: scale(0.92);
    transition: opacity .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  #dragGhost.show { opacity: 1; transform: scale(1.05); box-shadow: 0 10px 28px rgba(0,0,0,0.5); }

  /* a short "landed" flash on the run/front that was just dropped, instead
     of it just snapping into place with no feedback */
  @keyframes landPulse { 0% { filter: brightness(1.7); } 100% { filter: brightness(1); } }
  .grgbox.landed { animation: landPulse .4s ease-out; }

  .grp-panel { }
  /* only the roomy group-level action row gets bigger buttons — the dense
     per-front row (name + dims + 4 buttons on one line) has no slack for it,
     and grew tight enough there to squeeze .fn to 0 width and overlap text */
  .grp-actions button.small, .grp-actions select.small { padding: 7px 11px; font-size: 0.85rem; }
  .grp-panel .grp {
    border: 1.5px solid #262626; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  .grp-panel .grp.sel { border-color: #2196f3; background: #0d1a26; }
  .grp-panel .grp.locked { border-color: #6b5a22; }
  .grp-panel .grp.locked.sel { border-color: #c9a234; background: #201c12; }
  .grp-panel .grp h4 { font-size: 0.9rem; margin-bottom: 2px; }
  .grp-panel .grp .gm { color: #d5d5d5; font-size: 0.78rem; margin-bottom: 8px; }
  .front-list { min-height: 4px; }
  .front-row {
    display: flex; align-items: center; gap: 8px; font-size: 0.82rem;
    padding: 4px 2px; border-top: 1px solid #1e1e1e; flex-wrap: wrap;
  }
  .front-row .drag-grip { cursor: grab; color: #cfcfcf; font-size: 0.9rem; }
  .front-row.dragging { opacity: 0.4; }
  .front-row.manual .fn { color: #7fd88f; }
  input.mf-h {
    width: 48px; padding: 3px 4px; font-size: 0.78rem; text-align: right; flex: none;
    background: #0d0d0d; border: 1px solid #2c4a34; border-radius: 5px; color: #cfeecf;
  }
  input.mf-label {
    flex: 1; min-width: 0; padding: 3px 6px; font-size: 0.8rem;
    background: #0d0d0d; border: 1px solid #2c4a34; border-radius: 5px; color: #cfeecf;
  }
  .front-row.drop-above { box-shadow: inset 0 2px 0 #2196f3; }
  .front-row.drop-below { box-shadow: inset 0 -2px 0 #2196f3; }
  .front-row .fn { flex: 1 1 90px; min-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .front-row .fdim { color: #d5d5d5; font-variant-numeric: tabular-nums; }
  .front-row .idx {
    width: 20px; height: 20px; border-radius: 4px; background: #222; color: #eee;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.72rem;
  }
  .grp-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    position: fixed; left: 0; right: 0; bottom: 0; background: #2196f3; color: #fff;
    padding: 10px 16px; text-align: center; font-size: 0.9rem; font-weight: 600; z-index: 50;
  }
  .banner button { background: rgba(0,0,0,0.25); margin-left: 10px; }

  .warn-box { background: #2a1512; border: 1px solid #5a2b22; color: #f0b8ac; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }

  .hint { color: #d5d5d5; font-size: 0.8rem; margin-top: 6px; }

  .msg-drop {
    border: 1px solid #2f5a8c; background: #101a26; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 18px;
  }
  .msg-drop summary {
    cursor: pointer; color: #8fbaff; font-weight: 700; font-size: 0.9rem; list-style: none;
  }
  .msg-drop summary::-webkit-details-marker { display: none; }
  .msg-drop summary::after { content: " ▾"; }
  .msg-drop[open] summary::after { content: " ▴"; }

  #planStrip:empty { display: none; }
  .plan-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 0.87rem;
    border: 1px solid #2a2a2a; background: #161616;
  }
  .plan-bar.confirmed { border-color: #2f6f4f; background: #10201a; }
  .plan-bar.draft     { border-color: #8f7530; background: #332912; }
  .plan-bar.floor     { border-color: #2f5a8c; background: #101a26; }
  .plan-bar b { color: #f0f0f0; }
  .plan-bar .spacer { flex: 1; }
  .plan-bar .muted { color: #d5d5d5; }
  body.floor .office-only { display: none !important; }

  /* Shop-floor touch targets: a tablet in a dusty workshop with gloved or
     sawdust-covered fingers needs bigger hit areas than an office mouse
     pointer does — bump only what the floor actually sees, office density
     stays as-is. Also brightens the floor's "start sawing" CTA to the same
     amber the /verkstaedi hub uses for Saga, so the hub → guide hop reads as
     one product instead of two different tools. */
  body.floor button.small { padding: 9px 14px; font-size: 0.88rem; }
  body.floor #guideOverlay .gboard-nav button { padding: 9px 14px; font-size: 0.88rem; }
  body.floor .plan-bar.floor .primary {
    background: #ffd60a; color: #1a1400; font-size: 1.05rem; padding: 14px 22px;
  }

  /* guided sawing overlay */
  #guideOverlay {
    position: fixed; inset: 0; z-index: 100; background: #0b0b0b;
    display: flex; flex-direction: column;
  }
  #guideOverlay .gtop {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid #222; font-size: 0.9rem; color: #d5d5d5;
  }
  #guideOverlay .gtop .gt-title { font-weight: 700; color: #f0f0f0; }
  #guideOverlay .gtop .gt-step { margin-left: auto; font-variant-numeric: tabular-nums; }
  #guideOverlay .gboard-nav { display: flex; gap: 6px; margin-left: 16px; }
  #guideOverlay .gboard-nav button {
    padding: 4px 10px; font-size: 0.8rem; border-radius: 6px;
    background: #1e1e1e; border: 1px solid #333; color: #d5d5d5;
  }
  #guideOverlay .gboard-nav button.cur { border-color: #2196f3; color: #fff; background: #12283d; }
  #guideOverlay .gboard-nav button.done { color: #6fbf7f; border-color: #2f6f4f; }
  #guideOverlay .gprog { height: 4px; background: #1e1e1e; position: relative; }
  #guideOverlay .gprog > div { height: 100%; background: #2196f3; transition: width 0.2s; }
  #guideOverlay .gprog .tick { position: absolute; top: 0; width: 2px; height: 100%; background: #0b0b0b; }

  #guideOverlay .gbody {
    flex: 1; display: flex; gap: 28px; padding: 26px 32px; overflow: auto; align-items: stretch;
  }
  #guideOverlay .gdiagram { flex: 1 1 46%; display: flex; align-items: flex-start; justify-content: center; min-width: 260px; }
  #guideOverlay .gdiagram svg { max-height: 68vh; width: auto; max-width: 100%; background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; }
  #guideOverlay .ginfo { flex: 1 1 54%; display: flex; flex-direction: column; gap: 18px; }

  #guideOverlay .gboard-chip {
    align-self: flex-start; background: #1c1c1c; border: 1px solid #333; border-radius: 999px;
    padding: 4px 14px; font-size: 0.85rem; color: #d5d5d5; font-weight: 600;
  }
  #guideOverlay .gkind {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
  }
  #guideOverlay .gkind.rip { color: #f5a623; }
  #guideOverlay .gkind.crosscut { color: #4aa3ff; }
  #guideOverlay .gkind.trim, #guideOverlay .gkind.scrap { color: #d5d5d5; }
  #guideOverlay .gtitle { font-size: 1.9rem; font-weight: 700; line-height: 1.15; }
  #guideOverlay .gmeasure {
    display: flex; align-items: baseline; gap: 12px; background: #12181f;
    border: 1px solid #24384a; border-radius: 12px; padding: 16px 20px;
  }
  #guideOverlay .gmeasure .num { font-size: 3.4rem; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
  #guideOverlay .gmeasure .unit { font-size: 1.3rem; color: #9ac7ff; }
  #guideOverlay .gmeasure .lbl { margin-left: auto; text-align: right; color: #8fa9c0; font-size: 0.9rem; max-width: 45%; }

  #guideOverlay .gproduces label { margin-bottom: 8px; }
  #guideOverlay .gchip {
    display: inline-flex; flex-direction: column; gap: 2px;
    background: #16241a; border: 1px solid #2c4a34; border-radius: 8px;
    padding: 8px 12px; margin: 0 8px 8px 0; min-width: 120px;
  }
  #guideOverlay .gchip .cl { font-weight: 700; font-size: 0.95rem; }
  #guideOverlay .gchip .cd { color: #9fd6ac; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  #guideOverlay .gchip.warn { border-color: #6b4a22; background: #241c12; }
  #guideOverlay .gchip-flag {
    margin-top: 6px; padding: 3px 7px; font-size: 0.72rem; font-weight: 600;
    background: transparent; border: 1px solid #5a4a2c; color: #d8b978; border-radius: 5px;
  }
  #guideOverlay .gnote { color: #d5d5d5; font-size: 0.9rem; }
  #guideOverlay .greorient {
    color: #ffd479; font-size: 1.15rem; font-weight: 800; line-height: 1.3;
    background: #241c12; border: 1px solid #6b4a22; border-radius: 8px; padding: 10px 14px;
  }
  #guideOverlay .greorient .gsub {
    display: block; font-size: 0.8rem; font-weight: 600; color: #d8b978; opacity: 0.85; margin-top: 3px;
  }
  #guideOverlay .gwincut {
    background: #12181f; border: 1px solid #2c4256; border-radius: 10px; padding: 14px 16px;
  }
  #guideOverlay .gwincut-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 1rem; color: #fff; }
  #guideOverlay .gwincut-feed { color: #fff; font-size: 0.95rem; }
  #guideOverlay .gwincut-table { width: 100%; border-collapse: collapse; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: #fff; }
  #guideOverlay .gwincut-table th { text-align: left; color: #9fb3c8; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 10px; }
  #guideOverlay .gwincut-table td { padding: 8px 10px; border-top: 1px solid #24384a; color: #fff; font-weight: 600; }
  #guideOverlay .gwincut-table tr.cur td { background: #1a3a2a; color: #fff; font-weight: 800; font-size: 1.5rem; }

  #guideOverlay .gbottom {
    display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-top: 1px solid #222;
  }
  #guideOverlay .gbottom button { padding: 14px 26px; font-size: 1.05rem; }
  #guideOverlay .gbottom .spacer { flex: 1; }
  #guideOverlay .gbottom .kbd-hint { color: #cfcfcf; font-size: 0.8rem; }
  #guideOverlay.done .gbody { align-items: center; justify-content: center; }
  #guideOverlay .gdone { text-align: center; }
  #guideOverlay .gdone .big { font-size: 3rem; font-weight: 800; margin-bottom: 8px; }

  @media (max-width: 760px) {
    #guideOverlay .gbody { flex-direction: column; }
    #guideOverlay .gtitle { font-size: 1.5rem; }
    #guideOverlay .gmeasure .num { font-size: 2.6rem; }
  }
  @media print { #guideOverlay { display: none !important; } }

  /* print */
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; color: #000; padding: 0; }
    .no-print { display: none !important; }
    .card { border: none; background: #fff; padding: 0; margin: 0; }
    .workspace { display: block; }
    .side-col { display: none; }
    #boardsCol { display: block; }
    .board-wrap { page-break-after: always; margin-bottom: 0; width: 100%; max-width: 100%; resize: none; }
    svg.board { background: #fff; border: 1px solid #000; max-width: 170mm; }
    svg.board text { fill: #000 !important; }
    .print-only { display: block !important; }
    .board-head h3 { color: #000; }
    .cutseq { color: #000 !important; }
    .cutseq b { color: #000 !important; }
  }
  .print-only { display: none; }
  .cutseq { font-size: 0.85rem; line-height: 1.5; margin-top: 10px; color: #d5d5d5; }
  .cutseq ol { padding-left: 20px; }
  .cutseq b { color: #f0f0f0; }
</style>
</head>
<body>

  <h1>Æðaskipulag</h1>
  <div class="sub">Raðar frontum með samfelldri viðaræð á plötu — það sem Cutty getur ekki gert.</div>

  <div class="card no-print" id="searchCard">
    <label>Veldu verkefni (Tækifæri)</label>
    <select id="projectSelect"><option value="">Sæki verkefni…</option></select>

  <div class="card no-print hidden" id="projectCard">
    <div class="hdr-row">

      <div id="matSwitcher" class="mat-switcher hidden">
        <img id="matPhoto" class="mat-photo hidden" alt="" />
        <div id="matSwatch" class="mat-photo mat-swatch">🪵</div>

        <div id="settingsPop" class="settings-pop" data-btn="settingsBtn" hidden>

      <button class="ghost small" id="redoBtn" onclick="redo()" title="Endurgera (⌘⇧Z)" disabled>↷</button>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────
const PROXY_URL = "/api/airtable";
const PROJECTS_TABLE     = "tbl4LMXlQjp66RFKI";
const SOGUNARLISTI_TABLE = "tblhdgyvTcBfP8kov";
const EFNISLISTI_TABLE   = "tbl8CrVWKF8CuI7HD";
const PLAN_TABLE         = "tblzkw70E2xoX9RmK"; // Æðaplan 📐
const PL_PROJECT = "Tækifæri 📣", PL_EFNI = "Efni", PL_JSON = "Skipulag", PL_CONFIRM = "Staðfest ✅", PL_NAME = "Nafn";

// /aedar = office (build & confirm). /saga = floor (run the confirmed plan,
// tweak locally only — no write-back).
const FLOOR_MODE = location.pathname === "/saga";
const PLAN_SCHEMA = 1;

const P_NAME_FIELD = "Heiti tækifæris / verkefnis";
const P_STADA_SOLU = "Staða í söluferli";
const P_STADA_SKIP = "Staða í skipulagi";
const P_STADA_FRAM = "Staða í framleiðslu";

const S_PROJECT_LINK = "Tækifæri 📣 (projects)";
const S_PARTUR   = "Partur";
const S_H = "H", S_B = "B", S_TH = "Þ", S_M = "M";
const S_EFNI      = "Efni:";
const S_EFNI_BASE = "Efni: (undirstaða)";
const S_EYDUBLAD  = "Eyðublað ✏️";
const S_VILLA     = "Villa?";
const S_PLANMSG   = "Skilaboð til skipulags";   // part-level note to the planners
const S_BAS   = "B.A.S.";   // checked -> print-server.js (shop PC) prints one label, then unchecks it
const S_LOKID = "Lokið";    // read-only here; print-server sets it once every copy (Magn) is printed

const E_HEITI = "Heiti efnis", E_BREIDD = "Breidd (mm)", E_LENGD = "Lengd (mm)", E_THYKKT = "Þykkt (mm)";
const E_SUB = "Undirflokkur 🗂️";   // Frontaefni / Spónlagt / Hurð / Skrokka efni / Harðplast / Borðplata
const E_MYND = "Mynd 🖼️";          // material swatch photo, shown in the project/material header pill

const EYDUBLAD_TABLE = "tbl0WcyHhz63pSzZX";
const U_NAME = "Athugasemd";               // Eyðublað's own primary field ("Sk 20-22")
const U_PROJECT_LINK = "Tækifæri 📣 (projects)", U_PROJECT_LINK_OLD = "Tækifæri 📣";

// Visible fronts whose grain the customer sees. Inner drawer fronts
// (Innskúffufrontur) sit inside the cabinet and are excluded.
const FRONT_RE  = /(frontur|blindlok|áfella|afella|vænghurð|vaenghurd|sökkul cover|sokkul cover)/i;
// "FRE" / "FRE2" in the Partur text = the part is cut from frontaefni.
const FRE_RE    = /\bfre\d?\b/i;
// A part whose material lands in one of these Undirflokkar is front material.
const FRONT_SUBS = new Set(["Frontaefni", "Spónlagt", "Hurð"]);
const HIDDEN_RE = /(innskúffufrontur|innskuffufrontur)/i;
// Wing doors: a horizontal pair over one opening — cut side by side, upright,
// so the grain figure runs continuously across the seam.
const SIDEBYSIDE_RE = /(væng|vaeng)/i;
// Wing doors + split fronts (vertical split, "skiptur frontur") — one door's
// worth of grain, so keep the run together (never auto-split); split fronts
// stack (grain top→bottom), wing doors go side by side.
const KEEPTOGETHER_RE = /(væng|vaeng|skipt)/i;
// A drawer bank: several fronts of one cabinet's drawer stack, sharing a
// width. Same "must not be scattered" logic as wing/split fronts, below —
// see DRAWER_RE's use in buildGroups().
const DRAWER_RE = /skúffufrontur/i;
// Wood-look / veneer decors where sequential grain matters.
const GRAIN_RE  = /(eik|hnot|valhnot|ash|askur|beyk|beech|fura|pine|wenge|teak|oak|walnut|spónlag|spónlög|sponlag|spónn|spon |rift|masterlin|linoak|hickory|acacia|akasía|kirsu|cherry|birki|birch|reykt)/i;
// Blum drawer-height codes, roughly narrow→tall — only used to break a
// genuine tie between two fronts of equal measured height (see buildGroups):
// the real H is what actually orders a drawer stack, and a code letter
// isn't always present in the Partur text.
const CODE_RANK = { N: 0, M: 1, K: 2, C: 3, D: 4, F: 5, E: 6 };

const DEFAULTS = { kerf: 4.4, trim: 10, grid: 25, freeMove: false, boardPx: 440 };

// ── STATE ────────────────────────────────────────────────────────────────
let projects = [];
let currentProjectId = null;
let projectName = "";
let allFronts = [];          // {id, partur, h, b, th, m, efni, unitId, unitName, err}
let skippedFronts = [];      // rows that look like fronts but were dropped (missing dims / unknown Partur)
let boards = [];             // Efnislisti rows
let materials = [];          // {key, label, efni, th, grain, pieces, area}
let selectedKey = null;
let groups = [];             // {id, unitName, width, orient, fronts:[{label,h,pieceId}]}
let layout = { boards: [] }; // [{ placements: {gid:{x,y}} }]
let selectedGid = null;
let settings = loadSettings();
let board = { w: 2070, l: 2800, name: "" };
let projectPlans = [];  // Æðaplan rows for the current project
let curPlan = null;     // { recordId, confirmed, sourceJSON } for the selected material
let planSaveTimer = null;
let manualFronts = [];  // {id, groupId, unitName, w, orient, label, h} — fronts added by hand in the tool

// ── UTIL ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const num = v => (typeof v === "number" ? v : parseFloat(v)) || 0;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

function loadSettings() {
  let s;
  try { s = { ...DEFAULTS, ...JSON.parse(localStorage.getItem("grain:settings") || "{}") }; }
  catch { s = { ...DEFAULTS }; }
  if (!s.trim) s.trim = DEFAULTS.trim;   // jaðar-snyrting: auto 10 mm
  if (!s.grid) s.grid = DEFAULTS.grid;
  if (!s.kerf) s.kerf = DEFAULTS.kerf;
  return s;
}
function saveSettings() {
  try { localStorage.setItem("grain:settings", JSON.stringify(settings)); } catch {}
}
function layoutKey() { return `grain:layout:${currentProjectId}:${selectedKey}`; }
function planSig(s) {                          // cheap hash of a plan JSON string
  let h = 0; s = s || ""; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h + ":" + s.length;
}
function saveLayout() {
  if (typeof syncManualIndex === "function") syncManualIndex();
  try {
    localStorage.setItem(layoutKey(), JSON.stringify({
      layout, board, planSig: FLOOR_MODE && curPlan ? planSig(curPlan.sourceJSON) : undefined,
    }));
  } catch {}
  if (typeof schedulePlanSave === "function") schedulePlanSave();  // office: mirror to Airtable (debounced)
  if (typeof pushHistory === "function") pushHistory();            // undo/redo
}

// ── UNDO / REDO (Cmd/Ctrl+Z, +Shift for redo) ────────────────────────────
let history = [];
let histIdx = -1;
let applyingHistory = false;
function resetHistory() { history = []; histIdx = -1; }
function pushHistory() {
  if (applyingHistory || loadingPlan || !selectedKey) return;
  const s = serializePlan();
  if (history[histIdx] === s) return;
  history = history.slice(0, histIdx + 1);
  history.push(s);
  if (history.length > 80) history.shift();
  histIdx = history.length - 1;
  updateUndoButtons();
}
function restoreHistory() {
  applyingHistory = true;
  try {
    applyPlan(JSON.parse(history[histIdx]));
    syncToolbarInputs();
    selectedGid = null;
    render();
    saveLayout();        // persist to localStorage / plan draft — pushHistory bails while applyingHistory
  } finally { applyingHistory = false; }
  updateUndoButtons();
}
function undo() { if (histIdx > 0) { histIdx--; restoreHistory(); } }
function redo() { if (histIdx < history.length - 1) { histIdx++; restoreHistory(); } }
function updateUndoButtons() {
  const u = $("undoBtn"), r = $("redoBtn");
  if (u) u.disabled = histIdx <= 0;
  if (r) r.disabled = histIdx >= history.length - 1;
}
document.addEventListener("keydown", e => {
  if (guide && !$("guideOverlay").classList.contains("hidden")) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  } else if ((e.metaKey || e.ctrlKey) && (e.key === "y" || e.key === "Y")) {
    e.preventDefault(); redo();
  } else if (/^Arrow(Left|Right|Up|Down)$/.test(e.key) && selectedGid && !e.metaKey && !e.ctrlKey) {
    nudgeSelected(e.key, e.shiftKey ? 1 : (settings.grid || 10));
    e.preventDefault();
  } else if ((e.key === "Delete" || e.key === "Backspace") && selectedGid) {
    const g = groups.find(x => x.id === selectedGid);
    if (g && g.fronts.length === 1 && g.fronts[0].manual) { removeManualFront(g.fronts[0].mfId); e.preventDefault(); }
  }
});
function nudgeSelected(key, step) {
  const bi = boardOfGroup(selectedGid); if (bi < 0) return;
  const g = groups.find(x => x.id === selectedGid);
  const W = groupWidth(g), H = groupLen(g);
  const p = layout.boards[bi].placements[selectedGid];
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[key];
  const x = clamp(p.x + d[0], 0, Math.max(0, board.w - W));
  const y = clamp(p.y + d[1], 0, Math.max(0, board.l - H));
  if (!posFree(bi, selectedGid, x, y, W, H)) return;   // blocked — don't move
  layout.boards[bi].placements[selectedGid] = { x, y };
  render(); saveLayout();
}
function loadStoredLayout() {
  try {
    const raw = localStorage.getItem(layoutKey());
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

async function fetchWithRetry(url, opt, tries = 3) {
  for (let a = 0; ; a++) {
    const r = await fetch(url, opt);
    if (r.status !== 429 || a >= tries) return r;
    await new Promise(res => setTimeout(res, 1000 * (a + 1)));
  }
}
async function airtableFetch(table, params, recordId) {
  // Build the query string with encodeURIComponent, NOT URLSearchParams:
  // URLSearchParams encodes spaces as "+", and neither the /api/airtable
  // request parser (locally) nor Airtable's formula parser decode "+" back
  // to a space, so a "{Field Name}" reference in filterByFormula breaks.
  const qs = [`path=${encodeURIComponent(recordId ? `${table}/${recordId}` : table)}`];
  for (const [k, v] of Object.entries(params || {})) {
    if (v === undefined) continue;
    for (const x of Array.isArray(v) ? v : [v]) qs.push(`${encodeURIComponent(k)}=${encodeURIComponent(x)}`);
  }
  const build = extra => `${PROXY_URL}?${[...qs, ...extra].join("&")}`;
  if (recordId) {
    const r = await fetchWithRetry(build([]));
    if (!r.ok) throw new Error(`Airtable HTTP ${r.status}`);
    return r.json();
  }
  let recs = [], offset;
  do {
    const r = await fetchWithRetry(build(offset ? [`offset=${encodeURIComponent(offset)}`] : []));
    if (!r.ok) throw new Error(`Airtable HTTP ${r.status}`);
    const d = await r.json();
    recs = recs.concat(d.records || []);
    offset = d.offset;
  } while (offset);
  return recs;
}
async function airtableCreate(table, fields) {
  const r = await fetchWithRetry(`${PROXY_URL}?path=${encodeURIComponent(table)}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields }),
  });
  if (!r.ok) throw new Error(`Airtable POST ${r.status}`);
  return r.json();
}
async function airtablePatch(table, recordId, fields) {
  const r = await fetchWithRetry(`${PROXY_URL}?path=${encodeURIComponent(table + "/" + recordId)}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields }),
  });
  if (!r.ok) throw new Error(`Airtable PATCH ${r.status}`);
  return r.json();
}

// ── DATA LOAD ────────────────────────────────────────────────────────────
async function fetchEligibleProjects() {
  const formula = `AND(
    {${P_STADA_SOLU}} = "🏆 Tækifæri unnið",
    {${P_STADA_SKIP}} != "For-skipulag",
    {${P_STADA_FRAM}} != "Afhent (LOKIÐ ✅)",
    {${P_STADA_FRAM}} != "Má Afhenda 🚚"
  )`;
  return airtableFetch(PROJECTS_TABLE, { filterByFormula: formula, "fields[]": [P_NAME_FIELD], pageSize: 100 });
}
async function fetchProjectById(id) { return airtableFetch(PROJECTS_TABLE, {}, id); }

async function fetchFrontsForProject(name) {
  const escd = name.replace(/"/g, '\\"');
  const formula = `FIND("${escd}", ARRAYJOIN({${S_PROJECT_LINK}})) > 0`;
  return airtableFetch(SOGUNARLISTI_TABLE, {
    filterByFormula: formula,
    "fields[]": [S_PARTUR, S_H, S_B, S_TH, S_M, S_EFNI, S_EFNI_BASE, S_EYDUBLAD, S_VILLA, S_PLANMSG],
    pageSize: 100,
  });
}
async function fetchBoards() {
  return airtableFetch(EFNISLISTI_TABLE, { "fields[]": [E_HEITI, E_BREIDD, E_LENGD, E_THYKKT, E_SUB, E_MYND], pageSize: 100 });
}
// Airtable attachment → best thumbnail URL, same extraction eining.html uses
// for its Efnislisti swatches.
function attImgUrl(field) {
  const att = (Array.isArray(field) ? field : [])[0];
  if (!att) return "";
  const t = (att.thumbnails && (att.thumbnails.large || att.thumbnails.small)) || {};
  return t.url || att.url || "";
}

// One batched query across every eligible project's Sögunarlisti, instead
// of 18 separate per-project fetches, just to answer "does this project
// have any melamine-grain front at all".
async function fetchAllFrontsAcrossProjects(names) {
  if (!names.length) return [];
  const clauses = names.map(n => `FIND("${n.replace(/"/g, '\\"')}", ARRAYJOIN({${S_PROJECT_LINK}})) > 0`);
  try {
    return await airtableFetch(SOGUNARLISTI_TABLE, {
      filterByFormula: `OR(${clauses.join(",")})`,
      "fields[]": [S_PARTUR, S_EFNI, S_EFNI_BASE, S_PROJECT_LINK],
      pageSize: 100,
    });
  } catch { return []; }
}
// A project with no melamine-grain front doesn't belong in this tool's
// picker at all — better than listing it and letting the office discover
// that only after opening it. Also bootstraps `boards` early (normally
// only loaded once a project is opened) since isMelamineGrain/materialSub
// need Efnislisti's Undirflokkur to tell Spónlagt/flat apart from melamine.
// Returns the set of project ids that have ≥1 melamine-grain front. This
// scans Sögunarlisti across every eligible project, which is genuinely a
// lot of rows (tested locally: noticeably slow even on production-shaped
// pagination) — so the caller must NOT block the picker on this. See
// populateProjects(): the dropdown is filled immediately, then narrowed in
// place once this resolves, rather than making the office stare at "Sæki
// verkefni…" for however long a full front-table scan takes.
async function filterProjectsByMelamine(recs) {
  const [brd, rows] = await Promise.all([
    fetchBoards(),
    fetchAllFrontsAcrossProjects(recs.map(r => r.fields[P_NAME_FIELD]).filter(Boolean)),
  ]);
  boards = brd.map(r => ({
    name: r.fields[E_HEITI] || "", w: num(r.fields[E_BREIDD]), l: num(r.fields[E_LENGD]), th: num(r.fields[E_THYKKT]),
    sub: r.fields[E_SUB]?.name || r.fields[E_SUB] || "",
    mynd: attImgUrl(r.fields[E_MYND]),
  }));
  _subCache.clear();

  const melamineIds = new Set();
  for (const r of rows) {
    const f = r.fields;
    const partur = f[S_PARTUR] || "";
    const efni = (f[S_EFNI] || f[S_EFNI_BASE] || "").replace(/\s*[–-]\s*$/, "").trim();
    const frontMat = FRE_RE.test(partur) || FRONT_SUBS.has(materialSub(efni));
    const isFront = (FRONT_RE.test(partur) || frontMat) && !HIDDEN_RE.test(partur);
    if (!isFront || !isMelamineGrain(efni)) continue;
    for (const link of (f[S_PROJECT_LINK] || [])) {
      const id = typeof link === "string" ? link : link?.id;
      if (id) melamineIds.add(id);
    }
  }
  return melamineIds;
}
// Look up a material's Undirflokkur by its resolved Efni: name.
const _subCache = new Map();
function materialSub(efni) {
  if (_subCache.has(efni)) return _subCache.get(efni);
  const v = _materialSub(efni);
  _subCache.set(efni, v);
  return v;
}
function _materialSub(efni) {
  const k = norm(efni);
  if (!k) return "";
  for (const b of boards) if (b.sub && norm(b.name) === k) return b.sub;
  for (const b of boards) if (b.sub && (norm(b.name).startsWith(k) || k.startsWith(norm(b.name)))) return b.sub;
  const toks = new Set(k.split(" ").filter(t => t.length > 2));
  let best = "", bestScore = 1;
  for (const b of boards) {
    if (!b.sub) continue;
    const s = norm(b.name).split(" ").filter(t => toks.has(t)).length;
    if (s > bestScore) { bestScore = s; best = b.sub; }
  }
  return best;
}
// The proxy returns linked-record fields as bare id arrays, so Sögunarlisti's
// Eyðublað link gives us ids only — fetch the units to map id → short name.
async function fetchUnitNames(name) {
  const escd = name.replace(/"/g, '\\"');
  const formula = `OR(FIND("${escd}", ARRAYJOIN({${U_PROJECT_LINK}})) > 0, FIND("${escd}", ARRAYJOIN({${U_PROJECT_LINK_OLD}})) > 0)`;
  try {
    const recs = await airtableFetch(EYDUBLAD_TABLE, { filterByFormula: formula, "fields[]": [U_NAME], pageSize: 100 });
    const map = {};
    for (const r of recs) map[r.id] = r.fields[U_NAME] || "";
    return map;
  } catch { return {}; }
}
async function fetchPlans(name) {
  const escd = name.replace(/"/g, '\\"');
  const formula = `FIND("${escd}", ARRAYJOIN({${PL_PROJECT}})) > 0`;
  try {
    return await airtableFetch(PLAN_TABLE, {
      filterByFormula: formula,
      "fields[]": [PL_EFNI, PL_JSON, PL_CONFIRM, PL_NAME],
      pageSize: 100,
    });
  } catch { return []; }   // table missing / not wired yet → behave as "no plans"
}

async function populateProjects() {
  const recs = await fetchEligibleProjects();
  recs.sort((a, b) => (a.fields[P_NAME_FIELD] || "").localeCompare(b.fields[P_NAME_FIELD] || "", "is"));
  const sel = $("projectSelect");
  sel.innerHTML = '<option value="">— Veldu verkefni —</option>';
  for (const r of recs) {
    const o = document.createElement("option");
    o.value = r.id; o.textContent = r.fields[P_NAME_FIELD] || r.id;
    o.dataset.name = r.fields[P_NAME_FIELD] || r.id;
    sel.appendChild(o);
  }
  if (!FLOOR_MODE) annotateProjectsWithPlans(recs);

  // narrow the list to melamine-grain projects a moment later, in place —
  // don't make the whole picker wait on a full Sögunarlisti scan first
  filterProjectsByMelamine(recs)
    .then(melamineIds => { for (const o of [...sel.options]) if (o.value && !melamineIds.has(o.value)) o.remove(); })
    .catch(e => console.error("melamine project filter failed, leaving the list unfiltered", e));
}
// one query: mark projects that already have an Æðaplan so the office sees at a
// glance which have a draft to finish vs a confirmed plan (no new field needed)
async function annotateProjectsWithPlans(recs) {
  const names = recs.map(r => r.fields[P_NAME_FIELD]).filter(Boolean);
  if (!names.length) return;
  const clauses = names.map(n => `FIND("${n.replace(/"/g, '\\"')}", ARRAYJOIN({${PL_PROJECT}})) > 0`);
  let plans;
  try {
    plans = await airtableFetch(PLAN_TABLE, {
      filterByFormula: `OR(${clauses.join(",")})`,
      "fields[]": [PL_PROJECT, PL_CONFIRM], pageSize: 100,
    });
  } catch { return; }
  const byProj = {};
  for (const p of plans) {
    const raw = (p.fields[PL_PROJECT] || [])[0];
    const id = typeof raw === "string" ? raw : raw?.id;
    if (id) (byProj[id] = byProj[id] || []).push(p);
  }
  for (const o of $("projectSelect").options) {
    const ps = byProj[o.value];
    if (!ps) continue;
    o.textContent += ps.every(p => p.fields[PL_CONFIRM]) ? "   ✅ skipulag" : "   ✏️ drög";
  }
}

async function loadProject(id) {
  currentProjectId = id;
  $("searchCard").classList.add("hidden");
  $("projectCard").classList.remove("hidden");
  $("materialCard").classList.add("hidden");
  $("workspaceCard").classList.add("hidden");
  $("projectStatus").textContent = FLOOR_MODE ? "Sæki staðfest skipulag…" : "Sæki Sögunarlista…";

  try {
    let name = document.querySelector(`#projectSelect option[value="${id}"]`)?.dataset.name;
    if (!name) name = (await fetchProjectById(id)).fields?.[P_NAME_FIELD] || "";
    projectName = name;
    $("projectName").textContent = name || id;
    $("projectName").title = name || id;   // full text on hover — the header row can ellipsis it

    if (FLOOR_MODE) { await loadFloorPlans(name); return; }

    const [rows, brd, plans, unitNames] = await Promise.all([
      fetchFrontsForProject(name), fetchBoards(), fetchPlans(name), fetchUnitNames(name),
    ]);
    projectPlans = plans;
    boards = brd.map(r => ({
      name: r.fields[E_HEITI] || "", w: num(r.fields[E_BREIDD]), l: num(r.fields[E_LENGD]), th: num(r.fields[E_THYKKT]),
      sub: r.fields[E_SUB]?.name || r.fields[E_SUB] || "",
      mynd: attImgUrl(r.fields[E_MYND]),
    }));
    _subCache.clear();

    const parsed = rows.map(r => {
      const f = r.fields;
      const efni = (f[S_EFNI] || f[S_EFNI_BASE] || "").replace(/\s*[–-]\s*$/, "").trim();
      const uid = (f[S_EYDUBLAD] || [])[0];              // proxy returns bare id string
      const id = typeof uid === "string" ? uid : uid?.id;
      const partur = f[S_PARTUR] || "";
      // Front material = FRE/FRE2 in the Partur, OR a recognised front word,
      // OR the resolved material's Undirflokkur is Frontaefni/Spónlagt/Hurð.
      const frontMat = FRE_RE.test(partur) || FRONT_SUBS.has(materialSub(efni));
      return {
        id: r.id, partur,
        h: num(f[S_H]), b: num(f[S_B]), th: num(f[S_TH]), m: Math.max(1, num(f[S_M]) || 1),
        efni, frontMat,
        unitId: id || "?",
        unitName: (id && unitNames[id]) || (typeof uid === "object" ? uid?.name : "") || "óþekkt eining",
        err: !!f[S_VILLA],
        planMsg: (f[S_PLANMSG] || "").trim(),
      };
    });
    const isFront = p => (FRONT_RE.test(p.partur) || p.frontMat) && !HIDDEN_RE.test(p.partur);
    allFronts = parsed.filter(p => isFront(p) && p.h > 0 && p.b > 0);
    // front-material rows (or explicit "frontur") that got dropped — usually missing dims
    skippedFronts = parsed.filter(p => !allFronts.includes(p) && !HIDDEN_RE.test(p.partur) &&
      (p.frontMat || /\bfrontur\b/i.test(p.partur))).map(p => ({
        ...p,
        reason: (p.h <= 0 || p.b <= 0) ? "vantar H eða B" : "annað",
      }));

    if (!allFronts.length) {
      $("projectStatus").textContent = "Engir frontar fundust í Sögunarlista fyrir þetta verkefni.";
      renderSkipped(); renderPlanMsgs();
      return;
    }
    $("projectStatus").textContent = `${allFronts.length} frontalínur fundnar.`;
    renderSkipped(); renderPlanMsgs();
    buildMaterials();
  } catch (e) {
    $("projectStatus").textContent = "Villa við að sækja gögn: " + e.message;
  }
}

// This tool is for melamine décor-print grain matching only. Real veneer
// (Spónlagt) needs book-matching this planner doesn't do (a carpenter
// handles that by hand), and flat/solid colours have no grain to match at
// all — both are out of scope, not just de-prioritised, so materials.html
// filters them out of the picker entirely rather than listing them.
// Décor codes: "U####" = Uni (solid colour), "H####" = Holz (woodgrain).
// The species keyword list is a backup for names without a code.
function isMelamineGrain(name) {
  if (materialSub(name) === "Spónlagt") return false;  // real veneer — out of scope for this tool
  if (/\bH\s?\d{3,4}\b/i.test(name)) return true;
  if (/\bU\s?\d{3,4}\b/i.test(name)) return false;
  return GRAIN_RE.test(name);
}

function renderSkipped() {
  const el = $("skippedCard");
  if (FLOOR_MODE || !skippedFronts.length) { el.innerHTML = ""; return; }
  const rows = skippedFronts.map(p =>
    `<li><b>${esc(p.unitName)}</b> — ${esc(p.partur || "(engin Partur)")} ${p.h}×${p.b} · <span style="color:#f5c518">${p.reason}</span></li>`
  ).join("");
  el.innerHTML = `<div class="card" style="border-color:#5a4a22;background:#211c12;">
    <label style="color:#f5c518;">⚠ ${skippedFronts.length} lína${skippedFronts.length > 1 ? "r" : ""} úr Sögunarlista sem líta út eins og frontar en komust ekki með</label>
    <ul style="font-size:0.82rem;color:#ddd;padding-left:20px;margin-top:6px;">${rows}</ul>
    <div class="hint">Lagaðu í Airtable (mál eða Partur) og opnaðu aftur, eða bættu þeim við handvirkt ef þeir eiga heima hér.</div>
  </div>`;
}

// notes on individual fronts (from the floor's "⚠ vandamál" flag, or written
// straight into Sögunarlisti) — shown to the office so the loop closes
// Collapsed by default (<details>, not a full card) — this is a to-do/FYI
// list, not an urgent warning, so it shouldn't cost screen space when empty
// of the reader's attention.
function renderPlanMsgs() {
  const el = $("planMsgCard");
  if (FLOOR_MODE) { el.innerHTML = ""; return; }
  const seen = new Map();
  for (const p of [...allFronts, ...skippedFronts]) if (p.planMsg && !seen.has(p.id)) seen.set(p.id, p);
  const list = [...seen.values()];
  if (!list.length) { el.innerHTML = ""; return; }
  const rows = list.map(p =>
    `<li><b>${esc(p.unitName)}</b> — ${esc(p.partur || "?")}: <span style="color:#8fbaff;white-space:pre-wrap;">${esc(p.planMsg)}</span></li>`
  ).join("");
  el.innerHTML = `<details class="msg-drop">
    <summary>💬 ${list.length} skilaboð um fronta</summary>
    <ul style="font-size:0.82rem;color:#ddd;padding-left:20px;margin-top:8px;">${rows}</ul>
    <div class="hint">Lagaðu í Airtable/Sögunarlista og hreinsaðu „Skilaboð til skipulags" þegar búið er að leysa.</div>
  </details>`;
}

function buildMaterials() {
  const map = new Map();
  for (const p of allFronts) {
    const key = `${p.efni}||${p.th}`;
    if (!map.has(key)) map.set(key, { key, efni: p.efni, th: p.th, pieces: 0, area: 0 });
    const m = map.get(key);
    m.pieces += p.m;
    m.area += (p.h * p.b * p.m) / 1e6;
  }
  // Only melamine décor-print materials belong in this tool (see
  // isMelamineGrain) — nothing else is ever offered, so there's no picker
  // step: go straight to the largest one, with a switcher in the header pill
  // for the rare project that has more than one.
  materials = [...map.values()].filter(m => isMelamineGrain(m.efni)).sort((a, b) => b.area - a.area);

  if (!materials.length) {
    $("projectStatus").textContent = "Ekkert æðaefni (melamín viðarmynstur) fannst í þessu verkefni — notaðu Cutty.";
    $("matSwitcher").classList.add("hidden");
    return;
  }

  // Confirmed/draft status shows as the ✏️/✅ badge in the header pill
  // (renderHeaderPill) — no separate "N af M óskipulögð" banner needed.
  selectMaterial(materials[0].key);   // straight to planning — no "pick a material" step
}

// Project name + active material (photo, name, plan status) + a switcher if
// the project has more than one æðaefni — replaces the old separate "veldu
// efni til að skipuleggja" picker screen entirely.
function renderHeaderPill() {
  const wrap = $("matSwitcher");
  const cur = materials.find(m => m.key === selectedKey);
  if (!cur) { wrap.classList.add("hidden"); return; }

  const bd = matchBoard(cur.efni, cur.th);
  const img = $("matPhoto"), swatch = $("matSwatch");
  if (bd?.mynd) { img.src = bd.mynd; img.classList.remove("hidden"); swatch.classList.add("hidden"); }
  else { img.classList.add("hidden"); swatch.classList.remove("hidden"); }

  $("matName").textContent = `${cur.efni || "(ónefnt efni)"} · ${cur.th} mm`;
  $("matName").title = cur.efni || "";
  const plan = projectPlans.find(p => p.fields[PL_EFNI] === cur.key);
  $("matBadge").innerHTML = plan
    ? (plan.fields[PL_CONFIRM] ? `✅ staðfest skipulag` : `✏️ drög`)
    : `óskipulagt`;
  $("matBadge").style.color = plan ? (plan.fields[PL_CONFIRM] ? "#4caf50" : "#f5c518") : "#d5d5d5";

  const sel = $("matSelect");
  if (materials.length > 1) {
    sel.innerHTML = materials.map(m =>
      `<option value="${esc(m.key)}" ${m.key === cur.key ? "selected" : ""}>${esc(m.efni)} · ${m.th} mm</option>`
    ).join("");
    sel.classList.remove("hidden");
  } else {
    sel.classList.add("hidden");
  }
  wrap.classList.remove("hidden");
}

// ── PLAN (Æðaplan) — office builds & confirms, floor runs it ──────────────
function serializePlan() {
  return JSON.stringify({
    v: PLAN_SCHEMA, key: selectedKey,
    board: { ...board },
    settings: { kerf: settings.kerf, trim: settings.trim, grid: settings.grid },
    groups: groups.map(g => ({
      id: g.id, unitName: g.unitName, width: g.width, orient: g.orient,
      keepTogether: !!g.keepTogether, autoSplit: !!g.autoSplit, kind: g.kind || "",
      locked: !!g.locked,
      fronts: g.fronts.map(f => ({
        pieceId: f.pieceId, uid: f.uid, label: f.label, h: f.h, code: f.code || "", err: !!f.err,
        manual: !!f.manual, mfId: f.mfId,
      })),
    })),
    layout: { boards: layout.boards.map(b => ({ placements: { ...b.placements }, done: !!b.done })) },
  });
}
let loadingPlan = false;
function applyPlan(obj) {
  loadingPlan = true;
  try {
    board = { w: 2070, l: 2800, name: "", ...obj.board };
    settings.kerf = obj.settings?.kerf ?? settings.kerf;
    settings.trim = obj.settings?.trim ?? settings.trim;
    settings.grid = obj.settings?.grid ?? settings.grid;
    groups = (obj.groups || []).map(g => ({ ...g, fronts: g.fronts.map(f => ({ ...f })) }));
    // Plans saved before `uid` existed have real fronts with neither uid nor
    // mfId — frontId() would return undefined for all of them alike, which
    // is exactly the collision this field exists to prevent. Backfill once
    // on load so every front has a permanent, unique identity from here on;
    // serializePlan() now carries uid through, so this only ever fires once
    // per plan (the next save has it for good).
    let legacyN = 0;
    for (const g of groups) for (const f of g.fronts) if (!f.uid && !f.mfId) f.uid = `legacy~${legacyN++}~${Math.random().toString(36).slice(2, 8)}`;
    layout = { boards: (obj.layout?.boards || [{ placements: {} }]).map(b => ({ placements: { ...b.placements }, done: !!b.done })) };
    rebuildManualIndex();          // from the plan groups + this device's local additions
    mergeManualFronts();           // pull in any local ones the plan doesn't have
    reconcileLayout();
  } finally { loadingPlan = false; }
}

function schedulePlanSave() {
  if (loadingPlan || FLOOR_MODE || !currentProjectId || !selectedKey) return;
  if (curPlan?.confirmed) { curPlan.confirmed = false; renderPlanStrip(); }  // any edit un-confirms
  clearTimeout(planSaveTimer);
  planSaveTimer = setTimeout(() => savePlan(false), 1400);
}
async function savePlan(confirm) {
  if (FLOOR_MODE || !currentProjectId || !selectedKey) return;
  clearTimeout(planSaveTimer);
  const mat = materials.find(m => m.key === selectedKey);
  const nafn = `${projectName.split("|")[0].trim()} · ${mat?.efni || selectedKey}`;
  const fields = { [PL_NAME]: nafn, [PL_JSON]: serializePlan(), [PL_CONFIRM]: !!confirm };
  try {
    if (curPlan?.recordId) {
      await airtablePatch(PLAN_TABLE, curPlan.recordId, fields);
    } else {
      const rec = await airtableCreate(PLAN_TABLE, { ...fields, [PL_PROJECT]: [currentProjectId], [PL_EFNI]: selectedKey });
      curPlan = { recordId: rec.id, confirmed: !!confirm, sourceJSON: fields[PL_JSON] };
    }
    curPlan.confirmed = !!confirm;
    if (confirm) { curPlan.sourceJSON = fields[PL_JSON]; curPlan.confirmedJSON = fields[PL_JSON]; }
    clearSaveError();
    renderPlanStrip();
  } catch (e) {
    showSaveError(confirm);
  }
}
let planSaveFailed = false;
function showSaveError(wasConfirm) {
  planSaveFailed = true;
  let d = $("saveErrBanner");
  if (!d) { d = document.createElement("div"); d.id = "saveErrBanner"; d.className = "banner no-print"; document.body.appendChild(d); }
  d.style.background = "#c62828";
  d.innerHTML = `⚠ Vistun mistókst — skipulagið er <b>ekki vistað</b> í Airtable. <button onclick="retrySave(${wasConfirm ? "true" : "false"})">Reyna aftur</button>`;
}
function clearSaveError() {
  planSaveFailed = false;
  $("saveErrBanner")?.remove();
}
function retrySave(wasConfirm) { savePlan(!!wasConfirm); }
function confirmPlan() {
  if (planSaveFailed) {
    alert("Síðasta vistun mistókst — skipulagið er ekki vistað. Athugaðu nettengingu og ýttu á Reyna aftur (rauða stikan neðst) áður en þú staðfestir.");
    return;
  }
  const unplaced = unplacedGroups();
  if (unplaced.length) {
    alert(`${unplacedFrontCount()} frontar eru ekki á neinni plötu (${unplaced.map(g => g.unitName).join(", ")}).\n\nRaðaðu þeim inn á plötu áður en þú staðfestir — annars verða þeir ekki sagaðir.`);
    return;
  }
  const overlaps = detectOverlaps();
  if (overlaps.length) {
    alert(`Hópar skarast: ${overlaps.join(", ")}.\n\nLagaðu skörunina áður en þú staðfestir — gólfið getur ekki sagað skarandi hópa.`);
    return;
  }
  if (anyOverflow() &&
      !confirm("Sumir hópar fara aðeins út fyrir snyrtilínuna. Á melamíni er það oftast í lagi (kanturinn er ósnyrtur hvort sem er). Staðfesta samt?"))
    return;
  savePlan(true).then(() => renderPlanStrip());
}
function anyOverflow() {
  return groups.some(g => groupWidth(g) > board.w - 2 * settings.trim + 0.5 || groupLen(g) > board.l - settings.trim + 0.5);
}

function renderPlanStrip() {
  const el = $("planStrip");
  if (!selectedKey) { el.innerHTML = ""; return; }
  if (FLOOR_MODE) {
    el.innerHTML = `<div class="plan-bar floor">
      <span>📐 <b>Staðfest skipulag skrifstofu.</b> <span class="muted">Breytingar þínar eru bara á þessu tæki.</span></span>
      <span class="spacer"></span>
      <button class="ghost small" onclick="reloadConfirmedPlan()">↺ Sækja staðfest skipulag aftur</button>
      <button class="primary" onclick="openGuide()">▶ Byrja sögun</button>
    </div>`;
    return;
  }
  const confirmed = !!curPlan?.confirmed;
  const drifted = !confirmed && !!curPlan?.confirmedJSON;   // was confirmed, then edited
  let cls, msg;
  if (confirmed) { cls = "confirmed"; msg = "✅ <b>Staðfest</b> — gólfið getur sótt þetta á /saga"; }
  else if (drifted) { cls = "draft"; msg = "⚠ <b>Óstaðfestar breytingar</b> — gólfið er enn með fyrri staðfestu útgáfu. Ýttu á ✅ Staðfesta skipulag þegar þú ert búin/n."; }
  else { cls = "draft"; msg = '✏️ <b style="color:#f5c518">Drög</b> — óstaðfest'; }
  el.innerHTML = `<div class="plan-bar ${cls}">
    <span>${msg}</span>
    <span class="spacer"></span>
    ${confirmed && curPlan?.recordId ? `<button class="ghost small" onclick="copyFloorLink()">🔗 Afrita hlekk fyrir gólfið</button>` : ""}
    ${curPlan?.recordId ? '<span class="muted">vistað sjálfkrafa</span>' : '<span class="muted">óvistað</span>'}
  </div>`;
  const btn = $("confirmBtn");
  if (btn) {
    btn.textContent = confirmed ? "✅ Staðfest" : drifted ? "✅ Staðfesta breytingar" : "✅ Staðfesta skipulag";
    btn.disabled = confirmed;
  }
}
function copyFloorLink() {
  const url = `${location.origin}/saga?recordId=${currentProjectId}`;
  const done = () => toast("Hlekkur afritaður — sendu gólfinu");
  const fail = () => { try { prompt("Afritaðu hlekkinn fyrir gólfið:", url); } catch { toast(url); } };
  try {
    const p = navigator.clipboard && navigator.clipboard.writeText(url);
    if (p && p.then) p.then(done, fail); else fail();
  } catch { fail(); }
}
function toast(msg) {
  let t = $("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

// ── FLAG A PROBLEM FRONT ─────────────────────────────────────────────────
// Writes a part-level note to Sögunarlisti's existing "Skilaboð til skipulags"
// (rolls up to the project for the planners). No new Airtable field.
const _flaggedPieces = new Set();
async function flagPiece(pieceId, label, unitName) {
  if (!pieceId) { toast("Handvirkur front — engin Sögunarlista lína til að merkja."); return; }
  const msg = (prompt(`Skilaboð til skrifstofu um „${label}" (${unitName}) — t.d. passar ekki, rangt mál, æð vitlaus:`, "") || "").trim();
  if (msg === "" && !confirm("Tómt — fjarlægja fyrri skilaboð frá gólfi?")) return;
  const who = FLOOR_MODE ? "gólf" : "skipulag";
  try {
    let existing = "";
    try { existing = ((await airtableFetch(SOGUNARLISTI_TABLE, {}, pieceId)).fields?.[S_PLANMSG] || "").trim(); } catch {}
    existing = existing.split("\n").filter(l => !l.startsWith(`[${who} `)).join("\n").trim();
    const stamped = msg ? (existing ? existing + "\n" : "") + `[${who} ${new Date().toLocaleDateString("is-IS")}] ${msg}` : existing;
    await airtablePatch(SOGUNARLISTI_TABLE, pieceId, { [S_PLANMSG]: stamped });
    if (msg) _flaggedPieces.add(pieceId); else _flaggedPieces.delete(pieceId);
    toast(msg ? "Sent til skrifstofu ✓" : "Skilaboð fjarlægð");
    if (guide) renderGuide(); else render();
  } catch { toast("Sending mistókst — reyndu aftur"); }
}
function flagFront(gid, fi) {
  const g = groups.find(x => x.id === gid);
  const f = g && g.fronts[fi];
  if (f) flagPiece(f.pieceId, f.label, g.unitName);
}

// ── LABEL PRINTING (real Sögunarlisti pieces only — manual fronts have no
// row to flag, so they never get a print button in the first place) ───────
// Reuses labels.html's exact mechanism, not a new one: check B.A.S. on the
// piece's row, then poll for the shop's print-server.js to notice (it polls
// Airtable every 5s), print one physical label straight from that row's own
// standard fields, and uncheck B.A.S. Nothing server-side needs to change —
// print-server.js doesn't care what set the flag. A row with Magn > 1 needs
// one full cycle per physical copy; print-server tracks that count itself
// (local counts.json) and reports Lokið once the last copy is done.
const _printedPieces = new Set();   // pieceIds confirmed Lokið this session
let _printing = false;
async function printOneCycle(pieceId) {
  const POLL_MS = 500, TIMEOUT_MS = 20000;
  await airtablePatch(SOGUNARLISTI_TABLE, pieceId, { [S_BAS]: true });
  const start = Date.now();
  while (Date.now() - start < TIMEOUT_MS) {
    await new Promise(r => setTimeout(r, POLL_MS));
    const rec = await airtableFetch(SOGUNARLISTI_TABLE, {}, pieceId);
    if (rec.fields?.[S_LOKID]) return { lokid: true };
    if (!rec.fields?.[S_BAS]) return { lokid: false };   // one copy printed, more may remain
  }
  // Timed out — print-server likely isn't running. Clear the flag ourselves
  // so it isn't sitting checked, ready to fire a surprise print later once
  // the shop PC comes back online.
  await airtablePatch(SOGUNARLISTI_TABLE, pieceId, { [S_BAS]: false }).catch(() => {});
  throw new Error("Prentþjónn svarar ekki — er hann í gangi á gólfstölvunni?");
}
async function printPieceLabel(pieceId, label) {
  if (!pieceId || _printing) { if (_printing) toast("Bíddu — annar miði er að prenta"); return; }
  _printing = true; if (guide) renderGuide();
  try {
    const r = await printOneCycle(pieceId);
    if (r.lokid) { _printedPieces.add(pieceId); toast(`✅ Allir miðar prentaðir — ${label}`); }
    else toast(`🖨 Miði prentaður — ${label}`);
  } catch (e) { toast(e.message || "Prentun mistókst"); }
  finally { _printing = false; if (guide) renderGuide(); }
}
async function printBoardLabels(bi) {
  if (!guide || _printing) { if (_printing) toast("Bíddu — annar miði er að prenta"); return; }
  const pieces = guide.steps.filter(s => s.bi === bi).flatMap(s => s.produces || [])
    .filter(p => p.pieceId && !_printedPieces.has(p.pieceId));
  if (!pieces.length) { toast("Ekkert eftir að prenta á þessari plötu"); return; }
  _printing = true; renderGuide();
  let ok = 0, failed = false;
  for (const p of pieces) {
    try { const r = await printOneCycle(p.pieceId); if (r.lokid) _printedPieces.add(p.pieceId); ok++; }
    catch { failed = true; break; }   // stop on the first failure, same as labels.html's printGroup
  }
  _printing = false; renderGuide();
  toast(failed ? `🖨 ${ok} prentaðir, villa á eftir — reyndu aftur` : `✅ ${ok} miðar prentaðir`);
}

// ── FLOOR MODE (/saga) ───────────────────────────────────────────────────
async function loadFloorPlans(name) {

  // layout first; they start the steps with the "▶ Byrja sögun" button.
}
function reloadConfirmedPlan() {

  manualFronts = [];
  applyPlan(JSON.parse(curPlan.sourceJSON));
  syncToolbarInputs();

}
function syncToolbarInputs() {
  $("boardW").value = board.w; $("boardL").value = board.l;
  $("kerf").value = settings.kerf; $("trim").value = settings.trim; $("grid").value = settings.grid;
  $("boardSize").value = settings.boardPx;

}

// On-screen board width — each device sets its own, persisted in settings.
function applyBoardSize() {
  document.documentElement.style.setProperty("--board-w", (settings.boardPx || DEFAULTS.boardPx) + "px");
}
let boardSizeSaveT = null;
$("boardSize").addEventListener("input", e => {
  settings.boardPx = +e.target.value || DEFAULTS.boardPx;
  applyBoardSize();
  clearTimeout(boardSizeSaveT);
  boardSizeSaveT = setTimeout(saveSettings, 400);

// Dragging a board's own corner handle updates the shared size too.
const boardRO = new ResizeObserver(entries => {
  let changed = 0;
  for (const e of entries) {
    const w = Math.round(e.contentRect.width);
    if (w && Math.abs(w - (settings.boardPx || 0)) >= 6) changed = w;
  }
  if (!changed) return;
  settings.boardPx = Math.max(320, Math.min(changed, 1500));
  $("boardSize").value = settings.boardPx;
  document.documentElement.style.setProperty("--board-w", settings.boardPx + "px");
  clearTimeout(boardSizeSaveT);
  boardSizeSaveT = setTimeout(saveSettings, 400);
});

// ── GROUPING ─────────────────────────────────────────────────────────────
function selectMaterial(key) {
  selectedKey = key;
  resetHistory();
  document.querySelectorAll(".mat-item").forEach(el => el.classList.toggle("active", el.dataset.key === key));
  const mat = materials.find(m => m.key === key);

  const planRec = projectPlans.find(p => p.fields[PL_EFNI] === key);
  curPlan = planRec ? {
    recordId: planRec.id, confirmed: !!planRec.fields[PL_CONFIRM], sourceJSON: planRec.fields[PL_JSON],
    confirmedJSON: planRec.fields[PL_CONFIRM] ? planRec.fields[PL_JSON] : null,   // what the floor currently has
  } : null;

  // match a board for dimensions
  const bd = matchBoard(mat.efni, mat.th);
  const stored = loadStoredLayout();
  if (stored?.board) {
    board = stored.board;
  } else if (bd) {
    board = { w: bd.w, l: bd.l, name: bd.name };
  } else {
    board = { w: 2070, l: 2800, name: "" };
  }
  $("matchNote").innerHTML = bd
    ? `Plata fundin: <b>${esc(bd.name)}</b> (${bd.w}×${bd.l}×${bd.th} mm). Breyttu að ofan ef rangt.`
    : `⚠ Engin plata fannst fyrir "${esc(mat.efni)}" ${mat.th} mm í Efnislista — sláðu inn plötustærð að ofan.`;

  manualFronts = loadManual();
  buildGroups();
  const freshGroups = groups;   // built from current Sögunarlisti, incl. any new fronts

  loadingPlan = true;
  try {
    if (stored?.layout && stored.layout.boards?.length) {
      // this device's own in-progress edits win over the saved plan
      layout = stored.layout;
      reconcileLayout();
    } else if (planRec && planRec.fields[PL_JSON]) {
      try { applyPlan(JSON.parse(planRec.fields[PL_JSON])); }
      catch { autoNest(); }
    } else {
      autoNest();
    }
  } finally { loadingPlan = false; }

  checkNewFronts(freshGroups);
  syncToolbarInputs();
  renderPlanStrip();
  renderHeaderPill();
  $("workspaceCard").classList.remove("hidden");
  render();
  resetHistory(); pushHistory();   // baseline = the layout as first shown
}

// After loading a saved plan, warn if Sögunarlisti now has fronts the plan
// doesn't — offer to fold them in rather than silently miss them.
let pendingNewFronts = [];
function checkNewFronts(freshGroups) {
  const inPlan = new Set(groups.flatMap(g => g.fronts.map(f => f.pieceId).filter(Boolean)));
  pendingNewFronts = [];
  for (const fg of freshGroups) {
    const missing = fg.fronts.filter(f => f.pieceId && !inPlan.has(f.pieceId));
    if (missing.length) pendingNewFronts.push({ ...fg, fronts: missing });
  }
  const el = $("skippedCard");
  el.querySelector("#newFrontsCard")?.remove();
  if (!pendingNewFronts.length) return;
  const n = pendingNewFronts.reduce((s, g) => s + g.fronts.length, 0);
  const lis = pendingNewFronts.map(g => {
    const names = g.fronts.map(f => esc(f.label) + " " + f.h).join(", ");
    return "<li><b>" + esc(g.unitName) + "</b> — " + names + "</li>";
  }).join("");
  el.insertAdjacentHTML("beforeend", `<div class="card" id="newFrontsCard" style="border-color:#2f5a8c;background:#101a26;">
    <label style="color:#8fbaff;">🆕 ${n} nýir frontar í Sögunarlista sem eru ekki í þessu skipulagi</label>
    <ul style="font-size:0.82rem;color:#ddd;padding-left:20px;margin-top:6px;">${lis}</ul>
    <button class="primary small" onclick="addNewFronts()">Bæta þeim við skipulagið</button>
  </div>`);
}
function addNewFronts() {
  for (const ng of pendingNewFronts) {
    const existing = groups.find(g => g.id === ng.id);
    if (existing && !existing.locked) existing.fronts.push(...ng.fronts.map(f => ({ ...f })));
    // its natural group is locked — land as its own run instead of silently
    // dropping it or breaking the lock
    else groups.push({ ...ng, id: existing ? `${ng.id}~${Date.now()}` : ng.id, fronts: ng.fronts.map(f => ({ ...f })) });
  }
  pendingNewFronts = [];
  let b = [...layout.boards].reverse().find(x => !x.done);   // never drop new fronts onto a hidden locked sheet
  if (!b) { layout.boards.push({ placements: {} }); b = layout.boards[layout.boards.length - 1]; }
  for (const g of groups) if (!layout.boards.some(bd => g.id in bd.placements)) {
    b.placements[g.id] = { x: settings.trim, y: settings.trim };
  }
  settleAll(); renderSkipped(); render(); saveLayout();
  toast("Nýju frontarnir bættust við — raðaðu þeim inn.");
}

function matchBoard(efni, th) {
  const key = norm(efni);
  const cand = boards.filter(b => b.th === th && b.w > 0 && b.l > 0 &&
    (norm(b.name).includes(key) || key.includes(norm(b.name))) && norm(b.name).length > 4);
  if (cand.length === 1) return cand[0];
  if (cand.length > 1) {
    // longest name overlap wins
    cand.sort((a, b) => norm(b.name).length - norm(a.name).length);
    return cand[0];
  }
  // loosen: token overlap
  const toks = new Set(key.split(" ").filter(t => t.length > 2));
  let best = null, bestScore = 0;
  for (const b of boards) {
    if (b.th !== th || !b.w || !b.l) continue;
    const bt = norm(b.name).split(" ");
    const score = bt.filter(t => toks.has(t)).length;
    if (score > bestScore) { bestScore = score; best = b; }
  }
  return bestScore >= 2 ? best : null;
}

function buildGroups() {
  const mat = materials.find(m => m.key === selectedKey);
  const rows = allFronts.filter(p => `${p.efni}||${p.th}` === selectedKey);

  // group by unit + rounded width — a grain run is a strip of same-width fronts
  const map = new Map();
  const drawerBuckets = new Map();   // base key -> [group, group, ...] for later "· N" labeling
  for (const p of rows) {
    const baseKey = `${p.unitId}|${Math.round(p.b)}`;
    const sbs = SIDEBYSIDE_RE.test(p.partur);
    const keep = KEEPTOGETHER_RE.test(p.partur);
    const drw = DRAWER_RE.test(p.partur);
    for (let i = 0; i < p.m; i++) {
      // A drawer front row's Magn (M) is an AGGREGATE count — Sögunarlisti
      // doesn't say which physical duplicate cabinet (Fjöldi eininga >= 2)
      // each copy belongs to. Merging every copy of every drawer height in
      // this unit+width into one run was wrong: it interleaved two whole
      // cabinets' drawer banks (e.g. M,M,K,K,E,E) instead of keeping each
      // cabinet's own 3-front stack together, breaking grain continuity
      // within a single installed drawer bank. Fix: key drawer rows by
      // their copy index `i` too, so copy #0 of every drawer-height row in
      // this unit+width becomes its own group, copy #1 becomes a separate
      // group, etc. — pairing "the i-th copy of each height" is always a
      // physically valid reconstruction since same-height copies are
      // interchangeable, and it naturally degrades to one lone-front group
      // for any row whose Magn is short relative to the others (see
      // buildGroups' comment block below for the mismatched-Magn case).
      // Plain (non-drawer) fronts are untouched — they keep the original
      // shared-width grouping, where M > 1 just means "N identical copies
      // of this one front," not "N different drawer positions."
      const gk = drw ? `${baseKey}|${i}` : baseKey;
      if (!map.has(gk)) {
        const g = {
          id: gk, unitName: p.unitName, width: Math.round(p.b),
          orient: sbs ? "s" : "v", keepTogether: keep || drw, kind: sbs ? "væng" : keep ? "skiptur" : drw ? "skúffur" : "", fronts: [],
        };
        map.set(gk, g);
        if (drw) (drawerBuckets.get(baseKey) || drawerBuckets.set(baseKey, []).get(baseKey)).push(g);
      }
      const g = map.get(gk);
      if (sbs) { g.orient = "s"; g.kind = "væng"; }
      else if (keep && !g.kind) g.kind = "skiptur";
      else if (drw && !g.kind) g.kind = "skúffur";
      if (keep || drw) g.keepTogether = true;
      g.fronts.push({
        pieceId: p.id,
        // pieceId is the Sögunarlisti ROW's id — every physical copy from a
        // row with magn/m > 1 shares it, so it's not unique per front. uid
        // is: distinct per individual instance, permanent for this front's
        // whole life (buildGroups() is the only place that creates it), and
        // is what any future split must key its id off — see frontId().
        uid: `${p.id}~${i}`,
        label: p.partur.replace(/\s*-\s*Merivo.*/i, "").replace(/\s*Skrokkaefni.*/i, "").trim() || p.partur,
        h: Math.round(p.h),
        code: (p.partur.match(/\b([NMKCDFE])\b/) || [])[1] || "",
        err: p.err,
        planMsg: p.planMsg || "",
      });
    }
  }
  // Label a multi-cabinet drawer bank's separate groups "· 1", "· 2", … so
  // the panel can tell them apart — a single cabinet (only one group came
  // out of that unit+width) keeps its plain unit name, no added noise.
  for (const list of drawerBuckets.values()) {
    if (list.length > 1) list.forEach((g, i) => { g.unitName += " · " + (i + 1); });
  }
  groups = [...map.values()];
  // Default order within a group: smallest front at the top, biggest at the
  // bottom, shrinking as you go up — by the front's own measured height.
  // Was code-rank-first with a *descending*-height tiebreak, which put the
  // tallest front on top whenever two fronts shared a code (or neither had
  // one) — backwards from the "smallest on top" rule, and the common case
  // for any Skúffufrontur row without an embedded Blum code letter. Height
  // is what a sawyer actually measures, so it's the primary key now; code
  // rank only breaks a genuine tie between two equal-height fronts.
  for (const g of groups) {
    g.fronts.sort((a, b) => {
      if (a.h !== b.h) return a.h - b.h;
      const ra = a.code in CODE_RANK ? CODE_RANK[a.code] : 99;
      const rb = b.code in CODE_RANK ? CODE_RANK[b.code] : 99;
      return ra - rb;
    });
  }
  mergeManualFronts();   // fold in any hand-added fronts (survives "Núllstilla röðun")
  normalizeGroups();
  groups.sort((a, b) => groupLen(b) - groupLen(a));
}

// ── HAND-ADDED FRONTS (plan-only, never written to Sögunarlisti) ─────────
function manualKey() { return `grain:manual:${currentProjectId}:${selectedKey}`; }
function loadManual() {
  try { return JSON.parse(localStorage.getItem(manualKey()) || "[]"); } catch { return []; }
}
// Recompute the manualFronts list from whatever is currently in `groups`
// (positions/groups may have changed via drag), and persist it. Called from
// saveLayout so it stays current after every structural edit.
function syncManualIndex() {
  const out = [];
  for (const g of groups) for (const f of g.fronts) if (f.manual && f.mfId)
    out.push({ id: f.mfId, groupId: g.id, unitName: g.unitName, w: g.width, orient: g.orient, label: f.label, h: f.h });
  manualFronts = out;
  try {
    if (currentProjectId && selectedKey) localStorage.setItem(manualKey(), JSON.stringify(out));
  } catch {}
}
// On load: seed manualFronts from the plan groups + this device's saved list.
function rebuildManualIndex() {
  const byId = new Map();
  for (const mf of loadManual()) if (mf.id) byId.set(mf.id, mf);
  for (const g of groups) for (const f of g.fronts) if (f.manual && f.mfId)
    byId.set(f.mfId, { id: f.mfId, groupId: g.id, unitName: g.unitName, w: g.width, orient: g.orient, label: f.label, h: f.h });
  manualFronts = [...byId.values()];
}
// Fold any manualFronts entry not already present into `groups`.
function mergeManualFronts() {
  for (const mf of manualFronts) {
    if (groups.some(g => g.fronts.some(f => f.mfId === mf.id))) continue;
    let g = groups.find(x => x.id === mf.groupId);
    if (!g) {
      g = { id: mf.groupId, unitName: mf.unitName || "Handvirkt", width: mf.w, orient: mf.orient || "v", fronts: [] };
      groups.push(g);
    }
    g.fronts.push({ pieceId: null, label: mf.label || "Nýr front", h: mf.h, code: "", err: false, manual: true, mfId: mf.id });
  }
}
function newMfId() { return "mf" + Math.random().toString(36).slice(2, 9); }
// A front's own permanent identity — its Sögunarlisti record id, or its
// manual-front id. Every place that splits a group into single-front groups
// must key the new id off THIS, never off the front's position in the
// array: that position isn't stable once a group can be split more than
// once (autoNest() can split the same "leftover" group again on a second
// run), and two different fronts landing on the same array index produce
// the same group id — which silently drops one of them, since
// layout.boards[*].placements is a plain object keyed by id and the second
// write just overwrites the first. Confirmed on a real project: clicking
// "raða sjálfvirkt" a few times in a row duplicated a group id and made one
// of the two same-named fronts vanish from every board with no warning.
function frontId(f) { return f.uid || f.mfId; }

function addFrontToGroup(gid) {
  const g = groups.find(x => x.id === gid);
  if (!g || g.locked) return;
  const ref = g.fronts[g.fronts.length - 1];
  g.fronts.push({ pieceId: null, label: "Nýr front", h: ref ? ref.h : 400, code: "", err: false, manual: true, mfId: newMfId() });
  selectedGid = gid;
  settleAll(); render(); saveLayout();
}
function addStandaloneFront() {
  if (!selectedKey) return;
  const id = newMfId();
  const gid = "manual~" + id;
  groups.push({ id: gid, unitName: "Handvirkt", width: 400, orient: "v",
    fronts: [{ pieceId: null, label: "Nýr front", h: 400, code: "", err: false, manual: true, mfId: id }] });
  const want = { x: settings.trim, y: settings.trim };
  layout.boards[0].placements[gid] = resolveCollision(0, gid, want) || want;
  selectedGid = gid;
  settleAll(); render(); saveLayout();
}
function setManualFrontH(mfId, val) {
  const h = Math.max(20, Math.round(+val) || 0);
  if (!h) return;
  for (const g of groups) for (const f of g.fronts) if (f.mfId === mfId) f.h = h;
  settleAll(); render(); saveLayout();
}
function setManualFrontLabel(mfId, val) {
  for (const g of groups) for (const f of g.fronts) if (f.mfId === mfId) f.label = val.trim() || "Nýr front";
  render(); saveLayout();
}
// Duplicate a front (real or manual) into the same run, as an editable manual copy.
function duplicateFront(gid, fi) {
  const g = groups.find(x => x.id === gid);
  if (!g || !g.fronts[fi]) return;
  const src = g.fronts[fi];
  g.fronts.splice(fi + 1, 0, {
    pieceId: null, label: src.label, h: src.h, code: "", err: false, manual: true, mfId: newMfId(),
  });
  selectedGid = gid;
  settleAll(); render(); saveLayout();
}
function setManualGroupWidth(gid, val) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  g.width = Math.max(20, Math.round(+val) || g.width);
  settleAll(); render(); saveLayout();
}
function removeManualFront(mfId) {
  for (const g of groups) {
    const i = g.fronts.findIndex(f => f.mfId === mfId);
    if (i >= 0) g.fronts.splice(i, 1);
  }
  const dead = groups.filter(g => g.fronts.length === 0).map(g => g.id);
  groups = groups.filter(g => g.fronts.length > 0);
  for (const b of layout.boards) for (const id of dead) delete b.placements[id];
  if (selectedGid && !groups.find(g => g.id === selectedGid)) selectedGid = null;
  settleAll(); render(); saveLayout();
}
function isManualGroup(g) { return String(g.id).startsWith("manual~") && g.fronts.every(f => f.manual); }

// A grain run must physically fit the sheet. If a vertical stack is longer
// than the board, try laying it out side-by-side; if it still doesn't fit
// (or is a lone oversized front), break it into single-front groups so the
// auto-layout is always valid and the sawyer only has to review, not repair.
function normalizeGroups() {
  const maxL = board.l - settings.trim;
  const maxW = board.w - 2 * settings.trim;
  // a few mm of length slack — better a tiny overflow than splitting a
  // grain-matched stack (the far sheet edge isn't trimmed anyway)
  const fits = g => groupLen(g) <= maxL + 22 && groupWidth(g) <= maxW + 0.5;
  const out = [];
  for (const g of groups) {
    if (fits(g)) { out.push(g); continue; }
    // try the other arrangements before giving up — keep the run's own
    // starting orientation first (wing = "s", split front = "v")
    const start = g.orient;
    const order = [start, ...["v", "s", "h"].filter(o => o !== start)];
    let done = false;
    for (const o of order) {
      g.orient = o;
      if (g.fronts.length > 1 && fits(g)) { out.push(g); done = true; break; }
    }
    if (done) continue;
    if (g.keepTogether) { g.orient = start; out.push(g); continue; } // leave overflowing, warn — never split a wing/split pair
    g.fronts.forEach((f, i) => out.push({
      id: `${g.id}~${frontId(f)}`, unitName: g.unitName + " · " + (i + 1), width: g.width, orient: "v", fronts: [f], autoSplit: true,
    }));
  }
  groups = out;
}

function splitGroup(gid) {
  const idx = groups.findIndex(g => g.id === gid);
  if (idx < 0) return;
  const g = groups[idx];
  if (g.fronts.length < 2 || g.locked) return;
  const singles = g.fronts.map((f, i) => ({
    id: `${g.id}~${frontId(f)}`, unitName: g.unitName + " · " + (i + 1), width: g.width, orient: "v", fronts: [f],
  }));
  groups.splice(idx, 1, ...singles);
  // move layout placement: keep first at old spot, stack rest under it
  const bi = boardOfGroup(gid);
  if (bi >= 0) {
    const p = layout.boards[bi].placements[gid];
    delete layout.boards[bi].placements[gid];
    let y = p.y;
    for (const s of singles) { layout.boards[bi].placements[s.id] = { x: p.x, y }; y += groupLen(s) + settings.kerf; }
  }
  selectedGid = singles[0].id;
  settleAll();
  render(); saveLayout();
}

function mergeGroup(gid, otherId) {
  const g = groups.find(x => x.id === gid);
