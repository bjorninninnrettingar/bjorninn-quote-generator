  if (!g || !o || g.locked || o.locked) return;
  g.fronts = g.fronts.concat(o.fronts);
  groups = groups.filter(x => x !== o);
  for (const b of layout.boards) delete b.placements[otherId];

  render(); saveLayout();
}

// A run is a strip of fronts sharing continuous grain. Three arrangements:
//  "v"  stacked — grain runs down the board length, fronts crosscut in
//       sequence off the top (drawer banks).
//  "s"  side by side, upright — fronts placed left→right, grain still
//       vertical in each, figure continuing across the seams (wing/split
//       doors). Cut as one tall piece then ripped into panels.
//  "h"  the whole run turned 90° — grain runs across the board width.
// frontExtent = a front's size along the run's long (layout) axis.
function frontExtent(g, f) { return g.orient === "s" ? g.width : f.h; }
function runSpan(g) {
  return g.fronts.reduce((s, f) => s + frontExtent(g, f), 0) + settings.kerf * (g.fronts.length - 1);
}
function runTall(g) { return Math.max(...g.fronts.map(f => f.h)); }
function groupWidth(g) { return g.orient === "v" ? g.width : runSpan(g); }

// ── NESTING ──────────────────────────────────────────────────────────────
function usable() {
  return { w: board.w - 2 * settings.trim, l: board.l - settings.trim };
}
// A single guillotine packing strategy: primaryOf/secondaryOf pick which of
// a group's two real dimensions (groupWidth/groupLen) drives strip width vs
// stacking, and primaryLimit/secondaryLimit are the matching sheet bounds.
// "Column-first" (primary=width, strips run the sheet length) is the
// original strategy: groups sharing a WIDTH stack into the same strip. Its
// mirror, "row-first" (primary=length, strips run the sheet width), does
// the opposite: groups sharing a LENGTH sit side by side in the same strip
// — exactly what a short, very wide run (a plinth/kickboard cover) wants,
// and column-first structurally can't do (each of its strips is only as
// wide as whichever group first claimed it). autoNest() runs both and keeps
// whichever uses fewer sheets — see below.
//
// Everything here operates in "primary/secondary" strip-space, not real
// x/y — the caller's primaryOf/secondaryOf choice is what makes one strip
// axis or the other; toXY() below maps a strategy's result back to real
// board coordinates.
function packGuillotine(groupsIn, primaryLimit, secondaryLimit, primaryOf, secondaryOf) {
  const sorted = [...groupsIn].sort((a, b) => primaryOf(b) - primaryOf(a) || secondaryOf(b) - secondaryOf(a));
  const sheets = [];

  // tries EXISTING sheets only — never opens a new one. Shared by whole-group
  // placement and by the per-front fallback below, so "does this fit
  // somewhere already open" means the same thing either way. Uses each
  // group's orientation exactly as assigned — a packing strategy only
  // decides which sheets/strips things land in, never rotates anything;
  // height stays vertical unless the sawyer/planner flips it by hand.
  function tryPlaceExisting(g) {
    const p = primaryOf(g), s = secondaryOf(g);
    for (const sh of sheets) {
      for (const strip of sh.strips) {
        if (p <= strip.size + 0.5 && strip.used + s <= secondaryLimit + 0.5) {
          sh.place[g.id] = { primary: strip.pos, secondary: strip.used };
          strip.used += s + settings.kerf;
          return true;
        }
      }
      const nextPos = sh.strips.reduce((acc, st) => acc + st.size + settings.kerf, 0);
      if (nextPos + p <= primaryLimit + 0.5) {
        sh.strips.push({ pos: nextPos, size: p, used: s + settings.kerf });
        sh.place[g.id] = { primary: nextPos, secondary: 0 };
        return true;
      }
      // Shared floor: something that needs more PRIMARY room than any
      // single strip has claimed (a plinth/kickboard run wider than any
      // existing column, in column-first strategy) can't join one and is
      // too big to become its own new strip either — but once every strip
      // on this sheet has used at least some SECONDARY room, the region
      // past that point is free across the sheet's full primary extent,
      // regardless of the narrower strip boundaries above it. Only tried
      // after the per-strip checks above, since those make tighter use of
      // anything that actually fits an existing strip.
      if (sh.strips.length) {
        const floor = Math.max(...sh.strips.map(st => st.used));
        if (p <= primaryLimit + 0.5 && floor + s <= secondaryLimit + 0.5) {
          sh.place[g.id] = { primary: 0, secondary: floor };
          for (const st of sh.strips) st.used = Math.max(st.used, floor + s + settings.kerf);
          return true;
        }
      }
    }
    return false;
  }
  function placeOnFreshSheet(g) {
    sheets.push({ strips: [{ pos: 0, size: primaryOf(g), used: secondaryOf(g) + settings.kerf }], place: { [g.id]: { primary: 0, secondary: 0 } } });
  }

  const finalGroups = [];
  for (const g of sorted) {
    if (tryPlaceExisting(g)) { finalGroups.push(g); continue; }
    // Whole group doesn't fit any sheet that's already open. Before opening
    // a brand new (likely mostly-empty) sheet for it, see if its individual
    // fronts can each backfill leftover space on sheets that already exist
    // — e.g. a plinth/kickboard cover run split across a few sheets' spare
    // corners instead of claiming a whole new one for itself. Grain-matched
    // runs (keepTogether) and locked groups are never split — same rule the
    // manual "✂ skipta upp" button follows.
    if (!g.keepTogether && !g.locked && g.fronts.length > 1) {
      const placedPieces = [], remaining = [];
      g.fronts.forEach((f, i) => {
        const piece = { id: `${g.id}~${frontId(f)}`, unitName: g.unitName + " · " + (i + 1), width: g.width, orient: "v", fronts: [f], autoSplit: true };
        if (tryPlaceExisting(piece)) placedPieces.push(piece);
        else remaining.push(f);
      });
      if (placedPieces.length) {
        finalGroups.push(...placedPieces);
        if (remaining.length) {
          // whatever's left stays ONE group (no point fragmenting further
          // than necessary) and only now gets a fresh sheet if it must
          const rest = { id: g.id, unitName: g.unitName, width: g.width, orient: "v", fronts: remaining, autoSplit: true };
          if (!tryPlaceExisting(rest)) placeOnFreshSheet(rest);
          finalGroups.push(rest);
        }
        continue;
      }
    }
    placeOnFreshSheet(g);
    finalGroups.push(g);
  }
  return { sheets, finalGroups };
}
function autoNest() {
  readToolbar();
  const u = usable();
  // Run both strategies from the SAME starting groups and keep whichever
  // uses fewer sheets (yield as the tie-break) — see packGuillotine's own
  // comment for why two independent strategies instead of one that tries to
  // mix both within a sheet. Neither run mutates a shared group object
  // (tryPlaceExisting only ever reads groupWidth/groupLen; split pieces are
  // new objects), so trying both against the same `groups` is safe.
  const colFirst = packGuillotine(groups, u.w, u.l, groupWidth, groupLen);
  const rowFirst = packGuillotine(groups, u.l, u.w, groupLen, groupWidth);
  const yieldOf = r => {
    const boardArea = board.w * board.l;
    const used = r.finalGroups.reduce((s, g) => s + groupWidth(g) * groupLen(g), 0);
    return r.sheets.length ? used / (r.sheets.length * boardArea) : 0;
  };
  const useRowFirst = rowFirst.sheets.length < colFirst.sheets.length ||
    (rowFirst.sheets.length === colFirst.sheets.length && yieldOf(rowFirst) > yieldOf(colFirst));
  const winner = useRowFirst ? rowFirst : colFirst;
  // column-first's {primary, secondary} IS {x, y} already (primary=width=x);
  // row-first's is transposed (primary=length=y, secondary=width=x).
  const toXY = useRowFirst ? (p => ({ x: p.secondary, y: p.primary })) : (p => ({ x: p.primary, y: p.secondary }));

  groups = winner.finalGroups;
  if (selectedGid && !groups.find(g => g.id === selectedGid)) selectedGid = null;
  layout = {
    boards: winner.sheets.map(s => {
      const xy = {};
      for (const [gid, p] of Object.entries(s.place)) xy[gid] = toXY(p);
      return { placements: offsetPlace(xy) };
    }),
  };
  if (!layout.boards.length) layout.boards.push({ placements: {} });
  saveLayout();
  render();
}
function offsetPlace(place) {
  const o = {};
  for (const [gid, p] of Object.entries(place)) o[gid] = { x: p.x + settings.trim, y: p.y + settings.trim };
  return o;
}
function reconcileLayout() {
  const known = new Set(groups.map(g => g.id));
  for (const b of layout.boards) {
    for (const gid of Object.keys(b.placements)) if (!known.has(gid)) delete b.placements[gid];
  }
  const placed = new Set(layout.boards.flatMap(b => Object.keys(b.placements)));
  const missing = groups.filter(g => !placed.has(g.id));
  if (missing.length) {
    // append to the last non-done board (never a locked/hidden one — that
    // would place new fronts somewhere nobody can see), stacked at x=trim
    let b = [...layout.boards].reverse().find(x => !x.done);
    if (!b) { layout.boards.push({ placements: {} }); b = layout.boards[layout.boards.length - 1]; }
    let y = settings.trim;
    for (const g of missing) { b.placements[g.id] = { x: settings.trim, y }; y += groupLen(g) + settings.kerf; }
  }

}
function boardOfGroup(gid) {
  return layout.boards.findIndex(b => gid in b.placements);
}
// groups (and their fronts) that aren't on any board — they never reach the
// saw guide, so they must be surfaced loudly and block confirm.
function unplacedGroups() {
  const placed = new Set(layout.boards.flatMap(b => Object.keys(b.placements)));
  return groups.filter(g => !placed.has(g.id));

function unplacedFrontCount() {

}
function addBoard() { layout.boards.push({ placements: {} }); saveLayout(); render(); }

// ── TOOLBAR ──────────────────────────────────────────────────────────────

["boardW", "boardL", "kerf", "trim", "grid"].forEach(id => {

// ── RENDER ───────────────────────────────────────────────────────────────
function render() {
  renderStats();
  renderBoards();
  renderPanel();
  renderOverflow();
  renderPlanStrip();
}

function renderStats() {
  const nB = layout.boards.filter(b => Object.keys(b.placements).length).length;
  $("statRow").innerHTML = `<div class="stat"><b>${nB}</b> plötur (${board.w}×${board.l})</div>`;
}

function renderOverflow() {
  const uL = board.l - settings.trim, uW = board.w - 2 * settings.trim;
  const wide = [], long = [];
  for (const g of groups) {
    if (groupWidth(g) > uW + 0.5) wide.push(g);
    else if (groupLen(g) > uL + 0.5) long.push(g);
  }
  const overlaps = detectOverlaps();
  const unplaced = unplacedGroups();
  let html = "";
  if (unplaced.length) html += `<div class="warn-box" style="background:#3a1e0f;border-color:#7a3d18;color:#ffcf9e;"><b>${unplacedFrontCount()} frontar eru ekki á neinni plötu</b> — ${unplaced.map(g => esc(g.unitName)).join(", ")}. Þeir verða <b>ekki sagaðir</b>. Dragðu þá inn á plötu eða ýttu á „↻ Raða sjálfvirkt".</div>`;
  if (long.length) {
    const maxLen = Math.max(...long.map(groupLen));
    const trimFix = Math.floor(board.l - maxLen);
    const names = long.map(g => `${esc(g.unitName)} (${Math.round(groupLen(g))} mm)`).join(", ");
    html += `<div class="warn-box">${names} — ${Math.round(maxLen - uL)} mm of langt fyrir snyrtilínuna.
      ${trimFix >= 0 && trimFix < settings.trim
        ? `<button class="small primary" style="margin-left:8px;" onclick="setTrim(${trimFix})">Minnka snyrtingu í ${trimFix} mm</button>`
        : "Skiptu hópnum upp."}</div>`;
  }
  if (wide.length) {
    const names = wide.map(g => `${esc(g.unitName)} (${Math.round(groupWidth(g))} mm breiður)`).join(", ");
    html += `<div class="warn-box">${names} — breiðari en nothæf plata (${Math.round(uW)} mm). Skiptu hópnum eða athugaðu málin í Airtable.</div>`;
  }
  if (overlaps.length) html += `<div class="warn-box">Hópar skarast: ${overlaps.map(esc).join(", ")}. Dragðu í sundur eða raðaðu sjálfvirkt.</div>`;
  $("overflowWarn").innerHTML = html;
}
function setTrim(v) {
  $("trim").value = Math.max(0, v | 0);

  saveSettings(); syncSettingsBtn();
  render(); saveLayout(); pushHistory();
  toast(`Snyrting sett í ${settings.trim} mm`);
}

function detectOverlaps() {
  const out = [];
  for (const b of layout.boards) {
    const items = Object.entries(b.placements).map(([gid, p]) => {
      const g = groups.find(x => x.id === gid); if (!g) return null;
      return { gid, name: g.unitName, x: p.x, y: p.y, w: groupWidth(g), l: groupLen(g) };
    }).filter(Boolean);
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], c = items[j];
      if (a.x < c.x + c.w - 1 && a.x + a.w > c.x + 1 && a.y < c.y + c.l - 1 && a.y + a.l > c.y + 1)
        out.push(`${a.name} ↔ ${c.name}`);
    }
  }
  return [...new Set(out)];
}

const COLORS = ["#2f6f4f", "#3a5a8c", "#8c5a3a", "#6b4a8c", "#8c8140", "#3a7d8c", "#8c4060", "#5c7a3a"];

// splitting/merging/adding a group elsewhere used to shift every later
// group's array index, silently recolouring runs on other, untouched sheets.
function groupColor(g) {
  let h = 0;
  for (let i = 0; i < g.id.length; i++) h = (h * 31 + g.id.charCodeAt(i)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
}

    wrap.appendChild(svg);

    // print cut sequence

    seq.innerHTML = cutSequenceHtml(b, bi);
    wrap.appendChild(seq);

    col.appendChild(wrap);
  });
}

function removeBoard(bi) {
  if (layout.boards.length <= 1) return;
  const moved = layout.boards[bi].placements;
  const n = Object.keys(moved).length;
  if (n && !confirm(`Fjarlægja Plötu ${bi + 1}? ${n} hópar færast á aðrar plötur.`)) return;
  layout.boards.splice(bi, 1);
  // re-place orphaned groups onto the least-full remaining board, then settle
  const target = layout.boards.reduce((best, b, i) =>
    Object.keys(b.placements).length < Object.keys(layout.boards[best].placements).length ? i : best, 0);
  for (const gid of Object.keys(moved)) layout.boards[target].placements[gid] = { x: settings.trim, y: settings.trim };
  if (layout.boards[target].done) layout.boards[target].done = false;   // don't silently place it somewhere hidden

// ── DRAG ─────────────────────────────────────────────────────────────────
const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));

// on board `bi` (butted with a saw kerf). Fronts never land on top of each

// Drag a whole run — a floating ghost follows the cursor across every board,
// and on drop the run snaps to the nearest spot where it doesn't overlap.
function enableDrag(handleEl, svg, bi, gid, scale) {
  handleEl.style.cursor = "grab";
  handleEl.addEventListener("pointerdown", ev => {
    if (ev.button > 0) return;
    ev.preventDefault(); ev.stopPropagation();
    selectGroup(gid);
    const g = groups.find(x => x.id === gid);
    const color = groupColor(g);
    const grp = svg.querySelector(`g.group-rect[data-gid="${cssq(gid)}"]`);
    grp.classList.add("dragging");
    try { handleEl.setPointerCapture(ev.pointerId); } catch {}

    const W = groupWidth(g), H = groupLen(g);
    const scr = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width; // vb→px on screen
    ghostShow(`${g.unitName} ${orientGlyph(g.orient)}\n${Math.round(W)}×${Math.round(H)}`,
      W * scale * scr, H * scale * scr, color);

// pop it into its own run (snapped to the nearest free spot), or back over

  cell.style.cursor = "grab";

    if (ev.button > 0) return;
    ev.preventDefault(); ev.stopPropagation();
    selectGroup(gid);
    const g0 = groups.find(x => x.id === gid);
    if (g0 && g0.locked) return;   // locked: select on tap, but individual fronts can't be pulled out
    try { cell.setPointerCapture(ev.pointerId); } catch {}
    let moved = false, lastE = ev;
    const startXY = { x: ev.clientX, y: ev.clientY };

    const g = groups.find(x => x.id === gid);
    const f = g.fronts[fi];
    const scr = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
    const gw = (g.orient === "h" ? f.h : g.width) * scale * scr;
    const gh = (g.orient === "h" ? g.width : f.h) * scale * scr;

    function move(e) {
      if (!moved && Math.hypot(e.clientX - startXY.x, e.clientY - startXY.y) < 4) return;
      if (!moved) {
        moved = true;
        cell.classList.add("dragging");
        ghostShow(`${g.unitName}\n${f.label}\n${g.width}×${f.h}`, gw, gh, "#4aa3ff");
      }

        const arr = g.fronts;

        const dst = groups.find(x => x.id === hit.gid);

      o.fronts = touchBelow ? o.fronts.concat(g.fronts) : g.fronts.concat(o.fronts);
      groups = groups.filter(x => x !== g);
      delete layout.boards[bi].placements[gid];
      if (selectedGid === gid) selectedGid = oid;
      return oid;   // the id gid actually ended up in, for pulseLanded()
    }
  }
  return false;
}
function selectGroup(gid) {
  selectedGid = gid;

  renderPanel();
  scrollPanelToGroup(gid);
}
// clicking a piece on a sheet should bring its side-panel entry into view,
// not leave the sawyer/planner hunting through a long scrolled list for it
function scrollPanelToGroup(gid) {
  const el = document.querySelector(`.grp-panel .grp[data-gid="${cssq(gid)}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
}
function cssq(s) { return String(s).replace(/["\\]/g, "\\$&"); }
function svgPoint(svg, ev) {
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;

}
// Free mode: drop exactly where released (0.1 mm). Grid mode: neighbour /
// trim edges are magnetic first (tight butt joins), then everything else
// locks to the grid step.
function snap(v, targets) {
  if (settings.freeMove) return Math.round(v * 10) / 10;
  for (const t of targets) if (Math.abs(v - t) < 14) return t;
  const g = settings.grid || 25;
  return Math.round(v / g) * g;
}
function edgeXs(bi, skip) {
  const xs = [];
  for (const [gid, p] of Object.entries(layout.boards[bi].placements)) {
    if (gid === skip) continue;
    const g = groups.find(x => x.id === gid); if (!g) continue;
    xs.push(p.x, p.x + groupWidth(g) + settings.kerf);
  }
  return xs;
}
function edgeYs(bi, skip) {
  const ys = [];
  for (const [gid, p] of Object.entries(layout.boards[bi].placements)) {
    if (gid === skip) continue;
    const g = groups.find(x => x.id === gid); if (!g) continue;
    ys.push(p.y, p.y + groupLen(g) + settings.kerf);
  }
  return ys;
}
function boardUnderPointer(e) {
  const svgs = document.querySelectorAll("svg.board");
  for (const s of svgs) {
    const r = s.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom)
      return +s.dataset.board;
  }
  return null;
}

// ── SIDE PANEL ───────────────────────────────────────────────────────────

          ${!f.manual ? `<button class="small ghost" title="Segja skrifstofu frá vandamáli" onclick="event.stopPropagation();flagFront('${g.id}',${i})">⚠</button>` : ""}

// Drag front rows in the panel to reorder within a run, or drop onto
// another run's list to move the front there.
let dragFront = null;
function wireFrontRowDnD() {
  $("grpPanel").querySelectorAll(".front-row").forEach(row => {
    row.addEventListener("dragstart", e => {
      dragFront = { gid: row.dataset.gid, fi: +row.dataset.fi };
      e.dataTransfer.effectAllowed = "move";
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      $("grpPanel").querySelectorAll(".front-row").forEach(r => r.classList.remove("drop-above", "drop-below"));
      dragFront = null;
    });
    row.addEventListener("dragover", e => {
      if (!dragFront) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const below = e.clientY > rect.top + rect.height / 2;
      row.classList.toggle("drop-below", below);
      row.classList.toggle("drop-above", !below);
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-above", "drop-below"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      if (!dragFront) return;
      const toGid = row.dataset.gid;
      const rect = row.getBoundingClientRect();
      let toIdx = +row.dataset.fi + (e.clientY > rect.top + rect.height / 2 ? 1 : 0);
      dropFrontRow(dragFront.gid, dragFront.fi, toGid, toIdx);
    });
  });
  // drop onto empty area of a run's list (e.g. a run with 0 visible rows won't exist, so also allow list container)
  $("grpPanel").querySelectorAll(".front-list").forEach(list => {
    list.addEventListener("dragover", e => { if (dragFront) e.preventDefault(); });
    list.addEventListener("drop", e => {
      if (!dragFront || e.target.closest(".front-row")) return;
      e.preventDefault();
      const toGid = list.dataset.gid;
      const dst = groups.find(x => x.id === toGid);
      dropFrontRow(dragFront.gid, dragFront.fi, toGid, dst ? dst.fronts.length : 0);
    });
  });
}
function dropFrontRow(fromGid, fromFi, toGid, toIdx) {
  const from = groups.find(x => x.id === fromGid);
  const to = groups.find(x => x.id === toGid);
  if (!from || !to) return;
  if (from !== to && (from.locked || to.locked)) return;   // locked: fronts can't move in or out, only reorder within
  const [it] = from.fronts.splice(fromFi, 1);
  if (from === to && fromFi < toIdx) toIdx--;
  to.fronts.splice(clamp(toIdx, 0, to.fronts.length), 0, it);
  cleanupIfEmpty(fromGid);
  settleAll();
  render(); saveLayout();
}
function pickGroup(gid) { selectedGid = gid; render(); scrollPanelToGroup(gid); }
function mergeCandidates(g) {
  if (g.locked) return [];   // a locked run can't absorb anything, and can't be absorbed
  return groups.filter(o => o !== g && !o.locked && o.width === g.width && o.orient === g.orient);
}
function moveFront(gid, i, dir) {
  const g = groups.find(x => x.id === gid);
  const j = i + dir;
  if (j < 0 || j >= g.fronts.length) return;
  [g.fronts[i], g.fronts[j]] = [g.fronts[j], g.fronts[i]];
  render(); saveLayout();
}
function reverseGroup(gid) { groups.find(x => x.id === gid).fronts.reverse(); render(); saveLayout(); }
// Locked = line up a few fronts, then freeze the group's contents: no adding,
// splitting, or pulling individual fronts in/out. The whole run can still be
// dragged/reordered/sent to another board — only its membership is frozen.
function toggleLock(gid) {
  const g = groups.find(x => x.id === gid);
  if (!g) return;
  g.locked = !g.locked;
  render(); saveLayout();
}
function setOrient(gid, o) {
  const g = groups.find(x => x.id === gid);
  if (!g || g.orient === o) return;
  g.orient = o;
  settleAll();
  render(); saveLayout();
}
function sendToBoard(gid, bi) {
  const from = boardOfGroup(gid);
  if (from >= 0) delete layout.boards[from].placements[gid];
  layout.boards[bi].placements[gid] = { x: settings.trim, y: settings.trim };
  if (layout.boards[bi].done) layout.boards[bi].done = false;   // don't silently place it somewhere hidden
  settleBoard(bi);
  render(); saveLayout();
}

// ── PRINT CUT SEQUENCE ───────────────────────────────────────────────────
function cutSequenceHtml(b, bi) {
  const items = Object.entries(b.placements).map(([gid, p]) => {
    const g = groups.find(x => x.id === gid); if (!g) return null;
    return { g, p };
  }).filter(Boolean).sort((a, c) => a.p.x - c.p.x || a.p.y - c.p.y);
  if (!items.length) return "<b>Plata " + (bi + 1) + " — tóm</b>";

  let html = `<b>Plata ${bi + 1} — sögunarröð (${board.w}×${board.l} mm, æð ↕)</b><ol>`;
  items.forEach(({ g, p }, i) => {
    const w = Math.round(groupWidth(g)), l = Math.round(groupLen(g));
    const seq = g.fronts.map((f, k) => `#${k + 1} ${esc(f.label)} ${f.h}`).join(" → ");
    if (g.orient === "v") {
      html += `<li><b>${esc(g.unitName)}</b> (stafla ↕): rífðu ræmu ${w} mm breiða (x ≈ ${Math.round(p.x)}–${Math.round(p.x + w)} mm). Þverskurðir að ofan: ${seq}.`;
    } else if (g.orient === "s") {
      html += `<li><b>${esc(g.unitName)}</b> (væng, hlið v. hlið ↔): þverskurður ${Math.round(runTall(g))} mm fyrir allan hópinn, svo rífðu í ${g.fronts.length} × ${g.width} mm hlið við hlið — samfelld æð: ${seq}.`;
    } else {
      html += `<li><b>${esc(g.unitName)}</b> (snúinn 90° ⟳): taktu band ${g.width} mm (á lengd plötu), snúðu 90°, sagaðu fronta: ${seq}.`;
    }
    html += `</li>`;
  });
  html += `</ol>`;
  return html;
}

// ── GUIDED SAWING ────────────────────────────────────────────────────────
// Turns the current layout into an ordered list of physical saw operations:
// per board → trim → for each vertical strip: rip the strip, then crosscut
// each front off its leading edge, top to bottom. Measurements are the
// number the sawyer dials into the fence / crosscut stop for that one cut.
let guide = null;   // { steps: [...], idx }

function clusterStrips(b) {
  const items = Object.entries(b.placements).map(([gid, p]) => {
    const g = groups.find(x => x.id === gid);
    return g ? { g, x: p.x, y: p.y, w: groupWidth(g), l: groupLen(g) } : null;
  }).filter(Boolean).sort((a, c) => a.x - c.x || a.y - c.y);

  const strips = [];
  for (const it of items) {
    let s = strips.find(s => Math.abs(s.x - it.x) < 45);
    if (!s) { s = { x: it.x, w: it.w, runs: [] }; strips.push(s); }
    s.w = Math.max(s.w, it.w);
    s.runs.push(it);
  }
  for (const s of strips) s.runs.sort((a, c) => a.y - c.y);
  return strips.sort((a, c) => a.x - c.x);
}

function buildCutPlan() {
  const steps = [];
  const k = settings.kerf, tr = settings.trim;

  layout.boards.forEach((b, bi) => {
    const strips = clusterStrips(b);
    if (!strips.length) return;

    if (tr > 0) {
      steps.push({
        bi, kind: "trim", measure: tr, measureLabel: "Taktu af hvorri brún",
        title: "Snyrtu frambrún og vinstri kant plötunnar",
        note: "Svo að allar næstu mælingar byrji á hreinum kanti.",
        produces: [], cutLines: [{ o: "h", pos: tr }, { o: "v", pos: tr }],
        highlight: null,
      });
    }

    strips.forEach((s, si) => {
      const names = [...new Set(s.runs.map(r => r.g.unitName.replace(/ · \d+$/, "")))].join(", ");
      const onlyRotated = s.runs.length === 1 && s.runs[0].g.orient !== "v";
      // workpiece: which physical piece of material a step actually cuts.
      // Two steps can share a board AND an axis and still be different
      // physical pieces — e.g. ripping the sheet's next strip is "v", and so
      // is crosscutting a front off an already-separated rotated band, but
      // they are not the same piece of material and can't be one WinCut
      // program together just because the axis happens to match. Every
      // separation (a strip ripped off the sheet, a "tall" piece or a
      // rotated "band" crosscut off a strip) gets its own workpiece id so
      // buildWinCutPrograms() below only merges steps that are truly
      // continuous cuts on the same piece.
      const sheetPiece = `${bi}-sheet`;
      const stripPiece = `${bi}-strip${si}`;
      if (!onlyRotated) steps.push({
        bi, workpiece: sheetPiece, kind: "rip", measure: Math.round(s.w), measureLabel: "Rifjaðar — frá vinstri kanti",
        title: `Rífðu ræmu ${si + 1}${strips.length > 1 ? " af " + strips.length : ""} — ${Math.round(s.w)} mm breið`,
        note: `Ræman heldur samfelldu æðinni fyrir: ${names}.`,
        produces: [],
        highlight: { x: s.x, y: tr, w: s.w, l: board.l - tr },
        cutLines: [{ o: "v", pos: s.x + s.w }],
      });

      let cursor = tr;
      s.runs.forEach(r => {
        const g = r.g;
        if (r.y > cursor + 1) {
          steps.push({
            bi, workpiece: stripPiece, kind: "scrap", measure: Math.round(r.y - cursor), measureLabel: "Þverskurðarstopp",
            title: "Sagaðu frá afskurð efst á ræmunni",
            note: "Kastaðu — næsti hópur byrjar hér.",
            produces: [], highlight: { x: s.x, y: cursor, w: s.w, l: r.y - cursor },
            cutLines: [{ o: "h", pos: r.y }],
          });
          cursor = r.y;
        }
        if (g.orient === "v") {
          const narrower = g.width < s.w - 1;
          const runTop = cursor;
          g.fronts.forEach((f, fi) => {
            steps.push({
              bi, workpiece: stripPiece, kind: "crosscut", measure: f.h, measureLabel: "Þverskurðarstopp",
              title: `${g.unitName} — þverskurður ${fi + 1} af ${g.fronts.length}`,
              note: fi === 0
                ? "Efsti fronti hópsins. Haltu röðinni." + (narrower ? " (fronturinn rifst mjórri á eftir)" : "")
                : "",
              produces: narrower ? [] : [{ label: f.label, w: g.width, h: f.h, unitName: g.unitName, err: f.err, n: fi + 1, of: g.fronts.length, pieceId: f.pieceId }],
              highlight: { x: s.x, y: cursor, w: g.width, l: f.h },
              cutLines: [{ o: "h", pos: cursor + f.h }],
            });
            cursor += f.h + k;
          });
          if (narrower) {
            steps.push({
              bi, workpiece: stripPiece, kind: "rip", measure: g.width, measureLabel: "Rifjaðar",
              title: `${g.unitName} — rífðu ${g.fronts.length} fronta niður í ${g.width} mm`,
              note: `Taktu ${Math.round(s.w - g.width)} mm af hverjum (ræman var breiðari en þessi hópur).`,
              produces: g.fronts.map((f, i) => ({ label: f.label, w: g.width, h: f.h, unitName: g.unitName, err: f.err, n: i + 1, of: g.fronts.length, pieceId: f.pieceId })),
              highlight: { x: s.x, y: runTop, w: g.width, l: cursor - runTop - k },
              cutLines: [{ o: "v", pos: s.x + g.width }],
            });
          }
        } else if (g.orient === "s") {
          // side by side, upright (wing / split doors): crosscut one tall
          // piece for the whole set, then rip it into panels — grain stays
          // continuous and the panels come off adjacent, in order. The rip
          // steps work the separated tall piece, not the strip — own id.
          const tallPiece = `${stripPiece}-tall-${g.id}`;
          const tall = runTall(g);
          steps.push({
            bi, workpiece: stripPiece, kind: "crosscut", measure: tall, measureLabel: "Þverskurðarstopp",
            title: `${g.unitName} — þverskurður fyrir allan vænghópinn`,
            note: `${g.fronts.length} frontar hlið við hlið, samfelld æð yfir samskeytin.`,
            produces: [], highlight: { x: s.x, y: cursor, w: groupWidth(g), l: tall },
            cutLines: [{ o: "h", pos: cursor + tall }],
          });
          let woff = s.x;
          g.fronts.forEach((f, fi) => {
            steps.push({
              bi, workpiece: tallPiece, kind: "rip", measure: g.width, measureLabel: "Rifjaðar",
              title: `${g.unitName} — rífðu væng ${fi + 1} af ${g.fronts.length}`,
              note: fi === 0 ? "Rífðu frá vinstri, haltu röðinni. Vængirnir eiga að vera hlið við hlið." : "",
              produces: [{ label: f.label, w: g.width, h: f.h, unitName: g.unitName, err: f.err, n: fi + 1, of: g.fronts.length, pieceId: f.pieceId }],
              highlight: { x: woff, y: cursor, w: g.width, l: f.h },
              cutLines: [{ o: "v", pos: woff + g.width }],
            });
            woff += g.width + k;
          });
          cursor += tall + k;
        } else {
          // rotated 90°: grain runs across the board. Crosscut a band g.width
          // long (separating it from the strip), then turn it and crosscut
          // each front off it in sequence — the per-front cuts work the
          // separated band, not the strip, even though the axis (v) happens
          // to match whatever rip comes next on the strip/sheet.
          const bandPiece = `${stripPiece}-band-${g.id}`;
          const band = g.width;
          steps.push({
            bi, workpiece: stripPiece, kind: "crosscut", measure: band, measureLabel: "Þverskurðarstopp",
            title: `${g.unitName} — taktu band (snúinn hópur, æð þvers)`,
            note: `${g.fronts.length} frontar með samfelldri æð þvers yfir bandið. Snúðu bandinu 90° á eftir.`,
            produces: [], highlight: { x: s.x, y: cursor, w: groupWidth(g), l: band },
            cutLines: [{ o: "h", pos: cursor + band }],
          });
          let woff = s.x;
          g.fronts.forEach((f, fi) => {
            steps.push({
              bi, workpiece: bandPiece, kind: "crosscut", measure: f.h, measureLabel: "Þverskurðarstopp (á bandinu)",
              title: `${g.unitName} — fronti ${fi + 1} af ${g.fronts.length} af bandinu`,
              note: fi === 0 ? "Haltu röðinni frá vinstri." : "",
              produces: [{ label: f.label, w: g.width, h: f.h, unitName: g.unitName, err: f.err, n: fi + 1, of: g.fronts.length, pieceId: f.pieceId }],
              highlight: { x: woff, y: cursor, w: f.h, l: band },
              cutLines: [{ o: "v", pos: woff + f.h }],
            });
            woff += f.h + k;
          });
          cursor += band + k;
        }
      });
    });
  });

  const programs = buildWinCutPrograms(steps);
  return { steps, programs, idx: 0 };
}

// Groups the step list into WinCut "SEMI-AUTOMATIC" programs — the real
// machine can only run a sequence of cuts along ONE axis per program (photos
// of the F2 screen confirm this: every row in a program is the same XI
// type). A rip step ("v" cut) and the crosscuts that follow it ("h") are
// physically different axes, meaning the sawyer has to stop, rotate/re-feed
// the material, and start a fresh program — a step the app never used to
// call out at all. Consecutive same-board, same-axis steps become one
// program; identical consecutive Values collapse into one line with a Rep
// count, exactly like WinCut's own Rep column (confirmed: a real program had
// "568.000, Rep 2" for two identical cuts back to back). trim is left out —
// it's a fixed preamble (crop both edges once), not something typed as an
// XI sequence.
function buildWinCutPrograms(steps) {
  const programs = [];
  let cur = null;
  steps.forEach((st, i) => {
    const cl = (st.cutLines || [])[0];
    if (st.kind === "trim" || !cl) { cur = null; return; }
    const axis = cl.o;
    // the cross-dimension of the material being fed for this program — the
    // "XA" declare value on the real screen. For an "h" (crosscut) axis
    // that's the piece's width; for "v" (rip) it's its length. Shown to the
    // user with an explicit caveat on rip-axis programs since it's the one
    // piece of the mapping not yet confirmed against a real rip-mode photo.
    const feedWidth = Math.round(axis === "h" ? (st.highlight?.w ?? 0) : (st.highlight?.l ?? 0));
    // Break on workpiece too, not just axis+board — two steps can be the
    // same board and the same axis and still be different physical pieces
    // (crosscutting a front off an already-separated rotated band is "v",
    // and so is ripping the sheet's next strip; they are not the same piece
    // of material and were wrongly merging into one WinCut program before
    // this field existed — see buildCutPlan()'s workpiece comment).
    if (!cur || cur.bi !== st.bi || cur.axis !== axis || cur.workpiece !== st.workpiece) {
      cur = { bi: st.bi, axis, workpiece: st.workpiece, feedWidth, lines: [] };
      programs.push(cur);
    }
    const val = Math.round(st.measure);
    const last = cur.lines[cur.lines.length - 1];
    if (last && last.value === val) last.stepIdxs.push(i);
    else cur.lines.push({ value: val, stepIdxs: [i] });
  });
  programs.forEach((p, pi) => {
    p.lines.forEach((line, li) => {
      line.stepIdxs.forEach(si => { steps[si].programIdx = pi; steps[si].programLineIdx = li; });
    });
  });
  // Flag the transition into every program after a board's first one (that
  // one just follows the trim step, which already told the sawyer to square
  // up the sheet). Two different kinds of transition, two different
  // instructions: the axis changed → physically rotate/re-feed the material
  // ("reorient"); only the workpiece changed (axis the same) → set the
  // current piece aside and pick up a different one, no rotation needed
  // ("switchPiece") — e.g. finishing a rotated band's own cuts and going
  // back to the main sheet's next strip, both happen to run "v".
  let prevByBoard = new Map();
  programs.forEach(p => {
    const firstStepIdx = p.lines[0].stepIdxs[0];
    const prev = prevByBoard.get(p.bi);
    if (prev) {
      if (prev.axis !== p.axis) steps[firstStepIdx].reorient = true;
      else steps[firstStepIdx].switchPiece = true;
    }
    prevByBoard.set(p.bi, p);
  });
  return programs;
}

function guideKey() { return `grain:guide:${currentProjectId}:${selectedKey}`; }

function openGuide() {
  readToolbar();
  const unplaced = unplacedGroups();
  const plan = buildCutPlan();
  if (!plan.steps.length) {
    alert(unplaced.length
      ? "Allir hópar eru óraðaðir — engin plata til að saga. Raðaðu frontunum inn fyrst."
      : "Engir frontar á plötunum til að saga.");
    return;
  }
  if (unplaced.length &&
      !confirm(`${unplacedFrontCount()} frontar eru ekki á plötu og verða EKKI sagaðir (${unplaced.map(g => g.unitName).join(", ")}).\n\nHalda áfram samt?`))
    return;
  let start = 0;
  try {
    const saved = parseInt(localStorage.getItem(guideKey()) || "0", 10);
    if (saved > 0 && saved < plan.steps.length &&
        confirm(`Halda áfram frá skrefi ${saved + 1} af ${plan.steps.length}? (Í lagi = halda áfram, Hætta við = byrja upp á nýtt)`))
      start = saved;
  } catch {}
  guide = plan; guide.idx = start;
  $("guideOverlay").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  renderGuide();
}
function closeGuide() {
  $("guideOverlay").classList.add("hidden");
  document.body.style.overflow = "";
  guide = null;
}
function guideNav(d) {
  if (!guide) return;
  const n = guide.idx + d;
  if (n < 0) return;
  if (n >= guide.steps.length) {
    guide.idx = guide.steps.length;
    try { localStorage.removeItem(guideKey()); } catch {}
    renderGuide(); return;
  }
  guide.idx = n;
  try { localStorage.setItem(guideKey(), String(Math.max(0, n))); } catch {}
  renderGuide();
}

function guideSvg(step) {
  const bi = step.bi;
  const b = layout.boards[bi];
  const PXW = 380, scale = PXW / board.w;
  const W = board.w * scale, H = board.l * scale;
  const S = (x) => x * scale;
  let inner = "";
  // sheet + trim
  inner += `<rect x="0" y="0" width="${W}" height="${H}" fill="#101010" stroke="#444"/>`;
  inner += `<rect x="${S(settings.trim)}" y="${S(settings.trim)}" width="${S(board.w - 2 * settings.trim)}" height="${S(board.l - settings.trim)}" fill="none" stroke="#333" stroke-dasharray="3 3"/>`;
  {
    const t = S(settings.trim) + 6, bot = H - 6, x = 8;
    inner += `<g stroke="#5a5a5a" stroke-width="1" fill="none">
      <line x1="${x}" y1="${t}" x2="${x}" y2="${bot}"/>
      <path d="M${x - 3} ${t + 6} L${x} ${t} L${x + 3} ${t + 6}"/>
      <path d="M${x - 3} ${bot - 6} L${x} ${bot} L${x + 3} ${bot - 6}"/></g>
      <text x="${x + 7}" y="${H / 2}" fill="#666" font-size="9" text-anchor="middle" transform="rotate(-90 ${x + 7} ${H / 2})">æð</text>`;
  }
  // all groups faint
  Object.entries(b.placements).forEach(([gid, p]) => {
    const g = groups.find(x => x.id === gid); if (!g) return;
    const c = groupColor(g);
    inner += `<rect x="${S(p.x)}" y="${S(p.y)}" width="${S(groupWidth(g))}" height="${S(groupLen(g))}" fill="${c}" fill-opacity="0.18" stroke="${c}" stroke-opacity="0.5"/>`;
    const horiz = g.orient !== "v";
    let off = 0;
    g.fronts.forEach(f => {
      const cw = g.orient === "h" ? f.h : g.width;
      const ch = g.orient === "h" ? g.width : f.h;
      const cx = horiz ? p.x + off : p.x;
      const cy = horiz ? p.y : p.y + off;
      inner += `<rect x="${S(cx)}" y="${S(cy)}" width="${S(cw)}" height="${S(ch)}" fill="none" stroke="${c}" stroke-opacity="0.4" stroke-width="0.5"/>`;
      off += frontExtent(g, f) + settings.kerf;
    });
  });
  // highlight region
  if (step.highlight) {
    const h = step.highlight;
    inner += `<rect x="${S(h.x)}" y="${S(h.y)}" width="${S(h.w)}" height="${S(h.l)}" fill="#2196f3" fill-opacity="0.28" stroke="#2196f3" stroke-width="2"/>`;
  }
  // cut lines
  (step.cutLines || []).forEach(cl => {
    if (cl.o === "v") inner += `<line x1="${S(cl.pos)}" y1="0" x2="${S(cl.pos)}" y2="${H}" stroke="#ff5252" stroke-width="2.5" stroke-dasharray="8 5"/>`;
    else inner += `<line x1="0" y1="${S(cl.pos)}" x2="${W}" y2="${S(cl.pos)}" stroke="#ff5252" stroke-width="2.5" stroke-dasharray="8 5"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function renderGuide() {
  const o = $("guideOverlay");
  const total = guide.steps.length;
  const mat = (materials.find(m => m.key === selectedKey) || {}).efni || "";

  if (guide.idx >= total) {
    o.classList.add("done");
    o.innerHTML = `
      <div class="gtop"><span class="gt-title">Leiðsögn</span><span class="gt-step">búið</span>
        <button class="ghost small" onclick="closeGuide()">✕ Loka</button></div>
      <div class="gprog"><div style="width:100%"></div></div>
      <div class="gbody"><div class="gdone">
        <div class="big">✓ Klárt</div>
        <div class="gnote">Öll ${total} skref búin á ${layout.boards.filter(b=>Object.keys(b.placements).length).length} plötum.</div>
        <div style="margin-top:20px;display:flex;gap:12px;justify-content:center;">
          <button class="ghost" onclick="guide.idx=0;try{localStorage.removeItem(guideKey())}catch(e){};renderGuide()">↻ Byrja aftur</button>
          <button class="primary" onclick="try{localStorage.removeItem(guideKey())}catch(e){};closeGuide()">Loka</button>
        </div>
      </div></div>`;
    return;
  }
  o.classList.remove("done");
  const st = guide.steps[guide.idx];
  const boardIdxs = [...new Set(guide.steps.map(s => s.bi))];
  const nBoards = boardIdxs.length;
  const pct = Math.round(guide.idx / total * 100);
  const bStarts = boardIdxs.map(bi => guide.steps.findIndex(s => s.bi === bi));
  const bLasts  = boardIdxs.map(bi => guide.steps.map(s => s.bi).lastIndexOf(bi));
  const boardPos = boardIdxs.indexOf(st.bi) + 1;          // 1-based nth board being cut
  const posInBoard = guide.idx - bStarts[boardPos - 1] + 1;
  const stepsInBoard = bLasts[boardPos - 1] - bStarts[boardPos - 1] + 1;
  const boardsDone = bLasts.filter(l => guide.idx > l).length;
  const boardNav = nBoards > 1 ? `<span class="gboard-nav">` + boardIdxs.map((bi, i) => {
    const state = guide.idx > bLasts[i] ? "done" : (st.bi === bi ? "cur" : "");
    return `<button class="${state}" onclick="guide.idx=${bStarts[i]};renderGuide()">Plata ${bi + 1}${state === "done" ? " ✓" : state === "cur" ? ` (${posInBoard}/${stepsInBoard})` : ""}</button>`;
  }).join("") + `</span>` : "";
  const ticks = nBoards > 1 ? bStarts.slice(1).map(s => `<span class="tick" style="left:${(s / total * 100).toFixed(2)}%"></span>`).join("") : "";

  const produces = (st.produces || []).map(p => `
    <div class="gchip ${p.err ? "warn" : ""}">
      <span class="cl">${p.of > 1 ? `<b style="color:#ffd479">${p.n}/${p.of}</b> · ` : ""}${esc(p.label)}${p.err ? " ⚠" : ""}${_flaggedPieces.has(p.pieceId) ? " 💬" : ""}${p.pieceId && _printedPieces.has(p.pieceId) ? " 🖨✓" : ""}</span>
      <span class="cd">${esc(p.unitName)} · ${Math.round(p.w)}×${Math.round(p.h)} mm</span>
      ${p.pieceId ? `<button class="gchip-flag" ${_printing ? "disabled" : ""} onclick='printPieceLabel(${JSON.stringify(p.pieceId)},${JSON.stringify(p.label)})'>🖨 prenta miða</button>` : ""}
      ${p.pieceId ? `<button class="gchip-flag" onclick='flagPiece(${JSON.stringify(p.pieceId)},${JSON.stringify(p.label)},${JSON.stringify(p.unitName)})'>⚠ vandamál með þennan part</button>` : ""}
    </div>`).join("");
  const multi = (st.produces || []).some(p => p.of > 1);

  const prog = st.programIdx != null ? guide.programs[st.programIdx] : null;
  const reorientBanner = st.reorient ? `
    <div class="greorient">🔄 <b>Snúðu efni</b><span class="gsub">Ný átt</span></div>`
    : st.switchPiece ? `
    <div class="greorient">↔️ <b>Nýr biti</b><span class="gsub">Sama átt</span></div>` : "";
  const wincutPanel = prog ? `
    <div class="gwincut">
      <div class="gwincut-head"><b>WinCut forrit (F2)</b>
        <span class="gwincut-feed">breidd efnis (XA): <b>${prog.feedWidth} mm</b>${prog.axis === "v" ? ` <span title="Óstaðfest fyrir rifskurði — athugaðu töluna á vélinni fyrst">⚠</span>` : ""}</span></div>
      <table class="gwincut-table"><thead><tr><th>Type</th><th>Value</th><th>Rep.</th></tr></thead>
        <tbody>${prog.lines.map((line, li) => `<tr class="${li === st.programLineIdx ? "cur" : ""}"><td>XI</td><td>${line.value}</td><td>${line.stepIdxs.length}</td></tr>`).join("")}</tbody>
      </table>
    </div>` : "";

  o.innerHTML = `
    <div class="gtop">
      <span class="gt-title">Leiðsögn — ${esc(projectName)}</span>
      ${boardNav}
      <span class="gt-step">${nBoards > 1 ? `Plata ${boardPos}/${nBoards} · skref ${posInBoard}/${stepsInBoard}${boardsDone ? ` · ${boardsDone} ✓` : ""}` : `Skref ${guide.idx + 1} / ${total}`}</span>
      <button class="ghost small" onclick="closeGuide()">✕ Loka</button>
    </div>
    <div class="gprog"><div style="width:${pct}%"></div>${ticks}</div>
    <div class="gbody">
      <div class="gdiagram">${guideSvg(st)}</div>
      <div class="ginfo">
        <span class="gboard-chip">Plata ${st.bi + 1}${nBoards > 1 ? " af " + nBoards : ""}</span>
        ${(() => {
          const pending = guide.steps.filter(s => s.bi === st.bi).flatMap(s => s.produces || [])
            .filter(p => p.pieceId && !_printedPieces.has(p.pieceId)).length;
          return pending ? `<button class="ghost small" ${_printing ? "disabled" : ""} onclick="printBoardLabels(${st.bi})">🖨 prenta ${pending} óprentaða miða á plötunni</button>` : "";
        })()}
        <span class="gkind ${st.kind}">${({ trim: "Snyrting", rip: "Rif", crosscut: "Þverskurður", scrap: "Afskurður" })[st.kind]}</span>
        <div class="gtitle">${esc(st.title)}</div>
        ${st.measure != null ? `<div class="gmeasure">
          <span class="num">${Math.round(st.measure)}</span><span class="unit">mm</span>
          <span class="lbl">${esc(st.measureLabel || "")}</span>
        </div>` : ""}
        ${st.note ? `<div class="gnote">${esc(st.note)}</div>` : ""}
        ${reorientBanner}
        ${wincutPanel}
        ${produces ? `<div class="gproduces"><label>Þú færð — merktu strax á bakhlið: eining, ör upp ↑${multi ? ", og númer í röð (t.d. 2/5)" : ""}</label>${produces}</div>` : ""}
      </div>
    </div>
    <div class="gbottom">
      <button class="ghost" onclick="guideNav(-1)" ${guide.idx === 0 ? "disabled" : ""}>◀ Til baka</button>
      <span class="kbd-hint">← → eða bil</span>
      <span class="spacer"></span>
      <button class="primary" onclick="guideNav(1)">${guide.idx === total - 1 ? "Klára ✓" : "Næsta ▶"}</button>
    </div>`;
}

document.addEventListener("keydown", e => {
  if (!guide || $("guideOverlay").classList.contains("hidden")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); guideNav(1); }
  else if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); guideNav(-1); }
  else if (e.key === "Escape") { e.preventDefault(); closeGuide(); }
});

// ── VERSION POLL ─────────────────────────────────────────────────────────
let deployedVersion = null;
async function checkVersion() {
  try {
    const r = await fetch("/api/version", { cache: "no-store" });
    if (!r.ok) return;
    const { version } = await r.json();
    if (!version) return;
    if (deployedVersion === null) { deployedVersion = version; return; }
    if (version !== deployedVersion) {
      if (!currentProjectId) location.reload();
      else showUpdateBanner();
    }
  } catch {}
}
function showUpdateBanner() {
  if ($("updBanner")) return;
  const d = document.createElement("div");
  d.className = "banner no-print"; d.id = "updBanner";
  d.innerHTML = `Ný útgáfa tilbúin. <button onclick="location.reload()">Endurhlaða</button>`;
  document.body.appendChild(d);
}
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// ── FLOOR PLAN POLL (/saga) ──────────────────────────────────────────────
// The office can edit / re-confirm / un-confirm while the sawyer has the
// guide open. planSig only compares at load, so poll the row and warn.
let floorPlanBaseSig = null;
async function checkFloorPlan() {
  if (!FLOOR_MODE || !curPlan?.recordId || $("floorUpdBanner")) return;
  try {
    const rec = await airtableFetch(PLAN_TABLE, {}, curPlan.recordId);
    const f = rec.fields || {};
    if (!f[PL_CONFIRM]) return showFloorUpdBanner("Skrifstofa afturkallaði staðfestingu á þessu skipulagi.");
    if (floorPlanBaseSig && planSig(f[PL_JSON] || "") !== floorPlanBaseSig)
      showFloorUpdBanner("Skrifstofa uppfærði skipulagið — þitt er úrelt.");
  } catch {}
}
function showFloorUpdBanner(msg) {
  if ($("floorUpdBanner")) return;
  const d = document.createElement("div");
  d.className = "banner no-print"; d.id = "floorUpdBanner"; d.style.background = "#c62828";
  d.innerHTML = `${esc(msg)} <button onclick="reloadFloorPlanFresh()">Sækja nýtt skipulag</button>`;
  document.body.appendChild(d);
}
async function reloadFloorPlanFresh() {
  const btn = $("floorUpdBanner")?.querySelector("button");
  if (btn) { btn.disabled = true; btn.textContent = "Sæki…"; }
  try {
    try { localStorage.removeItem(layoutKey()); localStorage.removeItem(manualKey()); } catch {}
    manualFronts = [];
    const rec = await airtableFetch(PLAN_TABLE, {}, curPlan.recordId);
    if (!rec.fields?.[PL_CONFIRM]) { toast("Ekkert staðfest skipulag lengur — hafðu samband við skrifstofu."); return; }
    $("floorUpdBanner")?.remove();
    closeGuide();
    openFloorPlan(rec);
  } catch { if (btn) { btn.disabled = false; btn.textContent = "Reyna aftur"; } }
}
if (FLOOR_MODE) setInterval(checkFloorPlan, 90 * 1000);

// ── INIT ─────────────────────────────────────────────────────────────────
function resetAll() {
  currentProjectId = null; selectedKey = null; selectedGid = null; curPlan = null; manualFronts = []; skippedFronts = [];
  resetHistory();
  clearTimeout(planSaveTimer);
  $("searchCard").classList.remove("hidden");
  $("projectCard").classList.add("hidden");
  $("materialCard").classList.add("hidden");
  $("workspaceCard").classList.add("hidden");
  $("planStrip").innerHTML = ""; $("skippedCard").innerHTML = ""; $("planMsgCard").innerHTML = "";
  $("projectSelect").value = "";
}
$("projectSelect").addEventListener("change", e => { if (e.target.value) loadProject(e.target.value); });

if (FLOOR_MODE) {
  document.body.classList.add("floor");
  document.querySelector("h1").textContent = "Saga með leiðsögn";
  document.querySelector(".sub").textContent = "Staðfest æðaskipulag frá skrifstofu — skref fyrir skref.";
}

applyBoardSize();
$("boardSize").value = settings.boardPx;

const params = new URLSearchParams(location.search);
const recordIdParam = params.get("recordId");
if (recordIdParam) loadProject(recordIdParam);
else populateProjects();
</script>
