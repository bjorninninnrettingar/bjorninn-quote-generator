<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Verk — Björninn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* verk.html — internal floor page for ONE project.
     Reached by scanning the QR on a Zebra piece-label:
        /verk?t=<Tækifæri recordId>&k=<VERK_KEY>
     Data via /api/airtable — the ?k= widens the Tækifæri field set to include
     the internal notes / drawings / progress (see VERK_ONLY_FIELDS in the
     proxy). Built for a phone in the workshop: dark, big, scannable.
     Formatting matches eining.html/velja.html: Kumbh Sans, near-white
     secondary text, no pill chips for plain facts, per-section accent color
     on headers + (where nothing else already carries color meaning) a
     left-border on content cards. */

  :root {
    --bg:#0b0b0c; --surface:#161618; --surface2:#1e1e21;
    --line:#2a2a2e; --text:#f2f2f3; --muted:#e8e8ec;
    --blue:#0a84ff; --blue-bg:#0e2436;
    --amber:#ffd60a; --green:#4caf50; --red:#ff5a5a;
    --sec-notes:#ff9f0a; --sec-draws:#a78bfa; --sec-prog:#0a84ff; --sec-mat:#2dd4bf; --sec-units:#ff6482;
    --font:"Kumbh Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    background:var(--bg); color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .wrap { max-width:640px; margin:0 auto; padding:0 14px 60px; }

  /* sticky header — project name + the one number that matters most while
     scrolling (Afhending), pinned to the top like eining.html's unit bar */
  .sticky-hd {
    position:sticky; top:0; z-index:20;
    margin:0 -14px 16px; padding:14px;
    background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .sticky-pname { font-size:1.2rem; font-weight:800; line-height:1.25; letter-spacing:-.01em; flex:1 1 auto; min-width:0; }
  .sticky-delivery { flex:none; text-align:right; }
  .sticky-delivery .flabel { display:block; }
  .sticky-delivery .fval-big { font-size:2rem; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }

  .field-row { display:flex; gap:28px; flex-wrap:wrap; margin-bottom:4px; }
  .field { margin-bottom:0; }
  .flabel { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .fval { font-size:1.05rem; font-weight:600; }
  .fval.prio-hot { color:#ffd54a; }

  .barwrap { margin-top:16px; }
  .bar { height:8px; background:var(--surface2); border-radius:5px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--blue); border-radius:5px; }
  .bar-lbl { font-size:.72rem; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.08em; }

  /* section */
  section { margin-top:22px; }
  .sec-h { font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.13em; color:var(--muted); margin-bottom:10px; }
  #notesSec .sec-h { color:var(--sec-notes); }
  #drawsSec .sec-h { color:var(--sec-draws); }
  #progSec .sec-h { color:var(--sec-prog); }
  #matSec .sec-h { color:var(--sec-mat); }
  #unitsSec .sec-h { color:var(--sec-units); }
  #drawsSec .draw { border-left:3px solid var(--sec-draws); }

  /* notes */
  .note {
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--blue);
    border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .note.warn { border-left-color:var(--amber); }
  .note-k { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:5px; }
  .note-k.toggle { cursor:pointer; display:flex; align-items:center; justify-content:space-between; margin-bottom:0; }
  .note-k.toggle .cv { color:var(--muted); font-size:.8rem; transition:transform .15s; }
  .note-k.toggle.open .cv { transform:rotate(-90deg); }
  .note-v { font-size:.98rem; white-space:pre-wrap; word-break:break-word; }
  .note-v.collapsed { display:none; margin-top:8px; }
  .note-v:not(.collapsed) { margin-top: 5px; }
  .note-v a { color:var(--blue); }
  .pep { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .pep .note { flex:1 1 46%; border-left-color:var(--green); margin:0; }

  /* drawings */
  .draws { display:flex; flex-direction:column; gap:8px; }
  .draw {
    display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px; font-size:1rem; font-weight:600;
  }
  .draw:active { background:var(--surface2); }
  .draw .ic { font-size:1.5rem; flex:none; }
  .draw .ct { margin-left:auto; font-size:.85rem; color:var(--muted); font-weight:700; }
  .draw-grp { cursor:pointer; }
  .draw-grp .cv { margin-left:auto; color:var(--muted); font-size:.8rem; font-weight:700; transition:transform .15s; }
  .draw-grp.open .cv { transform:rotate(90deg); }
  .draw-sub { display:none; flex-direction:column; gap:6px; margin:2px 0 4px 34px; }
  .draw-sub.open { display:flex; }
  .draw-sub a {
    display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text);
    background:var(--surface2); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; font-size:.9rem;
  }
  .draw-sub a .ct { margin-left:auto; font-size:.78rem; color:var(--muted); font-weight:700; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; margin-top:4px; }
  .imgs a { display:block; }
  .imgs img { width:100%; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }

  /* progress rows */
  .prow { margin-bottom:14px; }
  .prow-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
  .prow-name { font-size:.92rem; font-weight:700; }
  .prow-num { font-size:.82rem; color:var(--muted); }
  .prow .bar > i.g { background:var(--green); }

  /* materials — colored/swatch rows for actual board materials, plain rows
     (no color meaning available) for hardware picks + order status */
  .mat { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .mat > * { border-top:1px solid var(--line); }
  .mat > *:first-child { border-top:0; }
  .matrow { display:flex; align-items:center; gap:14px; padding:12px 14px; }
  .mat-swatch-link { flex:none; display:block; }
  .mat-swatch { width:64px; height:64px; border-radius:9px; object-fit:cover; display:block; border:1px solid rgba(255,255,255,.25); }
  .mat-swatch-link:active .mat-swatch { opacity:.8; }
  .mat-cat { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .mat-name { font-size:.95rem; font-weight:600; color:var(--text); margin-top:1px; }
  .mrow { display:grid; grid-template-columns:96px 1fr; gap:10px; padding:11px 14px; font-size:.9rem; }
  .mrow .mk { color:var(--muted); }
  .mrow .mv { color:var(--text); }
  .mrow.order .mv { font-weight:700; }
  /* hardware row (Höldur) — same visual treatment as a matrow (swatch +
     category + name) but no colored border: it's a product, not a board
     material, so there's no "same material = same color" idea to express. */
  .hwrow { display:flex; align-items:center; gap:14px; padding:12px 14px; }

  /* units (Eyðublað) — grouped by Rými, collapsible, searchable */
  .usearch {
    width:100%; padding:12px 14px; margin-bottom:10px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-family:var(--font); font-size:.95rem;
  }
  .usearch::placeholder { color:var(--muted); }
  .rgroup {
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--sec-units);
    border-radius:10px; overflow:hidden; margin-bottom:10px;
  }
  .rhead {
    display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;
    font-weight:800; font-size:.98rem;
  }
  .rhead .rcount { color:var(--muted); font-weight:700; font-size:.85rem; }
  .rhead .cv { margin-left:auto; color:var(--muted); font-size:.85rem; transition:transform .15s; }
  .rhead.open .cv { transform:rotate(90deg); }
  .rbody { display:none; flex-direction:column; }
  .rbody.open { display:flex; }
  .rbody a { text-decoration:none; color:var(--text); border-top:1px solid var(--line); }
  .rbody a:active { background:var(--surface2); }
  .urow {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px 12px 20px;
  }
  .urow .uname { font-weight:700; font-size:.95rem; }
  .urow .usub { color:var(--muted); font-size:.82rem; font-weight:400; margin-top:1px; }
  .urow .arrow { color:var(--muted); flex:none; }

  /* tools */
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tool {
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--blue-bg); border:1px solid #1c3a52; color:var(--blue);
    border-radius:10px; padding:16px 10px; font-size:.98rem; font-weight:800;
    text-decoration:none; text-align:center;
  }
  .tool:active { background:#123048; }

  #loading,#error { text-align:center; color:var(--muted); padding:70px 20px; }
  #error strong { display:block; color:var(--text); font-size:1.1rem; margin-bottom:6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" style="padding-top:70px;">Sæki verk…</div>
  <div id="error" class="hidden" style="padding-top:70px;">
    <strong>Fann ekki verkið</strong>
    QR-kóðinn gæti verið úreltur eða hlekkinn vantar lykil.
  </div>

  <div id="content" class="hidden">
    <div class="sticky-hd">
      <span class="sticky-pname" id="pname">—</span>
      <div class="sticky-delivery hidden" id="deliveryField">
        <span class="flabel">Afhending</span>
        <span class="fval-big" id="deliveryVal"></span>
      </div>
    </div>

    <div class="field-row">
      <div class="field hidden" id="stageField"><span class="flabel">Staða</span><br><span class="fval" id="stageVal"></span></div>
      <div class="field hidden" id="prioField"><span class="flabel">Forgangur</span><br><span class="fval" id="prioVal"></span></div>
    </div>
    <div class="barwrap hidden" id="wbar">
      <div class="bar"><i id="wbarFill" style="width:0%"></i></div>
      <div class="bar-lbl">Heildarframvinda framleiðslu · <span id="wbarPct">0%</span></div>
    </div>

    <section id="notesSec" class="hidden">
      <div class="sec-h">⚠️ Muna</div>
      <div id="notes"></div>
    </section>

    <section id="drawsSec" class="hidden">
      <div class="sec-h">Teikningar</div>
      <div class="draws" id="draws"></div>
      <div class="imgs" id="imgs"></div>
    </section>

    <section id="progSec" class="hidden">
      <div class="sec-h">Framvinda</div>
      <div id="prog"></div>
    </section>

    <section id="matSec" class="hidden">
      <div class="sec-h">Efni</div>
      <div class="mat" id="mat"></div>
    </section>

    <section id="unitsSec" class="hidden">
      <div class="sec-h">Eyðublað</div>
      <input type="search" class="usearch" id="unitSearch" placeholder="Leita að einingu…" autocomplete="off">
      <div id="unitsList"></div>
    </section>

    <section id="toolsSec">
      <div class="sec-h">Opna</div>
      <div class="tools" id="tools"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var PROXY = "/api/airtable";
  var TABLE = "tbl4LMXlQjp66RFKI";
  var UNIT_TABLE = "tbl0WcyHhz63pSzZX";
  var MATERIALS_TABLE = "tbl8CrVWKF8CuI7HD";

  var F = {
    name:"Heiti tækifæris / verkefnis",
    stage:"Staða í framleiðslu",
    prio:"Forgangur framleiðslu 🥇",
    delivery:"Áætlaður afhendingardagur Björninn (internal)",
    start:"Upphafs framleiðsludagur verks",
    weighted:"Framvinda framleiðslu [weighted]",

    nGeneral:"🧠📌Það sem þarf að hafa í huga",
    nFraes:"🔬📌 Það sem Fræsari þarf að hafa í huga",
    nSpon:"🪵📌 Það sem spónlagning þarf að hafa í huga",
    nUpp:"🪛📌 Það sem uppsetningaraðili þarf að hafa í huga❗",
    nTeikn:"Ýtarleg verklýsing teiknara📝",
    nDrawers:"Skúffusamantekt",
    nMeeting:"Verkfundar glósur",
    goal:"🎯 Markmið:",
    pep:"🚀 Pepp verksins:",

    dFinal:"Loka teikningar verkefnis 📋",
    dMill:"Sér fræsi teikningar",
    dDims:"Málsettar myndir af rými 🖼️",
    dSketch:"Teikningar af tækifæri ✍️",
    dAppl:"Heimilistæki verkefnis",

    pgSaw:"Framvinda sögunar",
    pgMill:"Framvinda fræsingar",
    pgGen:"Framvinda almennar framleiðslu",
    sawTodo:"Fjöldi varahluta til að saga",
    sawDone:"Fjöldi varahluta sagaðir",
    millTodo:"Fjöldi eininga til að fræsa",
    millDone:"Fjöldi eininga búið að fræsa ✅",
    orderStatus:"Staða á efnispöntun",

    mCarcase:"Heiti efnis (from Skrokka efni 🔲 viðskiptavinar)",
    mFront1:"Heiti efnis (from Fronta efni viðskiptavinar 🖼️)",
    mFront2:"Heiti efnis (from Fronta efni 2.0 Viðskiptavinar 🖼️)",
    mDoor1:"Heiti efnis (from Hurðaefni viðskiptavinar 🚪)",
    mDoor2:"Heiti efnis (from Hurðaefni viðskiptavinar 🚪 2.0)",
    mWorktop:"Heiti efnis (from Borðplata viðskiptavinar 🍽️)",
    mHandle1:"Heiti vöru 📣 (from Höldur Viðskiptavinar ✊)",
    mHandle2:"Heiti vöru 📣 (from Höldur Viðskiptavinar ✊2.0)",
    mHandle1Img:"Mynd af Höldum Viðskiptavinar ✊",
    mHandle2Img:"Mynd Höldur Viðskiptavinar ✊2.0"
  };

  var IS_MONTHS = ["janúar","febrúar","mars","apríl","maí","júní","júlí","ágúst","september","október","nóvember","desember"];
  function $(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function arr(v){ return Array.isArray(v)?v:(v==null||v===""?[]:[v]); }
  function txt(v){ return arr(v).filter(function(x){return x!=null&&x!=="";}).join(" / ").trim(); }
  function num(v){ var n=Number(v); return Number.isFinite(n)?n:0; }
  function pct(raw){
    if (raw==null||raw==="") return null;
    var n = (raw>0&&raw<=1)?Math.round(raw*100):Math.round(num(raw));
    return Math.max(0,Math.min(100,n));
  }
  function fmtDate(v){
    var s=txt(v); if(!s) return "";
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return parseInt(m[3],10)+". "+IS_MONTHS[parseInt(m[2],10)-1]+" "+m[1];
    return s;
  }
  function md(src){
    var s=esc(src).trim();
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    return s.replace(/\n/g,"<br>");
  }

  // Deterministic color per material name — same function as eining.html, so
  // a material shared between the two pages reads as the same color.
  function colorForKey(key){
    var hash = 0;
    for (var i=0;i<key.length;i++) hash = (hash*31 + key.charCodeAt(i)) | 0;
    var hue = Math.abs(hash) % 360;
    return "hsl(" + hue + ",70%,68%)";
  }

  // Swatch thumbnail that opens the FULL-resolution original in a new tab on
  // tap — so someone can hold the real board/handle up next to their phone
  // and actually compare it, not just squint at a 64px thumbnail.
  function swatchLink(att){
    if (!att) return "";
    var t = (att.thumbnails && (att.thumbnails.large || att.thumbnails.small)) || {};
    var thumb = t.url || att.url, full = att.url || t.url;
    if (!thumb) return "";
    return '<a class="mat-swatch-link" href="'+esc(full)+'" target="_blank" rel="noopener">'+
      '<img class="mat-swatch" src="'+esc(thumb)+'" alt="" loading="lazy" onerror="this.closest(\'a\').remove()"></a>';
  }

  // encodeURIComponent, NOT URLSearchParams — see eining.html for why
  // (URLSearchParams turns spaces into "+", which corrupts filterByFormula
  // here). Material names and field names both contain spaces, so this
  // matters the moment we query Efnislisti/Eyðublað, not just the main fetch.
  function fetchJson(path, params, k){
    var all = Object.assign({ path: path }, params || {});
    if (k) all.k = k;
    var qs = Object.keys(all).map(function(key){
      return encodeURIComponent(key) + "=" + encodeURIComponent(all[key]);
    }).join("&");
    return fetch(PROXY + "?" + qs).then(function(r){
      return r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status));
    });
  }
  function fetchAll(path, params, k){
    var records = [];
    function page(offset){
      var p = Object.assign({}, params||{});
      if (offset) p.offset = offset;
      return fetchJson(path, p, k).then(function(data){
        records = records.concat(data.records||[]);
        return data.offset ? page(data.offset) : records;
      });
    }
    return page();
  }

  function note(sec, key, val, opts){
    var v = txt(val);
    if (!v) return;
    opts = opts || {};
    var d = document.createElement("div");
    d.className = "note" + (opts.warn ? " warn" : "");
    d.innerHTML = '<div class="note-k">'+esc(key)+'</div><div class="note-v">'+
                  (opts.md ? md(v) : esc(v)) + '</div>';
    sec.appendChild(d);
  }

  // Skúffusamantekt is usually a long per-cabinet drawer breakdown — worth
  // having, not worth it taking up a screen's height by default.
  function collapsibleNote(sec, key, val){
    var v = txt(val);
    if (!v) return;
    var d = document.createElement("div");
    d.className = "note";
    d.innerHTML =
      '<div class="note-k toggle"><span>'+esc(key)+'</span><span class="cv">▸</span></div>'+
      '<div class="note-v collapsed">'+esc(v)+'</div>';
    var head = d.querySelector(".note-k");
    var body = d.querySelector(".note-v");
    head.addEventListener("click", function(){
      head.classList.toggle("open");
      body.classList.toggle("collapsed");
    });
    sec.appendChild(d);
  }

  function renderNotes(f){
    var box = $("notes");

    // Markmið/Pepp first — morale before task list.
    var goal = txt(f[F.goal]), pep = txt(f[F.pep]);
    if (goal || pep) {
      var wrap = document.createElement("div");
      wrap.className = "pep";
      if (goal) wrap.innerHTML += '<div class="note"><div class="note-k">🎯 Markmið</div><div class="note-v">'+esc(goal)+'</div></div>';
      if (pep)  wrap.innerHTML += '<div class="note"><div class="note-k">🚀 Pepp</div><div class="note-v">'+esc(pep)+'</div></div>';
      box.appendChild(wrap);
    }

    note(box, "Spónlagning 🪵", f[F.nSpon], {warn:true});
    note(box, "Verklýsing teiknara 📝", f[F.nTeikn]);
    collapsibleNote(box, "Skúffusamantekt", f[F.nDrawers]);
    note(box, "Verkfundur 🗒️", f[F.nMeeting], {md:true});

    if (box.children.length) show($("notesSec"));
  }

  function ext(a){ return (a.filename||"").split(".").pop().toUpperCase(); }

  function drawRow(icon, label, atts){
    var list = arr(atts);
    if (!list.length) return;
    var imgs = list.filter(function(a){ return a && /^image\//.test(a.type||""); });
    var docs = list.filter(function(a){ return !(a && /^image\//.test(a.type||"")); });

    if (docs.length === 1) {
      var a = docs[0];
      var el = document.createElement("a");
      el.className = "draw";
      el.href = a.url; el.target = "_blank"; el.rel = "noopener";
      el.innerHTML = '<span class="ic">'+icon+'</span><span>'+esc(label)+'</span>'+
        '<span class="ct">'+esc(ext(a))+'</span>';
      $("draws").appendChild(el);
    } else if (docs.length > 1) {
      var head = document.createElement("div");
      head.className = "draw draw-grp";
      head.innerHTML = '<span class="ic">'+icon+'</span><span>'+esc(label)+'</span>'+
        '<span class="ct">'+docs.length+' skjöl</span><span class="cv">▸</span>';
      var sub = document.createElement("div");
      sub.className = "draw-sub";
      sub.innerHTML = docs.map(function(a, i){
        return '<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+
               esc((a.filename && a.filename.replace(/\.[^.]+$/,"")) || (label+" "+(i+1)))+
               '<span class="ct">'+esc(ext(a))+'</span></a>';
      }).join("");
      head.addEventListener("click", function(){
        head.classList.toggle("open");
        sub.classList.toggle("open");
      });
      $("draws").appendChild(head);
      $("draws").appendChild(sub);
    }

    imgs.forEach(function(a){
      var t = (a.thumbnails && (a.thumbnails.large||a.thumbnails.full)) || {};
      var el = document.createElement("a");
      el.href = a.url; el.target = "_blank"; el.rel = "noopener";
      el.innerHTML = '<img src="'+esc(t.url||a.url)+'" alt="'+esc(label)+'" loading="lazy" onerror="this.closest(\'a\').remove()">';
      $("imgs").appendChild(el);
    });
  }

  // Only Lokateikningar — the other project-drawing types (sérfræsi,
  // málsettar myndir, teikningar af tækifæri, heimilistæki) were cut from
  // both /verk and /eining on request. They're not shown anywhere anymore;
  // say so if you ever need them back.
  function renderDraws(f){
    drawRow("📋", "Lokateikningar", f[F.dFinal]);
    if ($("draws").children.length || $("imgs").children.length) show($("drawsSec"));
  }

  function progRow(name, p, detail){
    if (p == null) return;
    var d = document.createElement("div");
    d.className = "prow";
    d.innerHTML =
      '<div class="prow-top"><span class="prow-name">'+esc(name)+'</span>'+
      '<span class="prow-num">'+(detail?esc(detail)+" · ":"")+p+'%</span></div>'+
      '<div class="bar"><i class="'+(p>=100?"g":"")+'" style="width:'+p+'%"></i></div>';
    $("prog").appendChild(d);
  }

  function renderProg(f){
    var sawT=num(f[F.sawTodo]), sawD=num(f[F.sawDone]);
    var milT=num(f[F.millTodo]), milD=num(f[F.millDone]);
    progRow("Sögun", pct(f[F.pgSaw]), sawT?sawD+"/"+sawT+" varahlutir":"");
    progRow("Fræsing", pct(f[F.pgMill]), milT?milD+"/"+milT+" einingar":"");
    progRow("Almenn framleiðsla", pct(f[F.pgGen]), "");
    if ($("prog").children.length) show($("progSec"));
  }

  // Board materials (Skrokkar/Frontar/Hurðaefni/Borðplata) get a swatch photo
  // + a deterministic color (same colorForKey as eining.html's Sögun &
  // fræsing, so a shared material reads as the same color on both pages) —
  // matched by exact name against Efnislisti, same approach as eining.html.
  // Höldur (hardware, not a board) and Efnispöntun (a status, not a material)
  // stay plain rows — there's no board material behind them to color.
  function renderMat(f){
    var matEntries = [];
    function addMat(cat, vals) {
      vals.forEach(function(v){ if (v) matEntries.push([cat, v]); });
    }
    addMat("Skrokkar", [txt(f[F.mCarcase])]);
    addMat("Frontar", [txt(f[F.mFront1]), txt(f[F.mFront2])]);
    addMat("Hurðaefni", [txt(f[F.mDoor1]), txt(f[F.mDoor2])]);
    addMat("Borðplata", [txt(f[F.mWorktop])]);

    // Höldur gets its own swatch too, straight from the Tækifæri record's
    // own "Mynd af Höldum ... " lookups (already resolved, same fields the
    // customer portal uses) — no extra fetch needed for these two.
    var handleEntries = [];
    if (txt(f[F.mHandle1])) handleEntries.push([txt(f[F.mHandle1]), arr(f[F.mHandle1Img])[0]]);
    if (txt(f[F.mHandle2])) handleEntries.push([txt(f[F.mHandle2]), arr(f[F.mHandle2Img])[0]]);

    var plainRows = [];
    var order = txt(f[F.orderStatus]);
    if (order) plainRows.push(["Efnispöntun", order, true]);

    if (!matEntries.length && !handleEntries.length && !plainRows.length) return;

    var names = [...new Set(matEntries.map(function(e){ return e[1]; }))];
    var imgsPromise = names.length
      ? fetchAll(MATERIALS_TABLE, {
          filterByFormula: "OR(" + names.map(function(n){
            return "{Heiti efnis}=\"" + n.replace(/"/g,'\\"') + "\"";
          }).join(",") + ")"
        }, null)
          .then(function(recs){
            var imgs = {};
            recs.forEach(function(r){
              var rf = r.fields || {};
              var att = arr(rf["Mynd 🖼️"])[0];
              if (!att) return;
              imgs[txt(rf["Heiti efnis"])] = att;
            });
            return imgs;
          })
          .catch(function(e){ console.error("Efnislisti swatch fetch failed:", e); return {}; })
      : Promise.resolve({});

    imgsPromise.then(function(imgs){
      var matHtml = matEntries.map(function(e){
        var cat = e[0], name = e[1];
        var c = colorForKey(name);
        return '<div class="matrow" style="border-left:3px solid '+c+';">'+swatchLink(imgs[name])+
          '<div><div class="mat-cat">'+esc(cat)+'</div><div class="mat-name">'+esc(name)+'</div></div></div>';
      }).join("");
      var handleHtml = handleEntries.map(function(e){
        var name = e[0], att = e[1];
        return '<div class="hwrow">'+swatchLink(att)+
          '<div><div class="mat-cat">Höldur</div><div class="mat-name">'+esc(name)+'</div></div></div>';
      }).join("");
      var plainHtml = plainRows.map(function(r){
        return '<div class="mrow'+(r[2]?" order":"")+'"><span class="mk">'+esc(r[0])+
               '</span><span class="mv">'+esc(r[1])+'</span></div>';
      }).join("");
      $("mat").innerHTML = matHtml + handleHtml + plainHtml;
      show($("matSec"));
    });
  }

  // All units (Eyðublað) in this project, grouped by Rými (collapsible) and
  // sorted by Tegund within each room, each linking into /eining for its own
  // vörur/eiginleikar/skurðarlisti. Exact match on both project-link fields
  // (old + new; some units are only linked via the old one), same reasoning
  // as everywhere else: FIND/substring is fine at the project-name level
  // (long, distinctive strings) but exact equality is what's safe.
  function renderUnits(projectName, projectId, k){
    if (!projectName) return;
    var formula = "OR(ARRAYJOIN({Tækifæri 📣 (projects)})=\""+projectName.replace(/"/g,'\\"')+"\", "+
                  "ARRAYJOIN({Tækifæri 📣})=\""+projectName.replace(/"/g,'\\"')+"\")";
    fetchAll(UNIT_TABLE, { filterByFormula: formula, pageSize: 100 }, k)
      .then(function(recs){
        if (!recs.length) return;

        var byRoom = new Map();
        recs.forEach(function(r){
          var room = txt((r.fields||{})["Heiti rýmis"]) || "Án rýmis";
          if (!byRoom.has(room)) byRoom.set(room, []);
          byRoom.get(room).push(r);
        });
        var rooms = [...byRoom.keys()].sort(function(a,b){ return a.localeCompare(b,"is"); });

        $("unitsList").innerHTML = rooms.map(function(room){
          var units = byRoom.get(room).slice().sort(function(a,b){
            var af = a.fields||{}, bf = b.fields||{};
            var ta = txt(af["Tegund einingu"]), tb = txt(bf["Tegund einingu"]);
            if (ta !== tb) return ta.localeCompare(tb, "is");
            return txt(af["Athugasemd"]).localeCompare(txt(bf["Athugasemd"]), "is", {numeric:true});
          });
          var rows = units.map(function(r){
            var uf = r.fields || {};
            var name = txt(uf["Athugasemd"]) || "Eining";
            var tegund = txt(uf["Tegund einingu"]);
            var href = "/eining?u="+encodeURIComponent(r.id)+"&p="+encodeURIComponent(projectId)+"&k="+encodeURIComponent(k);
            return '<a href="'+href+'" data-name="'+esc(name.toLowerCase())+'">'+
              '<div class="urow"><div><div class="uname">'+esc(name)+'</div>'+
              (tegund?'<div class="usub">'+esc(tegund)+'</div>':'')+'</div>'+
              '<span class="arrow">→</span></div></a>';
          }).join("");
          var rc = colorForKey(room);
          return '<div class="rgroup" data-room="'+esc(room.toLowerCase())+'" style="border-left:3px solid '+rc+';">'+
            '<div class="rhead"><span style="color:'+rc+';">'+esc(room)+'</span><span class="rcount">'+units.length+'</span><span class="cv">▸</span></div>'+
            '<div class="rbody">'+rows+'</div></div>';
        }).join("");

        $("unitsList").querySelectorAll(".rhead").forEach(function(head){
          var body = head.nextElementSibling;
          head.addEventListener("click", function(){
            head.classList.toggle("open");
            body.classList.toggle("open");
          });
        });

        show($("unitsSec"));
      })
      .catch(function(e){ console.error("Eyðublað fetch failed:", e); });
  }

  // Filters units by name as you type, auto-expanding rooms with a match and
  // collapsing everything again once the search is cleared.
  $("unitSearch").addEventListener("input", function(){
    var qv = this.value.trim().toLowerCase();
    $("unitsList").querySelectorAll(".rgroup").forEach(function(g){
      var anyMatch = false;
      g.querySelectorAll(":scope > .rbody > a").forEach(function(a){
        var match = !qv || (a.dataset.name || "").indexOf(qv) !== -1;
        a.classList.toggle("hidden", !match);
        if (match) anyMatch = true;
      });
      g.classList.toggle("hidden", !anyMatch);
      var head = g.querySelector(".rhead"), body = g.querySelector(".rbody");
      head.classList.toggle("open", !!qv && anyMatch);
      body.classList.toggle("open", !!qv && anyMatch);
    });
  });

  function renderTools(t){
    var tools = [
      ["Skurðarlisti","/cutlist?recordId="+t],
      ["Fræsing","/fraesing?recordId="+t],
      ["Merkingar","/labels?recordId="+t],
      ["Æðaskipulag","/saga"]
    ];
    $("tools").innerHTML = tools.map(function(x){
      return '<a class="tool" href="'+x[1]+'">'+esc(x[0])+'</a>';
    }).join("");
  }

  function render(rec, projectId, k){
    var f = rec.fields || {};
    var pname = txt(f[F.name]).replace(/[\s,–—-]+$/,"").trim() || "Verk";
    $("pname").textContent = pname;

    var stage = txt(f[F.stage]);
    if (stage) { $("stageVal").textContent = stage; show($("stageField")); }

    var prio = txt(f[F.prio]);
    if (prio) {
      $("prioVal").textContent = prio;
      $("prioVal").classList.toggle("prio-hot", /^1/.test(prio));
      show($("prioField"));
    }

    var del = fmtDate(f[F.delivery]);
    if (del) { $("deliveryVal").textContent = del; show($("deliveryField")); }

    var w = pct(f[F.weighted]);
    if (w != null) {
      $("wbarFill").style.width = w+"%";
      $("wbarPct").textContent = w+"%";
      show($("wbar"));
    }

    try { renderNotes(f); } catch(e){}
    try { renderDraws(f); } catch(e){}
    try { renderProg(f); } catch(e){}
    try { renderMat(f); } catch(e){}
    try { renderUnits(pname, projectId, k); } catch(e){}
    renderTools(projectId);

    hide($("loading"));
    show($("content"));
  }

  var q = new URLSearchParams(location.search);
  var t = q.get("t"), k = q.get("k");
  if (!t || !/^rec[A-Za-z0-9]{14}$/.test(t) || !k) {
    hide($("loading")); show($("error")); return;
  }

  fetchJson(TABLE + "/" + t, {}, k)
    .then(function(rec){ if(!rec||!rec.fields) return Promise.reject(new Error("no record")); render(rec, t, k); })
    .catch(function(e){ console.error(e); hide($("loading")); show($("error")); });
})();
</script>
</body>
</html>
