<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Eining — Björninn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* eining.html — internal page for ONE unit (Eyðublað). Reached from /velja
     after scanning a piece's Zebra label. The Vörur/Eiginleikar field lists
     mirror, field-for-field, what the "samsetningar prentunar" Airtable
     automation puts on the physical assembly label — so the digital and
     printed views of a unit agree. */
  :root {
    --bg:#0b0b0c; --surface:#161618; --surface2:#1e1e21;
    --line:#2a2a2e; --text:#f2f2f3; --muted:#e8e8ec;
    --blue:#0a84ff; --blue-bg:#0e2436;
    --amber:#ffd60a; --green:#4caf50;
    --font:"Kumbh Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    background:var(--bg); color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .wrap { max-width:640px; margin:0 auto; padding:0 14px 60px; }

  /* sticky unit header — bleeds to the wrap's edges so it reads as a full
     bar while pinned, with its own opaque background so content doesn't
     show through while scrolling underneath it */
  .sticky-hd {
    position:sticky; top:0; z-index:20;
    margin:0 -14px 16px; padding:14px;
    background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .sticky-hd .uname { font-size:1.55rem; font-weight:800; letter-spacing:-.01em; }
  .sticky-hd .proj-link { color:var(--amber); font-size:.85rem; font-weight:700; text-decoration:none; white-space:nowrap; }

  .field-row { display:flex; gap:28px; flex-wrap:wrap; margin-bottom:12px; }
  .field-row .field { margin-bottom:0; }
  .field { margin-bottom:12px; }
  .flabel { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .fval { font-size:1.05rem; font-weight:600; }
  .fval-big { font-size:1.55rem; font-weight:800; letter-spacing:-.01em; }
  .tnote { font-size:.82rem; color:var(--amber); margin-top:6px; padding-top:6px; border-top:1px dashed var(--line); }

  /* per-section accent colors — purely a wayfinding aid so each table reads
     as its own thing while scanning/scrolling, no other meaning attached */
  :root {
    --sec-draws:#a78bfa; --sec-tree:#0a84ff; --sec-props:#2dd4bf; --sec-cut:#ff9f0a;
  }
  section { margin-top:22px; }
  .sec-h { font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.13em; color:var(--muted); margin-bottom:10px; }
  #drawsSec .sec-h { color:var(--sec-draws); }
  #treeSec .sec-h { color:var(--sec-tree); }
  #propSec .sec-h { color:var(--sec-props); }
  #cutSec .sec-h { color:var(--sec-cut); }
  #drawsSec .draw-grp { border-left:3px solid var(--sec-draws); }
  #treeSec .tgroup { border-left:3px solid var(--sec-tree); }
  #propSec .list { border-left:3px solid var(--sec-props); }
  #cutSec .ctable { border-left:3px solid var(--sec-cut); }

  /* drawings dropdown */
  .draw-grp {
    display:flex; align-items:center; gap:12px; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:13px 14px; font-weight:700; font-size:.95rem;
    text-decoration:none; color:var(--text);
  }
  .draw-imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .draw-imgs a { display:block; }
  .draw-imgs img { width:100%; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .draw-grp .ic { font-size:1.2rem; }
  .draw-grp .ct { margin-left:auto; color:var(--muted); font-size:.82rem; font-weight:700; }
  .draw-grp .cv { color:var(--muted); font-size:.8rem; transition:transform .15s; }
  .draw-grp.open .cv { transform:rotate(90deg); }
  .draw-sub { display:none; flex-direction:column; gap:6px; margin:6px 0 0 10px; }
  .draw-sub.open { display:flex; }
  .draw-sub a {
    display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text);
    background:var(--surface2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-size:.88rem;
  }
  .draw-sub a .ct { margin-left:auto; font-size:.76rem; color:var(--muted); font-weight:700; }

  /* generic list (Vörur / Eiginleikar) */
  .list { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .item { display:flex; justify-content:space-between; gap:10px; padding:11px 14px; font-size:.92rem; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .k { color:var(--text); }
  .item .v { color:var(--text); text-align:right; flex:none; max-width:55%; }

  /* compact skúffur/hillur tree */
  .tree { display:flex; flex-direction:column; gap:12px; }
  .tgroup { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tgroup .th { font-weight:800; font-size:.95rem; margin-bottom:6px; }
  .tgroup .th .n { color:var(--muted); font-weight:700; }
  .tleaf { display:flex; gap:8px; font-size:.9rem; padding:3px 0; }
  .tleaf .branch { color:var(--muted); flex:none; }
  .tleaf .lv { color:var(--text); }

  /* sögun/fræsing combined table */
  .ctable { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .ct-head, .crow2 { display:grid; grid-template-columns:1fr 52px 52px; align-items:center; }
  .ct-head { padding:8px 14px; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .ct-head span { text-align:center; }
  .ct-head span:first-child { text-align:left; }
  .mat-head {
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; font-size:1.1rem; font-weight:800; color:var(--text);
    background:var(--surface2); border-top:1px solid var(--line);
  }
  .mat-swatch { width:34px; height:34px; border-radius:7px; object-fit:cover; flex:none; border:1px solid rgba(255,255,255,.25); }
  .crow2 { padding:11px 14px; border-top:1px solid var(--line); }
  .crow2 .p { font-weight:700; font-size:.92rem; color:var(--text); }
  .crow2 .d { font-size:.82rem; color:var(--text); margin-top:1px; }
  .cstat { text-align:center; font-size:1.05rem; }
  .cstat.ok { color:var(--green); }
  .cstat.na { color:var(--muted); opacity:.5; }

  .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tool {
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--blue-bg); border:1px solid #1c3a52; color:var(--blue);
    border-radius:10px; padding:16px 10px; font-size:.95rem; font-weight:800;
    text-decoration:none; text-align:center;
  }
  .tool:active { background:#123048; }

  #loading,#error { text-align:center; color:var(--muted); padding:70px 20px; }
  #error strong { display:block; color:var(--text); font-size:1.1rem; margin-bottom:6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" style="padding-top:70px;">Sæki einingu…</div>
  <div id="error" class="hidden" style="padding-top:70px;">
    <strong>Fann ekki einingu</strong>
    QR-kóðinn gæti verið úreltur eða hlekkinn vantar lykil.
  </div>

  <div id="content" class="hidden">
    <div class="sticky-hd">
      <span class="uname" id="uname">—</span>
      <a class="proj-link hidden" id="projLink">Skoða allt verkefnið →</a>
    </div>

    <div class="field-row">
      <div class="field hidden" id="roomField"><span class="flabel">Rými</span><br><span class="fval" id="roomVal"></span></div>
      <div class="field hidden" id="tegundField"><span class="flabel">Tegund</span><br><span class="fval" id="tegundVal"></span></div>
      <div class="field hidden" id="dimsField"><span class="flabel">Mál</span><br><span class="fval-big" id="dimsVal"></span></div>
    </div>

    <section id="drawsSec" class="hidden">
      <div class="sec-h">Teikningar</div>
      <div id="draws" style="display:flex;flex-direction:column;gap:8px;"></div>
      <div class="draw-imgs" id="drawImgs" style="margin-top:8px;"></div>
    </section>

    <section id="treeSec" class="hidden">
      <div class="sec-h">Skúffur &amp; hillur</div>
      <div class="tree" id="tree"></div>
    </section>

    <section id="propSec" class="hidden">
      <div class="sec-h">Eiginleikar</div>
      <div class="list" id="propList"></div>
    </section>

    <section id="cutSec" class="hidden">
      <div class="sec-h">Sögun &amp; fræsing</div>
      <div class="ctable">
        <div class="ct-head"><span>Stykki</span><span>SÖG</span><span>FRÆS</span></div>
        <div id="cutList"></div>
      </div>
    </section>

    <section id="toolsSec" class="hidden">
      <div class="sec-h">Opna</div>
      <div class="tools" id="tools"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var PROXY = "/api/airtable";
  var UNIT_TABLE = "tbl0WcyHhz63pSzZX";
  var PROJECT_TABLE = "tbl4LMXlQjp66RFKI";
  var PRODUCTS_TABLE = "tblzuuRSRkeXaLWxC";
  var MATERIALS_TABLE = "tbl8CrVWKF8CuI7HD";
  var SOGUNARLISTI_TABLE = "tblhdgyvTcBfP8kov";

  function $(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function arr(v){ return Array.isArray(v)?v:(v==null||v===""?[]:[v]); }
  function txt(v){ return arr(v).filter(function(x){return x!=null&&x!=="";}).join(" / ").trim(); }
  function num(v){ var n=Number(v); return Number.isFinite(n)?n:0; }

  // Deterministic color per material name — pure wayfinding, same material
  // always gets the same hue so it's recognizable at a glance while scrolling.
  function colorForKey(key){
    var hash = 0;
    for (var i=0;i<key.length;i++) hash = (hash*31 + key.charCodeAt(i)) | 0;
    var hue = Math.abs(hash) % 360;
    return "hsl(" + hue + ",70%,68%)";
  }

  // encodeURIComponent, NOT URLSearchParams — URLSearchParams serializes
  // spaces as "+", which the request parser here doesn't decode back to a
  // space, corrupting any filterByFormula that references a field name with
  // a space in it (e.g. {Eyðublað ✏️}). Same gotcha noted across grain.html
  // and the other tools; encodeURIComponent always emits %20 instead.
  function fetchJson(path, params, k){
    var all = Object.assign({ path: path }, params || {});
    if (k) all.k = k;
    var qs = Object.keys(all).map(function(key){
      return encodeURIComponent(key) + "=" + encodeURIComponent(all[key]);
    }).join("&");
    return fetch(PROXY + "?" + qs).then(function(r){
      return r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status));
    });
  }
  function fetchAll(path, params, k){
    var records = [];
    function page(offset){
      var p = Object.assign({}, params||{});
      if (offset) p.offset = offset;
      return fetchJson(path, p, k).then(function(data){
        records = records.concat(data.records||[]);
        return data.offset ? page(data.offset) : records;
      });
    }
    return page();
  }

  // ── field spec tables, mirroring the samsetningar assembly-label script ──
  var HW_LINKS = [
    ["Höldur 1","Höldur 1 magn"], ["Höldur 2","Höldur 2 magn"],
    ["LED","LED magn"], ["Fataslár","Fataslár magn"],
    ["Straumbreytar","Straumbreytar magn"], ["Útdrög","Útdrög magn"],
    ["AMBIA","AMBIA magn"], ["Hnífaparabakkar","Hnífaparabakkar magn"],
    ["Rusl","Rusl magn"], ["Fatalyftur","Fatalyftur magn"],
    ["Loftunarrist","Loftunarristar magn"], ["Stök vara","Stök vara magn"],
    ["Harðplast", null], ["Töfrahorn útfærsla", null],
    ["Skrá [Hurð]", null], ["Felliþr. [Hurð]", null], ["Lamir [Hurð]", null],
  ];
  var PROP_BOOL = [
    ["Rastex","Rastex"], ["Tveir frontar (væng)","Vænghurð"],
    ["Mottur í skúffur","Mottur í sk."], ["550mm skúffur?","550mm skúffur"],
    ["Úrtaksskúffa?","Úrtaksskúffa"], ["Harðplast?","Harðplast"],
    ["Flatpakkaður","Flatpakkaður"], ["Kassi án fronts","Kassi án fronts"],
    ["Lagnaskápur","Lagnaskápur"], ["Ofnaskápur","Ofnaskápur"],
    ["Kassi úr frontaefni","FRE kassi"],
  ];
  var PROP_SELECT = [
    ["Grip?","Grip"],
    ["Skipting fronta [Lárétt]","Sk. lárétt"], ["Skipting fronta [Lóðrétt]","Sk. lóðrétt"],
    ["Skipting fronta [Tækja]","Sk. tækja"], ["Opnun [Hurð]","Opnun"],
    ["Tvípress / Eurolight","Tvípress"],
    ["Sérsmíði tegund","Sérsmíði"], ["Sérsmíði efni","Sérsm. efni"],
  ];
  var SERHAED = [
    ["N","Sérhæð N fronts"], ["M","Sérhæð M fronts"], ["K","Sérhæð K fronts"],
    ["C","Sérhæð C fronts"], ["F","Sérhæð F fronts"], ["E","Sérhæð E fronts"],
  ];
  // Skúffur tree: drawer-front-type letter codes + their counts.
  var DRAWER_TYPES = ["N","M","K","C","F","E","IN","IM","IK","IC","IE","IF"];
  var HILLUR_SPEC = [
    ["Fastar hillur fjöldi","Fastar hillur"], ["Lausar hillur fjöldi","Lausar hillur"],
    ["Fjöldi hillubera","Hilluberar"],
  ];
  var ANNAD_SPEC = [
    ["Fjöldi Movento bakka","Movento bakki"],
    ["Fjöldi díla","Dílar"], ["Fjöldi Skrúfu / rastex","Skrúfur"],
    ["Fjöldi euroskrúfa","Euroskrúfur"], ["Fjöldi lama / klossa","Lamar/klossar"],
    ["Undirgrip","Undirgrip"],
  ];

  function renderTree(f){
    var html = "";

    // Skúffur — one leaf per drawer-front type that has a count, with the
    // unit's drawer system (Skúffutegund) and depth (Skúffu dýptir fyrir
    // prentara — one value for the whole unit, so every leaf shows the same
    // depth; there's no per-type depth field to pull a different number from).
    // "Fjöldi lagnaskúffa" is NOT an extra drawer to add to the total — it
    // says that one of the drawers counted above (N/M/K/.../IF) is a
    // lagnaskúffa variant that needs a different manufacturing route. Shown
    // as a note under the group, not as its own leaf (the data doesn't say
    // which specific drawer type it is).
    var tegund = txt(f["Skúffutegund"]);
    var depth = num(f["Skúffu dýptir fyrir prentara"]);
    var lagnaskuffa = num(f["Fjöldi lagnaskúffa"]);
    var drawerLeaves = [];
    DRAWER_TYPES.forEach(function(t){
      var n = num(f[t]);
      if (n > 0) {
        var spec = [tegund, depth ? depth+"mm dýpt" : ""].filter(Boolean).join(" · ");
        drawerLeaves.push([n, t + (spec ? " — " + spec : "")]);
      }
    });
    if (drawerLeaves.length) {
      var drawerTotal = drawerLeaves.reduce(function(s,l){ return s+l[0]; }, 0);
      var lagnaNote = lagnaskuffa > 0
        ? '<div class="tnote">⚠️ Þar af '+lagnaskuffa+' lagnaskúffa — fer aðra framleiðsluleið</div>' : '';
      html += '<div class="tgroup"><div class="th">Skúffur <span class="n">('+drawerTotal+')</span></div>' +
        drawerLeaves.map(function(l){
          return '<div class="tleaf"><span class="branch">∟</span><span class="lv">'+l[0]+'× '+esc(l[1])+'</span></div>';
        }).join("") + lagnaNote + '</div>';
    } else if (lagnaskuffa > 0) {
      // No N/M/K/... count recorded at all, only the lagnaskúffa flag —
      // still surface it rather than silently dropping it.
      html += '<div class="tgroup"><div class="th">Skúffur</div>' +
        '<div class="tnote">⚠️ '+lagnaskuffa+' lagnaskúffa — fer aðra framleiðsluleið</div></div>';
    }

    // Hillur
    var hillurLeaves = [];
    HILLUR_SPEC.forEach(function(spec){
      var n = num(f[spec[0]]);
      if (n > 0) hillurLeaves.push([n, spec[1]]);
    });
    if (hillurLeaves.length) {
      html += '<div class="tgroup"><div class="th">Hillur</div>' +
        hillurLeaves.map(function(l){
          return '<div class="tleaf"><span class="branch">∟</span><span class="lv">'+l[0]+'× '+esc(l[1])+'</span></div>';
        }).join("") + '</div>';
    }

    // Annað — everything else numeric that isn't a drawer or a shelf
    var annadLeaves = [];
    ANNAD_SPEC.forEach(function(spec){
      var n = num(f[spec[0]]);
      if (n > 0) annadLeaves.push([n, spec[1]]);
    });
    if (annadLeaves.length) {
      html += '<div class="tgroup"><div class="th">Annað</div>' +
        annadLeaves.map(function(l){
          return '<div class="tleaf"><span class="branch">∟</span><span class="lv">'+l[0]+'× '+esc(l[1])+'</span></div>';
        }).join("") + '</div>';
    }

    if (!html) return;
    $("tree").innerHTML = html;
    show($("treeSec"));
  }

  // One combined "Eiginleikar" list: resolved hardware/products first (each
  // with its own quantity), then the boolean/select/sérhæð specs. Was two
  // separate sections (Vörur & aukahlutir / Eiginleikar) — merged since they
  // were the same kind of info (what's in/about this unit), just split for
  // no real reason.
  function renderProps(f, names){
    var rows = [];
    HW_LINKS.forEach(function(spec){
      var ids = arr(f[spec[0]]);
      if (!ids.length) return;
      var label = ids.map(function(id){ return names[id] || id; }).join(", ");
      var qty = spec[1] ? num(f[spec[1]]) : 0;
      rows.push([label, qty > 0 ? "×" + qty : ""]);
    });
    PROP_BOOL.forEach(function(spec){ if (f[spec[0]] === true) rows.push([spec[1], ""]); });
    PROP_SELECT.forEach(function(spec){
      var v = txt(f[spec[0]]);
      if (v) rows.push([spec[1], v]);
    });
    SERHAED.forEach(function(spec){
      var count = num(f[spec[0]]), h = num(f[spec[1]]);
      if (count > 0 && h > 0) rows.push(["Frontahæð (" + spec[0] + ")", h + "mm"]);
    });
    // Hurðaefni only means anything for an actual Hurð unit.
    if (txt(f["Tegund einingu"]) === "Hurð") {
      var hurdaefni = txt(f["Hurðaefni"]);
      if (hurdaefni) rows.push(["Hurðaefni", hurdaefni]);
    }
    if (!rows.length) return;
    $("propList").innerHTML = rows.map(function(r){
      return '<div class="item"><span class="k">'+esc(r[0])+'</span>'+
        (r[1] ? '<span class="v">'+esc(r[1])+'</span>' : '')+'</div>';
    }).join("");
    show($("propSec"));
  }

  function ext(a){ return (a.filename||"").split(".").pop().toUpperCase(); }
  function drawRow(icon, label, atts){
    var list = arr(atts);
    if (!list.length) return;
    var docs = list.filter(function(a){ return !(a && /^image\//.test(a.type||"")); });
    var imgs = list.filter(function(a){ return a && /^image\//.test(a.type||""); });

    if (docs.length === 1) {
      var a = docs[0];
      var el = document.createElement("a");
      el.className = "draw-grp"; el.style.cursor = "default";
      el.href = a.url; el.target = "_blank"; el.rel = "noopener";
      el.innerHTML = '<span class="ic">'+icon+'</span><span>'+esc(label)+'</span><span class="ct">'+esc(ext(a))+'</span>';
      $("draws").appendChild(el);
    } else if (docs.length > 1) {
      var head = document.createElement("div");
      head.className = "draw-grp";
      head.innerHTML = '<span class="ic">'+icon+'</span><span>'+esc(label)+'</span>'+
        '<span class="ct">'+docs.length+' skjöl</span><span class="cv">▸</span>';
      var sub = document.createElement("div");
      sub.className = "draw-sub";
      sub.innerHTML = docs.map(function(a, i){
        return '<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+
               esc((a.filename && a.filename.replace(/\.[^.]+$/,"")) || (label+" "+(i+1)))+
               '<span class="ct">'+esc(ext(a))+'</span></a>';
      }).join("");
      head.addEventListener("click", function(){
        head.classList.toggle("open");
        sub.classList.toggle("open");
      });
      $("draws").appendChild(head);
      $("draws").appendChild(sub);
    }
    imgs.forEach(function(a){
      var t = (a.thumbnails && (a.thumbnails.large||a.thumbnails.full)) || {};
      var el = document.createElement("a");
      el.href = a.url; el.target = "_blank"; el.rel = "noopener";
      el.title = label;
      el.innerHTML = '<img src="'+esc(t.url||a.url)+'" alt="'+esc(label)+'" loading="lazy" onerror="this.closest(\'a\').remove()">';
      $("drawImgs").appendChild(el);
    });
  }

  // Only Lokateikningar — the other project-drawing types (sérfræsi,
  // málsettar myndir, teikningar af tækifæri, heimilistæki) were cut from
  // this page on request; they're still on /verk.
  function renderDraws(pf){
    drawRow("📋", "Lokateikningar", pf["Loka teikningar verkefnis 📋"]);
    if ($("draws").children.length || $("drawImgs").children.length) show($("drawsSec"));
  }

  // Combined sögun/fræsing status, one row per Partur+size+material group —
  // SÖG from Lokið (existing), FRÆS from Yfirfr./Fræst: "–" when the group
  // doesn't need milling at all, ✓ once every record in it is Fræst.
  // Grouped by material (Efni) with a sub-header per material — everything
  // coming off the same board sits together, instead of one flat list.
  function renderCutlist(rows){
    if (!rows.length) return;
    var map = new Map();
    rows.forEach(function(r){
      var f = r.fields || {};
      var partur = txt(f["Partur"]), h = num(f["H"]), b = num(f["B"]), th = num(f["Þ"]);
      var efni = txt(f["Efni: (undirstaða)"]) || "Óþekkt efni";
      var key = partur+"|"+h+"|"+b+"|"+th+"|"+efni;
      if (!map.has(key)) map.set(key, {
        partur:partur, h:h, b:b, th:th, efni:efni,
        m:0, lokid:true, needsMill:false, milled:true,
      });
      var g = map.get(key);
      g.m += num(f["M"]) || 1;
      if (!f["Lokið"]) g.lokid = false;
      if (f["Yfirfr."]) { g.needsMill = true; if (!f["Fræst"]) g.milled = false; }
    });

    var byMat = new Map();
    map.forEach(function(g){
      if (!byMat.has(g.efni)) byMat.set(g.efni, []);
      byMat.get(g.efni).push(g);
    });
    var materials = [...byMat.keys()].sort(function(a,b){ return a.localeCompare(b,"is"); });

    // Swatch photo per material, from Efnislisti's own "Mynd 🖼️" — matched
    // by exact name (Sögunarlisti only ever stores the resolved text name,
    // no direct link to Efnislisti), so everyone can spot the right board
    // by eye instead of reading the full material name every time.
    var realMats = materials.filter(function(m){ return m !== "Óþekkt efni"; });
    var imgsPromise = realMats.length
      ? fetchAll(MATERIALS_TABLE, {
          filterByFormula: "OR(" + realMats.map(function(n){
            return "{Heiti efnis}=\"" + n.replace(/"/g,'\\"') + "\"";
          }).join(",") + ")"
        }, null)
          .then(function(recs){
            var imgs = {};
            recs.forEach(function(r){
              var f = r.fields || {};
              var att = arr(f["Mynd 🖼️"])[0];
              if (!att) return;
              var t = (att.thumbnails && (att.thumbnails.large || att.thumbnails.small)) || {};
              imgs[txt(f["Heiti efnis"])] = t.url || att.url;
            });
            return imgs;
          })
          .catch(function(){ return {}; })
      : Promise.resolve({});

    imgsPromise.then(function(imgs){
      $("cutList").innerHTML = materials.map(function(mat){
        var list = byMat.get(mat).sort(function(a,b){ return (b.h*b.b)-(a.h*a.b); });
        var c = colorForKey(mat);
        var rows = list.map(function(g){
          var sog = '<span class="cstat'+(g.lokid?' ok':'')+'">'+(g.lokid?'✓':'□')+'</span>';
          var fraes = !g.needsMill ? '<span class="cstat na">–</span>'
                    : '<span class="cstat'+(g.milled?' ok':'')+'">'+(g.milled?'✓':'□')+'</span>';
          return '<div class="crow2" style="border-left:3px solid '+c+';">' +
            '<div><div class="p">'+esc(g.partur)+' <span style="color:var(--muted);font-weight:400;">×'+g.m+'</span></div>'+
            '<div class="d">'+g.h+'×'+g.b+'×'+g.th+'mm</div></div>'+
            sog + fraes + '</div>';
        }).join("");
        var swatch = imgs[mat]
          ? '<img class="mat-swatch" src="'+esc(imgs[mat])+'" alt="" loading="lazy" onerror="this.remove()">' : "";
        return '<div class="mat-head" style="color:'+c+';border-left:3px solid '+c+';">'+swatch+'<span>'+esc(mat)+'</span></div>' + rows;
      }).join("");
      show($("cutSec"));
    });
  }

  // u (unit) and p (project) both come from /v/<pieceId>'s server-side
  // redirect, resolved from the printed piece's own Sögunarlisti links — NOT
  // re-derived from Eyðublað's own project link here, which has been found
  // to carry stray extra links on some units (see api/v.js).
  var q = new URLSearchParams(location.search);
  var u = q.get("u"), p = q.get("p"), k = q.get("k");
  if (!u || !/^rec[A-Za-z0-9]{14}$/.test(u) || !k) {
    hide($("loading")); show($("error")); return;
  }

  fetchJson(UNIT_TABLE + "/" + u, {}, k)
    .then(function(rec){
      var f = rec.fields || {};
      var unitName = txt(f["Athugasemd"]) || "Eining";
      $("uname").textContent = unitName;

      var room = txt(f["Heiti rýmis"]);
      if (room) { $("roomVal").textContent = room; show($("roomField")); }
      var tegund = txt(f["Tegund einingu"]);
      if (tegund) { $("tegundVal").textContent = tegund; show($("tegundField")); }
      var hh=num(f["Hæð"]), bb=num(f["Breidd"]), dd=num(f["Dýpt"]);
      if (hh||bb||dd) { $("dimsVal").textContent = hh+"×"+bb+"×"+dd+"mm"; show($("dimsField")); }

      renderTree(f);

      var linkIds = new Set();
      HW_LINKS.forEach(function(spec){ arr(f[spec[0]]).forEach(function(id){ linkIds.add(id); }); });

      var namesPromise = linkIds.size
        ? fetchAll(PRODUCTS_TABLE, { filterByFormula: "OR(" + [...linkIds].map(function(id){ return "RECORD_ID()='"+id+"'"; }).join(",") + ")" }, null)
            .then(function(recs){
              var names = {};
              recs.forEach(function(r){ names[r.id] = txt((r.fields||{})["Heiti vöru 📣"]) || r.id; });
              return names;
            })
            .catch(function(){ return {}; })
        : Promise.resolve({});

      var projectId = (p && /^rec[A-Za-z0-9]{14}$/.test(p)) ? p : null;

      var projectPromise = projectId
        ? fetchJson(PROJECT_TABLE + "/" + projectId, {}, k)
            .then(function(prec){ return prec.fields || {}; })
            .catch(function(){ return {}; })
        : Promise.resolve({});

      if (projectId) {
        var pl = $("projLink");
        pl.href = "/verk?t=" + encodeURIComponent(projectId) + "&k=" + encodeURIComponent(k);
        show(pl);
        $("tools").innerHTML =
          '<a class="tool" href="/labels?recordId='+encodeURIComponent(projectId)+'">Merkingar</a>' +
          '<a class="tool" href="/fraesing?recordId='+encodeURIComponent(projectId)+'">Fræsing</a>';
        show($("toolsSec"));
      }

      hide($("loading"));
      show($("content"));

      namesPromise.then(function(names){ renderProps(f, names); });

      projectPromise.then(function(pf){
        renderDraws(pf);
        var projectName = txt(pf["Heiti tækifæris / verkefnis"]);
        if (!projectName || !unitName) return;
        // Exact match on both, not FIND/substring — "Sk 3" as a substring
        // also matches "Sk 30", "Sk 31", "Sk 32", "Sk 39"... (confirmed live:
        // Sk 3's list was pulling in other units' hliðar this way). Since
        // ARRAYJOIN() on a single-link field is just that one record's name,
        // exact string equality is the correct match here.
        var formula = "AND(ARRAYJOIN({Tækifæri 📣 (projects)})=\""+projectName.replace(/"/g,'\\"')+"\", "+
                      "ARRAYJOIN({Eyðublað ✏️})=\""+unitName.replace(/"/g,'\\"')+"\")";
        return fetchAll(SOGUNARLISTI_TABLE, { filterByFormula: formula, pageSize: 100 }, null)
          .then(renderCutlist)
          .catch(function(){});
      });
    })
    .catch(function(e){ console.error(e); hide($("loading")); show($("error")); });
})();
</script>
</body>
