<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Skipulagsferli — Björninn</title>
<link rel="icon" href="/icons/icon-192.png" />
<script>
// Apply a saved dark-theme choice before first paint (avoids a light→dark flash) — same pattern
// app.html/verk.html already use for the floor PWA, see office-shell.js's theme comment.
(function () {
  try { if (localStorage.getItem("bjorninn:skrifstofa:theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
})();
</script>
<style>
  /* ferli.html — the unified skipulag-process workspace (2026-10-17), replacing
     /yfirferd, /skipulag and PRO mode's "Keyra skipulag" button as three
     separate things. One kanban (columns = Staða í skipulagi's 4 real stages,
     plus a computed 5th "Pöntunarlisti" column — same "Klárt til framleiðslu"
     status, split by whether its Pantaðir listar are all "Komið í hús" yet)
     over every confirmed project (Staða í söluferli = Tækifæri unnið). Opening
     a card shows ALL stage sections stacked — the current stage expanded and
     highlighted, earlier ones collapsed but never hidden ("kemst alltaf í
     reiti úr skrefinu á undan", user's own words) — rather than a UI that
     replaces itself and loses access to earlier data.
     Per-unit review reuses /yfirferd's exact box-render + tab logic, just
     inlined into a modal instead of its own page. Loka yfirferð reuses
     /skipulag's exact checklist + BPP-viewer + Cutty/Æðar/CNC pipeline code.
     Pöntunarlisti here is a summary + link — /pontun stays the real tool for
     actually managing orders. */
  :root {
    --bg:#f5f5f7; --surface:#ffffff; --line:#e6e6ea; --sidebar:#1b2430;
    --text:#1d1d1f; --muted:#6e6e73; --dim:#a1a1a6;
    --accent:#0f6cbd; --warn:#9a6700; --bad:#c4291c; --good:#1a7d36;
    --warn-bg:#fdf2d9; --good-bg:#e5f6ea; --bad-bg:#fbe4e1; --good-soft:#e5f6ea;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="dark"] {
    --bg:#101216; --surface:#1a1d23; --line:#2a2e37;
    --text:#f2f2f5; --muted:#9a9aa3; --dim:#6b6b73;
    --accent:#3b9eff; --warn:#e3b341; --bad:#f2766b; --good:#4caf6e;
    --warn-bg:#332a10; --good-bg:#102414; --bad-bg:#3a1a17; --good-soft:#102414;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4; }

  #shell { display:flex; min-height:100vh; }
  .sidebar { width:224px; flex:none; background:var(--sidebar); color:#cfd5dd; display:flex; flex-direction:column; padding:18px 0; height:100vh; position:sticky; top:0; overflow-y:auto; }
  .sidebar .brand { padding:0 18px 18px; font-weight:700; color:#fff; font-size:1.05rem; border-bottom:1px solid #2a3442; margin-bottom:10px; }
  .sidebar nav { display:flex; flex-direction:column; gap:1px; flex:1; }
  .sidebar nav a { display:flex; align-items:center; gap:10px; padding:9px 18px; text-decoration:none; color:#cfd5dd; font-size:.88rem; }
  .sidebar nav a:hover { background:#242e3b; }
  .sidebar nav a.active { background:var(--accent); color:#fff; }
  .sidebar .user { padding:14px 18px 0; border-top:1px solid #2a3442; margin-top:10px; font-size:.82rem; display:flex; justify-content:space-between; align-items:center; }
  .sidebar .user button { background:none; border:none; color:#8aa4c7; font:inherit; font-size:.8rem; cursor:pointer; }

  .main { flex:1; min-width:0; padding:36px 40px 60px; max-width:none; }
  .pageHd { margin-bottom:6px; }
  .pageHd h1 { font-size:2rem; font-weight:700; letter-spacing:-.02em; }
  .back { display:inline-block; color:var(--accent); text-decoration:none; font-size:.9rem; margin-bottom:14px; }
  .back[hidden] { display:none; }
  .lead { color:var(--muted); font-size:.95rem; margin:4px 0 22px; min-height:1.2em; }

  /* ---- Board (list, 2026-10-28) ---- */
  .group { margin-bottom:34px; }
  .secTitle { font-size:.78rem; font-weight:600; color:var(--muted); letter-spacing:.02em; margin:0 4px 10px; }
  .secTitle.bad { color:var(--bad); }
  .list { background:var(--surface); border-radius:14px; overflow:hidden; }
  .prow { display:flex; align-items:center; gap:14px; padding:11px 18px; border-left:3px solid var(--sc, transparent); border-bottom:1px solid var(--line); text-decoration:none; color:var(--text); }
  .prow:last-child { border-bottom:none; }
  .prow:hover { background:var(--bg); }
  .prow:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .pn { flex:1; min-width:0; }
  .pn .t { font-weight:600; font-size:.96rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pn .s { font-size:.8rem; color:var(--muted); margin-top:1px; }
  .pn .s .stale { color:var(--warn); font-weight:600; }
  .pn .s .late { color:var(--bad); font-weight:600; }
  .stg { flex:none; width:128px; text-align:center; font-size:.74rem; font-weight:600; padding:4px 0; border-radius:999px; }
  .tools { display:flex; flex-direction:row; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .tools input { flex:0 1 420px; width:100%; font:inherit; font-size:.95rem; padding:10px 14px; border:none; border-radius:10px; background:var(--surface); color:var(--text); outline:none; }
  .tools input:focus { box-shadow:0 0 0 2px var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chipf { display:inline-flex; align-items:center; gap:6px; border:none; background:var(--surface); color:var(--muted); font:inherit; font-size:.82rem; padding:6px 13px; border-radius:999px; cursor:pointer; }
  .chipf i { width:8px; height:8px; border-radius:50%; }
  .chipf b { font-weight:600; color:var(--dim); }
  .chipf:hover { color:var(--text); }
  .chipf.on { background:var(--text); color:var(--surface); }
  .chipf.on b { color:inherit; opacity:.7; }
  .dotc { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
  .group { margin-bottom:0; }
  .group > .secTitle { font-weight:700; }
  .steps { display:flex; gap:4px; flex:none; }
  .steps i { width:22px; height:4px; border-radius:2px; background:var(--line); }
  .steps i.on { background:var(--accent); }
  .steps i.cur { background:var(--accent); }
  .chev { color:var(--dim); flex:none; }
  .tag { font-size:.7rem; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--bg); color:var(--muted); margin-left:8px; white-space:nowrap; }
  .tag.pt { background:#efe8fc; color:#6f42c1; }
  .empty { text-align:center; color:var(--muted); padding:16px 0; font-size:.85rem; }
  .loading { text-align:center; color:var(--muted); padding:60px 0; }
  .note { color:var(--muted); font-size:.92rem; padding:22px; }
  .note.err { color:var(--bad); }
  .link { background:none; border:none; color:var(--accent); cursor:pointer; font-size:.88rem; padding:2px 4px; }
  .link:hover { text-decoration:underline; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--text); color:var(--surface); padding:11px 20px; border-radius:999px; font-size:.88rem; z-index:300; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
  .toast.show { opacity:1; }
  .toast.bad { background:var(--bad); color:#fff; }
  .skel { height:62px; border-bottom:1px solid var(--line); background:linear-gradient(90deg,var(--surface),var(--bg),var(--surface)); background-size:200% 100%; animation:sh 1.4s infinite; }
  @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ---- Detail ---- */
  .projHd { margin:0 0 26px; }
  .stepper { display:flex; gap:6px; margin-top:4px; }
  .stepper .sp { flex:1; }
  .stepper .sp i { display:block; height:4px; border-radius:2px; background:var(--line); margin-bottom:6px; }
  .stepper .sp.done i, .stepper .sp.cur i { background:var(--accent); }
  .stepper .sp.done i { background:var(--good); }
  .stepper .sp span { font-size:.78rem; color:var(--muted); }
  .stepper .sp.cur span { color:var(--text); font-weight:600; }

  .stage { background:var(--surface); border-radius:14px; margin-bottom:14px; overflow:hidden; }
  .stage.current { box-shadow:0 0 0 2px var(--accent); }
  .stageHd .badge.done { background:var(--good); }
  .stageHd { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; cursor:default; }
  .stageHd .chev { display:none; }
  .stageHd .t { font-weight:600; font-size:1.02rem; display:flex; align-items:center; gap:8px; }
  .stageHd .badge { font-size:.68rem; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--accent); color:#fff; }
  .stageHd .chev { color:var(--dim); font-size:.8rem; }
  .stageBody { display:block; padding:4px 22px 22px; border-top:1px solid var(--line); padding-top:18px; }
  .stageBody.open { display:block; }

  .unitRow { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; font-size:.88rem; }
  .unitRow.unitDone { background:var(--good-soft, #e5f6ea); margin:0 -8px; padding:9px 8px; border-radius:8px; border-bottom-color:transparent; }
  .unitRow:last-child { border-bottom:none; }
  .unitRow .chip { font-size:.7rem; padding:2px 8px; border-radius:999px; background:var(--good); color:#fff; }
  .unitRow .chip.todo { background:var(--line); color:var(--muted); }

  .sectionTitle { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:14px 0 8px; }
  /* Loka skipulag's Dagatal section (2026-10-18) — these 4 fields were missing entirely. */
  .dagatalCard { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:13px; margin-bottom:14px; }
  .dagatalGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .dagatalField label { display:block; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:4px; }
  .dagatalField input { width:100%; box-sizing:border-box; font:inherit; font-size:.92rem; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:var(--surface); color:var(--text); }
  .dagatalComputed { margin-top:10px; font-size:.82rem; color:var(--muted); }
  .dagatalComputed b { color:var(--text); font-size:1rem; }
  .checklist { display:flex; flex-direction:column; gap:7px; }
  .chkRow { display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:.85rem; }
  .chkRow .box { width:19px; height:19px; border-radius:5px; border:2px solid var(--dim); flex:none; display:flex; align-items:center; justify-content:center; font-size:.78rem; }
  .chkRow.on .box { background:var(--good); border-color:var(--good); color:#fff; }
  .stemmir { font-size:.8rem; color:var(--muted); margin-top:8px; }

  .pipeSteps { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .pipeStepWrap { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .pipeStep { display:flex; align-items:center; gap:10px; color:var(--text); padding:10px 12px; font-size:.85rem; }
  .pipeStep .pipeLabel { flex:1; }
  .pipeStep .chip { font-size:.68rem; padding:2px 8px; border-radius:999px; background:var(--line); color:var(--muted); flex:none; }
  .pipeStep .chip.ok { background:var(--good); color:#fff; }
  .pipeStep .chip.partial { background:#fdf2d9; color:var(--warn); }
  .inlineToggle { all:unset; flex:none; font-size:.76rem; color:var(--accent); cursor:pointer; font-weight:600; padding:2px 4px; }
  .newTab { flex:none; color:var(--muted); text-decoration:none; font-size:.9rem; padding:2px 4px; }
  .inlineFrame { display:none; border-top:1px solid var(--line); background:var(--surface); }
  .inlineFrame.open { display:block; }
  .inlineFrame iframe { width:100%; height:70vh; border:none; display:block; background:var(--surface); }
  .autoTag { font-size:.65rem; color:var(--dim); font-weight:500; }

  .bppToggle { margin-top:10px; background:none; border:1px dashed var(--line); border-radius:10px; color:var(--muted); font-size:.82rem; padding:9px 12px; width:100%; text-align:left; font-family:inherit; cursor:pointer; }
  #bppArea { display:none; margin-top:10px; }
  #bppArea.open { display:block; }
  #bppDrop { border:2px dashed var(--line); border-radius:12px; padding:20px 14px; text-align:center; color:var(--muted); font-size:.82rem; }
  #bppDrop.over { border-color:var(--accent); }
  #bppDrop input { display:none; }
  #bppDrop .pick { display:inline-block; margin-top:8px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:.8rem; }
  #bppOut { margin-top:12px; display:flex; flex-direction:column; gap:12px; }
  .bpp-card { background:none; border:none; padding:0; }
  .bw-window { background:#d6d3c6; border:1px solid #9b9686; border-radius:5px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .bw-titlebar { background:linear-gradient(180deg,#5c4a2e,#9c8a6b); color:#f3ecdd; padding:6px 7px 6px 10px; display:flex; align-items:center; gap:8px; font-family:Tahoma,"Segoe UI",Verdana,sans-serif; }
  .bw-titlebar .ttl { font-size:.8rem; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 1px rgba(0,0,0,.4); }
  .bw-titlebar .remove { background:#00000030; border:1px solid #ffffff40; color:#fff; width:20px; height:18px; border-radius:3px; cursor:pointer; font-size:.72rem; line-height:1; flex:none; }
  .bpp-chip { font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:3px; letter-spacing:.03em; white-space:nowrap; display:inline-block; flex:none; }
  .bpp-chip.kind { background:#ffffffcc; color:#4a3c22; }
  .bpp-chip.unknown { background:#c0392b; color:#fff; }
  .bw-body { display:flex; align-items:stretch; }
  .bw-list { width:150px; flex:none; background:#e2dfd2; border-right:1px solid #9b9686; max-height:360px; overflow:auto; font-family:Tahoma,"Segoe UI",Verdana,sans-serif; }
  .bw-row { display:flex; align-items:center; gap:5px; padding:2.5px 6px; border-bottom:1px solid #cac6b6; white-space:nowrap; }
  .bw-row.child { padding-left:22px; }
  .bw-row.hi { background:#c7d8e8; }
  .bw-chk { width:10px; height:10px; border:1px solid #767262; background:#fff; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:1px; }
  .bw-chk.on::after { content:""; width:6px; height:6px; background:#2f2f2f; display:block; }
  .bw-icon { width:12px; height:12px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.3); }
  .bw-row .nm { color:#1a1a1a; font-size:.72rem; overflow:hidden; text-overflow:ellipsis; }
  .bw-canvas-wrap { flex:1; background:#eeede6; padding:14px; display:flex; justify-content:center; align-items:center; min-width:0; overflow:auto; }
  svg.plan { display:block; max-width:100%; }
  .bpp-legend { display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px 12px; font-size:.72rem; color:#5c5848; background:#d6d3c6; font-family:Tahoma,"Segoe UI",Verdana,sans-serif; }
  .bpp-legend span { display:inline-flex; align-items:center; gap:5px; }
  .bpp-legend i { width:11px; height:11px; border-radius:3px; display:inline-block; flex:none; }
  .bpp-note { margin-top:8px; font-size:.8rem; border-radius:8px; padding:8px 12px; }
  .bpp-note.warn { background:#fdf2d9; color:var(--warn); }
  .bpp-note.err { background:#fbe9e7; color:var(--bad); }
  .bpp-note.info { background:#e5f6ea; color:var(--good); }
  .bpp-raw { margin-top:8px; }
  .bpp-raw summary { cursor:pointer; font-size:.78rem; color:var(--muted); font-weight:700; }
  .bpp-rawlist { margin-top:6px; font-size:.74rem; color:var(--dim); font-family:ui-monospace,Menlo,Consolas,monospace; max-height:180px; overflow:auto; background:var(--bg); border-radius:8px; padding:8px 10px; }

  .gateBtn { width:100%; margin-top:14px; background:var(--good); color:#fff; border:none; border-radius:10px; padding:12px; font-size:.92rem; font-weight:700; font-family:inherit; cursor:pointer; }
  .gateBtn:disabled { opacity:.45; }
  .gateMsg { text-align:center; font-size:.8rem; color:var(--muted); margin-top:6px; min-height:1.1em; }
  .runBtn { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 16px; font:inherit; font-size:.85rem; font-weight:600; cursor:pointer; }
  .proLink { display:inline-block; margin-top:8px; color:var(--accent); font-size:.85rem; text-decoration:none; }

  .gateList { display:flex; flex-direction:column; gap:6px; margin:14px 0 10px; }
  .gateRow { display:flex; gap:10px; align-items:flex-start; padding:8px 11px; border-radius:8px; background:var(--bg); font-size:.88rem; }
  .gateRow .gIc { width:1.2em; flex:none; text-align:center; font-weight:700; }
  .gateRow.ok { color:var(--muted); }
  .gateRow.ok .gIc { color:var(--good); }
  .gateRow.open { background:#fdf2d9; color:var(--warn); }
  .gateRow.hard { background:#fbe3e0; color:var(--bad); font-weight:600; }
  .gateRow .gHint { font-weight:400; font-size:.78rem; margin-top:2px; }
  .gateNote { font-size:.82rem; color:var(--muted); min-height:1.1em; }
  .gateActions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .gateCancel { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font:inherit; font-size:.88rem; cursor:pointer; }
  .gateGo { background:var(--good); color:#fff; border:none; border-radius:10px; padding:10px 16px; font:inherit; font-size:.88rem; font-weight:700; cursor:pointer; }
  .gateGo.risky { background:var(--bad); }

  /* ---- Unit wizard modal (ported from /yfirferd) ---- */
  .modalBg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto; }
  .modalBg.open { display:flex; }
  .modal { background:var(--surface); border-radius:14px; max-width:520px; width:100%; padding:20px; max-height:85vh; overflow:auto; }
  .modal .mTitle { font-size:1.1rem; font-weight:700; }
  .modal .mSub { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .modal .mClose { float:right; background:none; border:none; font-size:1.2rem; color:var(--muted); cursor:pointer; }
  .wFlags { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
  .wFlag { background:#fdf2d9; color:var(--warn); border-radius:8px; padding:8px 11px; font-size:.82rem; }
  .wTabs { display:flex; gap:6px; margin:14px 0 10px; overflow-x:auto; }
  .wTab { flex:0 0 auto; padding:6px 12px; border-radius:999px; background:var(--bg); color:var(--muted); font-size:.8rem; font-weight:500; border:1px solid var(--line); }
  .wTab.active { background:var(--text); color:var(--surface); border-color:var(--text); }
  .wPanel { display:none; }
  .wPanel.active { display:block; }
  .wCard { background:var(--bg); border-radius:12px; padding:13px; margin-bottom:10px; }
  .wCard h3 { font-size:.74rem; font-weight:600; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .wRow { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:.85rem; }
  .wRow:last-child { border-bottom:none; }
  .wRow .k { color:var(--muted); }
  /* Sögunarlisti/Pöntun tabs — per-row ready checkbox + B/H/Þ/M + thickness/Óklárt filter chips
     (2026-10-18). .sogRow overrides .wRow's 2-column layout for a 3-part row. */
  .wRow.sogRow { justify-content:flex-start; align-items:center; }
  .tbCheck { flex:none; display:flex; }
  .tbCheck input { width:18px; height:18px; cursor:pointer; accent-color:var(--good); }
  .sogRow .k { flex:1; min-width:0; }
  .sogDims { flex:none; color:var(--muted); font-size:.8rem; white-space:nowrap; }
  .sogChips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .sogChips .chip { all:unset; cursor:pointer; font-size:.78rem; padding:4px 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--muted); }
  .sogChips .chip.on { background:var(--text); color:var(--surface); border-color:var(--text); }
  .boxSvg { width:100%; height:auto; display:block; }
  .boxSvg text { font-family:var(--font); fill:var(--text); }
  .boxSvg .dim { stroke:var(--muted); stroke-width:1; }
  .boxSvg .dimTxt { font-size:11px; fill:var(--muted); }
  .boxSvg .shell { fill:var(--surface); stroke:var(--text); stroke-width:1.5; }
  .boxSvg .div { stroke:var(--line); stroke-width:1.5; }
  .approveBtn { width:100%; background:var(--good); color:#fff; border:none; border-radius:10px; padding:13px; font-size:.92rem; font-weight:700; font-family:inherit; margin-top:8px; cursor:pointer; }
  .approveBtn:disabled { opacity:.5; }
  .approveMsg { text-align:center; font-size:.8rem; color:var(--muted); margin-top:6px; min-height:1.1em; }

  /* ---- Skipulagsleiðin (2026-10-29) ---- */

<script>
(function () {
  "use strict";
  var TAEKIFAERI = "tbl4LMXlQjp66RFKI";
  var EYDUBLAD = "tbl0WcyHhz63pSzZX";
  var SOGUNARLISTI = "tblhdgyvTcBfP8kov";
  var VORUR = "tblszHaBrwhYNV68z";
  var PANTADIR = "tblSccfV2lBp4FiFU";
  var PLAN_TABLE = "tblzkw70E2xoX9RmK";
  var VORULISTI = "tblzuuRSRkeXaLWxC";

  var shellInfo = window.OfficeShell.boot("ferli");
  if (!shellInfo) return;
  var k = shellInfo.k;
  var params = new URLSearchParams(location.search);
  var recordId = params.get("recordId");
  var unitParam = params.get("unit");

  function api(path, extra) {
    var u = "/api/airtable?path=" + encodeURIComponent(path);
    if (k) u += "&k=" + encodeURIComponent(k);
    if (extra) u += "&" + extra;
    return fetch(u).then(function (r) { return r.json(); });
  }
  function apiPatch(path, fields) {
    var u = "/api/airtable?path=" + encodeURIComponent(path);
    if (k) u += "&k=" + encodeURIComponent(k);
    return fetch(u, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    }).then(function (r) {
      // a refused/failed write must reject so every chain's .catch shows the failure (it used to resolve the error body
      // and the callers looked like they had succeeded)
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok || (d && d.error)) throw new Error("patch");
        return d;
      });
    });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function eqFilter(fieldPrefixEncoded, name) {
    var e = String(name).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    return fieldPrefixEncoded + "%3D" + encodeURIComponent('"' + e + '"');
  }
  // Project-link filters (2026-10-27): {Link}="<name>" never matches a project whose name has a
  // comma ("…, 112 Reykjavík") — Airtable quotes such names when it stringifies a link field. So
  // match with FIND over ARRAYJOIN and then keep only records whose link really holds this
  // project's record id (FIND alone could also hit a longer name that contains this one).
  function linkFilter(fieldPrefixEncoded, name) {
    var e = String(name).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    return encodeURIComponent('FIND("' + e + '", ARRAYJOIN(') + fieldPrefixEncoded + encodeURIComponent(')) > 0');
  }
  function onlyProject(recs, linkField, projectId) {
    return (recs || []).filter(function (r) {
      var l = (r.fields || {})[linkField];
      return !Array.isArray(l) || l.indexOf(projectId) !== -1;
    });
  }

  var FIELD_PROJECT_ON_EYDUBLAD = "%7BT%C3%A6kif%C3%A6ri%20%F0%9F%93%A3%7D"; // {Tækifæri 📣}
  var FIELD_PROJECT_ON_PANTADIR = "%7BT%C3%A6kif%C3%A6ri%20%F0%9F%93%A3%7D";

  // "Klárt til framleiðslu" is deliberately not a shown column (user, 2026-10-17): once
  // skipulag is done, the project graduates off this board — except Pöntunarlisti, which stays
  // since a still-open supplier order is real active work someone here should keep tracking.
  var STAGES = [
    { id: "forskipulag", match: "For-skipulag", label: "For-skipulag", color: "#e9b000" },
    { id: "skipulag", match: "Í skipulagningu", label: "Í skipulagningu", color: "#d6473c" },
    { id: "yfirfara", match: "Yfirfara", label: "Yfirfara", color: "#0f6cbd" },
  ];
  var PONTUN_COLOR = "#8250df";
  var PROD_DONE = "Afhent (LOKIÐ ✅)";

  if (!recordId) {
    loadBoard();
  } else {
    loadDetail(recordId);
  }
  // ?unit=<id> is read by pendingUnit (selected when the Einingar step is drawn)

  // ======================= BOARD (list, 2026-10-28) =======================
  // No kanban: what matters is what needs somebody. Stale projects first, then one group per stage
  // (each row shows how far along the 4 steps it is). The old drag into "Pöntunarlisti" is gone — a
  // drag is too easy to do by accident for a status that tells the floor to start; "Merkja Klárt"
  // on the project page runs the same gate (checklist + typed KLÁRT) and the same notification.
  var toastT = null;
  function toast(msg, bad) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("show"); }, bad ? 5000 : 2200);
  }
  function retryNote(msg, fn) {
    var id = "r" + Math.random().toString(36).slice(2);
    setTimeout(function () { var b = document.getElementById(id); if (b) b.addEventListener("click", fn); }, 0);
    return '<div class="list"><div class="note err">' + esc(msg) + ' <button class="link" id="' + id + '" type="button">Reyna aftur</button></div></div>';
  }
  // PATCH that tells the truth: resolves true on success; on failure shows a red toast and resolves false
  // (callers undo their optimistic UI). Used by the checklist and the date fields, which used to fail silently.
  function saveFields(path, fields, what) {
    return apiPatch(path, fields).then(function (r) {
      if (r && r.error) throw new Error("patch");
      return true;
    }).catch(function () { toast("Tókst ekki að vista" + (what ? " " + what : "") + " — reyndu aftur.", true); return false; });
  }

  var MONTHS = ["jan.", "feb.", "mars", "apr.", "maí", "júní", "júlí", "ág.", "sept.", "okt.", "nóv.", "des."];
  function todayStr() { return new Date().toLocaleDateString("sv-SE", { timeZone: "Atlantic/Reykjavik" }); }
  function dateIs(s) { var p = String(s).slice(0, 10).split("-"); return (+p[2]) + ". " + MONTHS[+p[1] - 1]; }
  function daysTo(s) { return Math.round((Date.parse(String(s).slice(0, 10)) - Date.parse(todayStr())) / 86400000); }

  var STALE_DAYS = 5;
  function loadBoard() {
    var BOARD_FIELDS = ["Heiti tækifæris / verkefnis", "Staða í skipulagi", "Staða í framleiðslu", "Verk ósnert dagar 📅", "Áætlaður afhendingardagur Björninn (internal)"];
    document.getElementById("loading").style.display = "none";
    var boardEl = document.getElementById("board");
    boardEl.style.display = "block";
    boardEl.innerHTML = '<div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    // delivered projects are excluded server-side, so the 100-per-page window is only live work (and we follow `offset` anyway)
    var fml = 'AND({Staða í söluferli}="🏆 Tækifæri unnið",{Staða í framleiðslu}!="' + PROD_DONE + '")';
    // reads every page; REJECTS on an API error (403/500 used to render as four empty columns)
    function apiAll(path, extra) {
      var out = [];
      function page(off, n) {
        return api(path, extra + (off ? "&offset=" + encodeURIComponent(off) : "")).then(function (d) {
          if (!d || d.error || !Array.isArray(d.records)) throw new Error("load");
          out = out.concat(d.records);
          return d.offset && n < 20 ? page(d.offset, n + 1) : out;
        });
      }
      return page(null, 0);
    }
    Promise.all([
      apiAll(TAEKIFAERI, "filterByFormula=" + encodeURIComponent(fml) + "&" + BOARD_FIELDS.map(function (f) { return "fields%5B%5D=" + encodeURIComponent(f); }).join("&") + "&pageSize=100"),
      apiAll(PANTADIR, "pageSize=100")
    ]).then(function (res) {
      renderBoard(res[0], res[1]);
    }).catch(function () { boardEl.innerHTML = retryNote("Tókst ekki að sækja verkin.", loadBoard); });
  }

  function hasOpenOrderFor(name, openOrderNames) {
    return Object.keys(openOrderNames).some(function (label) { return label.indexOf(name) === 0; });
  }
  var STAGE_LOOK = { forskipulag: { c: "#e9b000", t: "#9a6700" }, skipulag: { c: "#d6473c", t: "#c4291c" }, yfirfara: { c: "#0f6cbd", t: "#0f6cbd" }, pontun: { c: "#8250df", t: "#6f42c1" } };
  var boardFilter = "all", boardQuery = "";
  function renderBoard(projects, orders) {
    // Names with a still-open (not "Komið í hús") order — splits "Klárt til framleiðslu" into the
    // Pöntunarlisti stage vs graduated, and tags ANY project with an open order.
    var openOrderNames = {};
    orders.forEach(function (o) {
      var f = o.fields || {};
      if (f["Staða"] !== "Komið í hús 🐻") openOrderNames[f["Stöðu kenni"] || ""] = true;
    });
    var DATE = "Áætlaður afhendingardagur Björninn (internal)";
    var stages = STAGES.map(function (s, i) { return { id: s.id, label: s.label, step: i }; });
    stages.push({ id: "pontun", label: "Pöntunarlisti", step: 3 });
    var items = [];
    projects.forEach(function (p) {
      var f = p.fields || {};
      if (f["Staða í framleiðslu"] === PROD_DONE) return; // delivered — off this board
      var stNow = f["Staða í skipulagi"] || "", name = f["Heiti tækifæris / verkefnis"] || "";

    var rows = [["Einingar", uDone + " af " + units.length + " yfirfarnar"], ["Afhending", (f["Áætlaður afhendingardagur Björninn (internal)"] ? dateIs(f["Áætlaður afhendingardagur Björninn (internal)"]) : "ekki skráð")],
      ["Pantanir", oSent + " af " + orders.length + " sendar" + (arrived ? " · " + arrived + " komnar í hús" : "")]];
    if (!setHtml(el, '<div class="list">' + rows.map(function (r) { return '<div class="prow" style="cursor:default"><div class="pn"><div class="t">' + r[0] + '</div></div><span class="stat">' + esc(r[1]) + '</span></div>'; }).join("") + '</div>' +
      (klart ? '<p class="stepIntro" style="margin-top:14px">Verkið er klárt til framleiðslu. <a class="proLink" href="/framleidsla?recordId=' + SIG.proj.id + k2 + '">Opna á Framleiðslu →</a></p>' : ""))) return;
    var b = document.getElementById("klartBtn"); if (b) { b.hidden = klart; var bx = document.querySelector(".klartBox"); if (bx && klart) bx.hidden = true; }
  }

  // ======================= Unit wizard modal (ported from /yfirferd) =======================
  function openUnitModal(unitId) { if (stepFilled.skipulag) selectUnit(unitId); else pendingUnit = unitId; }
  function selectUnit(unitId) {
    selUnit = unitId;
    document.querySelectorAll("#unitQueue .qchip").forEach(function (c) { c.classList.toggle("sel", c.dataset.unit === unitId); }); var uq = document.getElementById("unitQueue"); if (uq) uq._html = null;
    var pane = document.getElementById("unitPane"); if (pane) pane.classList.add("loading");
    api(EYDUBLAD + "/" + unitId).then(function (unit) {
      var unitName = (unit.fields || {})["Athugasemd"] || "";
      // FIND + unit id (a unit name with a comma never matches {Eyðublað ✏️}="name").
      var fml = linkFilter("%7BEy%C3%B0ubla%C3%B0%20%E2%9C%8F%EF%B8%8F%7D", unitName);
      return Promise.all([Promise.resolve(unit), api(SOGUNARLISTI, "filterByFormula=" + fml + "&maxRecords=200"), api(VORUR, "filterByFormula=" + fml + "&maxRecords=200")]);
    }).then(function (res) { if (selUnit !== unitId) return; renderUnit(res[0], onlyProject(res[1].records, "Eyðublað ✏️", unitId), onlyProject(res[2].records, "Eyðublað ✏️", unitId)); var pn = document.getElementById("unitPane"); if (pn) pn.classList.remove("loading"); })
      .catch(function () { var pn = document.getElementById("unitPane"); if (pn) { pn.classList.remove("loading"); pn.insertAdjacentHTML("afterbegin", '<div class="note err">Gat ekki sótt eininguna.</div>'); } });
  }
  document.getElementById("mClose").addEventListener("click", function () { document.getElementById("modalBg").classList.remove("open"); });
  document.getElementById("modalBg").addEventListener("click", function (e) { if (e.target === e.currentTarget) e.currentTarget.classList.remove("open"); });

  function renderUnit(unit, sogun, vorur) {
    var f = unit.fields || {};
    document.getElementById("unitTitle").textContent = f["Athugasemd"] || "(ónefnd eining)";
    document.getElementById("unitSub").textContent = [f["Heiti rýmis"], f["Hvað viltu smíða?"]].filter(Boolean).join(" · ");
    var flagsEl = document.getElementById("flags");
    flagsEl.innerHTML = "";
    if (f["Skúffur stemma ekki ⚠️"]) addFlag("Skúffur stemma ekki við á milli Sögunar og Pöntunar");
    if (f["Vantar hluta ⚠️"]) addFlag("Það vantar hluta fyrir þessa einingu");
    if (!sogun.length) addFlag("Engir hlutar í Sögunarlista fyrir þessa einingu");
    if (!vorur.length) addFlag("Engar vörur á einingunni (Pöntun einingar er tóm)");
    if (vorur.some(function (v) { return (v.fields || {})["⛔ Villa"]; })) addFlag("Vara á einingunni er með villu (⛔) — skoðaðu Pöntun einingar");
    function addFlag(msg) { var d = document.createElement("div"); d.className = "wFlag"; d.textContent = "! " + msg; flagsEl.appendChild(d); }

    var box = parseBox(f);
    drawBox(box);
    renderDrawers(f); renderShelves(f); renderOther(f);
    readyState = {};
    renderSogun(sogun); renderVorur(vorur);
    updateApproveGate();

    document.querySelectorAll(".wTab").forEach(function (tab) {
      tab.onclick = function () {
        document.querySelectorAll(".wTab").forEach(function (t2) { t2.classList.remove("active"); });
        document.querySelectorAll(".wPanel").forEach(function (p) { p.classList.remove("active"); });
        tab.classList.add("active");
        document.getElementById(tab.dataset.panel).classList.add("active");
      };
    });

    var msg = document.getElementById("approveMsg");
    msg.textContent = "";
    document.getElementById("approveBtn").textContent = "Yfirfarin — næsta →";
    document.getElementById("approveBtn").onclick = function () {
      var btn = document.getElementById("approveBtn"), uid = unit.id, nm = f["Athugasemd"] || "Eining";
      btn.disabled = true; msg.textContent = "Sendi…";
      apiPatch(EYDUBLAD + "/" + uid, { "🔄 Keyra Yfirferð 3.0": false })
        .then(function () { return apiPatch(EYDUBLAD + "/" + uid, { "🔄 Keyra Yfirferð 3.0": true }); })
        .then(function () {
          // Airtable does the review in the background — carry on with the next unit, the chip shows the result when it lands
          inReview[uid] = true; renderUnitList(); selectNextOpen(); btn.disabled = false; msg.textContent = "";
          pollSignals("unit" + uid, 150, function () { var u = (SIG.units || []).filter(function (r) { return r.id === uid; })[0]; return !!(u && (u.fields || {})["Yfirfarin"]); },
            function () { delete inReview[uid]; renderUnitList(); toast(nm + " yfirfarin ✓" + ((SIG.units || []).filter(unitFlagged).some(function (r) { return r.id === uid; }) ? " — en hún hefur vandamál, skoðaðu hana." : ""), false); },
            function () { delete inReview[uid]; renderUnitList(); toast(nm + " er ekki yfirfarin enn — athugaðu Airtable (Skipulag · Yfirfara einingu) og reyndu aftur.", true); });
        }).catch(function () { msg.textContent = "Tókst ekki."; btn.disabled = false; });
    };
  }
  function parseBox(f) {
    var raw = f["Smíðagögn (JSON) 🔧"];
    if (raw) { try { var p = JSON.parse(raw); if (p && p.w && p.h) return p; } catch (e) {} }
    return { w: f["Breidd"] || 0, h: f["Hæð"] || 0, d: f["Dýpt"] || 0, shelves: { loose: f["Lausar hillur fjöldi"] || 0, fixed: f["Fastar hillur fjöldi"] || 0 } };
  }
  function drawBox(box) {
    var svg = document.getElementById("boxSvg");
    var W = 320, H = 280, padL = 46, padR = 58, padV = 46;
    var w = Math.max(box.w || 1, 1), h = Math.max(box.h || 1, 1);
    var scale = Math.min((W - padL - padR) / w, (H - padV * 2) / h);
    var bw = w * scale, bh = h * scale;
    var x0 = padL + (W - padL - padR - bw) / 2, y0 = (H - bh) / 2 + 6;
    var parts = ['<rect class="shell" x="' + x0 + '" y="' + y0 + '" width="' + bw + '" height="' + bh + '" rx="2"/>'];
    var dy = y0 - 18;
    parts.push(dimLine(x0, dy, x0 + bw, dy));
    parts.push('<text class="dimTxt" x="' + (x0 + bw / 2) + '" y="' + (dy - 6) + '" text-anchor="middle">' + Math.round(box.w) + ' mm</text>');
    var dx = x0 - 18;
    parts.push(dimLine(dx, y0, dx, y0 + bh));
    parts.push('<text class="dimTxt" x="' + (dx - 6) + '" y="' + (y0 + bh / 2) + '" text-anchor="middle" transform="rotate(-90 ' + (dx - 6) + ' ' + (y0 + bh / 2) + ')">' + Math.round(box.h) + ' mm</text>');
    if (box.d) parts.push('<text class="dimTxt" x="' + (x0 + bw + 6) + '" y="' + (y0 + bh + 14) + '">d ' + Math.round(box.d) + ' mm</text>');
    if (box.fronts && box.fronts.length) {
      var totalMm = box.fronts.reduce(function (s, fr) { return s + (fr.mm || 0); }, 0) || h;
      var cy = y0;
      box.fronts.forEach(function (fr, i) {
        var fh = (fr.mm || totalMm / box.fronts.length) * (bh / totalMm);
        if (i > 0) parts.push('<line class="div" x1="' + x0 + '" y1="' + cy + '" x2="' + (x0 + bw) + '" y2="' + cy + '"/>');
        parts.push('<text class="dimTxt" x="' + (x0 + 6) + '" y="' + (cy + fh / 2 + 3) + '">' + esc(fr.code || "") + (fr.mm ? " · " + Math.round(fr.mm) + "mm" : "") + '</text>');
        cy += fh;
      });
    } else if (box.shelves && (box.shelves.loose || box.shelves.fixed)) {
      var n = (box.shelves.loose || 0) + (box.shelves.fixed || 0);
      for (var i = 1; i <= n; i++) {
        var ly = y0 + (bh * i) / (n + 1);
        parts.push('<line class="div" x1="' + x0 + '" y1="' + ly + '" x2="' + (x0 + bw) + '" y2="' + ly + '"/>');
      }
      parts.push('<text class="dimTxt" x="' + (x0 + 6) + '" y="' + (y0 + 14) + '">' + n + ' hillur</text>');
    }
    svg.innerHTML = parts.join("");
  }
  function dimLine(x1, y1, x2, y2) {
    return '<line class="dim" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>' +
      '<line class="dim" x1="' + x1 + '" y1="' + (y1 - 4) + '" x2="' + x1 + '" y2="' + (y1 + 4) + '"/>' +
      '<line class="dim" x1="' + x2 + '" y1="' + (y2 - 4) + '" x2="' + x2 + '" y2="' + (y2 + 4) + '"/>';
  }
  // 2026-10-18 (user): don't show the Skúffur/Hillur/Annað card at all when there's nothing in
  // it, rather than an empty-state placeholder — these three can hide independently per unit.
  function renderDrawers(f) {
    var el = document.getElementById("drawerList"), rows = [];
    if (f["Skúffutegund"]) rows.push(["Tegund", f["Skúffutegund"]]);
    ["N", "M", "K", "C", "F", "E"].forEach(function (code) { if (f[code]) rows.push([code, f[code] + " stk"]); });
    document.getElementById("drawerCard").style.display = rows.length ? "" : "none";
    el.innerHTML = rowsHtml(rows);
  }
  function renderShelves(f) {
    var el = document.getElementById("shelfList"), rows = [];
    if (f["Fastar hillur fjöldi"]) rows.push(["Fastar hillur", f["Fastar hillur fjöldi"]]);
    if (f["Lausar hillur fjöldi"]) rows.push(["Lausar hillur", f["Lausar hillur fjöldi"]]);
    document.getElementById("shelfCard").style.display = rows.length ? "" : "none";
    el.innerHTML = rowsHtml(rows);
  }
  function renderOther(f) {
    var el = document.getElementById("otherList"), rows = [];
    if (f["Grip?"]) rows.push(["Grip", f["Grip?"]]);
    if (f["Hæð ofns"]) rows.push(["Hæð ofns", f["Hæð ofns"] + " mm"]);
    if (f["LED magn"]) rows.push(["LED", f["LED magn"] + " stk"]);
    if (f["Athugasemd til fræsara 🔬"]) rows.push(["Athugasemd til fræsara", f["Athugasemd til fræsara 🔬"]]);
    document.getElementById("otherCard").style.display = rows.length ? "" : "none";
    el.innerHTML = rowsHtml(rows);
  }
  function rowsHtml(rows) {
    return rows.map(function (r) { return '<div class="wRow"><span class="k">' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>'; }).join("");
  }
  // ---- Sögunarlisti tab — B/H/Þ/M columns, a Tilbúið 🔒 checkbox per row (every one has to be
  // checked before "Samþykkja einingu" unlocks — see updateApproveGate), and a thickness/Óklárt
  // filter chip bar (2026-10-18, the image the user posted). ----
  var sogunRecs = [], sogunFilter = "all";
  function renderSogun(recs) {
    sogunRecs = recs;
    sogunFilter = "all";
    renderSogunFiltered();
  }
  function renderSogunFiltered() {
    var el = document.getElementById("sogunList");
    var chipsEl = document.getElementById("sogunChips");
    if (!sogunRecs.length) { chipsEl.innerHTML = ""; el.innerHTML = '<div class="empty">Engir hlutar í Sögunarlista enn</div>'; return; }

    var thicknesses = Array.from(new Set(sogunRecs.map(function (r) { return r.fields["Þ"]; }).filter(function (v) { return v != null; })))
      .sort(function (a, b) { return a - b; });
    var chips = [{ v: "all", label: "Allt" }]
      .concat(thicknesses.map(function (t) { return { v: "t" + t, label: t + "mm" }; }))
      .concat([{ v: "todo", label: "Óklárt" }]);
    chipsEl.innerHTML = chips.map(function (c) {
      return '<button type="button" class="chip' + (sogunFilter === c.v ? " on" : "") + '" data-f="' + c.v + '">' + esc(c.label) + '</button>';
    }).join("");
    chipsEl.querySelectorAll(".chip").forEach(function (btn) {
      btn.addEventListener("click", function () { sogunFilter = btn.dataset.f; renderSogunFiltered(); });
    });

    var shown = sogunRecs.filter(function (r) {
      if (sogunFilter === "all") return true;
      if (sogunFilter === "todo") return !r.fields["Tilbúið 🔒"];
      return String(r.fields["Þ"]) === sogunFilter.slice(1);
    });
    // grouped by material (Efni:), like the Sögunarlisti view in Airtable: Partur | H | B | Þ | M | Tilbúið
    var groups = {}, order = [];
    shown.forEach(function (r) {
      var g = tx(r.fields["Efni:"]) || tx(r.fields["Efni: (undirstaða)"]) || "Efni vantar";
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(r);
    });
    el.innerHTML = shown.length ? order.map(function (g) {
      return '<details class="sgGrp" open><summary><b>' + esc(g) + '</b> <span class="cnt">' + groups[g].length + '</span></summary>' +
        '<table class="dt"><colgroup><col><col style="width:60px"><col style="width:60px"><col style="width:44px"><col style="width:44px"><col style="width:72px"></colgroup><thead><tr><th>Partur</th><th class="n">H</th><th class="n">B</th><th class="n">Þ</th><th class="n">M</th><th class="c">Tilbúið</th></tr></thead><tbody>' +
        groups[g].map(function (r) {
          var f = r.fields || {}, on = !!f["Tilbúið 🔒"];
          readyState["sog:" + r.id] = on;
          return '<tr><td>' + esc(f["Partur"] || "") + (f["Villa?"] ? " ⚠️" : "") + '</td><td class="n">' + esc(f["H"] ?? "—") + '</td><td class="n">' + esc(f["B"] ?? "—") + '</td><td class="n">' + esc(f["Þ"] ?? "—") + '</td><td class="n">' + esc(f["M"] ?? "—") +
            '</td><td class="c"><label class="tbCheck"><input type="checkbox" data-id="' + r.id + '" data-kind="sog"' + (on ? " checked" : "") + ' /></label></td></tr>';
        }).join("") + '</tbody></table></details>';
    }).join("") : '<div class="empty">Ekkert fellur undir þessa síu</div>';
    // the ready-state of rows hidden by a filter still counts for the approve gate
    sogunRecs.forEach(function (r) { readyState["sog:" + r.id] = !!r.fields["Tilbúið 🔒"]; });
    el.querySelectorAll('input[data-kind="sog"]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        var want = cb.checked, rec = sogunRecs.filter(function (r) { return r.id === cb.dataset.id; })[0];
        readyState["sog:" + cb.dataset.id] = want;
        if (rec) rec.fields["Tilbúið 🔒"] = want;
        updateApproveGate();
        saveFields(SOGUNARLISTI + "/" + cb.dataset.id, { "Tilbúið 🔒": want }, "lásinn").then(function (ok) {
          if (ok) return;
          // Airtable never stored it: undo the box and the approve gate so nothing looks locked that is not
          cb.checked = !want;
          readyState["sog:" + cb.dataset.id] = !want;
          if (rec) rec.fields["Tilbúið 🔒"] = !want;
          updateApproveGate();
        });
        if (sogunFilter === "todo" && want) setTimeout(renderSogunFiltered, 250); // Óklárt: a ticked row leaves the list
      });
    });
  }
  function tx(v) { return Array.isArray(v) ? v.map(tx).filter(Boolean).join(", ") : (v == null ? "" : String(v)); }
  function thumb(v) { var a = Array.isArray(v) ? v[0] : null; return a && typeof a === "object" ? ((a.thumbnails && a.thumbnails.small && a.thumbnails.small.url) || a.url || "") : ""; }
  // ---- Pöntun einingar (Vörur á einingu): Tegund | Vara | Hvað | Skúffu dýpt | Magn | Mynd | Rétt | Hæð | Breidd — "Rétt" plays
  // the per-row ready role (there is no "Tilbúið 🔒" on this table, see the api/airtable.js comment). ----
  var prodNames = {};
  function renderVorur(recs) {
    var el = document.getElementById("pontunList");
    if (!recs.length) { el.innerHTML = '<div class="empty">Engar vörur skráðar á þessa einingu</div>'; return; }
    var need = [];
    recs.forEach(function (r) { ((r.fields || {})["Vörulisti 🚪"] || []).forEach(function (id) { if (!prodNames[id] && need.indexOf(id) < 0) need.push(id); }); });
    if (need.length && !renderVorur.busy) {
      renderVorur.busy = true;
      api(VORULISTI, "filterByFormula=" + encodeURIComponent("OR(" + need.map(function (id) { return "RECORD_ID()='" + id + "'"; }).join(",") + ")") + "&fields%5B%5D=" + encodeURIComponent("Heiti vöru 📣"))
        .then(function (d) { (d.records || []).forEach(function (r) { prodNames[r.id] = (r.fields || {})["Heiti vöru 📣"] || ""; }); })
        .catch(function () {}).then(function () { renderVorur.busy = false; if (need.some(function (id) { return prodNames[id]; })) renderVorur(recs); });
    }
    var hasWhat = recs.some(function (r) { return (r.fields || {})["Hvað viltu panta?"]; }), hasDim = recs.some(function (r) { var f = r.fields || {}; return f["Breidd (mm)"] || f["Hæð (mm)"]; });
    el.innerHTML = '<table class="dt"><colgroup><col style="width:90px"><col>' + (hasWhat ? '<col style="width:130px">' : '') + '<col style="width:90px"><col style="width:70px"><col style="width:60px"><col style="width:70px">' + (hasDim ? '<col style="width:80px"><col style="width:80px">' : '') + '</colgroup><thead><tr><th>Tegund</th><th>Vara</th>' + (hasWhat ? '<th>Hvað viltu panta?</th>' : "") + '<th class="n">Skúffu dýpt</th><th class="n">Magn</th><th>Mynd</th><th class="c">Rétt</th>' + (hasDim ? '<th class="n">Hæð (mm)</th><th class="n">Breidd (mm)</th>' : "") + '</tr></thead><tbody>' +
      recs.map(function (r) {
        var f = r.fields || {}, on = !!f["Rétt"], names = (f["Vörulisti 🚪"] || []).map(function (id) { return prodNames[id] || ""; }).filter(Boolean).join(", "), im = thumb(f["Mynd 🖼️"]);
        readyState["vor:" + r.id] = on;
        return '<tr><td>' + esc(tx(f["Tegund"]) || "Vara") + (f["⛔ Villa"] ? " ⚠️" : "") + '</td><td>' + (names ? '<span class="pill">' + esc(names) + '</span>' : "—") + '</td>' + (hasWhat ? '<td>' + esc(tx(f["Hvað viltu panta?"]) || "–") + '</td>' : "") +
          '<td class="n">' + esc(tx(f["Skúffu dýpt"]) || "–") + '</td><td class="n">' + esc(f["Magn"] ?? "–") + '</td><td>' + (im ? '<img class="th" src="' + esc(im) + '" alt="">' : "") + '</td>' +
          '<td class="c"><label class="tbCheck"><input type="checkbox" data-id="' + r.id + '" data-kind="vor"' + (on ? " checked" : "") + ' /></label></td>' + (hasDim ? '<td class="n">' + esc(f["Hæð (mm)"] ?? "–") + '</td><td class="n">' + esc(f["Breidd (mm)"] ?? "–") + '</td>' : "") + '</tr>';
      }).join("") + '</tbody></table>';
    el.querySelectorAll('input[data-kind="vor"]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        var want = cb.checked;
        readyState["vor:" + cb.dataset.id] = want;
        updateApproveGate();
        saveFields(VORUR + "/" + cb.dataset.id, { "Rétt": want }, "merkinguna").then(function (ok) {
          if (ok) return;
          cb.checked = !want;
          readyState["vor:" + cb.dataset.id] = !want;
          updateApproveGate();
        });
      });
    });
  }
  // ---- "Samþykkja einingu" is gated on every Tilbúið/Rétt checkbox above being true (2026-10-18,
  // user) — tracked across both tabs in one place since the button lives outside either panel. ----
  var readyState = {};
  function updateApproveGate() {
    var ids = Object.keys(readyState);
    var allReady = ids.every(function (id) { return readyState[id]; }); // a unit with no rows at all can still be approved (the flags above say so)
    var btn = document.getElementById("approveBtn");
    btn.disabled = !allReady;
    btn.title = allReady ? (ids.length ? "" : "Engir hlutar á þessari einingu — yfirfarin eins og hún er") : "Merktu alla hluti í Sögunarlista og Pöntun tilbúna fyrst";
  }
})();
</script>
