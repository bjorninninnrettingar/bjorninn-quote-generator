<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Pöntunarlisti — Björninn</title>
<link rel="icon" href="/icons/icon-192.png" />
<script>
// Apply a saved dark-theme choice before first paint (avoids a light→dark flash) — same pattern
// app.html/verk.html already use for the floor PWA, see office-shell.js's theme comment.
(function () {
  try { if (localStorage.getItem("bjorninn:skrifstofa:theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
})();
</script>
<style>
  /* pontun.html — the Pöntunarlisti area (2026-10-17), second area on /skrifstofa.
     Per-project dashboard: supplier orders (Pantaðir listar), their line detail,
     and Auka-Pöntunarlisti. Same "checkbox retriggers automation" pattern as
     /yfirferd for the two actions that need real Airtable business logic
     (full recompute, send-to-supplier email) — those automations' Interface-
     button triggers have no API equivalent. PDF reprint does NOT need that:
     it's a direct call to this repo's own existing api/generate-order-pdf.js
     via api/pontun-print.js (no Airtable automation involved at all). */
  :root {
    --bg:#f3f4f6; --surface:#ffffff; --line:#e1e4e8; --sidebar:#1b2430;
    --text:#1a1d21; --muted:#5d6670; --dim:#9aa3ad;
    --accent:#0f6cbd; --warn:#9a6700; --bad:#c4291c; --good:#1a7d36;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="dark"] {
    --bg:#11151c; --surface:#1a1f28; --line:#2a3140;
    --text:#e7eaf0; --muted:#9aa3ad; --dim:#6b7380;
    --accent:#3b9eff; --warn:#e3b341; --bad:#f2766b; --good:#4caf6e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4; }

  #shell { display:flex; min-height:100vh; }
  .sidebar { width:224px; flex:none; background:var(--sidebar); color:#cfd5dd; display:flex; flex-direction:column; padding:18px 0; height:100vh; position:sticky; top:0; overflow-y:auto; }
  .sidebar .brand { padding:0 18px 18px; font-weight:700; color:#fff; font-size:1.05rem; border-bottom:1px solid #2a3442; margin-bottom:10px; }
  .sidebar nav { display:flex; flex-direction:column; gap:1px; flex:1; }
  .sidebar nav a { display:flex; align-items:center; gap:10px; padding:9px 18px; text-decoration:none; color:#cfd5dd; font-size:.88rem; }
  .sidebar nav a:hover { background:#242e3b; }
  .sidebar nav a.active { background:var(--accent); color:#fff; }
  .sidebar .user { padding:14px 18px 0; border-top:1px solid #2a3442; margin-top:10px; font-size:.82rem; display:flex; justify-content:space-between; align-items:center; }
  .sidebar .user button { background:none; border:none; color:#8aa4c7; font:inherit; font-size:.8rem; cursor:pointer; }

  .wrap { flex:1; max-width:1040px; padding:24px 28px 40px; }

  .hd { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .title { font-size:1.3rem; font-weight:700; letter-spacing:-.01em; margin-top:2px; }

  .primaryBtn { width:100%; background:var(--text); color:var(--bg); border:none; border-radius:14px; padding:13px; font-size:.95rem; font-weight:600; font-family:inherit; margin:16px 0; }
  .primaryBtn:disabled { opacity:.5; }
  .runMsg { text-align:center; font-size:.83rem; color:var(--muted); margin:-10px 0 14px; min-height:1.1em; }

  h2.sectionTitle { font-size:.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:22px 0 10px; }

  .card { background:var(--surface); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .cardHd { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer; }
  .cardHd .nm { font-weight:600; font-size:.95rem; }
  .cardHd .meta { font-size:.82rem; color:var(--muted); margin-top:3px; }
  .chip { font-size:.75rem; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .chip.prep { background:#fff4e5; color:#8a5200; }
  .chip.sent { background:#e5f1ff; color:#0057b3; }
  .chip.done { background:#e4f8ea; color:#1a7a35; }

  .lines { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); display:none; }
  .lines.open { display:block; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) 70px 110px; gap:12px; padding:7px 0; font-size:.86rem; border-bottom:1px solid var(--line); align-items:baseline; }
  .row:last-of-type { border-bottom:none; } .row.hd2 { font-size:.72rem; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding-top:0; }
  .row .k { color:var(--text); font-weight:500; overflow:hidden; text-overflow:ellipsis; } .row .q { text-align:right; font-variant-numeric:tabular-nums; } .row .v { color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; } .row.np .v { color:var(--bad); }
  .flowLink { font-size:.84rem; color:var(--muted); margin:4px 0 0; } .flowLink a { color:var(--accent); text-decoration:none; font-weight:600; }

  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .actBtn { flex:1; min-width:120px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:.82rem; font-weight:500; font-family:inherit; color:var(--text); }
  .actBtn.good { background:var(--good); color:#fff; border-color:var(--good); }
  .actBtn:disabled { opacity:.45; }
  .efniBar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; font-size:.85rem; color:var(--muted); }
  .efniBar .actBtn { flex:0 0 auto; }
  select.statusSel { font-family:inherit; font-size:.82rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); padding:9px 8px; }

  .empty { text-align:center; color:var(--muted); padding:30px 0; font-size:.9rem; }

  #picker input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:1rem; font-family:inherit; }
  #pickerResults { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .pickRow { background:var(--surface); border-radius:12px; padding:12px 14px; text-decoration:none; color:var(--text); display:block; }
  .pickRow .lbl { font-weight:600; font-size:.95rem; }

  .loading { text-align:center; color:var(--muted); padding:60px 0; }
</style>
</head>
<body>
<div id="shell">
  <div class="sidebar">
    <div id="officeSidebarTop"></div>
    <nav id="officeNav"></nav>
    <div id="officeSidebarBottom"></div>
  </div>
<div class="wrap">

  <div id="picker" style="display:none;">
    <div class="title">Pöntunarlisti</div>
    <p style="color:var(--muted); font-size:.9rem; margin-top:4px;">Leitaðu að verkefni</p>
    <div style="margin-top:14px;"><input id="pickerInput" type="text" placeholder="Heiti verkefnis…" /></div>
    <div id="pickerResults"></div>
  </div>

  <div id="loading" class="loading" style="display:none;">Sæki gögn…</div>

  <div id="dash" style="display:none;">
    <div class="title" id="projTitle"></div>
    <div class="flowLink" id="flowLink"></div>

    <button class="primaryBtn" id="recomputeBtn">Endurreikna pöntunarlista</button>
    <div class="runMsg" id="recomputeMsg"></div>

    <h2 class="sectionTitle">Pantaðir listar</h2>
    <div class="efniBar" id="efniBar" style="display:none;">
      <span id="efniState"></span>
      <button class="actBtn good" id="allArrivedBtn" type="button">Allt komið í hús</button>
    </div>
    <div id="orders"></div>

    <div id="unlinkedWrap" style="display:none;">
      <h2 class="sectionTitle">Óflokkaðar línur</h2>
      <div class="card"><div id="unlinkedLines"></div></div>
    </div>

    <h2 class="sectionTitle">Auka-pöntunarlisti</h2>
    <div id="auka"></div>
  </div>
</div>
</div>

<script src="/office-shell.js"></script>
<script>
(function () {
  "use strict";
  var TAEKIFAERI = "tbl4LMXlQjp66RFKI";
  var PANTADIR = "tblSccfV2lBp4FiFU";
  var PONTUN = "tbloXR7f9Q943O9el";
  var AUKA = "tblHGYgrvvDqyKOAe";
  var RUN_FIELD = "🔄 Keyra Pöntunarlista 4.0";
  var SEND_FIELD = "📧 Senda á birgja";

  var shellInfo = window.OfficeShell.boot("pontun");
  if (!shellInfo) return;

  var params = new URLSearchParams(location.search);
  var recordId = params.get("recordId");
  var k = shellInfo.k;

  function api(path, extra) {
    var u = "/api/airtable?path=" + encodeURIComponent(path);
    if (k) u += "&k=" + encodeURIComponent(k);
    if (extra) u += "&" + extra;
    return fetch(u).then(function (r) { return r.json(); });
  }
  function apiPatch(path, fields) {
    var u = "/api/airtable?path=" + encodeURIComponent(path);
    if (k) u += "&k=" + encodeURIComponent(k);
    return fetch(u, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    }).then(function (r) { return r.json(); });
  }
  // Same fix as /yfirferd: Airtable's ARRAYJOIN on a linked-record field
  // resolves to the linked record's NAME, not its id (confirmed by direct
  // testing) — so these match by the project's own display name via exact
  // equality, not by record id. Auka-Pöntunarlisti's link field has a
  // slightly different name ("… (projects)"), so it takes its own encoded field prefix.
  function eqFilter(fieldPrefixEncoded, name) {
    var e = String(name).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    return fieldPrefixEncoded + "%3D" + encodeURIComponent('"' + e + '"');
  }
  // Project-link filters (2026-10-27): {Link}="<name>" never matches a project whose name has a
  // comma ("…, 112 Reykjavík") — Airtable quotes such names when it stringifies a link field. So
  // match with FIND over ARRAYJOIN and then keep only records whose link really holds this
  // project's record id (FIND alone could also hit a longer name that contains this one).
  function linkFilter(fieldPrefixEncoded, name) {
    var e = String(name).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    return encodeURIComponent('FIND("' + e + '", ARRAYJOIN(') + fieldPrefixEncoded + encodeURIComponent(')) > 0');
  }
  function onlyProject(recs, linkField, projectId) {
    return (recs || []).filter(function (r) {
      var l = (r.fields || {})[linkField];
      return !Array.isArray(l) || l.indexOf(projectId) !== -1;
    });
  }

  var FIELD_TAEKIFAERI_LINK = "%7BT%C3%A6kif%C3%A6ri%20%F0%9F%93%A3%7D"; // {Tækifæri 📣}
  var FIELD_TAEKIFAERI_LINK_AUKA = "%7BT%C3%A6kif%C3%A6ri%20%F0%9F%93%A3%20(projects)%7D"; // {Tækifæri 📣 (projects)}
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }
  function kr(n) { return n == null ? "" : Number(n).toLocaleString("is-IS") + " kr."; }

  // ---- Picker ----
  if (!recordId) {
    document.getElementById("picker").style.display = "block";
    var input = document.getElementById("pickerInput");
    var results = document.getElementById("pickerResults");
    var t = null;
    input.addEventListener("input", function () {
      clearTimeout(t);
      var q = input.value.trim();
      if (q.length < 2) { results.innerHTML = ""; return; }
      t = setTimeout(function () {
        var formula = "SEARCH(LOWER(%22" + encodeURIComponent(q.toLowerCase()).replace(/%20/g, " ") + "%22),LOWER({Heiti t%C3%A6kif%C3%A6ris%20%2F%20verkefnis}))";
        api(TAEKIFAERI, "filterByFormula=" + formula + "&maxRecords=12&fields%5B%5D=Heiti%20t%C3%A6kif%C3%A6ris%20%2F%20verkefnis")
          .then(function (d) {
            var recs = d.records || [];
            results.innerHTML = "";
            if (!recs.length) { results.innerHTML = '<div class="empty">Ekkert fannst</div>'; return; }
            recs.forEach(function (r) {
              var a = document.createElement("a");
              a.className = "pickRow";
              a.href = "/pontun?recordId=" + r.id + (k ? "&k=" + encodeURIComponent(k) : "");
              a.innerHTML = '<div class="lbl">' + esc(r.fields["Heiti tækifæris / verkefnis"] || "(ónefnt)") + '</div>';
              results.appendChild(a);
            });
          });
      }, 250);
    });
    return;
  }

  // ---- Load dashboard ----
  document.getElementById("loading").style.display = "block";
  api(TAEKIFAERI + "/" + recordId).then(function (project) {
    var name = (project.fields || {})["Heiti tækifæris / verkefnis"] || "";
    var fml1 = linkFilter(FIELD_TAEKIFAERI_LINK, name);
    var fml2 = linkFilter(FIELD_TAEKIFAERI_LINK_AUKA, name);
    return Promise.all([
      Promise.resolve(project),
      api(PANTADIR, "filterByFormula=" + fml1 + "&maxRecords=100"),
      api(PONTUN, "filterByFormula=" + fml1 + "&maxRecords=500"),
      api(AUKA, "filterByFormula=" + fml2 + "&maxRecords=50")
    ]);
  }).then(function (res) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("dash").style.display = "block";
    render(res[0], onlyProject(res[1].records, "Tækifæri 📣", recordId), onlyProject(res[2].records, "Tækifæri 📣", recordId), onlyProject(res[3].records, "Tækifæri 📣 (projects)", recordId));
  }).catch(function () {
    document.getElementById("loading").textContent = "Tókst ekki að sækja gögn.";
  });

  function render(project, orders, lines, auka) {
    var pf = project.fields || {};
    document.getElementById("projTitle").textContent = pf["Heiti tækifæris / verkefnis"] || "(ónefnt verk)";
    document.getElementById("flowLink").innerHTML = 'Pöntun er líka skref 4 í <a href="/ferli?recordId=' + recordId + '">Skipulagsferli →</a>';

    // Group lines by Pantaðir listar link
    var linesByOrder = {};
    var unlinked = [];
    lines.forEach(function (l) {
      var f = l.fields || {};
      var orderLinks = f["Pantaðir listar"];
      if (orderLinks && orderLinks.length) {
        orderLinks.forEach(function (ol) {
          var oid = typeof ol === "string" ? ol : ol.id; // REST gives plain ids
          (linesByOrder[oid] = linesByOrder[oid] || []).push(l);
        });
      } else {
        unlinked.push(l);
      }
    });

    var ordersEl = document.getElementById("orders");
    ordersEl.innerHTML = "";
    if (!orders.length) {
      ordersEl.innerHTML = '<div class="card"><div class="empty">Engar pantanir enn — keyrðu "Endurreikna pöntunarlista" fyrst</div></div>';
    }
    currentOrders = orders;
    efniLanded = !!pf[EFNI_FIELD];
    orders.forEach(function (o) {
      ordersEl.appendChild(orderCard(o, linesByOrder[o.id] || []));
    });
    paintEfniBar();
    document.getElementById("allArrivedBtn").addEventListener("click", function () {
      var open = currentOrders.filter(function (o) { return (o.fields || {})["Staða"] !== ARRIVED; });
      if (!open.length) return;
      if (!confirm("Merkja allar " + open.length + " pantanir „Komið í hús“ og haka „5. Efni lent í húsi“?")) return;
      var b = this; b.disabled = true;
      Promise.all(open.map(function (o) {
        return apiPatch(PANTADIR + "/" + o.id, { "Staða": ARRIVED }).then(function () { setOrderStatus(o.id, ARRIVED); });
      })).then(syncEfni).then(function (flipped) {
        // syncEfni already announced "Allt efni komið í hús" if it just ticked the box; if the box
        // was ticked by hand earlier the button still tells the floor.
        if (!flipped) window.OfficeShell.notifyEfni(k, recordId, "Allt efni komið í hús", { name: (shellInfo.record && shellInfo.record.name) || "" });
      }).catch(function () { b.disabled = false; alert("Tókst ekki að vista allt — endurhlaða og reyna aftur."); });
    });

    var unlinkedWrap = document.getElementById("unlinkedWrap");
    if (unlinked.length) {
      unlinkedWrap.style.display = "block";
      document.getElementById("unlinkedLines").innerHTML = unlinked.map(lineRowHtml).join("");
    }

    var aukaEl = document.getElementById("auka");
    aukaEl.innerHTML = "";
    if (!auka.length) {
      aukaEl.innerHTML = '<div class="card"><div class="empty">Engin aukapöntun til</div></div>';
    }
    auka.forEach(function (a) {
      aukaEl.appendChild(aukaCard(a));
    });

    // Recompute button
    var btn = document.getElementById("recomputeBtn");
    var msg = document.getElementById("recomputeMsg");
    btn.addEventListener("click", function () {
      btn.disabled = true;
      msg.textContent = "Keyri…";
      var f1 = {}; f1[RUN_FIELD] = false;
      apiPatch(TAEKIFAERI + "/" + recordId, f1)
        .then(function () {
          var f2 = {}; f2[RUN_FIELD] = true;
          return apiPatch(TAEKIFAERI + "/" + recordId, f2);
        })
        .then(function () {
          var now = new Date();
          msg.textContent = "Sent kl. " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + " — endurhlaða síðuna eftir smá til að sjá uppfærslu";
          btn.disabled = false;
        })
        .catch(function () { msg.textContent = "Tókst ekki — reyndu aftur."; btn.disabled = false; });
    });
  }

  // Efni samstillt (2026-10-27): once every Pantaður listi of the project is "Komið í hús",
  // "5. Efni lent í húsi" on the project gets ticked — forward only, never unticked, since
  // material is often ordered outside the system and that box gets ticked by hand.
  var ARRIVED = "Komið í hús 🐻", EFNI_FIELD = "5. Efni lent í húsi";
  var currentOrders = [], efniLanded = false;
  function setOrderStatus(id, st) {
    currentOrders.forEach(function (o) { if (o.id === id) { o.fields = o.fields || {}; o.fields["Staða"] = st; } });
    var sel = document.querySelector('[data-status="' + id + '"]');
    if (sel) sel.value = st;
    var chip = sel && sel.closest(".card") && sel.closest(".card").querySelector(".cardHd .chip");
    if (chip) chip.outerHTML = statusChip(st);
  }
  function paintEfniBar() {
    var bar = document.getElementById("efniBar");
    if (!currentOrders.length) { bar.style.display = "none"; return; }
    var done = currentOrders.filter(function (o) { return (o.fields || {})["Staða"] === ARRIVED; }).length;
    bar.style.display = "flex";
    document.getElementById("efniState").textContent = done + " / " + currentOrders.length + " komið í hús" + (efniLanded ? " · ✓ Efni lent hakað" : "");
    document.getElementById("allArrivedBtn").style.display = done === currentOrders.length ? "none" : "";
  }
  function syncEfni() {
    var all = currentOrders.length && currentOrders.every(function (o) { return (o.fields || {})["Staða"] === ARRIVED; });
    var p = Promise.resolve(false);
    if (all && !efniLanded) {
      var ff = {}; ff[EFNI_FIELD] = true;
      p = apiPatch(TAEKIFAERI + "/" + recordId, ff).then(function () {
        efniLanded = true;
        // 2026-10-28 (G5): first time the box flips -> tell the floor, whichever way it got there.
        return window.OfficeShell.notifyEfni(k, recordId, "Allt efni komið í hús", { name: (shellInfo.record && shellInfo.record.name) || "" }).then(function () { return true; });
      });
    }
    return p.then(function (flipped) { paintEfniBar(); return flipped; });
  }

  function statusChip(staða) {
    var cls = staða === "Sent" ? "sent" : staða === "Komið í hús 🐻" ? "done" : "prep";
    return '<span class="chip ' + cls + '">' + esc(staða || "") + '</span>';
  }

  function lineRowHtml(l) {
    var f = l.fields || {};
    var label = f["Vörulisti txt"] || f["Gerð"] || "Lína";
    var price = f["Áætlaður kostnaður"];
    return '<div class="row' + (price ? "" : " np") + '"><span class="k" title="' + esc(label) + '">' + esc(label) + '</span><span class="q">' + esc(f["Magn"] != null ? f["Magn"] : "") + '</span><span class="v">' + (price ? kr(price) : "vantar verð") + '</span></div>';
  }

  function orderCard(o, lines) {
    var f = o.fields || {};
    var el = document.createElement("div");
    el.className = "card";
    var pdf = (f["Pöntunarlistar PDF"] || [])[0];
    var canSend = f["Staða"] === "Í undirbúningi";

    el.innerHTML =
      '<div class="cardHd" data-toggle="1">' +
        '<div><div class="nm">' + esc(f["Stöðu kenni"] || "Pöntun") + '</div>' +
        '<div class="meta">' + kr(f["Áætlaður kostnaður"]) + (f["Afhending óskuð"] ? " · óskað " + esc(f["Afhending óskuð"]) : "") + '</div></div>' +
        statusChip(f["Staða"]) +
      '</div>' +
      '<div class="lines">' +
        (lines.length ? '<div class="row hd2"><span>Vara</span><span class="q">Magn</span><span class="v">Verð</span></div>' + lines.map(lineRowHtml).join("") : '<div class="empty">Engar línur</div>') +
        '<div class="actions">' +
          (pdf ? '<a class="actBtn" href="' + pdf.url + '" target="_blank" rel="noopener">📄 Skoða PDF</a>' : '') +
          '<button class="actBtn" data-reprint="' + o.id + '">↻ Endurprenta PDF</button>' +
          (canSend ? '<button class="actBtn good" data-send="' + o.id + '">📧 Senda á birgja</button>' : '') +
          (canSend ? '<button class="actBtn" data-offline="' + o.id + '" title="Pantað í síma eða tölvupósti — enginn póstur sendur héðan">☎️ Pantað utan kerfis</button>' : '') +
          '<select class="statusSel" data-status="' + o.id + '">' +
            ["Í undirbúningi", "Sent", "Komið í hús 🐻"].map(function (s) {
              return '<option value="' + s + '"' + (s === f["Staða"] ? " selected" : "") + '>' + s + '</option>';
            }).join("") +
          '</select>' +
        '</div>' +
      '</div>';

    el.querySelector(".cardHd").addEventListener("click", function () {
      el.querySelector(".lines").classList.toggle("open");
    });
    var reprintBtn = el.querySelector("[data-reprint]");
    reprintBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      reprintBtn.disabled = true;
      reprintBtn.textContent = "Prenta…";
      fetch("/api/pontun-print", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recordId: o.id, kind: "order", k: k })
      }).then(function (r) { return r.json(); }).then(function () {
        reprintBtn.textContent = "✓ Prentað — endurhlaða til að sjá";
      }).catch(function () { reprintBtn.textContent = "Tókst ekki"; reprintBtn.disabled = false; });
    });
    var sendBtn = el.querySelector("[data-send]");
    if (sendBtn) {
      sendBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (!confirm("Senda pöntun á birgja núna? Þetta sendir alvöru tölvupóst.")) return;
        sendBtn.disabled = true;
        sendBtn.textContent = "Sendi…";
        var f1 = {}; f1[SEND_FIELD] = false;
        apiPatch(PANTADIR + "/" + o.id, f1)
          .then(function () {
            var f2 = {}; f2[SEND_FIELD] = true;
            return apiPatch(PANTADIR + "/" + o.id, f2);
          })
          .then(function () { sendBtn.textContent = "✓ Sent — endurhlaða til að sjá"; })
          .catch(function () { sendBtn.textContent = "Tókst ekki"; sendBtn.disabled = false; });
      });
    }
    el.querySelector("[data-status]").addEventListener("change", function (ev) {
      ev.stopPropagation();
      var st = ev.target.value;
      var fields = {}; fields["Staða"] = st;
      apiPatch(PANTADIR + "/" + o.id, fields).then(function () {
        setOrderStatus(o.id, st); return syncEfni();
      }).then(function (flipped) {
        // 2026-10-28 (G5): one order arrived (not the last) -> quiet bell line, no chat ping.
        if (st === ARRIVED && !flipped) {
          var n = currentOrders.filter(function (x) { return (x.fields || {})["Staða"] === ARRIVED; }).length;
          window.OfficeShell.notifyEfni(k, recordId, "Pöntun komin í hús (" + n + " / " + currentOrders.length + ")", { chat: false, name: (shellInfo.record && shellInfo.record.name) || "" });
        }
      });
    });
    var offBtn = el.querySelector("[data-offline]");
    if (offBtn) {
      offBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        offBtn.disabled = true;
        apiPatch(PANTADIR + "/" + o.id, { "Staða": "Sent" }).then(function () {
          setOrderStatus(o.id, "Sent");
          offBtn.remove();
          var sb = el.querySelector("[data-send]"); if (sb) sb.remove();
          paintEfniBar();
        }).catch(function () { offBtn.disabled = false; });
      });
    }
    el.querySelector("[data-status]").addEventListener("click", function (ev) { ev.stopPropagation(); });

    return el;
  }

  function aukaCard(a) {
    var f = a.fields || {};
    var el = document.createElement("div");
    el.className = "card";
    var pdf = (f["Auka pöntunarlisti PDF"] || [])[0];
    el.innerHTML =
      '<div class="nm">' + esc(f["Name"] || "Aukapöntun") + '</div>' +
      '<div class="meta">' + kr(f["Áætlaður kostnaður Rollup (from Pöntunarlisti 📋)"]) + '</div>' +
      '<div class="actions">' +
        (pdf ? '<a class="actBtn" href="' + pdf.url + '" target="_blank" rel="noopener">📄 Skoða PDF</a>' : '') +
        '<button class="actBtn" data-reprint-auka="' + a.id + '">↻ Endurprenta PDF</button>' +
      '</div>';
    el.querySelector("[data-reprint-auka]").addEventListener("click", function (ev) {
      ev.target.disabled = true;
      ev.target.textContent = "Prenta…";
      fetch("/api/pontun-print", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recordId: a.id, kind: "extra", k: k })
      }).then(function (r) { return r.json(); }).then(function () {
        ev.target.textContent = "✓ Prentað — endurhlaða til að sjá";
      }).catch(function () { ev.target.textContent = "Tókst ekki"; ev.target.disabled = false; });
    });
    return el;
  }
})();
</script>
</body>
</html>
