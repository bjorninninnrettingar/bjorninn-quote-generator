<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#efe9df"/>
  <!-- front panel, cross-section, in a generic spónlagt wood tone -->
  <rect x="40" y="60" width="320" height="180" rx="4" fill="#b98e5f"/>
  <rect x="40" y="60" width="320" height="180" rx="4" fill="none" stroke="#8a6b48" stroke-width="2"/>
  <!-- milled channel along the top edge: rounded bottom, same wood colour, just shaded to read as a recess -->
  <path d="M 140 60 L 140 92 Q 140 118 166 118 L 234 118 Q 260 118 260 92 L 260 60 Z" fill="#7a5c3c"/>
  <path d="M 140 60 L 140 92 Q 140 118 166 118 L 234 118 Q 260 118 260 92 L 260 60" fill="none" stroke="#5f4630" stroke-width="2"/>
  <!-- soft highlight to sell the rounded floor -->
  <ellipse cx="200" cy="104" rx="46" ry="10" fill="#8f6c47" opacity="0.55"/>
  <text x="200" y="270" text-anchor="middle" font-family="Kumbh Sans, sans-serif" font-size="20" fill="#4a3a28">Spónagrip — rúnað, í lit spónsins</text>
</svg>
